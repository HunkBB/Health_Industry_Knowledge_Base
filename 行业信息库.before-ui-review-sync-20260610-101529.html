=\"doc-heading-1\">一句话定位<\/h2>\n<p>本文定位为国大药房/国药一致 · 新闻动态的新闻动态资料，主要事件有业绩变化、门店调整、O2O运营、平台合作、监管合规和区域扩张。<\/p>\n<h2 id=\"doc-heading-2\">一、国药一致/国大药房概况<\/h2>\n<h3 id=\"doc-heading-3\">1. 企业定位<\/h3>\n<ul>\n<li><strong>来源<\/strong>：行业公开信息<\/li>\n<li><strong>核心内容<\/strong>：国大药房是国药一致(000028.SZ)旗下零售板块，隶属于国药控股体系，是全国最大的药店零售商。国药一致同时经营分销和零售两大业务，零售板块以\"国大药房\"品牌运营。<\/li>\n<li><strong>关键数据<\/strong>：<\/li>\n<li>国药控股2025年药品零售收入383.83亿元，同比+6.67%<\/li>\n<li>国大药房为全国最大药店零售商<\/li>\n<li>门店覆盖全国主要城市<\/li>\n<li><strong>可应用性思考<\/strong>：国大药房是全国规模最大的药店零售商，但其O2O数据未单独披露，透明度不足；作为国药体系的一部分，其与<a href=\"https://ir.jdhealth.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">医药服务平台<\/a>的合作可能受到国药控股整体战略的约束（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-4\">2. 国药一致业务结构<\/h3>\n<ul>\n<li><strong>来源<\/strong>：行业公开信息<\/li>\n<li><strong>核心内容<\/strong>：国药一致(000028.SZ)是国药控股在两广（广东、广西）的分销平台+全国零售平台。主营医药分销和药品零售，零售板块以\"国大药房\"品牌在全国运营。<\/li>\n<li><strong>关键信息<\/strong>：<\/li>\n<li>医药分销：两广区域龙头<\/li>\n<li>药品零售：全国最大药店零售商（国大药房品牌）<\/li>\n<li>旗下拥有多个零售子品牌<\/li>\n<li><strong>可应用性思考<\/strong>：国药一致的分销+零售一体化模式，意味着其供应链能力较强，但零售端的盈利能力可能受分销业务的交叉补贴影响（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-5\">二、行业报道中的增量动态<\/h2>\n<h3 id=\"doc-heading-6\">3. 国药控股2025年零售收入383.83亿<\/h3>\n<ul>\n<li><strong>来源<\/strong>：连锁药店行业增量新闻动态_2025-2026 / <a href=\"https://www.cmschina.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">招商证券<\/a>行业研报<\/li>\n<li><strong>日期<\/strong>：2025-2026<\/li>\n<li><strong>核心内容<\/strong>：国药控股2025年药品零售收入383.83亿元，同比+6.67%。在六大上市连锁药店中，国大药房的零售收入体量最大。<\/li>\n<li><strong>关键数据<\/strong>：<\/li>\n<li>药品零售收入383.83亿元（+6.67%）<\/li>\n<li>远超第二大参林275.0亿元<\/li>\n<li><strong>可应用性思考<\/strong>：国大药房383.83亿零售收入+6.67%增速，在行业普遍低增长/负增长背景下表现尚可，说明大型央企背景的药店零售商在行业下行期有更强的抗压能力（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-7\">4. 国大药房未单独披露O2O数据<\/h3>\n<ul>\n<li><strong>来源<\/strong>：连锁药店行业增量新闻动态_2025-2026<\/li>\n<li><strong>核心内容<\/strong>：国大药房为全国最大药店零售商，但未单独披露O2O数据。这与其他头部连锁药店逐步增加O2O透明度的趋势不一致。<\/li>\n<li><strong>可应用性思考<\/strong>：O2O数据不透明增加了合作评估的难度；可能是国大药房的O2O占比不高（以传统线下零售为主），也可能是集团层面尚未重视O2O数据披露（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-8\">三、公开检索补充信息（2026-06-08核验）<\/h2>\n<blockquote>\n<p><strong>说明<\/strong>：以下信息已按公开公告、业绩快报、<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>摘要、<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">主流财经报道<\/a>和监管/信用公示转引补充。未在公告或主流公开材料中找到明确披露的事项，按“官方公开材料未列示明确信息；仅保留已披露事实”处理，不做判断。（仅推测）<\/p>\n<\/blockquote>\n<h3 id=\"doc-heading-9\">5. 国药一致2025年年报与2026Q1核心数据<\/h3>\n<p>| 发布时间 | 发布主体 | 事件摘要 | 影响判断 | 来源 |（仅推测）\n|:---|:---|:---|:---|:---|\n| 2026-03-18 | 国药一致 | 2025年度业绩快报披露：营业总收入734.16亿元，同比-1.29%；营业利润15.13亿元，同比+163.80%；归母净利润11.36亿元，同比+76.80%；扣非归母净利润10.96亿元，同比+88.53%。利润增长主要来自商誉及无形资产减值准备同比减少6.86亿元，以及门店调整带来的人工、租金等刚性费用下降。 | 2025年集团利润修复明显，但核心原因包含减值减少和关店降本，不能简单理解为零售业务自然增长。 | 国药一致2025年度业绩快报（公告编号2026-04，2026-03-18）；<a href=\"https://www.cs.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中国证券报<\/a>信息披露；<a href=\"https://data.eastmoney.com/notices/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">东方财富公告<\/a>正文 |\n| 2026-04-22 | 国药一致 | 2026年一季度业绩快报披露：营业总收入178.23亿元，同比-2.57%；归母净利润2.87亿元，同比-12.36%；扣非归母净利润2.80亿元，同比-11.77%。 | 2026Q1收入和利润同步承压，分销、零售均受政策变化、市场竞争和回款周期影响。 | 国药一致2026年第一季度业绩快报（公告编号2026-18，2026-04-22）；<a href=\"https://data.eastmoney.com/notices/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">东方财富公告<\/a>正文；<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a>7x24 |<\/p>\n<h3 id=\"doc-heading-10\">6. 分销与零售板块拆分数据<\/h3>\n<p>| 发布时间 | 发布主体 | 事件摘要 | 影响判断 | 来源 |（仅推测）\n|:---|:---|:---|:---|:---|\n| 2026-03-18 | 国药一致 | 2025年分销板块营业收入533.21亿元，同比+0.64%；净利润9.49亿元，同比+2.94%。零售板块即国大药房营业收入209.81亿元，同比-6.16%；净利润-2.17亿元，同比改善80.36%；剔除商誉和无形资产减值影响后，国大药房净利润0.60亿元，同比+139.28%。 | 分销仍是利润基石，国大药房规模大但盈利质量仍弱；零售端利润改善主要来自减值减少、关店和费用下降，后续需观察可持续性。 | 国药一致2025年度业绩快报（2026-03-18）；<a href=\"https://www.cs.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中国证券报<\/a>信息披露；Reportify公告整理 |\n| 2026-04-22 | 国药一致 | 2026Q1分销板块营业收入133.56亿元，同比-1.72%；净利润1.99亿元，同比-13.60%。零售板块国大药房营业收入47.39亿元，同比-4.89%；净利润0.05亿元，同比+15.42%。 | 一季度零售收入仍下降，但已实现微利，说明亏损门店治理和门店结构调整继续释放效果。 | 国药一致2026年第一季度业绩快报（2026-04-22）；<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a>7x24转引公告 |<\/p>\n<h3 id=\"doc-heading-11\">7. 国大药房门店数量、区域分布与子品牌<\/h3>\n<p>| 发布时间 | 发布主体 | 事件摘要 | 影响判断 | 来源 |（仅推测）\n|:---|:---|:---|:---|:---|\n| 2026-04 | 国药一致/<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">主流财经报道<\/a>转引<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a> | 2025年国药一致新增直营门店61家、直营关店1,140家；新增加盟门店65家、加盟关店334家。2024年末国大药房门店总数9,569家，其中直营7,770家、加盟1,799家；2025年具体期末门店总数需以后续<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>全文口径为准。 | 国大药房正在从规模扩张转向“瘦身强体”，大量关闭亏损门店会压低收入，但有利于改善费用和利润。 | 国药一致2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a>/主流媒体转引；同花顺财经2026-04-02；<a href=\"https://www.yidiandian.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">第一药店财智<\/a>/<a href=\"https://xueqiu.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">雪球<\/a>2025-04-08 |\n| 2026-04 | 国药一致/国大药房 | 国大药房为国药一致零售板块主体，旗下除“国大药房”外，还包含区域药房品牌和加盟体系。公开材料对2025年各零售子品牌的独立收入、门店数、区域分布披露有限。 | 目前可以确认“国大药房”为全国性社会药房零售平台，但细分子品牌经营数据透明度不足，合作评估建议持续跟踪集团或国大药房提供内部口径。 | 国药一致2025年度业绩快报；国药一致2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a>；国大药房官网公开介绍 | （仅推测） |<\/p>\n<h3 id=\"doc-heading-12\">8. 国大药房与美团/饿了么/医药服务平台合作动态及O2O进展<\/h3>\n<p>| 发布时间 | 发布主体 | 事件摘要 | 影响判断 | 来源 |（仅推测）\n|:---|:---|:---|:---|:---|\n| 2025-2026 | 国药一致/国大药房 | 公开公告和主流报道中未见国大药房在2026年与美团、饿了么或<a href=\"https://ir.jdhealth.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">医药服务平台<\/a>的新签约/专项合作事件；可确认行业层面美团买药、饿了么买药、<a href=\"https://ir.jdhealth.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">医药服务平台<\/a>均在拓展实体连锁药店合作，但未找到国大药房单独披露合作门店数、GMV或订单数据。 | 对平台合作只能判断为“可能存在平台入驻或区域合作”，不能写成新增战略合作；后续需以<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>、平台新闻或内部合作清单确认。 | 国药一致公告检索；<a href=\"https://36kr.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">36氪<\/a>《医保支付线上买药，京东、美团、饿了么成赢家》（2024-06-18）；本次公开检索未见国大药房专项合作公告 | （仅推测） |\n| 2025-04 | <a href=\"https://www.yidiandian.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">第一药店财智<\/a>/<a href=\"https://xueqiu.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">雪球<\/a>转引国药一致2024<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a> | 2024年国大药房创新业务销售18.9亿元，其中O2O 12.1亿元、B2C 2.3亿元、自营0.9亿元、商保3.6亿元；国大药房完成国药健康商城第三方电商平台资质认证，并取得互联网医疗器械及药品经营相关备案许可。 | 国大药房已有O2O和线上业务基础，但2025<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>及2026Q1公开材料未见O2O最新GMV/订单量单独披露，透明度仍低于部分上市连锁。 | <a href=\"https://www.yidiandian.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">第一药店财智<\/a>/<a href=\"https://xueqiu.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">雪球<\/a>转引国药一致2024<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>（2025-04-08）；国药一致2025年度业绩快报未单独披露O2O数据 |<\/p>\n<h3 id=\"doc-heading-13\">9. 国大药房监管处罚/合规事件<\/h3>\n<p>| 发布时间 | 发布主体 | 事件摘要 | 影响判断 | 来源 |（仅推测）\n|:---|:---|:---|:---|:---|\n| 2025-2026 | 监管/信用公示检索 | 本次公开检索未发现对国大药房集团层面产生重大影响的2025-2026年行政处罚或交易所监管事件。考虑国大药房门店数量大、医保定点门店多，单店层面的药监、医保、市场监管处罚建议持续跟踪通过信用中国、地方医保局/药监局逐门店持续核验。 | 当前不能认定存在重大集团层面合规事件；但医保、药监、处方药、线上售药合规仍是高频风险，需要后续纳入周度监控。 | 信用中国/地方监管公开信息检索；国药一致2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a>风险提示；本次公开检索未见重大集团层面处罚披露 | （仅推测） |<\/p>\n<h3 id=\"doc-heading-14\">10. 2026年战略调整和业务布局<\/h3>\n<p>| 发布时间 | 发布主体 | 事件摘要 | 影响判断 | 来源 |（仅推测）\n|:---|:---|:---|:---|:---|\n| 2026-03-18 | 国药一致 | 公司提出2026年是“十五五”开局之年，将坚持高质量发展，聚焦“开源、节流、提效”，持续深化转型创新，强化合规与风险管控。 | 2026年主线不是单纯扩张，而是经营质量、费用效率和风险控制；对国大药房而言，亏损门店治理和商品结构优化仍是核心。 | <a href=\"https://www.baidu.com/s?wd=%E5%9B%BD%E8%8D%AF%E4%B8%80%E8%87%B42025%E5%B9%B4%E5%BA%A6%E4%B8%9A%E7%BB%A9%E5%BF%AB%E6%8A%A5%EF%BC%882026-03-18%EF%BC%89\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">国药一致2025年度业绩快报（2026-03-18）<\/a> |\n| 2026-04-22 | 国药一致 | 一季度公告称，分销板块受行业政策变化、竞争加剧、下游回款延迟和坏账准备增加影响；零售板块受流感季变化、市场竞争影响收入下降，但公司强化亏损企业治理并调整门店结构，人工及租金等刚性费用下降，推动净利润提升。 | 分销端需应对应收账款和政策压力，零售端继续通过关店、门店结构调整和降本增效改善利润；O2O与数字化应服从“提效”目标。 | <a href=\"https://www.baidu.com/s?wd=%E5%9B%BD%E8%8D%AF%E4%B8%80%E8%87%B42026%E5%B9%B4%E7%AC%AC%E4%B8%80%E5%AD%A3%E5%BA%A6%E4%B8%9A%E7%BB%A9%E5%BF%AB%E6%8A%A5%EF%BC%882026-04-22%EF%BC%89\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">国药一致2026年第一季度业绩快报（2026-04-22）<\/a> | （仅推测） |\n| 2025-04 | <a href=\"https://www.yidiandian.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">第一药店财智<\/a>/<a href=\"https://xueqiu.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">雪球<\/a>转引国药一致<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a> | 国大药房提出通过“组织重塑+业务重塑”实现数字化转型、多元化产业和“互联网+医疗”布局；业务重塑包括治理亏损门店、关闭亏损门店并退出弱势区域、夯实“一店一策”、推动专业化体系建设、探索“互联网+医疗”。 | 国大药房的长期方向是从全国大规模铺店转向数字化、专业化、多元化和互联网医疗协同；对即时零售合作的关键变量是O2O能力是否能与医保、处方、专业药房和门店效率结合。 | <a href=\"https://www.yidiandian.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">第一药店财智<\/a>/<a href=\"https://xueqiu.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">雪球<\/a>转引国药一致2024<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>（2025-04-08）；国药一致2025年度业绩快报 |<\/p>\n<hr />\n<p><em>信息溯源：资料来源包括：《连锁药店行业增量新闻动态_2025-2026》、<a href=\"https://www.cmschina.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">招商证券<\/a>行业研报中涉及国大药房的数据；本次补充新增国药一致2025年度业绩快报（2026-03-18）、国药一致2026年第一季度业绩快报（2026-04-22）、国药一致2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a>/<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a>摘要（<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">巨潮资讯网<\/a>，2026-04-02）、<a href=\"https://www.cs.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中国证券报<\/a>信息披露、<a href=\"https://data.eastmoney.com/notices/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">东方财富公告<\/a>正文、财经网/蓝鲸财经/同花顺等主流媒体转引公告，以及<a href=\"https://www.yidiandian.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">第一药店财智<\/a>/<a href=\"https://xueqiu.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">雪球<\/a>对国大药房<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>经营数据的整理。<\/em><\/p>","rawText":"﻿# 国大药房/国药一致 · 新闻动态（2025-2026） 引用级别：✅可供研判参考 资料基础：行业研究报告、券商研报、机构观点、分析师判断、主观解释、预测或推演结论，公告，财报。 更新时间：2026-06-08 信息来源：公司年报、业绩快报、一季报、行业报道、券商研报、监管/信用公示转引 声明：本次已补充公开检索结果；财务数据优先采用国药一致公告/巨潮资讯网披露，国大药房零售数据采用国药一致业绩快报、年报及主流媒体转引公告。未见官方披露的事项明确标注“官方公开材料未列示明确信息；仅保留已披露事实”。 一句话定位 本文定位为国大药房/国药一致 · 新闻动态的新闻动态资料，主要事件有业绩变化、门店调整、O2O运营、平台合作、监管合规和区域扩张。 一、国药一致/国大药房概况 1. 企业定位 来源**：行业公开信息 核心内容**：国大药房是国药一致(000028.SZ)旗下零售板块，隶属于国药控股体系，是全国最大的药店零售商。国药一致同时经营分销和零售两大业务，零售板块以\"国大药房\"品牌运营。 关键数据**： 国药控股2025年药品零售收入383.83亿元，同比+6.67% 国大药房为全国最大药店零售商 门店覆盖全国主要城市 可应用性思考**：国大药房是全国规模最大的药店零售商，但其O2O数据未单独披露，透明度不足；作为国药体系的一部分，其与医药服务平台的合作可能受到国药控股整体战略的约束（仅推测） 2. 国药一致业务结构 来源**：行业公开信息 核心内容**：国药一致(000028.SZ)是国药控股在两广（广东、广西）的分销平台+全国零售平台。主营医药分销和药品零售，零售板块以\"国大药房\"品牌在全国运营。 关键信息**： 医药分销：两广区域龙头 药品零售：全国最大药店零售商（国大药房品牌） 旗下拥有多个零售子品牌 可应用性思考**：国药一致的分销+零售一体化模式，意味着其供应链能力较强，但零售端的盈利能力可能受分销业务的交叉补贴影响（仅推测） 二、行业报道中的增量动态 3. 国药控股2025年零售收入383.83亿 来源**：连锁药店行业增量新闻动态_2025-2026 / 招商证券行业研报 日期**：2025-2026 核心内容**：国药控股2025年药品零售收入383.83亿元，同比+6.67%。在六大上市连锁药店中，国大药房的零售收入体量最大。 关键数据**： 药品零售收入383.83亿元（+6.67%） 远超第二大参林275.0亿元 可应用性思考**：国大药房383.83亿零售收入+6.67%增速，在行业普遍低增长/负增长背景下表现尚可，说明大型央企背景的药店零售商在行业下行期有更强的抗压能力（仅推测） 4. 国大药房未单独披露O2O数据 来源**：连锁药店行业增量新闻动态_2025-2026 核心内容**：国大药房为全国最大药店零售商，但未单独披露O2O数据。这与其他头部连锁药店逐步增加O2O透明度的趋势不一致。 可应用性思考**：O2O数据不透明增加了合作评估的难度；可能是国大药房的O2O占比不高（以传统线下零售为主），也可能是集团层面尚未重视O2O数据披露（仅推测） 三、公开检索补充信息（2026-06-08核验） 说明**：以下信息已按公开公告、业绩快报、年报摘要、主流财经报道和监管/信用公示转引补充。未在公告或主流公开材料中找到明确披露的事项，按“官方公开材料未列示明确信息；仅保留已披露事实”处理，不做判断。（仅推测） 5. 国药一致2025年年报与2026Q1核心数据 发布时间 发布主体 事件摘要 影响判断 来源 （仅推测） :--- :--- :--- :--- :--- 2026-03-18 国药一致 2025年度业绩快报披露：营业总收入734.16亿元，同比-1.29%；营业利润15.13亿元，同比+163.80%；归母净利润11.36亿元，同比+76.80%；扣非归母净利润10.96亿元，同比+88.53%。利润增长主要来自商誉及无形资产减值准备同比减少6.86亿元，以及门店调整带来的人工、租金等刚性费用下降。 2025年集团利润修复明显，但核心原因包含减值减少和关店降本，不能简单理解为零售业务自然增长。 国药一致2025年度业绩快报（公告编号2026-04，2026-03-18）；中国证券报信息披露；东方财富公告正文 2026-04-22 国药一致 2026年一季度业绩快报披露：营业总收入178.23亿元，同比-2.57%；归母净利润2.87亿元，同比-12.36%；扣非归母净利润2.80亿元，同比-11.77%。 2026Q1收入和利润同步承压，分销、零售均受政策变化、市场竞争和回款周期影响。 国药一致2026年第一季度业绩快报（公告编号2026-18，2026-04-22）；东方财富公告正文；新浪财经7x24 6. 分销与零售板块拆分数据 发布时间 发布主体 事件摘要 影响判断 来源 （仅推测） :--- :--- :--- :--- :--- 2026-03-18 国药一致 2025年分销板块营业收入533.21亿元，同比+0.64%；净利润9.49亿元，同比+2.94%。零售板块即国大药房营业收入209.81亿元，同比-6.16%；净利润-2.17亿元，同比改善80.36%；剔除商誉和无形资产减值影响后，国大药房净利润0.60亿元，同比+139.28%。 分销仍是利润基石，国大药房规模大但盈利质量仍弱；零售端利润改善主要来自减值减少、关店和费用下降，后续需观察可持续性。 国药一致2025年度业绩快报（2026-03-18）；中国证券报信息披露；Reportify公告整理 2026-04-22 国药一致 2026Q1分销板块营业收入133.56亿元，同比-1.72%；净利润1.99亿元，同比-13.60%。零售板块国大药房营业收入47.39亿元，同比-4.89%；净利润0.05亿元，同比+15.42%。 一季度零售收入仍下降，但已实现微利，说明亏损门店治理和门店结构调整继续释放效果。 国药一致2026年第一季度业绩快报（2026-04-22）；新浪财经7x24转引公告 7. 国大药房门店数量、区域分布与子品牌 发布时间 发布主体 事件摘要 影响判断 来源 （仅推测） :--- :--- :--- :--- :--- 2026-04 国药一致/主流财经报道转引年报 2025年国药一致新增直营门店61家、直营关店1,140家；新增加盟门店65家、加盟关店334家。2024年末国大药房门店总数9,569家，其中直营7,770家、加盟1,799家；2025年具体期末门店总数需以后续年报全文口径为准。 国大药房正在从规模扩张转向“瘦身强体”，大量关闭亏损门店会压低收入，但有利于改善费用和利润。 国药一致2025年年度报告/主流媒体转引；同花顺财经2026-04-02；第一药店财智/雪球2025-04-08 2026-04 国药一致/国大药房 国大药房为国药一致零售板块主体，旗下除“国大药房”外，还包含区域药房品牌和加盟体系。公开材料对2025年各零售子品牌的独立收入、门店数、区域分布披露有限。 目前可以确认“国大药房”为全国性社会药房零售平台，但细分子品牌经营数据透明度不足，合作评估建议持续跟踪集团或国大药房提供内部口径。 国药一致2025年度业绩快报；国药一致2025年年度报告；国大药房官网公开介绍 （仅推测） 8. 国大药房与美团/饿了么/医药服务平台合作动态及O2O进展 发布时间 发布主体 事件摘要 影响判断 来源 （仅推测） :--- :--- :--- :--- :--- 2025-2026 国药一致/国大药房 公开公告和主流报道中未见国大药房在2026年与美团、饿了么或医药服务平台的新签约/专项合作事件；可确认行业层面美团买药、饿了么买药、医药服务平台均在拓展实体连锁药店合作，但未找到国大药房单独披露合作门店数、GMV或订单数据。 对平台合作只能判断为“可能存在平台入驻或区域合作”，不能写成新增战略合作；后续需以公司公告、平台新闻或内部合作清单确认。 国药一致公告检索；36氪《医保支付线上买药，京东、美团、饿了么成赢家》（2024-06-18）；本次公开检索未见国大药房专项合作公告 （仅推测） 2025-04 第一药店财智/雪球转引国药一致2024年报 2024年国大药房创新业务销售18.9亿元，其中O2O 12.1亿元、B2C 2.3亿元、自营0.9亿元、商保3.6亿元；国大药房完成国药健康商城第三方电商平台资质认证，并取得互联网医疗器械及药品经营相关备案许可。 国大药房已有O2O和线上业务基础，但2025年报及2026Q1公开材料未见O2O最新GMV/订单量单独披露，透明度仍低于部分上市连锁。 第一药店财智/雪球转引国药一致2024年报（2025-04-08）；国药一致2025年度业绩快报未单独披露O2O数据 9. 国大药房监管处罚/合规事件 发布时间 发布主体 事件摘要 影响判断 来源 （仅推测） :--- :--- :--- :--- :--- 2025-2026 监管/信用公示检索 本次公开检索未发现对国大药房集团层面产生重大影响的2025-2026年行政处罚或交易所监管事件。考虑国大药房门店数量大、医保定点门店多，单店层面的药监、医保、市场监管处罚建议持续跟踪通过信用中国、地方医保局/药监局逐门店持续核验。 当前不能认定存在重大集团层面合规事件；但医保、药监、处方药、线上售药合规仍是高频风险，需要后续纳入周度监控。 信用中国/地方监管公开信息检索；国药一致2025年年度报告风险提示；本次公开检索未见重大集团层面处罚披露 （仅推测） 10. 2026年战略调整和业务布局 发布时间 发布主体 事件摘要 影响判断 来源 （仅推测） :--- :--- :--- :--- :--- 2026-03-18 国药一致 公司提出2026年是“十五五”开局之年，将坚持高质量发展，聚焦“开源、节流、提效”，持续深化转型创新，强化合规与风险管控。 2026年主线不是单纯扩张，而是经营质量、费用效率和风险控制；对国大药房而言，亏损门店治理和商品结构优化仍是核心。 国药一致2025年度业绩快报（2026-03-18） 2026-04-22 国药一致 一季度公告称，分销板块受行业政策变化、竞争加剧、下游回款延迟和坏账准备增加影响；零售板块受流感季变化、市场竞争影响收入下降，但公司强化亏损企业治理并调整门店结构，人工及租金等刚性费用下降，推动净利润提升。 分销端需应对应收账款和政策压力，零售端继续通过关店、门店结构调整和降本增效改善利润；O2O与数字化应服从“提效”目标。 国药一致2026年第一季度业绩快报（2026-04-22） （仅推测） 2025-04 第一药店财智/雪球转引国药一致年报 国大药房提出通过“组织重塑+业务重塑”实现数字化转型、多元化产业和“互联网+医疗”布局；业务重塑包括治理亏损门店、关闭亏损门店并退出弱势区域、夯实“一店一策”、推动专业化体系建设、探索“互联网+医疗”。 国大药房的长期方向是从全国大规模铺店转向数字化、专业化、多元化和互联网医疗协同；对即时零售合作的关键变量是O2O能力是否能与医保、处方、专业药房和门店效率结合。 第一药店财智/雪球转引国药一致2024年报（2025-04-08）；国药一致2025年度业绩快报 信息溯源：资料来源包括：《连锁药店行业增量新闻动态_2025-2026》、招商证券行业研报中涉及国大药房的数据；本次补充新增国药一致2025年度业绩快报（2026-03-18）、国药一致2026年第一季度业绩快报（2026-04-22）、国药一致2025年年度报告/年度报告摘要（巨潮资讯网，2026-04-02）、中国证券报信息披露、东方财富公告正文、财经网/蓝鲸财经/同花顺等主流媒体转引公告，以及第一药店财智/雪球对国大药房年报经营数据的整理。*","headings":[{"level":2,"text":"一句话定位","anchor":"doc-heading-1"},{"level":2,"text":"一、国药一致/国大药房概况","anchor":"doc-heading-2"},{"level":3,"text":"1. 企业定位","anchor":"doc-heading-3"},{"level":3,"text":"2. 国药一致业务结构","anchor":"doc-heading-4"},{"level":2,"text":"二、行业报道中的增量动态","anchor":"doc-heading-5"},{"level":3,"text":"3. 国药控股2025年零售收入383.83亿","anchor":"doc-heading-6"},{"level":3,"text":"4. 国大药房未单独披露O2O数据","anchor":"doc-heading-7"},{"level":2,"text":"三、公开检索补充信息（2026-06-08核验）","anchor":"doc-heading-8"},{"level":3,"text":"5. 国药一致2025年年报与2026Q1核心数据","anchor":"doc-heading-9"},{"level":3,"text":"6. 分销与零售板块拆分数据","anchor":"doc-heading-10"},{"level":3,"text":"7. 国大药房门店数量、区域分布与子品牌","anchor":"doc-heading-11"},{"level":3,"text":"8. 国大药房与美团/饿了么/医药服务平台合作动态及O2O进展","anchor":"doc-heading-12"},{"level":3,"text":"9. 国大药房监管处罚/合规事件","anchor":"doc-heading-13"},{"level":3,"text":"10. 2026年战略调整和业务布局","anchor":"doc-heading-14"}],"outgoing":[]},{"id":"doc-433ca8e4d0af","title":"国大药房-国药一致-结构化摘要","path":"02-连锁药店/国大药房-国药一致/国大药房-国药一致-结构化摘要.md","stem":"国大药房-国药一致-结构化摘要","module":"02-连锁药店","entity":"国大药房-国药一致","contentType":"综合分析","isIndex":false,"isGovernance":false,"summary":"﻿# 国大药房/国药一致 - 结构化摘要","learningTakeaway":"本文帮助你理解国大药房/国药一致 - 结构化摘要的结构化摘要资料，核心关注财务指标、O2O能力、门店网络、平台合作和合作机会判断。阅读后可 n<\/tbody>\n<\/table><\/div>\n<blockquote>\n<p><strong>数据缺口说明<\/strong>：公开材料中暂未补齐门店数、毛利率、线上占比等核心数据。这些是评估O2O合作价值的关键指标，后续需要优先回到国药一致<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>、公告或投资者关系材料核验。<\/p>\n<\/blockquote>\n<h2 id=\"doc-heading-3\">核心观点（5条）<\/h2>\n<ol>\n<li>\n<p><strong>规模最大但数据最不透明<\/strong>：383.83亿零售收入远超第二大参林275亿，但O2O销售额、线上占比、门店数等关键数据均官方公开材料未列示该字段；仅保留已披露事实。与其他头部连锁逐步增加O2O透明度的趋势不一致。<\/p>\n<\/li>\n<li>\n<p><strong>央企体系的双面性<\/strong>：国药控股旗下，分销+零售一体化，供应链抗压能力强（集采冲击下可能比纯零售商更有韧性）。但央企决策链条长，O2O创新速度可能较慢。（仅推测）<\/p>\n<\/li>\n<li>\n<p><strong>行业出清期的受益者<\/strong>：全国最大药店零售商在供给侧出清期可能进一步扩大市场份额。中小药店退出后，国大药房的规模优势更加明显。（仅推测）<\/p>\n<\/li>\n<li>\n<p><strong>O2O可能不是其核心战略<\/strong>：官方公开材料未列示该字段；仅保留已披露事实O2O数据可能说明两点——(1)O2O占比低，不是核心增长引擎；(2)集团层面尚未重视O2O数据披露。无论哪种情况，都说明国大药房在O2O领域可能落后于健之佳、老百姓等积极拥抱O2O的同行。（仅推测）<\/p>\n<\/li>\n<li>\n<p><strong>分销+零售一体化的协同价值<\/strong>：国药一致同时经营两广分销和全国零售，分销端能为零售端提供供应链支持。这对DTP特药的供给能力可能比纯零售商更强。（仅推测）<\/p>\n<\/li>\n<\/ol>\n<h2 id=\"doc-heading-4\">重要结论<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">结论<\/th>\n<th style=\"text-align: left;\">置信度<\/th>\n<th style=\"text-align: left;\">依据<\/th>\n<th style=\"text-align: left;\">变量<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">国大药房是规模最大的药店零售商<\/td>\n<td style=\"text-align: left;\">高<\/td>\n<td style=\"text-align: left;\">383.83亿零售收入<\/td>\n<td style=\"text-align: left;\">—<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">国大药房O2O进展可能落后于同行<\/td>\n<td style=\"text-align: left;\">中<\/td>\n<td style=\"text-align: left;\">官方公开材料未列示该字段；仅保留已披露事实O2O数据+行业趋势<\/td>\n<td style=\"text-align: left;\">如果O2O占比高但不披露，则结论反转<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">央企背景使O2O创新速度较慢<\/td>\n<td style=\"text-align: left;\">低<\/td>\n<td style=\"text-align: left;\">【推理】央企决策链条长<\/td>\n<td style=\"text-align: left;\">如果国药控股将O2O定为战略方向，速度可能加快<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"> tr>\n<td style=\"text-align: left;\">行业出清<\/td>\n<td style=\"text-align: left;\">规模最大的受益者<\/td>\n<td style=\"text-align: left;\">【推理】行业出清后国大药房门店网络可能进一步扩大<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">O2O进展<\/td>\n<td style=\"text-align: left;\">可能落后于同行<\/td>\n<td style=\"text-align: left;\">【推理】国大药房可能是O2O的\"后来者\"，医药服务平台可以作为O2O赋能者<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"doc-heading-7\">信息溯源清单<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">信息<\/th>\n<th style=\"text-align: left;\">来源<\/th>\n<th style=\"text-align: left;\">时间<\/th>\n<th style=\"text-align: left;\">链接/备注<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">药品零售收入383.83亿+6.67%<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cmschina.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">招商证券<\/a>行业研报<\/td>\n<td style=\"text-align: left;\">2026<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%E8%A1%8C%E4%B8%9A%E5%85%AC%E5%BC%80%E6%95%B0%E6%8D%AE\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">行业公开数据<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">全国最大药店零售商<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%E8%A1%8C%E4%B8%9A%E5%85%AC%E5%BC%80%E4%BF%A1%E6%81%AF\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">行业公开信息<\/a><\/td>\n<td style=\"text-align: left;\">2025<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%E8%A1%8C%E4%B8%9A%E5%85%B1%E8%AF%86\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">行业共识<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">国药一致(000028.SZ)上市主体<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%E4%BC%81%E4%B8%9A%E5%85%AC%E5%BC%80%E4%BF%A1%E6%81%AF\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">企业公开信息<\/a><\/td>\n<td style=\"text-align: left;\">—<\/t **：383.83亿零售收入远超第二大参林275亿，但O2O销售额、线上占比、门店数等关键数据均官方公开材料未列示该字段；仅保留已披露事实。与其他头部连锁逐步增加O2O透明度的趋势不一致。 2. **央企体系的双面性**：国药控股旗下，分销+零售一体化，供应链抗压能力强（集采冲击下可能比纯零售商更有韧性）。但央企决策链条长，O2O创新速度可能较慢。（仅推测） 3. **行业出清期的受益者**：全国最大药店零售商在供给侧出清期可能进一步扩大市场份额。中小药店退出后，国大药房的规模优势更加明显。（仅推测） 4. **O2O可能不是其核心战略**：官方公开材料未列示该字段；仅保留已披露事实O2O数据可能说明两点——(1)O2O占比低，不是核心增长引擎；(2)集团层面尚未重视O2O数据披露。无论哪种情况，都说明国大药房在O2O领域可能落后于健之佳、老百姓等积极拥抱O2O的同行。（仅推测） 5. **分销+零售一体化的协同价值**：国药一致同时经营两广分销和全国零售，分销端能为零售端提供供应链支持。这对DTP特药的供给能力可能比纯零售商更强。（仅推测） 重要结论 结论 置信度 依据 变量 :--- :--- :--- :--- 国大药房是规模最大的药店零售商 高 383.83亿零售收入 — 国大药房O2O进展可能落后于同行 中 官方公开材料未列示该字段；仅保留已披露事实O2O数据+行业趋势 如果O2O占比高但不披露，则结论反转 （仅推测） 央企背景使O2O创新速度较慢 低 【推理】央企决策链条长 如果国药控股将O2O定为战略方向，速度可能加快 （仅推测） 分销+零售一体化在DTP供给上有优势 中 【推理】国药分销网络+零售终端 需要验证国大药房DTP具体能力 行业出清期国大药房市场份额可能扩大 中 规模优势+央企抗压能力 中小药店退出速度 （仅推测） 关键时间线 时间 事件 数据/影响 :--- :--- :--- 2025年全年 药品零售收入383.83亿元(+6.67%) 行业最大，增速尚可 2025-2026 O2O数据未单独披露 透明度不足 与即时零售的关联 维度 国大药房现状 与医药服务平台即时零售的关系 :--- :--- :--- 规模 383.83亿零售收入，全国最大 【推理】规模最大意味着O2O合作的市场空间最大 O2O透明度 官方公开材料未列示该字段；仅保留已披露事实O2O数据 【推理】数据不透明增加合作评估难度，需要主动获取 央企背景 国药控股旗下 【推理】合作谈判可能需要通过国药控股集团层面，决策链条较长 （仅推测） 分销+零售 一体化模式 【推理】分销供应链可能在DTP特药供给上有优势 （仅推测） 行业出清 规模最大的受益者 【推理】行业出清后国大药房门店网络可能进一步扩大 （仅推测） O2O进展 可能落后于同行 【推理】国大药房可能是O2O的\"后来者\"，医药服务平台可以作为O2O赋能者 （仅推测） 信息溯源清单 信息 来源 时间 链接/备注 :--- :--- :--- :--- 药品零售收入383.83亿+6.67% 招商证券行业研报 2026 行业公开数据 全国最大药店零售商 行业公开信息 2025 行业共识 国药一致(000028.SZ)上市主体 企业公开信息 — 国药控股旗下A股 国大药房为国药一致零售板块 行业公开信息 — — O2O数据官方公开材料未列示该字段；仅保留已披露事实 各渠道均无 2025-2026 透明度不足 数据补充优先级 国大药房因未纳入前次专项分析，数据缺口较大。以下为需要优先补充的数据： 优先级 数据项 获取方式 :--- :--- :--- **最高** 门店数量和区域分布 国药一致年报 **最高** 零售毛利率 国药一致年报 **高** 线上/O2O收入及占比 国药一致年报或投资者关系 **高** O2O上线率和合作平台 国药一致年报或行业调研 **中** 单店产出/坪效 国药一致年报 **中** DTP业务规模 国药一致年报或行业调研 **中** 与美团/饿了么/医药服务平台合作深度 行业调研 **低** 分销与零售利润拆分 国药一致年报","headings":[{"level":2,"text":"一句话定位","anchor":"doc-heading-1"},{"level":2,"text":"关键数据仪表盘","anchor":"doc-heading-2"},{"level":2,"text":"核心观点（5条）","anchor":"doc-heading-3"},{"level":2,"text":"重要结论","anchor":"doc-heading-4"},{"level":2,"text":"关键时间线","anchor":"doc-heading-5"},{"level":2,"text":"与即时零售的关联","anchor":"doc-heading-6"},{"level":2,"text":"信息溯源清单","anchor":"doc-heading-7"},{"level":2,"text":"数据补充优先级","anchor":"doc-heading-8"}],"outgoing":[]},{"id":"doc-d73b44f764b8","title":"大参林 · 新闻动态（2025-2026）","path":"02-连锁药店/大参林/公开新闻/大参林-新闻动态_2025-2026.md","stem":"大参林-新闻动态_2025-2026","module":"02-连锁药店","entity":"大参林","contentType":"公开新闻","isIndex":false,"isGovernance":false,"summary":"引用级别：✅可正式引用","learningTakeaway":"本文帮助你理解大参林 · 新闻动态的新闻动态资料，主要事件有业绩变化、门店调整、O2O运营、平台合作、监管合规和区域扩张。阅读后可以重点掌握：行业规模、平台竞争、财报指标、新闻动态、政策监管；主要帮助解决“这篇资料讲什么、关键事实是什么、后续应从哪些角度继续核验/阅读”的问题。","lastUpdated":"","citationStatus":"可正式引用","html":"<h1>大参林 · 新闻动态（2025-2026）<\/h1>\n<blockquote>\n<p>引用级别：✅可正式引用\n资料基础：官方公告、公司财报、交易所/港交所披露、公司官网新闻稿、监管披露或已核验权威公开来源。<\/p>\n<p>更新时间：2026-06-08\n信息来源：公司<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>、行业公开报道、<a href=\"https://www.sinohealth.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中康科技<\/a>等\n关联深度分析：<span class=\"wiki-link missing\">大参林深度分析<\/span><\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"doc-heading-1\">一句话定位<\/h2>\n<p>本文定位为大参林 · 新闻动态的新闻动态资料，主要事件有业绩变化、门店调整、O2O运营、平台合作、监管合规和区域扩张。<\/p>\n<h2 id=\"doc-heading-2\">一、2025年业绩与经营动态<\/h2>\n<h3 id=\"doc-heading-3\">1. 2025年营收275.02亿，同比增长3.80%——六家中规模最大<\/h3>\n<ul>\n<li><strong>来源<\/strong>：大参林医药集团2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a> [P83]<\/li>\n<li><strong>日期<\/strong>：2026-04（<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>披露）<\/li>\n<li><strong>核心内容<\/strong>：大参林2025年营业收入275.02亿元，同比增长3.80%，为六家头部连锁中营收规模最大的一家。归母净利润12.35亿元，同比增长35.0%<\/li>\n<li><strong>关键数据<\/strong>：营收275.02亿（+3.80%）；归母净利12.35亿（+35.0%）；扣非归母净利12.24亿（+38.4%）<\/li>\n<li><strong>可应用性思考<\/strong>：大参林是六家中规模最大的连锁药店，其O2O数据缺失（见下文）使得我们无法准确评估其线上竞争力（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-4\">2. 归母净利12.35亿增长35%——利润增长质量高<\/h3>\n<ul>\n<li><strong>来源<\/strong>：大参林2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a> [P7/P84]<\/li>\n<li><strong>日期<\/strong>：2026-04<\/li>\n<li><strong>核心内容<\/strong>：利润增长35%的核心驱动力是费用控制——销售费用减少1.74亿（-2.81%），其中人工费降2.04亿、促销费砍1.02亿。非经常性损益仅1,082万（占比0.9%），利润增长几乎没有\"水分\"<\/li>\n<li><strong>关键数据<\/strong>：销售费用60.19亿（-2.81%）；促销费5.36→4.34亿（-19%）；人工费33.60→31.56亿（-6.07%）<\/li>\n<li><strong>可应用性思考<\/strong>：大参林主动退出价格战（砍促销费19%）说明其正在从\"规模优先\"转向\"利润优先\"，这可能影响其在O2O平台上的价格竞争力（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-5\">3. 零售毛利率36.96%（+0.34pct），品类\"砍量提利\"<\/h3>\n<ul>\n<li><strong>来源<\/strong>：大参林2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a> [P28]<\/li>\n<li><strong>日期<\/strong>：2026-04<\/li>\n<li><strong>核心内容<\/strong>：零售毛利率提升0.34pct至36.96%。但分品类看，中参药材收入-9.08%但毛利率+1.99pct，非药品收入-3.13%但毛利率+3.61pct——典型的\"砍量提利\"策略（仅推测）<\/li>\n<li><strong>关键数据<\/strong>：中参药材毛利率44.31%（+1.99pct）；非药品毛利率45.33%（+3.61pct）；中西成药毛利率29.58%（-0.42pct）<\/li>\n<li><strong>可应用性思考<\/strong>：大参林在牺牲低效品类收入规模以换取毛利率改善，这种策略可能使O2O渠道上大参林的高毛利品类供给减少（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-6\">4. 加盟净增1,240家，零收购<\/h3>\n<ul>\n<li><strong>来源<\/strong>：大参林2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a> [P33]<\/li>\n<li><strong>日期<\/strong>：2026-04<\/li>\n<li><strong>核心内容<\/strong>：期末门店17,758家（直营10,468+加盟7,290），新开自建501家，关闭536家，新增加盟1,240家。2025年零收购，完全靠自建+加盟<\/li>\n<li><strong>关键数据<\/strong>：17,758家；直营净减35家（新开501-关闭536）；加盟净增1,240家<\/li>\n<li><strong>可应用性思考<\/strong>：直营净减少+加盟快速扩张=更轻的资产结构，但加盟管控风险同步上升（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-7\">二、O2O与线上——最大信息不对称<\/h2>\n<h3 id=\"doc-heading-8\">5. O2O上线率80.38%，但销售额官方公开材料未列示该字段；仅保留已披露事实<\/h3>\n<ul>\n<li><strong>来源<\/strong>：大参林2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a> [P21]<\/li>\n<li><strong>日期<\/strong>：2026-04<\/li>\n<li><strong>核心内容<\/strong>：大参林只披露O2O上线率80.38%，没有披露任何O2O相关的收入数字。在同行（益丰、老百姓、健之佳）均披露线上销售数据的背景下，这是唯一不透明的头部连锁<\/li>\n<li><strong>关键数据<\/strong>：O2O上线率80.38%；O2O销售额：官方公开材料未列示该字段；仅保留已披露事实<\/li>\n<li><strong>可应用性思考<\/strong>：信息不对称让我们无法评估大参林在O2O上的竞争力。需要通过其他渠道（行业调研、平台数据）获取（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-9\">6. 物流费增加1.99亿（+173%）——O2O成本信号<\/h3>\n<ul>\n<li><strong>来源<\/strong>：大参林2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a> [P177]<\/li>\n<li><strong>日期<\/strong>：2026-04<\/li>\n<li><strong>核心内容<\/strong>：运输及物流配送费从1.15亿增至3.14亿（+172.82%），增幅远超营收增速（+3.8%）。<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>未解释具体原因，但可能与O2O配送成本有关（仅推测）<\/li>\n<li><strong>关键数据<\/strong>：物流费1.15→3.14亿（+173%）；营收+3.8%<\/li>\n<li><strong>可应用性思考<\/strong>：物流费激增173%但营收仅增3.8%，说明每单位物流投入的产出在下降——如果主要是O2O配送，那O2O的单均履约成本可能很高（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-10\">三、加盟扩张质量值得关注<\/h2>\n<h3 id=\"doc-heading-11\">7. 店均加盟分销收入从65万降到61万（-5.7%）<\/h3>\n<ul>\n<li><strong>来源<\/strong>：大参林2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a> [P28/P29] + 计算<\/li>\n<li><strong>日期<\/strong>：2026-04<\/li>\n<li><strong>核心内容<\/strong>：加盟门店增长20.5%（从约6,050到7,290家），但加盟分销收入只增长13.6%（从39.40到44.75亿），导致店均加盟分销收入下降约5.7%<\/li>\n<li><strong>关键数据<\/strong>：店均加盟分销收入65.1→61.4万（-5.7%）<\/li>\n<li><strong>可应用性思考<\/strong>：加盟扩张速度&gt;加盟质量提升速度，可能影响大参林加盟体系的长期可持续性（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-12\">四、行业级关联动态<\/h2>\n<h3 id=\"doc-heading-13\">8. 药店数量负增长，头部连锁关店\"止血\"<\/h3>\n<ul>\n<li><strong>来源<\/strong>：<a href=\"https://www.sinohealth.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中康科技<\/a>/药械江湖<\/li>\n<li><strong>日期<\/strong>：2025-2026<\/li>\n<li><strong>核心内容<\/strong>：全国药店数量连续4个季度环比负增长。大参林2025年关闭536家直营门店<\/li>\n<li><strong>关键数据<\/strong>：大参林关店536家<\/li>\n<li><strong>可应用性思考<\/strong>：大参林主动关店优化网络，关店后的区域可能有O2O供给缺口——秒送药房可考虑在空白区域布局（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-14\">9. O2O药品市场规模384亿元<\/h3>\n<ul>\n<li><strong>来源<\/strong>：<a href=\"https://www.sinohealth.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中康科技<\/a>《2025中国医药核心渠道全景报告》<\/li>\n<li><strong>日期<\/strong>：2025<\/li>\n<li><strong>关键数据<\/strong>：O2O渠道规模384亿元<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-15\">五、关键时间线<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">时间<\/th>\n<th style=\"text-align: left;\">事件<\/th>\n<th style=\"text-align: left;\">数据/影响<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">2025全年<\/td>\n<td style=\"text-align: left;\">营收275.02亿（+3.80%）<\/td>\n<td style=\"text-align: left;\">六家最大<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2025全年<\/td>\n<td style=\"text-align: left;\">归母12.35亿（+35.0%）<\/td>\n<td style=\"text-align: left;\">利润增长质量高<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2025全年<\/td>\n<td style=\"text-align: left;\">销售费用-2.81%，促销费-19%<\/td>\n<td style=\"text-align: left;\">主动退出价格战<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2025全年<\/td>\n<td style=\"text-align: left;\">物流费+173%<\/td>\n<td style=\"text-align: left;\">O2O成本信号<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2025全年<\/td>\n<td style=\"text-align: left;\">加盟净增1,240家，零收购<\/td>\n<td style=\"text-align: left;\">加盟主力扩张<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2025全年<\/td>\n<td style=\"text-align: left;\">O2O上线率80.38%，销售额官方公开材料未列示该字段；仅保留已披露事实<\/td>\n<td style=\"text-align: left;\">信息不对称<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2025全年<\/td>\n<td style=\"text-align: left;\">关闭536家直营门店<\/td>\n<td style=\"text-align: left;\">网络优化<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2025 Q4<\/td>\n<td style=\"text-align: left;\">净利率2.07%（全年最低）<\/td>\n<td style=\"text-align: left;\">集中确认费用<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />","rawText":"大参林 · 新闻动态（2025-2026） 引用级别：✅可正式引用 资料基础：官方公告、公司财报、交易所/港交所披露、公司官网新闻稿、监管披露或已核验权威公开来源。 更新时间：2026-06-08 信息来源：公司年报、行业公开报道、中康科技等 关联深度分析：大参林深度分析 一句话定位 本文定位为大参林 · 新闻动态的新闻动态资料，主要事件有业绩变化、门店调整、O2O运营、平台合作、监管合规和区域扩张。 一、2025年业绩与经营动态 1. 2025年营收275.02亿，同比增长3.80%——六家中规模最大 来源**：大参林医药集团2025年年度报告 [P83] 日期**：2026-04（年报披露） 核心内容**：大参林2025年营业收入275.02亿元，同比增长3.80%，为六家头部连锁中营收规模最大的一家。归母净利润12.35亿元，同比增长35.0% 关键数据**：营收275.02亿（+3.80%）；归母净利12.35亿（+35.0%）；扣非归母净利12.24亿（+38.4%） 可应用性思考**：大参林是六家中规模最大的连锁药店，其O2O数据缺失（见下文）使得我们无法准确评估其线上竞争力（仅推测） 2. 归母净利12.35亿增长35%——利润增长质量高 来源**：大参林2025年年度报告 [P7/P84] 日期**：2026-04 核心内容**：利润增长35%的核心驱动力是费用控制——销售费用减少1.74亿（-2.81%），其中人工费降2.04亿、促销费砍1.02亿。非经常性损益仅1,082万（占比0.9%），利润增长几乎没有\"水分\" 关键数据**：销售费用60.19亿（-2.81%）；促销费5.36→4.34亿（-19%）；人工费33.60→31.56亿（-6.07%） 可应用性思考**：大参林主动退出价格战（砍促销费19%）说明其正在从\"规模优先\"转向\"利润优先\"，这可能影响其在O2O平台上的价格竞争力（仅推测） 3. 零售毛利率36.96%（+0.34pct），品类\"砍量提利\" 来源**：大参林2025年年度报告 [P28] 日期**：2026-04 核心内容**：零售毛利率提升0.34pct至36.96%。但分品类看，中参药材收入-9.08%但毛利率+1.99pct，非药品收入-3.13%但毛利率+3.61pct——典型的\"砍量提利\"策略（仅推测） 关键数据**：中参药材毛利率44.31%（+1.99pct）；非药品毛利率45.33%（+3.61pct）；中西成药毛利率29.58%（-0.42pct） 可应用性思考**：大参林在牺牲低效品类收入规模以换取毛利率改善，这种策略可能使O2O渠道上大参林的高毛利品类供给减少（仅推测） 4. 加盟净增1,240家，零收购 来源**：大参林2025年年度报告 [P33] 日期**：2026-04 核心内容**：期末门店17,758家（直营10,468+加盟7,290），新开自建501家，关闭536家，新增加盟1,240家。2025年零收购，完全靠自建+加盟 关键数据**：17,758家；直营净减35家（新开501-关闭536）；加盟净增1,240家 可应用性思考**：直营净减少+加盟快速扩张=更轻的资产结构，但加盟管控风险同步上升（仅推测） 二、O2O与线上——最大信息不对称 5. O2O上线率80.38%，但销售额官方公开材料未列示该字段；仅保留已披露事实 来源**：大参林2025年年度报告 [P21] 日期**：2026-04 核心内容**：大参林只披露O2O上线率80.38%，没有披露任何O2O相关的收入数字。在同行（益丰、老百姓、健之佳）均披露线上销售数据的背景下，这是唯一不透明的头部连锁 关键数据**：O2O上线率80.38%；O2O销售额：官方公开材料未列示该字段；仅保留已披露事实 可应用性思考**：信息不对称让我们无法评估大参林在O2O上的竞争力。需要通过其他渠道（行业调研、平台数据）获取（仅推测） 6. 物流费增加1.99亿（+173%）——O2O成本信号 来源**：大参林2025年年度报告 [P177] 日期**：2026-04 核心内容**：运输及物流配送费从1.15亿增至3.14亿（+172.82%），增幅远超营收增速（+3.8%）。年报未解释具体原因，但可能与O2O配送成本有关（仅推测） 关键数据**：物流费1.15→3.14亿（+173%）；营收+3.8% 可应用性思考**：物流费激增173%但营收仅增3.8%，说明每单位物流投入的产出在下降——如果主要是O2O配送，那O2O的单均履约成本可能很高（仅推测） 三、加盟扩张质量值得关注 7. 店均加盟分销收入从65万降到61万（-5.7%） 来源**：大参林2025年年度报告 [P28/P29] + 计算 日期**：2026-04 核心内容**：加盟门店增长20.5%（从约6,050到7,290家），但加盟分销收入只增长13.6%（从39.40到44.75亿），导致店均加盟分销收入下降约5.7% 关键数据**：店均加盟分销收入65.1→61.4万（-5.7%） 可应用性思考**：加盟扩张速度>加盟质量提升速度，可能影响大参林加盟体系的长期可持续性（仅推测） 四、行业级关联动态 8. 药店数量负增长，头部连锁关店\"止血\" 来源**：中康科技/药械江湖 日期**：2025-2026 核心内容**：全国药店数量连续4个季度环比负增长。大参林2025年关闭536家直营门店 关键数据**：大参林关店536家 可应用性思考**：大参林主动关店优化网络，关店后的区域可能有O2O供给缺口——秒送药房可考虑在空白区域布局（仅推测） 9. O2O药品市场规模384亿元 来源**：中康科技《2025中国医药核心渠道全景报告》 日期**：2025 关键数据**：O2O渠道规模384亿元 五、关键时间线 时间 事件 数据/影响 :--- :--- :--- 2025全年 营收275.02亿（+3.80%） 六家最大 2025全年 归母12.35亿（+35.0%） 利润增长质量高 2025全年 销售费用-2.81%，促销费-19% 主动退出价格战 2025全年 物流费+173% O2O成本信号 2025全年 加盟净增1,240家，零收购 加盟主力扩张 2025全年 O2O上线率80.38%，销售额官方公开材料未列示该字段；仅保留已披露事实 信息不对称 2025全年 关闭536家直营门店 网络优化 2025 Q4 净利率2.07%（全年最低） 集中确认费用","headings":[{"level":2,"text":"一句话定位","anchor":"doc-heading-1"},{"level":2,"text":"一、2025年业绩与经营动态","anchor":"doc-heading-2"},{"level":3,"text":"1. 2025年营收275.02亿，同比增长3.80%——六家中规模最大","anchor":"doc-heading-3"},{"level":3,"text":"2. 归母净利12.35亿增长35%——利润增长质量高","anchor":"doc-heading-4"},{"level":3,"text":"3. 零售毛利率36.96%（+0.34pct），品类\"砍量提利\"","anchor":"doc-heading-5"},{"level":3,"text":"4. 加盟净增1,240家，零收购","anchor":"doc-heading-6"},{"level":2,"text":"二、O2O与线上——最大信息不对称","anchor":"doc-heading-7"},{"level":3,"text":"5. O2O上线率80.38%，但销售额官方公开材料未列示该字段；仅保留已披露事实","anchor":"doc-heading-8"},{"level":3,"text":"6. 物流费增加1.99亿（+173%）——O2O成本信号","anchor":"doc-heading-9"},{"level":2,"text":"三、加盟扩张质量值得关注","anchor":"doc-heading-10"},{"level":3,"text":"7. 店均加盟分销收入从65万降到61万（-5.7%）","anchor":"doc-heading-11"},{"level":2,"text":"四、行业级关联动态","anchor":"doc-heading-12"},{"level":3,"text":"8. 药店数量负增长，头部连锁关店\"止血\"","anchor":"doc-heading-13"},{"level":3,"text":"9. O2O药品市场规模384亿元","anchor":"doc-heading-14"},{"level":2,"text":"五、关键时间线","anchor":"doc-heading-15"}],"outgoing":[]},{"id":"doc-635e88384406","title":"大参林-结构化摘要", r>\n<tr>\n<td style=\"text-align: left;\">O2O上线率<\/td>\n<td style=\"text-align: left;\">80.38%<\/td>\n<td style=\"text-align: left;\">—<\/td>\n<td style=\"text-align: left;\">2025年末<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>[P21]<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">O2O销售额<\/td>\n<td style=\"text-align: left;\">官方公开材料未列示该字段；仅保留已披露事实<\/td>\n<td style=\"text-align: left;\">—<\/td>\n<td style=\"text-align: left;\">—<\/td>\n<td style=\"text-align: left;\">—<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">门店总数<\/td>\n<td style=\"text-align: left;\">17,758家<\/td>\n<td style=\"text-align: left;\">↑<\/td>\n<td style=\"text-align: left;\">2025年末<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>[P16]<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">直营门店<\/td>\n<td style=\"text-align: left;\">10,468家<\/td>\n<td style=\"text-align: left;\">↓（净减35）<\/td>\n<td style=\"text-align: left;\">2025年末<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>[P16]<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">加盟门店<\/td>\n<td style=\"text-align: left;\">7,290家<\/td>\n<td style=\"text-align: left;\">↑（净增1,240）<\/td>\n<td style=\"text-align: left;\">2025年末<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>[P16]<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">销售费用<\/td>\n<td style=\"text-align: left;\">60.19亿元<\/td>\n<td style=\"text-align: left;\">↓-2.81%<\/td>\n<td style=\"text-align: left;\">2025全年<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>[P83]<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">促销费<\/td>\n<td style=\"text-align: left;\">4.34亿元<\/td>\n<td style=\"text-align: left;\">↓-19.0%<\/td>\n<td style=\"text-align: left;\">2025全年<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>[P177]<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">运输物流费<\/td>\n<td style=\"text-align: left;\">3.14亿元<\/td>\n<td style=\"text-align: left;\">↑+173%<\/td>\n<td style=\"text-align: left;\">2025全年<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>[P177]<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">经营现金流<\/td>\n<td style=\"text-align: left;\">53.50亿元<\/td>\n<td style=\"text-align: left;\">↑<\/td>\n<td style=\"text-align: left;\">2025全年<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"doc-heading-3\">核心观点（5条）<\/h2>\n<ol>\n<li>\n<p><strong>利润增长35%质量高，但主要靠\"省钱\"<\/strong>：费用下降贡献了53%的利润增量（销售费用-1.74亿+财务费用-0.52亿+管理费用-0.36亿），收入端增长贡献相对有限。2026年如果费用下降空间收窄，利润增速可能回落。（仅推测）<\/p>\n<\/li>\n<li>\n<p><strong>O2O数据完全不透明是最大问题<\/strong>：在益丰、老百姓、健之佳均披露线上销售数据的背景下，大参林只披露O2O上线率80.38%。同时物流费激增173%（+1.99亿），投资者无法评估O2O投入产出。<\/p>\n<\/li>\n<li>\n<p><strong>\"砍量提利\"的品类策略<\/strong>：中参药材收入-9.08%但毛利率+1.99pct，非药品收入-3.13%但毛利率+3.61pct。主动牺牲低效品类收入规模换取毛利率改善——这是\"规模优先\"向\"利润优先\"的明确信号。（仅推测）<\/p>\n<\/li>\n<li>\n<p><strong>加盟扩张最猛，但边际效益递减<\/strong>：加盟净增1,240家是六家中最多的，但店均加盟分销收入从65万降到61万（-5.7%）。加盟扩张速度&gt;质量提升速度。<\/p>\n<\/li>\n<li>\n<p><strong>主动退出价格战<\/strong>：促销费砍了19%（-1.02亿），说明大参林在主动退出线下价格战。但在O2O平台上，价格竞争力可能反而更重要——退出线下价格战和在O2O上的定价策略是两个不同维度。（仅推测）<\/p>\n<\/li>\n<\/ol>\n<h2 id=\"doc-heading-4\">重要结论<\/h2>\n<di 事实 — — — 门店总数 17,758家 ↑ 2025年末 年报[P16] 直营门店 10,468家 ↓（净减35） 2025年末 年报[P16] 加盟门店 7,290家 ↑（净增1,240） 2025年末 年报[P16] 销售费用 60.19亿元 ↓-2.81% 2025全年 年报[P83] 促销费 4.34亿元 ↓-19.0% 2025全年 年报[P177] 运输物流费 3.14亿元 ↑+173% 2025全年 年报[P177] 经营现金流 53.50亿元 ↑ 2025全年 年报 核心观点（5条） 1. **利润增长35%质量高，但主要靠\"省钱\"**：费用下降贡献了53%的利润增量（销售费用-1.74亿+财务费用-0.52亿+管理费用-0.36亿），收入端增长贡献相对有限。2026年如果费用下降空间收窄，利润增速可能回落。（仅推测） 2. **O2O数据完全不透明是最大问题**：在益丰、老百姓、健之佳均披露线上销售数据的背景下，大参林只披露O2O上线率80.38%。同时物流费激增173%（+1.99亿），投资者无法评估O2O投入产出。 3. **\"砍量提利\"的品类策略**：中参药材收入-9.08%但毛利率+1.99pct，非药品收入-3.13%但毛利率+3.61pct。主动牺牲低效品类收入规模换取毛利率改善——这是\"规模优先\"向\"利润优先\"的明确信号。（仅推测） 4. **加盟扩张最猛，但边际效益递减**：加盟净增1,240家是六家中最多的，但店均加盟分销收入从65万降到61万（-5.7%）。加盟扩张速度>质量提升速度。 5. **主动退出价格战**：促销费砍了19%（-1.02亿），说明大参林在主动退出线下价格战。但在O2O平台上，价格竞争力可能反而更重要——退出线下价格战和在O2O上的定价策略是两个不同维度。（仅推测） 重要结论 结论 置信度 依据 变量 :--- :--- :--- :--- 大参林是六家中规模最大、ROE最高的连锁 高 营收275亿+扣非ROE 17.0% — 利润增长靠费用控制，持续性待验证 中 费用下降贡献53%利润增量 费用下降空间有限，2026年需收入端发力 O2O投入大但产出不透明 中 物流费+173%，O2O销售额官方公开材料未列示该字段；仅保留已披露事实 物流费增加不一定全由O2O导致 加盟扩张边际效益递减 中 店均加盟分销收入-5.7% 可能是新店爬坡期现象 （仅推测） 关键时间线 时间 事件 数据/影响 :--- :--- :--- 2025全年 营收275.02亿（+3.80%） 六家最大 2025全年 归母12.35亿（+35.0%） 利润增长质量高 2025全年 销售费用-2.81%，促销费-19% 退出价格战 2025全年 物流费+173% O2O成本信号 2025全年 加盟净增1,240家 加盟最猛 2025全年 关闭536家直营 网络优化 2025 Q4 净利率2.07%（全年最低） 集中确认费用 2025全年 O2O销售额官方公开材料未列示该字段；仅保留已披露事实 信息不对称 与老百姓、益丰对比 维度 大参林 老百姓 益丰药房 :--- :--- :--- :--- 营收(亿) 275.0 222.4 244.3 营收增速 +3.80% -0.54% +1.54% 归母净利(亿) 12.35 3.82 16.78 扣非ROE 17.0% ~5.6% 14.4% 零售毛利率 36.96%(+0.34pct) 综合32.30%(-0.87pct) 40.82%(-0.57pct) 线上销售 官方公开材料未列示该字段；仅保留已披露事实 31.2亿(+26.3%) 29.93亿 门店数 17,758 14,975 14,831 加盟净增 1,240 791 501 核心特征 规模最大，利润弹性大 O2O最激进，利润最薄 最稳，盈利能力最强 最大风险 O2O数据不透明 商誉减值+O2O毛利率 增速放缓 信息溯源清单 信息 来源 时间 链接/备注 :--- :--- :--- :--- 营收275.02亿(+3.80%) 大参林2025年年报 [P83] 2026-04 大参林深度分析 归母12.35亿(+35.0%) 大参林2025年年报 [P84] 2026-04 同上 扣非+38.4% 大参林2025年年报 [P7] 2026-04 同上 零售毛利率36.96%(+0.34pct) 大参林2025年年报 [P28] 2026-04 同上 O2O上线率80.38% 大参林2025年年报 [P21] 2026-04 同上 物流费+173% 大参林2025年年报 [P177] 2026-04 同上 门店17,758家 大参林2025年年报 [P16] 2026- el=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>、<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>、<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">一季报<\/a>、<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">主流财经报道<\/a>和医保/监管公示转引补充。未在公告或主流公开材料中找到明确披露的事项，按“官方公开材料未列示明确信息；仅保留已披露事实”处理，不做判断。（仅推测）<\/p>\n<\/blockquote>\n<h3 id=\"doc-heading-4\">3. 2026年Q1业绩情况<\/h3>\n<p>| 发布时间 | 发布主体 | 事件摘要 | 影响判断 | 来源 |（仅推测）\n|:---|:---|:---|:---|:---|\n| 2026-04-29 | 漱玉平民大药房连锁股份有限公司 | 2026年Q1营业收入26.01亿元，同比+9.36%；归母净利润1,035.77万元，同比-59.58%；扣非归母净利润970.62万元，同比-58.27%；经营活动现金流净额5,455.82万元，同比-38.25%；加权平均净资产收益率0.51%，同比下降0.83个百分点。 | 收入增长但利润和现金流明显承压，说明规模扩张、物流项目折旧、可转债利息和费用投入对利润形成拖累；短期更应关注利润质量和现金流，而非单纯收入增速。 | 漱玉平民2026年第一<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">季度报告<\/a>（<a href=\"https://data.eastmoney.com/notices/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">东方财富公告<\/a>正文/<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">巨潮资讯网<\/a>，2026-04-29）；<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">一季报<\/a>解读（2026-04-29） |<\/p>\n<h3 id=\"doc-heading-5\">4. 门店数、O2O上线率与核心经营数据<\/h3>\n<p>| 发布时间 | 发布主体 | 事件摘要 | 影响判断 | 来源 |（仅推测）\n|:---|:---|:---|:---|:---|\n| 2026-04 | 漱玉平民 | 2025年末公司门店8,869家；2026Q1末门店8,447家，其中直营门店4,862家。2025年O2O销售额9.92亿元，同比+14.7%；公司通过深化商圈运营和商品结构精细化管理扩大覆盖城市规模，并建成智能配送预警系统，配送准时率提升至98.6%。 | 门店规模较大但盈利承压，O2O仍保持双位数增长；配送准时率提升说明履约系统投入有效，但O2O绝对规模相对总营收仍不高，后续需要观察上线门店覆盖率、订单量和客单价。 | 漱玉平民2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a>（<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a>公告页，2026-04-29）；<a href=\"https://www.yidiandian.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">第一药店财智<\/a>/<a href=\"https://xueqiu.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">雪球<\/a>转引<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>内容（2026-04-28）；<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">一季报<\/a>解读（2026-04-29） |<\/p>\n<h3 id=\"doc-heading-6\">5. 区域布局和扩张策略<\/h3>\n<p>| 发布时间 | 发布主体 | 事件摘要 | 影响判断 | 来源 |（仅推测）\n|:---|:---|:---|:---|:---|\n| 2026-04 | 漱玉平民 | 2026Q1门店布局继续优化：公开报道披露，截至报告期末公司门店8,447家，其中山东区域关闭37家门店，福建区域新增8家门店。 | 公司从粗放扩张转向区域结构优化，山东大本营存在门店调整压力，福建等外埠区域仍有补点动作；区域深耕策略有效性需要结合单店产出和医保合规风险观察。 | <a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">一季报<\/a>解读（2026-04-29） | （仅推测） |\n| 2025-2026 | 漱玉平民/媒体转引 | 2025年营收仍同比增长，但2026Q1净利润大幅下滑，显示区域深耕与规模扩张并不能完全抵消费用和合规压力。 | 对即时零售合作而言，漱玉平民的区域密度仍有价值，但合作重点应从“增加门店数”转为“提升高质量门店的O2O履约、医保合规和夜间/应急购药能力”。 | 漱玉平民2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a>；漱玉平民2026年第一<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">季度报告<\/a>；<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">一季报<\/a>解读 |<\/p>\n<h3 id=\"doc-heading-7\">6. 与美团/饿了么/医药服务平台等平台合作动态<\/h3>\n<p>| 发布时间 | 发布主体 | 事件摘要 | 影响判断 | 来源 |（仅推测）\n|:---|:---|:---|:---|:---|\n| 2025-2026 | 漱玉平民/公开报道 | 公开公告和主流报道中未见漱玉平民在2026年与美团、饿了么或<a href=\"https://ir.jdhealth.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">医药服务平台<\/a>的新签约/专项合作事件；可确认公司披露O2O销售额和配送准时率，但未单独披露具体合作平台、平台门店数、GMV或订单量。 | 当前只能确认漱玉平民O2O业务在增长，不能写成与某一平台新增战略合作；后续需要<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>、平台新闻或内部合作清单确认具体合作对象和规模。 | 漱玉平民2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a>；<a href=\"https://www.yidiandian.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">第一药店财智<\/a>/<a href=\"https://xueqiu.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">雪球<\/a>转引<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>内容（2026-04-28）；本次公开检索未见专项合作公告 |<\/p>\n<h3 id=\"doc-heading-8\">7. 监管处罚/合规事件<\/h3>\n<p>| 发布时间 | 发布主体 | 事件摘要 | 影响判断 | 来源 |（仅推测）\n|:---|:---|:---|:---|:---|\n| 2025-06 | 山东省医保局/媒体转引 | 媒体报道称山东省医保局公告中有济南两家漱玉平民药房被解除省直医保协议关系，报道官方公开材料未列示该字段；仅保留已披露事实具体事由；同文回溯称2024年济南、青岛等地多家漱玉平民相关门店因医保违规或重大信息变更等被解除医保协议。 | 医保定点资格和医保结算合规是漱玉平民的重要经营风险；对O2O和处方药履约而言，医保合规风险会直接影响线上医保支付、处方流转和门店客流。 | <a href=\"https://www.baidu.com/s?wd=%E5%8D%8A%E5%B2%9B%E9%83%BD%E5%B8%82%E6%8A%A5/%E6%90%9C%E7%8B%90%E8%BD%AC%E5%BC%95%E5%B1%B1%E4%B8%9C%E7%9C%81%E5%8C%BB%E4%BF%9D%E5%B1%80%E5%8F%8A%E5%9C%B0%E6%96%B9%E5%8C%BB%E4%BF%9D%E4%BF%A1%E6%81%AF%EF%BC%882025-06-06%EF%BC%89\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">半岛都市报/搜狐转引山东省医保局及地方医保信息（2025-06-06）<\/a> |\n| 2024-10 | <a href=\"https://www.nhsa.gov.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">国家医保局<\/a>/媒体转引 | <a href=\"https://www.nhsa.gov.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">国家医保局<\/a>通报哈尔滨宝丰大药房骗保案，媒体报道称涉事药店包括漱玉平民旗下宝丰大药房，公安机关刑事立案并冻结涉案医保基金6,223万元。 | 虽发生在2024年，但该事件对2025-2026年合规形象仍有影响；后续合作评估应关注处方真实性、医保结算、门店执行和区域子公司治理。 | <a href=\"https://news.qq.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">腾讯新闻<\/a>/今日头条转引<a href=\"https://www.nhsa.gov.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">国家医保局<\/a>通报（2024-10） |\n| 2026-05 | 信用中国（甘肃）/媒体转引 | 公开报道显示，漱玉平民一门店因执业药师外出培训期间销售处方药被举报并处罚；该信息为媒体转引信用公示。 | 单店处方药合规问题说明药师在岗、审方和处方药销售仍是连锁药店高频监管点。 | <a href=\"https://xueqiu.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">雪球<\/a>转引信用中国（甘肃）公开信息（2026-05） |<\/p>\n<h3 id=\"doc-heading-9\">8. 2026年业务布局和战略调整<\/h3>\n<p>| 发布时间 | 发布主体 | 事件摘要 | 影响判断 | 来源 |（仅推测）\n|:---|:---|:---|:---|:---|\n| 2026-04 | 漱玉平民 | 2026Q1收入增长但净利润下滑，主要受到流感季节性回落、现代物流项目（二期）折旧增加、可转债利息停止资本化及费用上升影响。 | 2026年经营重点应转向费用控制、物流资产效率释放、门店结构优化和高质量O2O增长，否则收入增长难以转化为利润。 | 漱玉平民2026年第一<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">季度报告<\/a>；<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">一季报<\/a>解读（2026-04-29） |\n| 2026-04 | 漱玉平民 | O2O方面，公司已披露通过商圈运营、商品结构精细化和智能配送预警系统提升履约体验。 | O2O战略重点从“上线”转向“履约质量和商品效率”；若能与区域高密度门店、慢病/处方服务结合，仍有提升空间。 | 漱玉平民2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a>；<a href=\"https://www.yidiandian.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">第一药店财智<\/a>/<a href=\"https://xueqiu.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">雪球<\/a>转引<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>内容 | （仅推测） |<\/p>","rawText":"漱玉平民 - 新闻动态（2025-2026） 引用级别：✅可正式引用 资料基础：官方公告、公司财报、交易所/港交所披露、公司官网新闻稿、监管披露或已核验权威公开来源。 基于漱玉平民2025年年报、2026年一季度报告及公开报道整理。 最后更新：2026-06-08 声明：本次已补充公开检索结果；财务数据优先采用公司公告/巨潮资讯网披露，门店、O2O、区域布局和合规事件采用公司年报、季度报告、主流媒体和监管/医保公示转引。未见官方披露的事项明确标注“官方公开材料未列示明确信息；仅保留已披露事实”。 一句话定位 本文定位为漱玉平民 - 新闻动态的新闻动态资料，主要事件有业绩变化、门店调整、O2O运营、平台合作、监管合规和区域扩张。 业绩动态 1. **2025年营收103.27亿元，同比+7.91%** — 据年报披露 归母净利润1.14亿元，同比+160.50%（低基数+非经常性因素） 可应用性思考：净利润高增需看扣非数据，营收增速在六家连锁中排第二（仅低于大参林），说明区域深耕策略有效（仅推测） 2. **O2O销售额9.92亿元，同比+14.7%** — 据年报披露 可应用性思考：O2O绝对规模较小但增速可观，说明O2O渗透仍有较大提升空间（仅推测） 公开检索补充信息（2026-06-08核验） 说明**：以下信息已按公司公告、年报、一季报、主流财经报道和医保/监管公示转引补充。未在公告或主流公开材料中找到明确披露的事项，按“官方公开材料未列示明确信息；仅保留已披露事实”处理，不做判断。（仅推测） 3. 2026年Q1业绩情况 发布时间 发布主体 事件摘要 影响判断 来源 （仅推测） :--- :--- :--- :--- :--- 2026-04-29 漱玉平民大药房连锁股份有限公司 2026年Q1营业收入26.01亿元，同比+9.36%；归母净利润1,035.77万元，同比-59.58%；扣非归母净利润970.62万元，同比-58.27%；经营活动现金流净额5,455.82万元，同比-38.25%；加权平均净资产收益率0.51%，同比下降0.83个百分点。 收入增长但利润和现金流明显承压，说明规模扩张、物流项目折旧、可转债利息和费用投入对利润形成拖累；短期更应关注利润质量和现金流，而非单纯收入增速。 漱玉平民2026年第一季度报告（东方财富公告正文/巨潮资讯网，2026-04-29）；新浪财经一季报解读（2026-04-29） 4. 门店数、O2O上线率与核心经营数据 发布时间 发布主体 事件摘要 影响判断 来源 （仅推测） :--- :--- :--- :--- :--- 2026-04 漱玉平民 2025年末公司门店8,869家；2026Q1末门店8,447家，其中直营门店4,862家。2025年O2O销售额9.92亿元，同比+14.7%；公司通过深化商圈运营和商品结构精细化管理扩大覆盖城市规模，并建成智能配送预警系统，配送准时率提升至98.6%。 门店规模较大但盈利承压，O2O仍保持双位数增长；配送准时率提升说明履约系统投入有效，但O2O绝对规模相对总营收仍不高，后续需要观察上线门店覆盖率、订单量和客单价。 漱玉平民2025年年度报告（新浪财经公告页，2026-04-29）；第一药店财智/雪球转引年报内容（2026-04-28）；新浪财经一季报解读（2026-04-29） 5. 区域布局和扩张策略 发布时间 发布主体 事件摘要 影响判断 来源 （仅推测） :--- :--- :--- :--- :--- 2026-04 漱玉平民 2026Q1门店布局继续优化：公开报道披露，截至报告期末公司门店8,447家，其中山东区域关闭37家门店，福建区域新增8家门店。 公司从粗放扩张转向区域结构优化，山东大本营存在门店调整压力，福建等外埠区域仍有补点动作；区域深耕策略有效性需要结合单店产出和医保合规风险观察。 新浪财经一季报解读（2026-04-29） （仅推测） 2025-2026 漱玉平民/媒体转引 2025年营收仍同比增长，但2026Q1净利润大幅下滑，显示区域深耕与规模扩张并不能完全抵消费用和合规压力。 对即时零售合作而言，漱玉平民的区域密度仍有价值，但合作重点应从“增加门店数”转为“提升高质量门店的O2O履约、医保合规和夜间/应急购药能力”。 漱玉平民2025年年度报告；漱玉平民2026年第一季度报告；新浪财经一季报解读 6. 与美团/饿了么/医药服务平台等平台合作动态 发布时间 发布主体 事件摘要 影响判断 来源 （仅推测） :--- :--- :--- :--- :--- 2025-2026 漱玉平民/公开报道 公开公告和主流报道中未见漱玉平民在2026年与美团、饿了么或医药服务平台的新签约/专项合作事件；可确认公司披露O2O销售额和配送准时率，但未单独披露具体合作平台、平台门店数、GMV或订单量。 当前只能确认漱玉平民O2O业务在增长，不能写成与某一平台新增战略合作；后续需要公司公告、平台新闻或内部合作清单确认具体合作对象和规模。 漱玉平民2025年年度报告；第一药店财智/雪球转引年报内容（2026-04-28）；本次公开检索未见专项合作公告 7. 监管处罚/合规事件 发布时间 发布主体 事件摘要 影响判断 来源 （仅推测） :--- :--- :--- :--- :--- 2025-06 山东省医保局/媒体转引 媒体报道称山东省医保局公告中有济南两家漱玉平民药房被解除省直医保协议关系，报道官方公开材料未列示该字段；仅保留已披露事实具体事由；同文回溯称2024年济南、青岛等地多家漱玉平民相关门店因医保违规或重大信息变更等被解除医保协议。 医保定点资格和医保结算合规是漱玉平民的重要经营风险；对O2O和处方药履约而言，医保合规风险会直接影响线上医保支付、处方流转和门店客流。 半岛都市报/搜狐转引山东省医保局及地方医保信息（2025-06-06） 2024-10 国家医保局/媒体转引 国家医保局通报哈尔滨宝丰大药房骗保案，媒体报道称涉事药店包括漱玉平民旗下宝丰大药房，公安机关刑事立案并冻结涉案医保基金6,223万元。 虽发生在2024年，但该事件对2025-2026年合规形象仍有影响；后续合作评估应关注处方真实性、医保结算、门店执行和区域子公司治理。 腾讯新闻/今日头条转引国家医保局通报（2024-10） 2026-05 信用中国（甘肃）/媒体转引 公开报道显示，漱玉平民一门店因执业药师外出培训期间销售处方药被举报并处罚；该信息为媒体转引信用公示。 单店处方药合规问题说明药师在岗、审方和处方药销售仍是连锁药店高频监管点。 雪球转引信用中国（甘肃）公开信息（2026-05） 8. 2026年业务布局和战略调整 发布时间 发布主体 事件摘要 影响判断 来源 （仅推测） :--- :--- :--- :--- :--- 2026-04 漱玉平民 2026Q1收入增长但净利润下滑，主要受到流感季节性回落、现代物流项目（二期）折旧增加、可转债利息停止资本化及费用上升影响。 2026年经营重点应转向费用控制、物流资产效率释放、门店结构优化和高质量O2O增长，否则收入增长难以转化为利润。 漱玉平民2026年第一季度报告；新浪财经一季报解读（2026-04-29） 2026-04 漱玉平民 O2O方面，公司已披露通过商圈运营、商品结构精细化和智能配送预警系统提升履约体验。 O2O战略重点从“上线”转向“履约质量和商品效率”；若能与区域高密度门店、慢病/处方服务结合，仍有提升空间。 漱玉平民2025年年度报告；第一药店财智/雪球转引年报内容 （仅推测）","headings":[{"level":2,"text":"一句话定位","anchor":"doc-heading-1"},{"level":2,"text":"业绩动态","anchor":"doc-heading-2"},{"level":2,"text":"公开检索补充信息（2026-06-08核验）","anchor":"doc-heading-3"},{"level":3,"text":"3. 2026年Q1业绩情况","anchor":"doc-heading-4"},{"level":3,"text":"4. 门店数、O2O上线率与核心经营数据","anchor":"doc-heading-5"},{"level":3,"text":"5. 区域布局和扩张策略","anchor":"doc-heading-6"},{"level":3,"text":"6. 与美团/饿了么/医药服务平台等平台合作动态","anchor":"doc-heading-7"},{"level":3,"text":"7. 监管处罚/合规事件","anchor":"doc-heading-8"},{"level":3,"text":"8. 2026年业务布局和战略调整","anchor":"doc-heading-9"}],"outgoing":[]},{"id":"doc-bc672b01f95c","title":"漱玉平民 - 结构化摘要","path":"02-连锁药店/漱玉平民/综合分析/漱玉平民-结构化摘要.md","stem":"漱玉平民-结构化摘要","module":"02-连锁药 交所披露、公司官网新闻稿、监管披露或已核验权威公开来源。<\/p>\n<p>更新时间：2026-06-08\n信息来源：公司<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>、行业公开报道、<a href=\"https://www.sinohealth.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中康科技<\/a>等\n关联深度分析：<span class=\"wiki-link missing\">益丰药房深度分析<\/span><\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"doc-heading-1\">一句话定位<\/h2>\n<p>本文定位为益丰药房 · 新闻动态的新闻动态资料，主要事件有业绩变化、门店调整、O2O运营、平台合作、监管合规和区域扩张。<\/p>\n<h2 id=\"doc-heading-2\">一、2025年业绩与经营动态<\/h2>\n<h3 id=\"doc-heading-3\">1. 2025年营收244.33亿，同比增长1.54%<\/h3>\n<ul>\n<li><strong>来源<\/strong>：益丰大药房连锁股份有限公司2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a> [P93]<\/li>\n<li><strong>日期<\/strong>：2026-04（<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>披露）<\/li>\n<li><strong>核心内容<\/strong>：益丰药房2025年营业收入244.33亿元，同比增长1.54%，在六家头部连锁中增速居中。归母净利润16.78亿元，同比增长9.81%，利润体量为六家中最大<\/li>\n<li><strong>关键数据<\/strong>：营收244.33亿（+1.54%）；归母净利16.78亿（+9.81%）<\/li>\n<li><strong>可应用性思考<\/strong>：益丰利润体量16.78亿远超大参林12.35亿和老百姓3.82亿，是最\"赚钱\"的连锁药店——其盈利能力和经营稳定性在O2O合作中意味着更可持续的投入能力（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-4\">2. 归母净利16.78亿增长9.81%——最稳的利润增长<\/h3>\n<ul>\n<li><strong>来源<\/strong>：益丰药房2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a> [P94]<\/li>\n<li><strong>日期<\/strong>：2026-04<\/li>\n<li><strong>核心内容<\/strong>：利润增长9.81%的驱动力更均衡——既有收入端稳健增长（零售+0.56%+加盟+15%），也有费用端结构性优化（销售费用-5.26%，省3.25亿）。ROE 14.98%连续三年维持15%左右<\/li>\n<li><strong>关键数据<\/strong>：销售费用58.54亿（-5.26%）；房租省1.73亿（-10%）；人工省0.97亿（-3.1%）；开办费-90%<\/li>\n<li><strong>可应用性思考<\/strong>：益丰的利润增长路径（降房租+降人工+少开新店）比大参林（砍促销19%）更可持续——房租下降是结构性的，促销费砍太狠可能影响客流（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-5\">3. 零售毛利率40.82%——行业最高<\/h3>\n<ul>\n<li><strong>来源<\/strong>：益丰药房2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a> [P22]<\/li>\n<li><strong>日期<\/strong>：2026-04<\/li>\n<li><strong>核心内容<\/strong>：益丰零售毛利率40.82%为六家中最高，但同比下降0.57pct。<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>解释\"零售端中西成药、中药毛利率有所下降\"。加盟分销毛利率从7.88%跳到10.06%（+2.18pct），供应链效率大幅提升<\/li>\n<li><strong>关键数据<\/strong>：零售毛利率40.82%（-0.57pct）；加盟分销毛利率10.06%（+2.18pct）<\/li>\n<li><strong>可应用性思考<\/strong>：零售毛利率行业最高说明益丰的品类管理能力最强——这意味着在O2O渠道上，益丰可能有更高的利润空间来承受平台佣金和配送成本（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-6\">4. 线上销售29.93亿，O2O 20.94亿<\/h3>\n<ul>\n<li><strong>来源<\/strong>：益丰药房2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a> [P11]<\/li>\n<li><strong>日期<\/strong>：2026-04<\/li>\n<li><strong>核心内容<\/strong>：益丰线上销售总额29.93亿（含税），其中O2O 20.94亿、B2C 8.99亿。O2O直营门店超10,000家，24h配送门店超600家。会员总量1.16亿<\/li>\n<li><strong>关键数据<\/strong>：线上29.93亿；O2O 20.94亿；B2C 8.99亿；O2O门店10,000+；会员1.16亿<\/li>\n<li><strong>可应用性思考<\/strong>：益丰是六家中唯一清晰披露O2O和B2C分拆数据的公司，透明度最高。O2O 20.94亿占线上总额的69.9%，说明O2O是益丰线上的绝对主力（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-7\">二、门店与扩张动态<\/h2>\n<h3 id=\"doc-heading-8\">5. 门店14,831家，净增仅147家<\/h3>\n<ul>\n<li><strong>来源<\/strong>：益丰药房2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a> [P10]<\/li>\n<li><strong>日期<\/strong>：2026-04<\/li>\n<li><strong>核心内容<\/strong>：期末门店14,831家（直营10,518+加盟4,313），新开自建仅193家，新增加盟501家，关闭547家。净增仅147家，扩张节奏明显放慢<\/li>\n<li><strong>关键数据<\/strong>：14,831家；自建193家；加盟+501家；关闭547家；净增+147家<\/li>\n<li><strong>可应用性思考<\/strong>：益丰2025年也在主动关店（547家），扩张大幅放缓——但利润增长9.81%说明\"少开店、多赚钱\"的策略在生效（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-9\">6. 会员1.16亿——六家中最大<\/h3>\n<ul>\n<li><strong>来源<\/strong>：益丰药房2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a> [P29]<\/li>\n<li><strong>日期<\/strong>：2026-04<\/li>\n<li><strong>核心内容<\/strong>：益丰会员总量1.16亿，在六家中最大<\/li>\n<li><strong>可应用性思考<\/strong>：1.16亿会员池是益丰的私域资产，在O2O场景可能与平台形成流量竞争。但也可以转化为O2O平台的用户基础（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-10\">三、区域布局<\/h2>\n<h3 id=\"doc-heading-11\">7. 华北增速最快（+4.58%）但毛利率降最猛（-1.70pct）<\/h3>\n<ul>\n<li><strong>来源<\/strong>：益丰药房2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a> [P22]<\/li>\n<li><strong>日期<\/strong>：2026-04<\/li>\n<li><strong>核心内容<\/strong>：中南（湘鄂粤，大本营）112.73亿（+2.58%），华东（苏沪浙赣）93.40亿（+0.19%），华北（京津冀）31.19亿（+4.58%）<\/li>\n<li><strong>关键数据<\/strong>：华北+4.58%但毛利率-1.70pct；中南+2.58%最稳定<\/li>\n<li><strong>可应用性思考<\/strong>：华北扩张期促销获客的代价——新市场的O2O毛利率可能更低。益丰在北京的O2O布局值得关注（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-12\">四、行业级关联动态<\/h2>\n<h3 id=\"doc-heading-13\">8. 药店数量负增长<\/h3>\n<ul>\n<li><strong>来源<\/strong>：<a href=\"https://www.sinohealth.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中康科技<\/a>/药械江湖<\/li>\n<li><strong>日期<\/strong>：2025-2026<\/li>\n<li><strong>核心内容<\/strong>：全国药店数量连续4个季度环比负增长。益丰关闭547家门店<\/li>\n<li><strong>可应用性思考<\/strong>：益丰关店547家是六家中最多的（大参林536家），主动优化力度最大（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-14\">9. O2O药品市场规模384亿元<\/h3>\n<ul>\n<li><strong>来源<\/strong>：<a href=\"https://www.sinohealth.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中康科技<\/a>《2025中国医药核心渠道全景报告》<\/li>\n<li><strong>日期<\/strong>：2025<\/li>\n<li><strong>关键数据<\/strong>：O2O渠道规模384亿元<\/li>\n<li><strong>可应用性思考<\/strong>：益丰O2O 20.94亿占O2O市场约5.5%【推理】，是O2O市场的重要供给方（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-15\">五、关键时间线<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">时间<\/th>\n<th style=\"text-align: left;\">事件<\/th>\n<th style=\"text-align: left;\">数据/影响<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align 房2025年年度报告 [P94] 日期**：2026-04 核心内容**：利润增长9.81%的驱动力更均衡——既有收入端稳健增长（零售+0.56%+加盟+15%），也有费用端结构性优化（销售费用-5.26%，省3.25亿）。ROE 14.98%连续三年维持15%左右 关键数据**：销售费用58.54亿（-5.26%）；房租省1.73亿（-10%）；人工省0.97亿（-3.1%）；开办费-90% 可应用性思考**：益丰的利润增长路径（降房租+降人工+少开新店）比大参林（砍促销19%）更可持续——房租下降是结构性的，促销费砍太狠可能影响客流（仅推测） 3. 零售毛利率40.82%——行业最高 来源**：益丰药房2025年年度报告 [P22] 日期**：2026-04 核心内容**：益丰零售毛利率40.82%为六家中最高，但同比下降0.57pct。年报解释\"零售端中西成药、中药毛利率有所下降\"。加盟分销毛利率从7.88%跳到10.06%（+2.18pct），供应链效率大幅提升 关键数据**：零售毛利率40.82%（-0.57pct）；加盟分销毛利率10.06%（+2.18pct） 可应用性思考**：零售毛利率行业最高说明益丰的品类管理能力最强——这意味着在O2O渠道上，益丰可能有更高的利润空间来承受平台佣金和配送成本（仅推测） 4. 线上销售29.93亿，O2O 20.94亿 来源**：益丰药房2025年年度报告 [P11] 日期**：2026-04 核心内容**：益丰线上销售总额29.93亿（含税），其中O2O 20.94亿、B2C 8.99亿。O2O直营门店超10,000家，24h配送门店超600家。会员总量1.16亿 关键数据**：线上29.93亿；O2O 20.94亿；B2C 8.99亿；O2O门店10,000+；会员1.16亿 可应用性思考**：益丰是六家中唯一清晰披露O2O和B2C分拆数据的公司，透明度最高。O2O 20.94亿占线上总额的69.9%，说明O2O是益丰线上的绝对主力（仅推测） 二、门店与扩张动态 5. 门店14,831家，净增仅147家 来源**：益丰药房2025年年度报告 [P10] 日期**：2026-04 核心内容**：期末门店14,831家（直营10,518+加盟4,313），新开自建仅193家，新增加盟501家，关闭547家。净增仅147家，扩张节奏明显放慢 关键数据**：14,831家；自建193家；加盟+501家；关闭547家；净增+147家 可应用性思考**：益丰2025年也在主动关店（547家），扩张大幅放缓——但利润增长9.81%说明\"少开店、多赚钱\"的策略在生效（仅推测） 6. 会员1.16亿——六家中最大 来源**：益丰药房2025年年度报告 [P29] 日期**：2026-04 核心内容**：益丰会员总量1.16亿，在六家中最大 可应用性思考**：1.16亿会员池是益丰的私域资产，在O2O场景可能与平台形成流量竞争。但也可以转化为O2O平台的用户基础（仅推测） 三、区域布局 7. 华北增速最快（+4.58%）但毛利率降最猛（-1.70pct） 来源**：益丰药房2025年年度报告 [P22] 日期**：2026-04 核心内容**：中南（湘鄂粤，大本营）112.73亿（+2.58%），华东（苏沪浙赣）93.40亿（+0.19%），华北（京津冀）31.19亿（+4.58%） 关键数据**：华北+4.58%但毛利率-1.70pct；中南+2.58%最稳定 可应用性思考**：华北扩张期促销获客的代价——新市场的O2O毛利率可能更低。益丰在北京的O2O布局值得关注（仅推测） 四、行业级关联动态 8. 药店数量负增长 来源**：中康科技/药械江湖 日期**：2025-2026 核心内容**：全国药店数量连续4个季度环比负增长。益丰关闭547家门店 可应用性思考**：益丰关店547家是六家中最多的（大参林536家），主动优化力度最大（仅推测） 9. O2O药品市场规模384亿元 来源**：中康科技《2025中国医药核心渠道全景报告》 日期**：2025 关键数据**：O2O渠道规模384亿元 可应用性思考**：益丰O2O 20.94亿占O2O市场约5.5%【推理】，是O2O市场的重要供给方（仅推测） 五、关键时间线 时间 事件 数据/影响 :--- :--- :--- 2025全年 营收244.33亿（+1.54%） 增速居中 2025全年 归母16.78亿（+9.81%） 六家利润体量最大 2025全年 零售毛利率40.82%（行业最高） 品类管理能力最强 2025全年 O2O 20.94亿，B2C 8.99亿 数据透明度最高 2025全年 门店14,831家，净增仅147家 扩张大幅放缓 2025全年 关闭547家门店 主动优化力度最大 2025全年 会员1.16亿 六家最大 2025全年 加盟分销毛利率7.88%→10.06% 供应链效率大幅提升 信息溯源：本文件核心数据来源于益丰药房2025年年度报告（603939.SH），行业级动态来源于[连锁药店行业-增量[新闻动态_2025-2026]]。部分占比数据为基于已有数据的推理计算，标注【推理】。*","headings":[{"level":2,"text":"一句话定位","anchor":"doc-heading-1"},{"level":2,"text":"一、2025年业绩与经营动态","anchor":"doc-heading-2"},{"level":3,"text":"1. 2025年营收244.33亿，同比增长1.54%","anchor":"doc-heading-3"},{"level":3,"text":"2. 归母净利16.78亿增长9.81%——最稳的利润增长","anchor":"doc-heading-4"},{"level":3,"text":"3. 零售毛利率40.82%——行业最高","anchor":"doc-heading-5"},{"level":3,"text":"4. 线上销售29.93亿，O2O 20.94亿","anchor":"doc-heading-6"},{"level":2,"text":"二、门店与扩张动态","anchor":"doc-heading-7"},{"level":3,"text":"5. 门店14,831家，净增仅147家","anchor":"doc-heading-8"},{"level":3,"text":"6. 会员1.16亿——六家中最大","anchor":"doc-heading-9"},{"level":2,"text":"三、区域布局","anchor":"doc-heading-10"},{"level":3,"text":"7. 华北增速最快（+4.58%）但毛利率降最猛（-1.70pct）","anchor":"doc-heading-11"},{"level":2,"text":"四、行业级关联动态","anchor":"doc-heading-12"},{"level":3,"text":"8. 药店数量负增长","anchor":"doc-heading-13"},{"level":3,"text":"9. O2O药品市场规模384亿元","anchor":"doc-heading-14"},{"level":2,"text":"五、关键时间线","anchor":"doc-heading-15"}],"outgoing":[]},{"id":"doc-b1df813d6f67","title":"益丰药房-结构化摘要","path":"02-连锁药店/益丰药房/综合分析/益丰药房-结构化摘要.md","stem":"益丰药房-结构化摘要","module":"02-连锁药店","entity":"益丰药房","contentType":"综合分析","isIndex":false,"isGovernance":false,"summary":"﻿# 益丰药房 - 结构化摘要","learningTakeaway":"本文帮助你理解益丰药房 - 结构化摘要的结构化摘要资料，核心关注财务指标、O2O能力、门店网络、平台合作和合作机会判断。阅读后可以重点掌握：行业规模、财报指标、研报观点、新闻动态、连锁药店；主要帮助解决“这篇资料讲什么、关键事实是什么、后续应从哪些角度继续核验/阅读”的问题。","lastUpdated":"2026-06-08","citationStatus":"可供研判参考","html":"<p>﻿# 益丰药房 - 结构化摘要<\/p>\n<blockquote>\n<p>引用级别：✅可供研判参考\n资料基础：行业研究报告、券商研报、机构观点、分析师判断、主观解释、预测或推演结论，公告，财报。<\/p>\n<p>整合周期：2025年全年\n基于：益丰药房2025年年度报告 / 行业公开信息\n最后更新：2026-06-08<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"doc-heading-1\">一句话定位<\/h2>\n<p>本文定位为益丰药房 - 结构化摘要的结构化摘要资料，核心关注财务指标、O2O能力、门店网络、平台合作和合作机会判断。<\/p>\n<h2 id=\"doc-heading-2\">关键数据仪表盘<\/h2>\n<div class=\"table-scroll\ 年末 年报[P10] 加盟门店 4,313家 ↑（净增+501） 2025年末 年报[P10] 会员总量 1.16亿 — 2025年末 年报[P29] 销售费用 58.54亿元 ↓-5.26% 2025全年 年报[P93] 房租省 1.73亿元（-10%） ↓ 2025全年 年报[P206] 核心观点（5条） 1. **盈利能力最稳定，利润体量六家最大**：归母16.78亿远超大参林12.35亿和老百姓3.82亿，ROE连续三年维持15%左右。利润增长9.81%路径更均衡——既有费用控制（销售费用-5.26%），也有收入端稳健增长。 2. **零售毛利率40.82%行业最高——O2O盈利空间最大**：高毛利率意味着在O2O渠道上有更大的利润空间来承受平台佣金和配送成本。同样的O2O平台抽佣率，益丰的净利率仍优于同行。 3. **O2O数据透明度最高——20.94亿O2O+8.99亿B2C分拆披露**：益丰是六家中唯一清晰披露O2O和B2C分拆数据的公司。O2O占线上总额69.9%，是线上绝对主力。这种透明度说明管理层对O2O的重视和信心。 4. **全品类正增长——O2O供给最丰富**：与大参林\"砍量提利\"（中参-9%、非药-3%）不同，益丰三个品类全部正增长（中西成药+1.69%、中药+0.71%、非药+3.96%），意味着O2O场景下SKU供给更丰富。 5. **直营占比71%最高——O2O履约品质管控最好**：直营门店10,518家（占比71%）在六家直营占比最高，加盟占比仅29%。全直营管控意味着O2O履约品质最稳定，用户体验最有保障。 重要结论 结论 置信度 依据 变量 :--- :--- :--- :--- 益丰是O2O赛道上盈利空间最大的连锁 高 零售毛利率40.82%行业最高 O2O毛利率未知，可能远低于线下 （仅推测） 益丰O2O数据透明度最高 高 O2O 20.94亿+B2C 8.99亿分拆披露 — 益丰O2O履约品质最稳定 中 直营占比71%最高 加盟占比可能在提升 （仅推测） 益丰增长在放缓 中 营收+1.54%，零售仅+0.56% 费用控制能否持续弥补收入增速放缓 益丰毛利率下降趋势需关注 中 中西成药-0.86pct，中药-0.89pct 品类结构变化和集采影响 关键时间线 时间 事件 数据/影响 :--- :--- :--- 2025全年 营收244.33亿（+1.54%） 增速居中 2025全年 归母16.78亿（+9.81%） 六家利润体量最大 2025全年 零售毛利率40.82%（行业最高） O2O盈利空间最大 2025全年 O2O 20.94亿，B2C 8.99亿 透明度最高 2025全年 门店14,831家，净增仅147家 扩张大幅放缓 2025全年 关闭547家门店 主动优化力度最大 2025全年 加盟分销毛利率+2.18pct 供应链效率大幅提升 2025全年 会员1.16亿 六家最大 与老百姓、大参林对比 维度 益丰药房 老百姓 大参林 :--- :--- :--- :--- 营收(亿) 244.3(+1.5%) 222.4(-0.5%) 275.0(+3.8%) 归母净利(亿) 16.78(+9.8%) 3.82(-26.4%) 12.35(+35.0%) 扣非ROE 14.4% ~5.6% 17.0% 零售毛利率 40.82%(-0.57pct) 综合32.30%(-0.87pct) 36.96%(+0.34pct) 线上销售(亿) 29.93(O2O 20.94) 31.2(+26.3%) 官方公开材料未列示该字段；仅保留已披露事实 门店数 14,831 14,975 17,758 直营占比 71% 65% 59% 加盟占比 29% 35% 41% 品类策略 全品类正增长 线上最激进 砍量提利 （仅推测） 核心特征 最稳，盈利能力最强 O2O最激进，利润最薄 规模最大，利润弹性大 O2O数据 最透明 线上增速最快 最不透明 最大风险 增速放缓 商誉减值+O2O毛利率 O2O数据不透明 信息溯源清单 信息 来源 时间 链接/备注 :--- :--- :--- :--- 营收244.33亿(+1.54%) 益丰2025年年报 [P93] 2026-04 益丰药房深度分析 归母16.78亿(+9.81%) 益丰2025年年报 [P94] 2026-04 同上 零售毛利率40.82% 益丰2025年年报 [P22] 2026-04 同上 O2O 20.94亿 益丰2025年年报 [P11] 2026-04 同上 B2C 8.99亿 益丰2025年年报 [P11] 2026-04 同上 门店14,831家 益丰2025年年报 [P10] 2026-04 同上 会员1.16亿 益丰2 n<li><strong>核心内容<\/strong>：老百姓2025年营业收入222.37亿元，同比下降0.54%，为六家头部连锁中唯二营收下滑的公司之一（另一家为健之佳-3.9%）<\/li>\n<li><strong>关键数据<\/strong>：营收222.37亿（-0.54%）；归母净利3.82亿（-26.44%）<\/li>\n<li><strong>可应用性思考<\/strong>：营收微降但线上业务增速最快（+26.3%），说明线下承压但O2O转型正在加速（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-4\">2. 归母净利3.82亿下降26.44%，但剔除商誉减值后仅降1%<\/h3>\n<ul>\n<li><strong>来源<\/strong>：老百姓大药房2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a> [P8]<\/li>\n<li><strong>日期<\/strong>：2026-04<\/li>\n<li><strong>核心内容<\/strong>：2025年计提约2.38亿商誉和土地减值损失，剔除后调整后归母净利6.20亿，同比仅降1.0%。商誉减值是并购后遗症集中爆发<\/li>\n<li><strong>关键数据<\/strong>：归母3.82亿（-26.44%）；商誉减值2.38亿；调整后6.20亿（-1.0%）<\/li>\n<li><strong>可应用性思考<\/strong>：商誉减值说明过去激进并购的部分标的经营不及预期，但核心经营并未实质性恶化（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-5\">3. 线上销售31.2亿，增速26.3%——六家中最快<\/h3>\n<ul>\n<li><strong>来源<\/strong>：老百姓大药房2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a> [P22]<\/li>\n<li><strong>日期<\/strong>：2026-04<\/li>\n<li><strong>核心内容<\/strong>：老百姓2025年线上销售总额31.2亿元（含加盟），同比增长26.3%，在六家头部连锁中增速最快。O2O外卖服务门店12,352家，小程序累计用户3,000万+<\/li>\n<li><strong>关键数据<\/strong>：线上31.2亿（+26.3%）；O2O门店12,352家；小程序用户3,000万+（+30%）<\/li>\n<li><strong>可应用性思考<\/strong>：老百姓对O2O最为激进，线上绝对值也是六家最高，是医药即时零售平台在商家端的重要合作伙伴（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-6\">4. 线下零售毛利率逆势+0.6pct<\/h3>\n<ul>\n<li><strong>来源<\/strong>：老百姓大药房2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a> [P23]<\/li>\n<li><strong>日期<\/strong>：2026-04<\/li>\n<li><strong>核心内容<\/strong>：综合毛利率32.30%（-0.87pct），但线下零售（不含DTP）毛利率同比+0.6pct。综合毛利率下降被DTP处方药和线上零售的低毛利业务快速增长\"拉低\"<\/li>\n<li><strong>关键数据<\/strong>：综合毛利率32.30%（-0.87pct）；线下零售毛利率+0.6pct<\/li>\n<li><strong>可应用性思考<\/strong>：DTP和O2O占比提升是结构性趋势，会持续拉低综合毛利率——这是选择与老百姓O2O合作时需要考量的成本因素（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-7\">二、门店与扩张动态<\/h2>\n<h3 id=\"doc-heading-8\">5. 门店总数14,975家，加盟占比35%<\/h3>\n<ul>\n<li><strong>来源<\/strong>：老百姓大药房2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a> [P21]<\/li>\n<li><strong>日期<\/strong>：2026-04<\/li>\n<li><strong>核心内容<\/strong>：期末门店14,975家（直营9,732+加盟5,243），新增875家（直营仅84家+加盟791家），覆盖18省<\/li>\n<li><strong>关键数据<\/strong>：14,975家；直营9,732家；加盟5,243家；加盟净增791家<\/li>\n<li><strong>可应用性思考<\/strong>：加盟是扩张绝对主力，但加盟门店在O2O履约品质上的管控是潜在风险——平台上如果出现老百姓加盟店的服务问题，品牌一致性难以保证（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-9\">6. 地级市及以下门店占比78%<\/h3>\n<ul>\n<li><strong>来源<\/strong>：老百姓大药房2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a> [P22]<\/li>\n<li><strong>日期<\/strong>：2026-04<\/li>\n<li><strong>核心内容<\/strong>：老百姓门店下沉比例高，78%位于地级市及以下<\/li>\n<li><strong>可应用性思考<\/strong>：下沉市场布局意味着老百姓在低线城市O2O供给中的角色重要，但也意味着单店产出可能较低（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-10\">三、行业级关联动态（来自行业汇总）<\/h2>\n<h3 id=\"doc-heading-11\">7. 药店数量迎来负增长拐点<\/h3>\n<ul>\n<li><strong>来源<\/strong>：<a href=\"https://www.sinohealth.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中康科技<\/a>/药械江湖<\/li>\n<li><strong>日期<\/strong>：2025-2026<\/li>\n<li><strong>核心内容<\/strong>：2024年Q4全国药店数量首次负增长，2025年Q1持续，已连续4个季度环比负增长<\/li>\n<li><strong>关键数据<\/strong>：连续4个季度环比负增长；头部连锁关店约1,000家<\/li>\n<li><strong>可应用性思考<\/strong>：供给端收缩有利于存活药店的单店效率提升，老百姓14,975家门店在行业出清中存活概率高（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-12\">8. O2O药品市场规模384亿元<\/h3>\n<ul>\n<li><strong>来源<\/strong>：<a href=\"https://www.sinohealth.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中康科技<\/a>《2025中国医药核心渠道全景报告》<\/li>\n<li><strong>日期<\/strong>：2025<\/li>\n<li><strong>关键数据<\/strong>：O2O渠道规模384亿元，被定位为\"核心增长引擎\"<\/li>\n<li><strong>可应用性思考<\/strong>：老百姓线上31.2亿占O2O市场约8.1%【推理】，是O2O市场的重要供给方（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-13\">9. 5月新规禁止线上销售GLP-1减肥药<\/h3>\n<ul>\n<li><strong>来源<\/strong>：搜狐网<\/li>\n<li><strong>日期<\/strong>：2026-05<\/li>\n<li><strong>核心内容<\/strong>：2026年5月起严格新规，禁止所有线上平台销售GLP-1类减肥药<\/li>\n<li><strong>可应用性思考<\/strong>：对老百姓线上31.2亿业务可能有品类影响，需评估GLP-1在其线上销售中的占比（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-14\">四、关键时间线<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">时间<\/th>\n<th style=\"text-align: left;\">事件<\/th>\n<th style=\"text-align: left;\">数据/影响<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">2025全年<\/td>\n<td style=\"text-align: left;\">营收222.37亿（-0.54%）<\/td>\n<td style=\"text-align: left;\">增收停滞<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2025全年<\/td>\n<td style=\"text-align: left;\">归母净利3.82亿（-26.44%）<\/td>\n<td style=\"text-align: left;\">商誉减值2.38亿<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2025全年<\/td>\n<td style=\"text-align: left;\">线上31.2亿（+26.3%）<\/td>\n<td style=\"text-align: left;\">六家最快<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2025全年<\/td>\n<td style=\"text-align: left;\">门店14,975家（加盟净增791）<\/td>\n<td style=\"text-align: left;\">加盟主力扩张<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2025 Q4<\/td>\n<td style=\"text-align: left;\">扣非净利亏损1.48亿<\/td>\n<td style=\"text-align: left;\">Q4集中计提减值<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2026-05<\/td>\n<td style=\"text-align: left;\">GLP-1线上禁售新规<\/td>\n<td style=\"text-align: left;\">线上品类影响待评估<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<p><em>信息溯源：本文件核心数据来源于老百姓大药房2025年年度报告（603883.SH），行业级动态来源于[连锁药店行业-增量[新闻动态_2025-2026]]。部分占比数据为基于已有数据的推理计算，标注【推理】。<\/em><\/p>","rawText":"老百姓大药房 · 新闻动态（2025-2026） 引用级别：✅可正式引用 资料基础：官方公告、公司财报、交易所/港交所披露、公司官网新闻稿、监管披露或已核验权威公开来源。 更新时间：2026-06-08 信息来源：公司年报、行业公开报道、中康科技等 关联深度分析：老百姓深度分析 一句话定位 本文定位为老百姓大药房 · 新闻动态的新闻动态资料，主要事件有业绩变化、门店调整、O2O运营、平台合作、监管合规和区域扩张。 一、2025年业绩与经营动态 1. 2025年营收222.37亿，同比微降0.54% 来源**：老百姓大药房2025年年度报告 [P8] 日期**：2026-04（年报披露） 核心内容**：老百姓2025年营业收入222.37亿元，同比下降0.54%，为六家头部连锁中唯二营收下滑的公司之一（另一家为健之佳-3.9%） 关键数据**：营收222.37亿（-0.54%）；归母净利3.82亿（-26.44%） 可应用性思考**：营收微降但线上业务增速最快（+26.3%），说明线下承压但O2O转型正在加速（仅推测） 2. 归母净利3.82亿下降26.44%，但剔除商誉减值后仅降1% 来源**：老百姓大药房2025年年度报告 [P8] 日期**：2026-04 核心内容**：2025年计提约2.38亿商誉和土地减值损失，剔除后调整后归母净利6.20亿，同比仅降1.0%。商誉减值是并购后遗症集中爆发 关键数据**：归母3.82亿（-26.44%）；商誉减值2.38亿；调整后6.20亿（-1.0%） 可应用性思考**：商誉减值说明过去激进并购的部分标的经营不及预期，但核心经营并未实质性恶化（仅推测） 3. 线上销售31.2亿，增速26.3%——六家中最快 来源**：老百姓大药房2025年年度报告 [P22] 日期**：2026-04 核心内容**：老百姓2025年线上销售总额31.2亿元（含加盟），同比增长26.3%，在六家头部连锁中增速最快。O2O外卖服务门店12,352家，小程序累计用户3,000万+ 关键数据**：线上31.2亿（+26.3%）；O2O门店12,352家；小程序用户3,000万+（+30%） 可应用性思考**：老百姓对O2O最为激进，线上绝对值也是六家最高，是医药即时零售平台在商家端的重要合作伙伴（仅推测） 4. 线下零售毛利率逆势+0.6pct 来源**：老百姓大药房2025年年度报告 [P23] 日期**：2026-04 核心内容**：综合毛利率32.30%（-0.87pct），但线下零售（不含DTP）毛利率同比+0.6pct。综合毛利率下降被DTP处方药和线上零售的低毛利业务快速增长\"拉低\" 关键数据**：综合毛利率32.30%（-0.87pct）；线下零售毛利率+0.6pct 可应用性思考**：DTP和O2O占比提升是结构性趋势，会持续拉低综合毛利率——这是选择与老百姓O2O合作时需要考量的成本因素（仅推测） 二、门店与扩张动态 5. 门店总数14,975家，加盟占比35% 来源**：老百姓大药房2025年年度报告 [P21] 日期**：2026-04 核心内容**：期末门店14,975家（直营9,732+加盟5,243），新增875家（直营仅84家+加盟791家），覆盖18省 关键数据**：14,975家；直营9,732家；加盟5,243家；加盟净增791家 可应用性思考**：加盟是扩张绝对主力，但加盟门店在O2O履约品质上的管控是潜在风险——平台上如果出现老百姓加盟店的服务问题，品牌一致性难以保证（仅推测） 6. 地级市及以下门店占比78% 来源**：老百姓大药房2025年年度报告 [P22] 日期**：2026-04 核心内容**：老百姓门店下沉比例高，78%位于地级市及以下 可应用性思考**：下沉市场布局意味着老百姓在低线城市O2O供给中的角色重要，但也意味着单店产出可能较低（仅推测） 三、行业级关联动态（来自行业汇总） 7. 药店数量迎来负增长拐点 来源**：中康科技/药械江湖 日期**：2025-2026 核心内容**：2024年Q4全国药店数量首次负增长，2025年Q1持续，已连续4个季度环比负增长 关键数据**：连续4个季度环比负增长；头部连锁关店约1,000家 可应用性思考**：供给端收缩有利于存活药店的单店效率提升，老百姓14,975家门店在行业出清中存活概率高（仅推测） 8. O2O药品市场规模384亿元 来源**：中康科技《2025中国医药核心渠道全景报告》 日期**：2025 关键数据**：O2O渠道规模384亿元，被定位为\"核心增长引擎\" 可应用性思考**：老百姓线上31.2亿占O2O市场约8.1%【推理】，是O2O市场的重要供给方（仅推测） 9. 5月新规禁止线上销售GLP-1减肥药 来源**：搜狐网 日期**：2026-05 核心内容**：2026年5月起严格新规，禁止所有线上平台销售GLP-1类减肥药 可应用性思考**：对老百姓线上31.2亿业务可能有品类影响，需评估GLP-1在其线上销售中的占比（仅推测） 四、关键时间线 时间 事件 数据/影响 :--- :--- :--- 2025全年 营收222.37亿（-0.54%） 增收停滞 2025全年 归母净利3.82亿（-26.44%） 商誉减值2.38亿 2025全年 线上31.2亿（+26.3%） 六家最快 2025全年 门店14,975家（加盟净增791） 加盟主力扩张 2025 Q4 扣非净利亏损1.48亿 Q4集中计提减值 2026-05 GLP-1线上禁售新规 线上品类影响待评估 信息溯源：本文件核心数据来源于老百姓大药房2025年年度报告（60388 /td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>[P21]<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">O2O外卖服务门店<\/td>\n<td style=\"text-align: left;\">12,352家<\/td>\n<td style=\"text-align: left;\">↑<\/td>\n<td style=\"text-align: left;\">2025年末<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>[P22]<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">小程序累计用户<\/td>\n<td style=\"text-align: left;\">3,000万+<\/td>\n<td style=\"text-align: left;\">↑+30%<\/td>\n<td style=\"text-align: left;\">2025年末<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>[P22]<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">商誉和土地减值<\/td>\n<td style=\"text-align: left;\">2.38亿元<\/td>\n<td style=\"text-align: left;\">一次性<\/td>\n<td style=\"text-align: left;\">2025全年<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>[P8]<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">经营现金流<\/td>\n<td style=\"text-align: left;\">31.43亿元<\/td>\n<td style=\"text-align: left;\">↑+55.08%<\/td>\n<td style=\"text-align: left;\">2025全年<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>[P8]<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"doc-heading-3\">核心观点（5条）<\/h2>\n<ol>\n<li>\n<p><strong>线上增速六家最快，O2O是最激进的公司<\/strong>：31.2亿线上销售在六家中绝对值最高（益丰29.93亿、健之佳26.50亿），26.3%增速也是最快。O2O门店12,352家，覆盖率高。老百姓是医药即时零售平台在商家端最重要的合作伙伴之一。<\/p>\n<\/li>\n<li>\n<p><strong>利润下降是商誉减值集中爆发，而非经营恶化<\/strong>：剔除2.38亿商誉和土地减值后，归母净利仅降1.0%。但商誉余额仍高，未来可能继续减值——这是老百姓区别于大参林和益丰的结构性风险。（仅推测）<\/p>\n<\/li>\n<li>\n<p><strong>综合毛利率六家最低，但线下经营在改善<\/strong>：32.30%的综合毛利率在六家中最低，但线下零售（不含DTP）毛利率反而+0.6pct。低毛利的DTP和线上业务占比提升是结构性趋势，会持续拉低综合毛利率。<\/p>\n<\/li>\n<li>\n<p><strong>加盟扩张是双刃剑<\/strong>：加盟净增791家是扩张主力，直营仅增84家。加盟模式轻资产、快扩张，但加盟门店在O2O履约品质上的管控是潜在风险。（仅推测）<\/p>\n<\/li>\n<li>\n<p><strong>下沉市场布局深，但单店产出可能较低<\/strong>：78%门店位于地级市及以下，是全国覆盖最广的连锁之一。下沉市场O2O供给少，老百姓的门店网络有稀缺性价值。（仅推测）<\/p>\n<\/li>\n<\/ol>\n<h2 id=\"doc-heading-4\">重要结论<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">结论<\/th>\n<th style=\"text-align: left;\">置信度<\/th>\n<th style=\"text-align: left;\">依据<\/th>\n<th style=\"text-align: left;\">变量<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">老百姓是O2O赛道上投入最激进的连锁<\/td>\n<td style=\"text-align: left;\">高<\/td>\n<td style=\"text-align: left;\">线上31.2亿+26.3%增速+12,352家O2O门店<\/td>\n<td style=\"text-align: left;\">O2O毛利率未知，可能\"增收不增利\"<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">利润下降主要是一次性减值，核心经营稳健<\/td>\n<td style=\"text-align: left;\">中<\/td>\n<td style=\"text-align: left;\">调整后归母6.20亿仅降1.0%<\/td>\n<td style=\"text-align: left;\">商誉余额官方公开材料未列示该字段；仅保留已披露事实，后续减值风险不明<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">综合毛利率将持续承压<\/td>\n<td style=\"text-align: left;\">中<\/td>\n<td style=\"text-align: left;\">DTP+线上低毛利占比提升+线下+0.6pct<\/td>\n<td style=\"text-align: left;\">线上增速如果放缓，毛利率可能企稳<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">加盟管控是O2O品质的潜在风险<\/td>\n<td style=\"text-align: left;\">中<\/td>\n<td style=\"text-align: left;\">加盟占比35%，O2O门店中加盟占比不明<\/td>\n<td style=\"text-align: left;\">加盟店O2O履约数据官方公开材料未列示该字段；仅保留已披露事实<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"doc-heading-5\">关键时间线<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">时间<\/th>\n<th style=\"text-align: left;\">事件<\/th>\n<th style=\"text-align: left;\">数据/影响<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">2025全年<\/td>\n<td style=\"text-align: left;\">营收22
