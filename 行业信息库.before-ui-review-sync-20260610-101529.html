港交所披露、公司官网新闻稿、监管披露或已核验权威公开来源。<\/p>\n<p>更新时间：2026-06-08\n信息来源：Google News RSS 聚合、<a href=\"https://36kr.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">36氪<\/a>、<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a>、界面、<a href=\"https://www.stcn.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">证券时报<\/a>、新华网等<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"doc-heading-1\">一句话定位<\/h2>\n<p>本文定位为阿里/淘宝闪购 公开新闻动态的新闻动态资料，主要事件有平台补贴竞争、供给网络扩张、品类合作、即时履约和医药零售相关业务变化。<\/p>\n<h2 id=\"doc-heading-2\">一、淘宝闪购500亿补贴与日订单量<\/h2>\n<h3 id=\"doc-heading-3\">1. 淘宝闪购祭出500亿补贴<\/h3>\n<ul>\n<li><strong>标题<\/strong>：淘宝闪购祭出500亿补贴，打工人盯上罗森、全家\"羊毛\"<\/li>\n<li><strong>来源<\/strong>：<a href=\"https://36kr.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">36氪<\/a><\/li>\n<li><strong>日期<\/strong>：2025-07-02<\/li>\n<li><strong>原文链接<\/strong>：<a href=\"https://36kr.com\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\"><a class=\"external-link\" href=\"https://36kr.com\" target=\"_blank\" rel=\"noopener noreferrer\">https://36kr.com<\/a><\/a> （搜索\"淘宝闪购500亿补贴\"可找到原文）<\/li>\n<li><strong>核心摘要<\/strong>：淘宝闪购正式推出500亿元补贴计划，首周即有4124个餐饮品牌商家破峰，城市连锁品牌占比95%；2318个非餐饮品类订单量翻倍。<\/li>\n<li><strong>关键数据<\/strong>：500亿补贴；首周4124个餐饮品牌破峰；2318个非餐饮品类翻倍<\/li>\n<\/ul>\n<h3 id=\"doc-heading-4\">2. 日订单破8000万<\/h3>\n<ul>\n<li><strong>标题<\/strong>：稳占8000万日订单，淘宝投出一个美团<\/li>\n<li><strong>来源<\/strong>：<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a><\/li>\n<li><strong>日期<\/strong>：2025-08-29<\/li>\n<li><strong>核心摘要<\/strong>：淘宝闪购日订单量稳定在8000万单。在\"疯狂星期六\"补贴期间曾突破更高峰值。<\/li>\n<li><strong>关键数据<\/strong>：日订单8000万<\/li>\n<\/ul>\n<h3 id=\"doc-heading-5\">3. \"疯狂星期六\"单日补贴超12亿<\/h3>\n<ul>\n<li><strong>标题<\/strong>：\"疯狂星期六\"单日补贴超12亿，美团仅4亿<\/li>\n<li><strong>来源<\/strong>：<a href=\"https://36kr.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">36氪<\/a> / <a href=\"https://www.stcn.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">证券时报<\/a><\/li>\n<li><strong>日期<\/strong>：2025-07<\/li>\n<li><strong>核心摘要<\/strong>：淘宝闪购在单个\"疯狂星期六\"补贴日投入超12亿元，同期美团约4亿元。\"疯狂星期六\"计划持续100天。<\/li>\n<li><strong>关键数据<\/strong>：单日补贴12亿 vs 美团4亿；持续100天<\/li>\n<\/ul>\n<h3 id=\"doc-heading-6\">4. 日订单连续破9000万<\/h3>\n<ul>\n<li><strong>标题<\/strong>：日订单连续破9000万，淘宝闪购翻盘已是新常态<\/li>\n<li><strong>来源<\/strong>：维科号/Weike<\/li>\n<li><strong>日期<\/strong>：2025-07-29<\/li>\n<li><strong>核心摘要<\/strong>：淘宝闪购日订单量连续突破9000万单，翻盘美团已成新常态。<\/li>\n<li><strong>关键数据<\/strong>：日订单9000万<\/li>\n<\/ul>\n<h3 id=\"doc-heading-7\">5. 淘宝闪购峰值超过美团<\/h3>\n<ul>\n<li><strong>标题<\/strong>：上个周末，淘宝闪购峰值超过了美团<\/li>\n<li><strong>来源<\/strong>：<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a>/LatePost<\/li>\n<li><strong>日期<\/strong>：2025-08-11<\/li>\n<li><strong>核心摘要<\/strong>：在补贴高峰期周末，淘宝闪购单日峰值超过美团，首次在日订单维度超越。<\/li>\n<li><strong>关键数据<\/strong>：峰值超过美团<\/li>\n<\/ul>\n<h3 id=\"doc-heading-8\">6. Q4份额冲至45.2%，与美团差距仅0.2个百分点<\/h3>\n<ul>\n<li><strong>标题<\/strong>：淘宝闪购第四季度份额冲至45.2%，与美团差距仅0.2个百分点<\/li>\n<li><strong>来源<\/strong>：<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a><\/li>\n<li><strong>日期<\/strong>：2026-05-22<\/li>\n<li><strong>原文链接<\/strong>：<a href=\"https://finance.sina.com.cn\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\"><a class=\"external-link\" href=\"https://finance.sina.com.cn\" target=\"_blank\" rel=\"noopener noreferrer\">https://finance.sina.com.cn<\/a><\/a><\/li>\n<li><strong>核心摘要<\/strong>：淘宝闪购在即时零售（含外卖）Q4市场份额达到45.2%，与美团的45.4%仅差0.2个百分点。一年内规模增长3倍，价格战并非主因。<\/li>\n<li><strong>关键数据<\/strong>：Q4份额45.2%；与美团差0.2个百分点；规模一年增3倍<\/li>\n<\/ul>\n<h3 id=\"doc-heading-9\">7. 淘宝闪购立下Flag争第一<\/h3>\n<ul>\n<li><strong>标题<\/strong>：淘宝闪购目标即时零售份额第一，压力给到美团<\/li>\n<li><strong>来源<\/strong>：<a href=\"https://xueqiu.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">雪球<\/a> / <a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a><\/li>\n<li><strong>日期<\/strong>：2026-01-08<\/li>\n<li><strong>核心摘要<\/strong>：淘宝闪购公开表态争即时零售份额第一。同日美团也不让步，双方正面宣战。<\/li>\n<li><strong>关键数据<\/strong>：公开争第一目标<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-10\">二、饿了么更名与阿里组织重组<\/h2>\n<h3 id=\"doc-heading-11\">8. 饿了么更名为淘宝闪购<\/h3>\n<ul>\n<li><strong>标题<\/strong>：饿了么App品牌全面焕新为淘宝闪购，开启大消费平台新篇章<\/li>\n<li><strong>来源<\/strong>：新京报<\/li>\n<li><strong>日期<\/strong>：2025-12-05<\/li>\n<li><strong>原文链接<\/strong>：<a href=\"https://www.bjnews.com.cn\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\"><a class=\"external-link\" href=\"https://www.bjnews.com.cn\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.bjnews.com.cn<\/a><\/a><\/li>\n<li><strong>核心摘要<\/strong>：饿了么App正式更名为\"淘宝闪购\"，品牌全面焕新。这是阿里即时零售战略的重大里程碑，从外卖平台升级为大消费平台。<\/li>\n<li><strong>关键数据<\/strong>：饿了么正式更名为淘宝闪购<\/li>\n<\/ul>\n<h3 id=\"doc-heading-12\">9. 从\"我想要\"到\"我现在就要\"<\/h3>\n<ul>\n<li><strong>标题<\/strong>：饿了么更名淘宝闪购：从\"我想要\"到\"我现在就要\"<\/li>\n<li><strong>来源<\/strong>：四川新闻<\/li>\n<li><strong>日期<\/strong>：2025-11-04<\/li>\n<li><strong>核心摘要<\/strong>：更名背后是阿里战略定位的根本性转变——从\"搜索式电商\"转向\"即时满足式消费\"。<\/li>\n<\/ul>\n<h3 id=\"doc-heading-13\">10. 阿里组建大消费平台：淘天+饿了么+飞猪<\/h3>\n<ul>\n<li><strong>标题<\/strong>：阿里大消费平台：淘天+饿了么+飞猪<\/li>\n<li><strong>来源<\/strong>：<a href=\"https://www.21jingji.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">21财经<\/a><\/li>\n<li><strong>日期<\/strong>：2025-06-24<\/li>\n<li><strong>核心摘要<\/strong>：阿里将淘宝天猫、饿了么、飞猪整合为大消费平台，形成\"电商+即时零售+出行\"的生态闭环。<\/li>\n<\/ul>\n<h3 id=\"doc-heading-14\">11. 饿了么与淘宝闪购纳入电商集团<\/h3>\n<ul>\n<li><strong>标题<\/strong>：阿里巴巴重新归纳4大业务，饿了么与淘宝闪购纳入电商集团<\/li>\n<li><strong>来源<\/strong>：<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a><\/li>\n<li><strong>日期<\/strong>：2025-08-22<\/li>\n<li><strong>核心摘要<\/strong>：阿里从六大集团缩编为四大业务，\"1+6+N\"架构终结。饿了么和淘宝闪购统一纳入电商集团管理。张勇时代激进分拆告终，蔡崇信吴泳铭收权重划版图。<\/li>\n<li><strong>关键数据<\/strong>：六→四大集团重组<\/li>\n<\/ul>\n<h3 id=\"doc-heading-15\">12. 马云亲自督战<\/h3>\n<ul>\n<li><strong>标题<\/strong>：马云豪赌未来，淘宝闪购正在起飞<\/li>\n<li><strong>来源<\/strong>：<a href=\"https://xueqiu.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">雪球<\/a> / <a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a><\/li>\n<li><strong>日期<\/strong>：2025-07 / 2026-01<\/li>\n<li><strong>核心摘要<\/strong>：马云亲自督战淘宝闪购业务，蒋凡被重用主导闪购攻坚战。阿里投入力度空前。<\/li>\n<li><strong>关键数据<\/strong>：马云亲自督战；蒋凡主导<\/li>\n<\/ul>\n<h3 id=\"doc-heading-16\">13. 蒋凡确立淘宝闪购\"小目标\"<\/h3>\n<ul>\n<li><strong>标题<\/strong>：吴泳铭不惧\"AI泡沫\"，蒋凡确立淘宝闪购\"小目标\"<\/li>\n<li><strong>来源<\/strong>：维科号<\/li>\n<li><strong>日期<\/strong>：2025-12-01<\/li>\n<li><strong>核心摘要<\/strong>：蒋凡为淘宝闪购设定明确的增长目标，蒋凡豪赌\"规模论\"，阿里蒸发百亿利润继续大战外卖。<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-17\">三、监管约谈与策略调整<\/h2>\n<h3 id=\"doc-heading-18\">14. 饿了么、美团、京东首次被约谈<\/h3>\n<ul>\n<li><strong>标题<\/strong>：饿了么美团京东被约谈<\/li>\n<li><strong>来源<\/strong>：新华网 / 新华日报<\/li>\n<li><strong>日期<\/strong>：2025-07-19<\/li>\n<li><strong>核心摘要<\/strong>：三大平台首次被监管部门约谈，要求停止\"恶性竞争\"。但约谈后首个周末补贴仍在继续。<\/li>\n<li><strong>关键数据<\/strong>：7月19日首次约谈<\/li>\n<\/ul>\n<h3 id=\"doc-heading-19\">15. 上海下令全面取消\"0元购\"<\/h3>\n<ul>\n<li><strong>标题<\/strong>：上海约谈外卖平台，要求全面下架\"0元购\"<\/li>\n<li><strong>来源<\/strong>：<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a><\/li>\n<li><strong>日期<\/strong>：2025-07-23<\/li>\n<li><strong>核心摘要<\/strong>：上海市监局约谈外卖平台，明确要求全面下架\"0元购\"等极端补贴活动。<\/li>\n<\/ul>\n<h3 id=\"doc-heading-20\">16. 第二次约谈：反垄断指引发布，淘宝闪购\"二选一\"被通报<\/h3>\n<ul>\n<li><strong>标题<\/strong>：反垄断指引发布当天，淘宝闪购\"二选一\"被通报<\/li>\n<li><strong>来源<\/strong>：<a href=\"https://news.qq.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">腾讯新闻<\/a> / <a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a><\/li>\n<li><strong>日期<\/strong>：2026-02-14<\/li>\n<li><strong>核心摘要<\/strong>：国家市场监督管理总局约谈7家平台（阿里、抖音、百度、腾讯、京东、美团、淘宝闪购），发布反垄断指引。淘宝闪购因\"二选一\"独家排他行为被作为典型案例通报。<\/li>\n<li><strong>关键数据<\/strong>：7家平台被约谈；淘宝闪购\"二选一\"被通报<\/li>\n<\/ul>\n<h3 id=\"doc-heading-21\">17. 北京三部门约谈12家平台<\/h3>\n<ul>\n<li><strong>标题<\/strong>：北京三部门约谈12家平台，整治\"内卷式\"竞争<\/li>\n<li><strong>来源<\/strong>：财新 / <a href=\"https://www.stcn.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">证券时报<\/a> / 人民日报<\/li>\n<li><strong>日期<\/strong>：2026-03-23~25<\/li>\n<li><strong>核心摘要<\/strong>：北京市场监管局等三部门联合约谈12家平台。典型案例：饺子售价18元商家实收1.25元。淘宝闪购因擅自修改商品价格被作为典型违规通报。市监总局官网发文\"外卖大战该结束了\"。<\/li>\n<li><strong>关键数据<\/strong>：饺子18元商家实收1.25元；淘宝闪购擅自改价被通报<\/li>\n<\/ul>\n<h3 id=\"doc-heading-22\">18. 淘宝闪购被约谈后仍继续烧钱<\/h3>\n<ul>\n<li><strong>标题<\/strong>：被约谈的淘宝闪购，还要继续\"烧钱\"<\/li>\n<li><strong>来源<\/strong>：<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a><\/li>\n<li><strong>日期<\/strong>：2026-03<\/li>\n<li><strong>核心摘要<\/strong>：尽管多次被约谈，淘宝闪购仍继续大规模补贴。阿里表态\"三年不担心亏损\"，投入力度将超去年。<\/li>\n<\/ul>\n<h3 id=\"doc-heading-23\">19. 省级约谈持续：安徽、江苏<\/h3>\n<ul>\n<li><strong>标题<\/strong>：安徽/江苏市场监管局约谈外卖平台<\/li>\n<li><strong>来源<\/strong>：新京报 / <a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a><\/li>\n<li><strong>日期<\/strong>：2026-05<\/li>\n<li><strong>核心摘要<\/strong>：安徽（5月11日）、江苏（5月25日）分别约谈淘宝闪购、美团、京东、抖音等外卖平台。<\/li>\n<\/ul>\n<h3 id=\"doc-heading-24\">20. 17平台被约谈防止618非理性补贴<\/h3>\n<ul>\n<li><strong>标题<\/strong>：17平台被约谈，防止\"618非理性大额补贴\"<\/li>\n<li><strong>来源<\/strong>：多家报道<\/li>\n<li><strong>日期<\/strong>：2026-05-25~26<\/li>\n<li><strong>核心摘要<\/strong>：618前夕，17家平台被约谈，明确禁止非理性大额补贴。这标志着补贴大战进入尾声。<\/li>\n<li><strong>关键数据<\/strong>：17平台被约谈<\/li>\n<\/ul>\n<h3 id=\"doc-heading-25\">21. 监管加码补贴收紧，外卖大战落幕<\/h3>\n<ul>\n<li><strong>标题<\/strong>：监管加码补贴收紧，外卖大战落幕，但消费入口争夺战才刚刚开始<\/li>\n<li><strong>来源<\/strong>：凤凰网 / <a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a><\/li>\n<li><strong>日期<\/strong>：2026-05-31 / 2026-06-01<\/li>\n<li><strong>核心摘要<\/strong>：监管持续加码、补贴被迫收紧，外卖大战基本落幕。但各方对\"消费入口\"的争夺仍在继续，即时零售是真正的终局战场。<\/li>\n<li><strong>关键数据<\/strong>：补贴大战落幕<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-26\">四、淘宝闪购与药房/买药<\/h2>\n<h3 id=\"doc-heading-27\">22. 淘宝打造首个零售医疗健康仓<\/h3>\n<ul>\n<li><strong>标题<\/strong>：单量是传统药房21.5倍！淘宝打造首个零售医疗健康仓<\/li>\n<li><strong>来源<\/strong>：<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a><\/li>\n<li><strong>日期<\/strong>：2026-04-18<\/li>\n<li><strong>核心摘要<\/strong>：淘宝闪购建成首个零售医疗健康仓，单量达到传统药房的21.5倍。这是阿里在医疗健康即时零售领域的重要布局，直接挑战线下药房。<\/li>\n<li><strong>关键数据<\/strong>：健康仓单量=传统药房21.5倍<\/li>\n<\/ul>\n<h3 id=\"doc-heading-28\">23. 美团VS淘宝闪购在医疗赛道正面硬刚<\/h3>\n<ul>\n<li><strong>标题<\/strong>：美团VS淘宝闪购，在医疗赛道正面硬刚，底牌全亮了<\/li>\n<li><strong>来源<\/strong>：<a href=\"https://36kr.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">36氪<\/a><\/li>\n<li><strong>日期<\/strong>：2026-04-20<\/li>\n<li><strong>核心摘要<\/strong>：美团和淘宝闪购在医疗健康品类展开最直接的竞争，双方\"底牌全亮\"。这是即时零售竞争从外卖向医疗纵深推进的标志性事件。<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-29\">五、淘宝闪购财务影响与阿里业绩<\/h2>\n<h3 id=\"doc-heading-30\">24. 阿里第二财季净利润下滑53%<\/h3>\n<ul>\n<li><strong>标题<\/strong>：外卖大战或将暂停，阿里巴巴第二财季净利润下滑53%（仅推测）<\/li>\n<li><strong>来源<\/strong>：<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a><\/li>\n<li><strong>日期<\/strong>：2025-11-26<\/li>\n<li><strong>核心摘要<\/strong>：淘宝闪购大规模投入导致阿里净利润大幅下滑53%，公司暗示闪购投入将收缩。<\/li>\n<\/ul>\n<h3 id=\"doc-heading-31\">25. 淘宝闪购强劲增长56%<\/h3>\n<ul>\n<li><strong>标题<\/strong>：平头哥首次亮相阿里财报，淘宝闪购强劲增长56%<\/li>\n<li><strong>来源<\/strong>：搜狐网<\/li>\n<li><strong>日期<\/strong>：2026-03-19<\/li>\n<li><strong>核心摘要<\/strong>：阿里财报显示淘宝闪购同比增长56%，是阿里各业务线中增速最快的板块之一。<\/li>\n<li><strong>关键数据<\/strong>：淘宝闪购增长56%<\/li>\n<\/ul>\n<h3 id=\"doc-heading-32\">26. 外卖大战烧掉2200亿/800亿（不同口径）<\/h3>\n<ul>\n<li><strong>标题<\/strong>：外卖大战烧掉2200亿（澎湃）/ 烧光800亿（36氪）<\/li>\n<li><strong>来源<\/strong>：澎湃 / <a href=\"https://36kr.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">36氪<\/a><\/li>\n<li><strong>日期<\/strong>：2025-12 / 2026-02<\/li>\n<li><strong>核心摘要<\/strong>：对外卖大战总烧钱规模，不同口径差异较大。澎湃引用2200亿，36氪引用800亿（半年）。三大平台合计少赚约1700亿元。<\/li>\n<li><strong>关键数据<\/strong>：三大平台合计少赚约1700亿元<\/li>\n<\/ul>\n<h3 id=\"doc-heading-33\">27. 阿里三年不担心亏损<\/h3>\n<ul>\n<li><strong>标题<\/strong>：消息称阿里要继续大投入淘宝闪购，三年不担心亏损<\/li>\n<li><strong>来源<\/strong>：DoNews / <a href=\"https://xueqiu.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">雪球<\/a><\/li>\n<li><strong>日期<\/strong>：2026-02-11<\/li>\n<li><strong>核心摘要<\/strong>：阿里内部传将连续三年大投入淘宝闪购，不在乎短期亏损，计划超越美团成为即时零售第一。<\/li>\n<li><strong>关键数据<\/strong>：三年不担心亏损<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-34\">六、外卖大战关键时间线<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>时间<\/th>\n<th>事件<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2025-05<\/td>\n<td>淘宝闪购正式上线，京东外卖39城开城<\/td>\n<\/tr>\n<tr>\n<td>2025-07-02<\/td>\n<td>淘宝闪购500亿补贴上线，首周4124品牌破峰<\/td>\n<\/tr>\n<tr>\n<td>2025-07-08<\/td>\n<td>\"疯狂星期六\"开战，阿里直补 vs 美团放券<\/td>\n<\/tr>\n<tr>\n<td>2025-07-11<\/td>\n<td>0.3元咖啡出圈（CNBC报道）<\/td>\n<\/tr>\n<tr>\n<td>2025-07-12<\/td>\n<td>美团日单量1.5亿，淘宝闪购8000万+<\/td>\n<\/tr>\n<tr>\n<td>2025-07-14<\/td>\n<td>淘宝闪购日单破8000万<\/td>\n<\/tr>\n<tr>\n<td>2025-07-19<\/td>\n<td>三大平台首次被约谈<\/td>\n<\/tr>\n<tr>\n<td>2025-07-23<\/td>\n<td>上海下令取消\"0元购\"<\/td>\n<\/tr>\n<tr>\n<td>2025-07-29<\/td>\n<td>淘宝闪购日单破9000万<\/td>\n<\/tr>\n<tr>\n<td>2025-08-11<\/td>\n<td>淘宝闪购峰值首超美团<\/td>\n<\/tr>\n<tr>\n<td>2025-08-22<\/td>\n<td>阿里六→四大集团重组<\/td>\n<\/tr>\n<tr>\n<td>2025-11<\/td>\n<td>美团Q3首次季度亏损；阿里净利润降53%<\/td>\n<\/tr>\n<tr>\n<td>2025-11-04<\/td>\n<td>饿了么更名淘宝闪购（品牌焕新）<\/td>\n<\/tr>\n<tr>\n<td>2025-12-05<\/td>\n<td>饿了么App正式更名淘宝闪购<\/td>\n<\/tr>\n<tr>\n<td>2025-12<\/td>\n<td>美团优选全国关停<\/td>\n<\/tr>\n<tr>\n<td>2026-01-08<\/td>\n<td>淘宝闪购公开争第一<\/td>\n<\/tr>\n<tr>\n<td>2026-02-05<\/td>\n<td>美团50亿收购叮咚买菜<\/td>\n<\/tr>\n<tr>\n<td>2026-02-14<\/td>\n<td>反垄断指引发布，淘宝闪购\"二选一\"被通报<\/td>\n<\/tr>\n<tr>\n<td>2026-03-16<\/td>\n<td>淘宝闪购份额45.2%，与美团差距0.2%<\/td>\n<\/tr>\n<tr>\n<td>2026-03-23<\/td>\n<td>北京约谈12平台，淘宝闪购改价被通报<\/td>\n<\/tr>\n<tr>\n<td>2026-04-18<\/td>\n<td>淘宝闪购首个医疗健康仓上线<\/td>\n<\/tr>\n<tr>\n<td>2026-04-20<\/td>\n<td>美团VS淘宝闪购医疗赛道正面对抗<\/td>\n<\/tr>\n<tr>\n<td>2026-05-22<\/td>\n<td>淘宝闪购Q4份额45.2%，规模一年增3倍<\/td>\n<\/tr>\n<tr>\n<td>2026-05-25<\/td>\n<td>17平台被约谈，禁止618非理性补贴<\/td>\n<\/tr>\n<tr>\n<td>2026-05-31<\/td>\n<td>监管加码，补贴大战落幕<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<h2 id=\"doc-heading-35\">七、阿里/淘宝闪购战略框架总结<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>维度<\/th>\n<th>核心内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>品牌演变<\/strong><\/td>\n<td>饿了么 → 淘宝闪购（2025-11/12月更名）<\/td>\n<\/tr>\n<tr>\n<td><strong>补贴规模<\/strong><\/td>\n<td>500亿元补贴计划；单日最高12亿（疯狂星期六）<\/td>\n<\/tr>\n<tr>\n<td><strong>日订单峰值<\/strong><\/td>\n<td>9000万+（峰值超美团）；稳定在8000万<\/td>\n<\/tr>\n<tr>\n<td><strong>市场份额<\/strong><\/td>\n<td>Q4达45.2%，与美团差距仅0.2%<\/td>\n<\/tr>\n<tr>\n<td><strong>组织整合<\/strong><\/td>\n<td>淘天+饿了么+飞猪=大消费平台；六→四大集团<\/td>\n<\/tr>\n<tr>\n<td><strong>核心人物<\/strong><\/td>\n<td>马云亲自督战；蒋凡主导闪购业务<\/td>\n<\/tr>\n<tr>\n<td><strong>三年承诺<\/strong><\/td>\n<td>三年不担心亏损，计划超越美团<\/td>\n<\/tr>\n<tr>\n<td><strong>医疗健康<\/strong><\/td>\n<td>首个零售医疗健康仓，单量=传统药房21.5倍<\/td>\n<\/tr>\n<tr>\n<td><strong>监管压力<\/strong><\/td>\n<td>多次被约谈，\"二选一\"被通报，擅自改价被典型通报<\/td>\n<\/tr>\n<tr>\n<td><strong>财务影响<\/strong><\/td>\n<td>阿里净利润降53%；三大平台合计少赚1700亿<\/td>\n<\/tr>\n<tr>\n<td><strong>战略定调<\/strong><\/td>\n<td>从外卖到即时零售（\"消费入口\"争夺战）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","rawText":"阿里/淘宝闪购 公开新闻动态（2025-2026） 引用级别：✅可正式引用 资料基础：官方公告、公司财报、交易所/港交所披露、公司官网新闻稿、监管披露或已核验权威公开来源。 更新时间：2026-06-08 信息来源：Google News RSS 聚合、36氪、新浪财经、界面、证券时报、新华网等 一句话定位 本文定位为阿里/淘宝闪购 公开新闻动态的新闻动态资料，主要事件有平台补贴竞争、供给网络扩张、品类合作、即时履约和医药零售相关业务变化。 一、淘宝闪购500亿补贴与日订单量 1. 淘宝闪购祭出500亿补贴 标题**：淘宝闪购祭出500亿补贴，打工人盯上罗森、全家\"羊毛\" 来源**：36氪 日期**：2025-07-02 原文链接**：https://36kr.com （搜索\"淘宝闪购500亿补贴\"可找到原文） 核心摘要**：淘宝闪购正式推出500亿元补贴计划，首周即有4124个餐饮品牌商家破峰，城市连锁品牌占比95%；2318个非餐饮品类订单量翻倍。 关键数据**：500亿补贴；首周4124个餐饮品牌破峰；2318个非餐饮品类翻倍 2. 日订单破8000万 标题**：稳占8000万日订单，淘宝投出一个美团 来源**：新浪财经 日期**：2025-08-29 核心摘要**：淘宝闪购日订单量稳定在8000万单。在\"疯狂星期六\"补贴期间曾突破更高峰值。 关键数据**：日订单8000万 3. \"疯狂星期六\"单日补贴超12亿 标题**：\"疯狂星期六\"单日补贴超12亿，美团仅4亿 来源**：36氪 / 证券时报 日期**：2025-07 核心摘要**：淘宝闪购在单个\"疯狂星期六\"补贴日投入超12亿元，同期美团约4亿元。\"疯狂星期六\"计划持续100天。 关键数据**：单日补贴12亿 vs 美团4亿；持续100天 4. 日订单连续破9000万 标题**：日订单连续破9000万，淘宝闪购翻盘已是新常态 来源**：维科号/Weike 日期**：2025-07-29 核心摘要**：淘宝闪购日订单量连续突破9000万单，翻盘美团已成新常态。 关键数据**：日订单9000万 5. 淘宝闪购峰值超过美团 标题**：上个周末，淘宝闪购峰值超过了美团 来源**：新浪财经/LatePost 日期**：2025-08-11 核心摘要**：在补贴高峰期周末，淘宝闪购单日峰值超过美团，首次在日订单维度超越。 关键数据**：峰值超过美团 6. Q4份额冲至45.2%，与美团差距仅0.2个百分点 标题**：淘宝闪购第四季度份额冲至45.2%，与美团差距仅0.2个百分点 来源**：新浪财经 日期**：2026-05-22 原文链接**：https://finance.sina.com.cn 核心摘要**：淘宝闪购在即时零售（含外卖）Q4市场份额达到45.2%，与美团的45.4%仅差0.2个百分点。一年内规模增长3倍，价格战并非主因。 关键数据**：Q4份额45.2%；与美团差0.2个百分点；规模一年增3倍 7. 淘宝闪购立下Flag争第一 标题**：淘宝闪购目标即时零售份额第一，压力给到美团 来源**：雪球 / 新浪财经 日期**：2026-01-08 核心摘要**：淘宝闪购公开表态争即时零售份额第一。同日美团也不让步，双方正面宣战。 关键数据**：公开争第一目标 二、饿了么更名与阿里组织重组 8. 饿了么更名为淘宝闪购 标题**：饿了么App品牌全面焕新为淘宝闪购，开启大消费平台新篇章 来源**：新京报 日期**：2025-12-05 原文链接**：https://www.bjnews.com.cn 核心摘要**：饿了么App正式更名为\"淘宝闪购\"，品牌全面焕新。这是阿里即时零售战略的重大里程碑，从外卖平台升级为大消费平台。 关键数据**：饿了么正式更名为淘宝闪购 9. 从\"我想要\"到\"我现在就要\" 标题**：饿了么更名淘宝闪购：从\"我想要\"到\"我现在就要\" 来源**：四川新闻 日期**：2025-11-04 核心摘要**：更名背后是阿里战略定位的根本性转变——从\"搜索式电商\"转向\"即时满足式消费\"。 10. 阿里组建大消费平台：淘天+饿了么+飞猪 标题**：阿里大消费平台：淘天+饿了么+飞猪 来源**：21财经 日期**：2025-06-24 核心摘要**：阿里将淘宝天猫、饿了么、飞猪整合为大消费平台，形成\"电商+即时零售+出行\"的生态闭环。 11. 饿了么与淘宝闪购纳入电商集团 标题**：阿里巴巴重新归纳4大业务，饿了么与淘宝闪购纳入电商集团 来源**：新浪财经 日期**：2025-08-22 核心摘要**：阿里从六大集团缩编为四大业务，\"1+6+N\"架构终结。饿了么和淘宝闪购统一纳入电商集团管理。张勇时代激进分拆告终，蔡崇信吴泳铭收权重划版图。 关键数据**：六→四大集团重组 12. 马云亲自督战 标题**：马云豪赌未来，淘宝闪购正在起飞 来源**：雪球 / 新浪财经 日期**：2025-07 / 2026-01 核心摘要**：马云亲自督战淘宝闪购业务，蒋凡被重用主导闪购攻坚战。阿里投入力度空前。 关键数据**：马云亲自督战；蒋凡主导 13. 蒋凡确立淘宝闪购\"小目标\" 标题**：吴泳铭不惧\"AI泡沫\"，蒋凡确立淘宝闪购\"小目标\" 来源**：维科号 日期**：2025-12-01 核心摘要**：蒋凡为淘宝闪购设定明确的增长目标，蒋凡豪赌\"规模论\"，阿里蒸发百亿利润继续大战外卖。 三、监管约谈与策略调整 14. 饿了么、美团、京东首次被约谈 标题**：饿了么美团京东被约谈 来源**：新华网 / 新华日报 日期**：2025-07-19 核心摘要**：三大平台首次被监管部门约谈，要求停止\"恶性竞争\"。但约谈后首个周末补贴仍在继续。 关键数据**：7月19日首次约谈 15. 上海下令全面取消\"0元购\" 标题**：上海约谈外卖平台，要求全面下架\"0元购\" 来源**：新浪财经 日期**：2025-07-23 核心摘要**：上海市监局约谈外卖平台，明确要求全面下架\"0元购\"等极端补贴活动。 16. 第二次约谈：反垄断指引发布，淘宝闪购\"二选一\"被通报 标题**：反垄断指引发布当天，淘宝闪购\"二选一\"被通报 来源**：腾讯新闻 / 新浪财经 日期**：2026-02-14 核心摘要**：国家市场监督管理总局约谈7家平台（阿里、抖音、百度、腾讯、京东、美团、淘宝闪购），发布反垄断指引。淘宝闪购因\"二选一\"独家排他行为被作为典型案例通报。 关键数据**：7家平台被约谈；淘宝闪购\"二选一\"被通报 17. 北京三部门约谈12家平台 标题**：北京三部门约谈12家平台，整治\"内卷式\"竞争 来源**：财新 / 证券时报 / 人民日报 日期**：2026-03-23~25 核心摘要**：北京市场监管局等三部门联合约谈12家平台。典型案例：饺子售价18元商家实收1.25元。淘宝闪购因擅自修改商品价格被作为典型违规通报。市监总局官网发文\"外卖大战该结束了\"。 关键数据**：饺子18元商家实收1.25元；淘宝闪购擅自改价被通报 18. 淘宝闪购被约谈后仍继续烧钱 标题**：被约谈的淘宝闪购，还要继续\"烧钱\" 来源**：新浪财经 日期**：2026-03 核心摘要**：尽管多次被约谈，淘宝闪购仍继续大规模补贴。阿里表态\"三年不担心亏损\"，投入力度将超去年。 19. 省级约谈持续：安徽、江苏 标题**：安徽/江苏市场监管局约谈外卖平台 来源**：新京报 / 新浪财经 日期**：2026-05 核心摘要**：安徽（5月11日）、江苏（5月25日）分别约谈淘宝闪购、美团、京东、抖音等外卖平台。 20. 17平台被约谈防止618非理性补贴 标题**：17平台被约谈，防止\"618非理性大额补贴\" 来源**：多家报道 日期**：2026-05-25~26 核心摘要**：618前夕，17家平台被约谈，明确禁止非理性大额补贴。这标志着补贴大战进入尾声。 关键数据**：17平台被约谈 21. 监管加码补贴收紧，外卖大战落幕 标题**：监管加码补贴收紧，外卖大战落幕，但消费入口争夺战才刚刚开始 来源**：凤凰网 / 新浪财经 日期**：2026-05-31 / 2026-06-01 核心摘要**：监管持续加码、补贴被迫收紧，外卖大战基本落幕。但各方对\"消费入口\"的争夺仍在继续，即时零售是真正的终局战场。 关键数据**：补贴大战落幕 四、淘宝闪购与药房/买药 22. 淘宝打造首个零售医疗健康仓 标题**：单量是传统药房21.5倍！淘宝打造首个零售医疗健康仓 来源**：新浪财经 日期**：2026-04-18 核心摘要**：淘宝闪购建成首个零售医疗健康仓，单量达到传统药房的21.5倍。这是阿里在医疗健康即时零售领域的重要布局，直接挑战线下药房。 关键数据**：健康仓单量=传统药房21.5倍 23. 美团VS淘宝闪购在医疗赛道正面硬刚 标题**：美团VS淘宝闪购，在医疗赛道正面硬刚，底牌全亮了 来源**：36氪 日期**：2026-04-20 核心摘要**：美团和淘宝闪购在医疗健康品类展开最直接的竞争，双方\"底牌全亮\"。这是即时零售竞争从外卖向医疗纵深推进的标志性事件。 五、淘宝闪购财务影响与阿里业绩 24. 阿里第二财季净利润下滑53% 标题**：外卖大战或将暂停，阿里巴巴第二财季净利润下滑53%（仅推测） 来源**：新浪财经 日期**：2025-11-26 核心摘要**：淘宝闪购大规模投入导致阿里净利润大幅下滑53%，公司暗示闪购投入将收缩。 25. 淘宝闪购强劲增长56% 标题**：平头哥首次亮相阿里财报，淘宝闪购强劲增长56% 来源**：搜狐网 日期**：2026-03-19 核心摘要**：阿里财报显示淘宝闪购同比增长56%，是阿里各业务线中增速最快的板块之一。 关键数据**：淘宝闪购增长56% 26. 外卖大战烧掉2200亿/800亿（不同口径） 标题**：外卖大战烧掉2200亿（澎湃）/ 烧光800亿（36氪） 来源**：澎湃 / 36氪 日期**：2025-12 / 2026-02 核心摘要**：对外卖大战总烧钱规模，不同口径差异较大。澎湃引用2200亿，36氪引用800亿（半年）。三大平台合计少赚约1700亿元。 关键数据**：三大平台合计少赚约1700亿元 27. 阿里三年不担心亏损 标题**：消息称阿里要继续大投入淘宝闪购，三年不担心亏损 来源**：DoNews / 雪球 日期**：2026-02-11 核心摘要**：阿里内部传将连续三年大投入淘宝闪购，不在乎短期亏损，计划超越美团成为即时零售第一。 关键数据**：三年不担心亏损 六、外卖大战关键时间线 时间 事件 ------ ------ 2025-05 淘宝闪购正式上线，京东外卖39城开城 2025-07-02 淘宝闪购500亿补贴上线，首周4124品牌破峰 2025-07-08 \"疯狂星期六\"开战，阿里直补 vs 美团放券 2025-07-11 0.3元咖啡出圈（CNBC报道） 2025-07-12 美团日单量1.5亿，淘宝闪购8000万+ 2025-07-14 淘宝闪购日单破8000万 2025-07-19 三大平台首次被约谈 2025-07-23 上海下令取消\"0元购\" 2025-07-29 淘宝闪购日单破9000万 2025-08-11 淘宝闪购峰值首超美团 2025-08-22 阿里六→四大集团重组 2025-11 美团Q3首次季度亏损；阿里净利润降53% 2025-11-04 饿了么更名淘宝闪购（品牌焕新） 2025-12-05 饿了么App正式更名淘宝闪购 2025-12 美团优选全国关停 2026-01-08 淘宝闪购公开争第一 2026-02-05 美团50亿收购叮咚买菜 2026-02-14 反垄断指引发布，淘宝闪购\"二选一\"被通报 2026-03-16 淘宝闪购份额45.2%，与美团差距0.2% 2026-03-23 北京约谈12平台，淘宝闪购改价被通报 2026-04-18 淘宝闪购首个医疗健康仓上线 2026-04-20 美团VS淘宝闪购医疗赛道正面对抗 2026-05-22 淘宝闪购Q4份额45.2%，规模一年增3倍 2026-05-25 17平台被约谈，禁止618非理性补贴 2026-05-31 监管加码，补贴大战落幕 七、阿里/淘宝闪购战略框架总结 维度 核心内容 ------ ---------- **品牌演变** 饿了么 → 淘宝闪购（2025-11/12月更名） **补贴规模** 500亿元补贴计划；单日最高12亿（疯狂星期六） **日订单峰值** 9000万+（峰值超美团）；稳定在8000万 **市场份额** Q4达45.2%，与美团差距仅0.2% **组织整合** 淘天+饿了么+飞猪=大消费平台；六→四大集团 **核心人物** 马云亲自督战；蒋凡主导闪购业务 **三年承诺** 三年不担心亏损，计划超越美团 **医疗健康** 首个零售医疗健康仓，单量=传统药房21.5倍 **监管压力** 多次被约谈，\"二选一\"被通报，擅自改价被典型通报 **财务影响** 阿里净利润降53%；三大平台合计少赚1700亿 **战略定调** 从外卖到即时零售（\"消费入口\"争夺战）","headings":[{"level":2,"text":"一句话定位","anchor":"doc-heading-1"},{"level":2,"text":"一、淘宝闪购500亿补贴与日订单量","anchor":"doc-heading-2"},{"level":3,"text":"1. 淘宝闪购祭出500亿补贴","anchor":"doc-heading-3"},{"level":3,"text":"2. 日订单破8000万","anchor":"doc-heading-4"},{"level":3,"text":"3. \"疯狂星期六\"单日补贴超12亿","anchor":"doc-heading-5"},{"level":3,"text":"4. 日订单连续破9000万","anchor":"doc-heading-6"},{"level":3,"text":"5. 淘宝闪购峰 r>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">Quick commerce收入（全年）<\/td>\n<td style=\"text-align: left;\">785.20亿元<\/td>\n<td style=\"text-align: left;\">↑+47% YoY<\/td>\n<td style=\"text-align: left;\">FY2026<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">财报<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Quick commerce收入（Q3）<\/td>\n<td style=\"text-align: left;\">199.88亿元<\/td>\n<td style=\"text-align: left;\">↑+57% YoY<\/td>\n<td style=\"text-align: left;\">FY2026Q3<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">财报<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">中国电商集团总收入（全年）<\/td>\n<td style=\"text-align: left;\">5,542.17亿元<\/td>\n<td style=\"text-align: left;\">↑+9%<\/td>\n<td style=\"text-align: left;\">FY2026<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">财报<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">中国电商集团EBITA（全年）<\/td>\n<td style=\"text-align: left;\">1,075.09亿元<\/td>\n<td style=\"text-align: left;\">↓-44%<\/td>\n<td style=\"text-align: left;\">FY2026<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">财报<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">中国电商集团EBITA（Q3）<\/td>\n<td style=\"text-align: left;\">240.10亿元<\/td>\n<td style=\"text-align: left;\">↓-40%<\/td>\n<td style=\"text-align: left;\">FY2026Q3<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">财报<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">淘宝闪购+饿了么日订单<\/td>\n<td style=\"text-align: left;\">8000万+<\/td>\n<td style=\"text-align: left;\">↑（补贴驱动）<\/td>\n<td style=\"text-align: left;\">2025-07<\/td>\n<td style=\"text-align: left;\"><a href=\"https://news.baidu.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公开新闻<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">淘宝月活<\/td>\n<td style=\"text-align: left;\">9.28亿<\/td>\n<td style=\"text-align: left;\">稳<\/td>\n<td style=\"text-align: left;\">2025-03<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=QuestMobile\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">QuestMobile<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">88VIP会员数<\/td>\n<td style=\"text-align: left;\">6200万+<\/td>\n<td style=\"text-align: left;\">↑双位数<\/td>\n<td style=\"text-align: left;\">FY2026Q3<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">财报<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">自由现金流（全年）<\/td>\n<td style=\"text-align: left;\">-466.09亿元<\/td>\n<td style=\"text-align: left;\">↓（从+738.7亿）<\/td>\n<td style=\"text-align: left;\">FY2026<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">财报<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"doc-heading-3\">核心观点（5条）<\/h2>\n<ol>\n<li>\n<p><strong>Quick commerce是阿里FY2026最大变量<\/strong>：收入从536亿→785亿（+47%），Q3增速进一步加速到+57%。淘宝闪购+饿了么的合体效应正在显现。<\/p>\n<\/li>\n<li>\n<p><strong>以利润换规模的决心极大<\/strong>：中国电商集团EBITA从1,932亿→1,075亿（-44%），全年自由现金流从+739亿转为-466亿。这是阿里历史上对即时零售最大规模的投入。<\/p>\n<\/li>\n<li>\n<p><strong>淘宝9.28亿月活是核心流量池<\/strong>：淘宝闪购获首页一级入口后，流量优势远超美团App（约4-5亿月活）和京东App（约5亿月活）。这是阿里在即时零售竞争中的最大底牌。<\/p>\n<\/li>\n<li>\n<p><strong>单均经济模型在改善<\/strong>：管理层强调\"unit economics steadily improved\"和\"average order value increased QoQ\"，说明不只是烧钱换量，而是在优化结构。<\/p>\n<\/li>\n<li>\n<p><strong>组织整合释放协同效应<\/strong>：饿了么+飞猪并入中国电商集团，统一目标后资源共享更顺畅，补贴效率可能高于独立运营阶段。（仅推测）<\/p>\n<\/li>\n<\/ol>\n<h2 id=\"doc-heading-4\">重要结论<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">结论<\/th>\n<th style=\"text-align: left;\">置信度<\/th>\n<th style=\"text-align: left;\">依据<\/th>\n<th style=\"text-align: left;\">变量<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">阿里已成为即时零售市场的第二大玩家<\/td>\n<td style=\"text-align: left;\">高<\/td>\n<td style=\"text-align: left;\">QC收入785亿+日订单8000万+<\/td>\n<td style=\"text-align: left;\">QC收入口径含补贴冲减，实际GTV更高<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">补贴驱动增长模式短期内不会改变<\/td>\n<td style=\"text-align: left;\">中<\/td>\n<td style=\"text-align: left;\">EBITA -44%+管理层的投资基调<\/td>\n<td style=\"text-align: left;\">监管约谈可能约束补贴力度<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">淘宝流量是阿里的结构性优势<\/td>\n<td style=\"text-align: left;\">高<\/td>\n<td style=\"text-align: left;\">9.28亿月活 vs 美团4-5亿<\/td>\n<td style=\"text-align: left;\">流量≠转化，用户心智需要培养<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">阿里在药品O2O领域仍弱于美团<\/td>\n<td style=\"text-align: left;\">中<\/td>\n<td style=\"text-align: left;\">美团买药500亿+GMV/25万+药店<\/td>\n<td style=\"text-align: left;\">饿了么买药增速可能很快但基数小<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"doc-heading-5\">关键时间线<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">时间<\/th>\n<th style=\"text-align: left;\">事件<\/th>\n<th style=\"text-align: left;\">数据/影响<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">2025-05-02<\/td>\n<td style=\"text-align: left;\">\"小时达\"更名\"淘宝闪购\"<\/td>\n<td style=\"text-align: left;\">获首页一级入口<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2025-06-23<\/td>\n<td style=\"text-align: left;\">饿了么+飞猪并入中国电商集团<\/td>\n<td style=\"text-align: left;\">组织整合<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2025-06-23<\/td>\n<td style=\"text-align: left;\">淘宝闪购+饿了么日订单超6000万<\/td>\n<td style=\"text-align: left;\">规模里程碑<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2025-07-02<\/td>\n<td style=\"text-align: left;\">500亿元补贴计划宣布<\/td>\n<td style=\"text-align: left;\">12个月滚动投入<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2025-07-09<\/td>\n<td style=\"text-align: left;\">日订单突破8000万<\/td>\n<td style=\"text-align: left;\">高速增长持续<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2025-08-06<\/td>\n<td style=\"text-align: left;\">监管约谈主要外卖平台<\/td>\n<td style=\"text-align: left;\">补贴行为可能受限<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2026-05-13<\/td>\n<td style=\"text-align: left;\">FY2026财报发布<\/td>\n<td style=\"text-align: left;\">QC收入785亿+47%<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"doc-heading-6\">与美团即时零售对比<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">维度<\/th>\n<th style=\"text-align: left;\">美团<\/th>\n<th style=\"text-align: left;\">阿里/淘宝闪购<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">即时零售收入规模<\/td>\n<td style=\"text-align: left;\">~2,000亿+（核心本地商业主体）<\/td>\n<td style=\"text-align: left;\">785亿（quick commerce分部）<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">收入增速<\/td>\n<td style=\"text-align: left;\">~15-20%<\/td>\n<td style=\"text-align: left;\">47-57%<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">日订单量<\/td>\n<td style=\"text-align: left;\">~8000万+（含外卖）<\/td>\n<td style=\"text-align: left;\">8000万+（含饿了么外卖）<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">配送网络<\/td>\n<td style=\"text-align: left;\">自有骑手745万+<\/td>\n<td style=\"text-align: left;\">饿了么+蜂鸟配送<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">流量入口<\/td>\n<td style=\"text-align: left;\">美团App月活4-5亿<\/td>\n<td style=\"text-align: left;\">淘宝App月活9.28亿<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">药品O2O<\/td>\n<td style=\"text-align: left;\">美团买药500亿+GMV/25万+药店<\/td>\n<td style=\"text-align: left;\">饿了么买药规模较小<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">盈利状态<\/td>\n 构观点、分析师判断、主观解释、预测或推演结论，公告，财报。 整合周期：2025年4月 - 2026年3月（FY2026） 基于：阿里FY2026财报 / 公开新闻 / 券商研报 最后更新：2026-06-08 一句话定位 本文定位为阿里/淘宝闪购 - 结构化摘要的结构化摘要资料，核心关注平台规模、供给履约、品类合作、竞争风险和对医药服务平台的启示。 关键数据仪表盘 维度 最新数据 趋势 数据截止日 来源 :--- :--- :--- :--- :--- Quick commerce收入（全年） 785.20亿元 ↑+47% YoY FY2026 财报 Quick commerce收入（Q3） 199.88亿元 ↑+57% YoY FY2026Q3 财报 中国电商集团总收入（全年） 5,542.17亿元 ↑+9% FY2026 财报 中国电商集团EBITA（全年） 1,075.09亿元 ↓-44% FY2026 财报 中国电商集团EBITA（Q3） 240.10亿元 ↓-40% FY2026Q3 财报 淘宝闪购+饿了么日订单 8000万+ ↑（补贴驱动） 2025-07 公开新闻 淘宝月活 9.28亿 稳 2025-03 QuestMobile 88VIP会员数 6200万+ ↑双位数 FY2026Q3 财报 自由现金流（全年） -466.09亿元 ↓（从+738.7亿） FY2026 财报 核心观点（5条） 1. **Quick commerce是阿里FY2026最大变量**：收入从536亿→785亿（+47%），Q3增速进一步加速到+57%。淘宝闪购+饿了么的合体效应正在显现。 2. **以利润换规模的决心极大**：中国电商集团EBITA从1,932亿→1,075亿（-44%），全年自由现金流从+739亿转为-466亿。这是阿里历史上对即时零售最大规模的投入。 3. **淘宝9.28亿月活是核心流量池**：淘宝闪购获首页一级入口后，流量优势远超美团App（约4-5亿月活）和京东App（约5亿月活）。这是阿里在即时零售竞争中的最大底牌。 4. **单均经济模型在改善**：管理层强调\"unit economics steadily improved\"和\"average order value increased QoQ\"，说明不只是烧钱换量，而是在优化结构。 5. **组织整合释放协同效应**：饿了么+飞猪并入中国电商集团，统一目标后资源共享更顺畅，补贴效率可能高于独立运营阶段。（仅推测） 重要结论 结论 置信度 依据 变量 :--- :--- :--- :--- 阿里已成为即时零售市场的第二大玩家 高 QC收入785亿+日订单8000万+ QC收入口径含补贴冲减，实际GTV更高 补贴驱动增长模式短期内不会改变 中 EBITA -44%+管理层的投资基调 监管约谈可能约束补贴力度 （仅推测） 淘宝流量是阿里的结构性优势 高 9.28亿月活 vs 美团4-5亿 流量≠转化，用户心智需要培养 阿里在药品O2O领域仍弱于美团 中 美团买药500亿+GMV/25万+药店 饿了么买药增速可能很快但基数小 （仅推测） 关键时间线 时间 事件 数据/影响 :--- :--- :--- 2025-05-02 \"小时达\"更名\"淘宝闪购\" 获首页一级入口 2025-06-23 饿了么+飞猪并入中国电商集团 组织整合 2025-06-23 淘宝闪购+饿了么日订单超6000万 规模里程碑 2025-07-02 500亿元补贴计划宣布 12个月滚动投入 2025-07-09 日订单突破8000万 高速增长持续 2025-08-06 监管约谈主要外卖平台 补贴行为可能受限 （仅推测） 2026-05-13 FY2026财报发布 QC收入785亿+47% 与美团即时零售对比 维度 美团 阿里/淘宝闪购 :--- :--- :--- 即时零售收入规模 ~2,000亿+（核心本地商业主体） 785亿（quick commerce分部） 收入增速 ~15-20% 47-57% 日订单量 ~8000万+（含外卖） 8000万+（含饿了么外卖） 配送网络 自有骑手745万+ 饿了么+蜂鸟配送 流量入口 美团App月活4-5亿 淘宝App月活9.28亿 药品O2O 美团买药500亿+GMV/25万+药店 饿了么买药规模较小 盈利状态 2025全年亏损，2026Q1恢复 大额亏损投入中 供给模式 闪电仓+商家入驻 平台模式（商家入驻） 核心差异化 30分钟达+骑手密度 流量+补贴+电商协同 信息溯源清单 信息 来源 时间 链接/备注 :--- :--- :--- :--- QC收入785.20亿元+47% 阿里FY2026财报 2026-05-13 阿里F
