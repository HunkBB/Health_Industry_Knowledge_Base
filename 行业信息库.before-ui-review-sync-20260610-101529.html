元<\/td>\n<td style=\"text-align: left;\"><strong>-44%<\/strong><\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">财报<\/a>分部EBITA表<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">CMR（客户管理收入）<\/td>\n<td style=\"text-align: left;\">3,438.67亿元<\/td>\n<td style=\"text-align: left;\">3,267.69亿元<\/td>\n<td style=\"text-align: left;\">+5%<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">财报<\/a>分部收入表<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">直销及其他收入<\/td>\n<td style=\"text-align: left;\">1,055.18亿元<\/td>\n<td style=\"text-align: left;\">1,037.22亿元<\/td>\n<td style=\"text-align: left;\">+2%<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">财报<\/a>分部收入表<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"doc-heading-4\">FY2026 Q4 / March Quarter（2026年1-3月）<\/h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">指标<\/th>\n<th style=\"text-align: left;\">Q4 FY2026<\/th>\n<th style=\"text-align: left;\">Q4 FY2025<\/th>\n<th style=\"text-align: left;\">同比变动<\/th>\n<th style=\"text-align: left;\">来源<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>Quick commerce收入<\/strong><\/td>\n<td style=\"text-align: left;\">199.88亿元<\/td>\n<td style=\"text-align: left;\">127.15亿元<\/td>\n<td style=\"text-align: left;\"><strong>+57%<\/strong><\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">财报<\/a>分部收入表<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">中国电商集团总收入<\/td>\n<td style=\"text-align: left;\">1,222.20亿元<\/td>\n<td style=\"text-align: left;\">1,153.48亿元<\/td>\n<td style=\"text-align: left;\">+6%<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">财报<\/a>分部收入表<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">中国电商集团调整后EBITA<\/td>\n<td style=\"text-align: left;\">240.10亿元<\/td>\n<td style=\"text-align: left;\">397.42亿元<\/td>\n<td style=\"text-align: left;\"><strong>-40%<\/strong><\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">财报<\/a>分部EBITA表<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">CMR<\/td>\n<td style=\"text-align: left;\">730.24亿元<\/td>\n<td style=\"text-align: left;\">721.80亿元<\/td>\n<td style=\"text-align: left;\">+1%<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">财报<\/a>分部收入表<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">直销及其他<\/td>\n<td style=\"text-align: left;\">232.68亿元<\/td>\n<td style=\"text-align: left;\">246.65亿元<\/td>\n<td style=\"text-align: left;\">-6%<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">财报<\/a>分部收入表<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"doc-heading-5\">关键口径说明<\/h3>\n<ul>\n<li><strong>Quick commerce收入口径<\/strong>：包含\"淘宝即时零售\"（Taobao Instant Commerce，即淘宝闪购）和饿了么App产生的收入，扣除补贴（作为冲减收入处理）<\/li>\n<li><strong>组织调整<\/strong>：FY2026 Q1（2025年4-6月），淘宝天猫集团、饿了么、飞猪战略合并为\"阿里巴巴中国电商集团\"（Alibaba China E-commerce Group），菜鸟、高德、数字媒体等归入\"All others\"<\/li>\n<li><strong>CMR增速修正<\/strong>：FY2026 Q4 CMR同比仅+1%，但剔除新商家发展计划对收入影响（补贴从营销费用重分类为冲减收入），同口径CMR增长8%<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-6\">二、管理层表述<\/h2>\n<h3 id=\"doc-heading-7\">CEO Eddie Wu（吴泳铭）<\/h3>\n<blockquote>\n<p>\"Alibaba's full-stack AI investments have progressed from incubation to commercialization at scale.\"<\/p>\n<\/blockquote>\n<h3 id=\"doc-heading-8\">CFO Toby Xu（徐宏）<\/h3>\n<blockquote>\n<p>\"The unit economics and average order value of quick commerce steadily improved. We are confident in our business outlook and will continue to invest in AI + Cloud to strengthen our competitive advantages.\"<\/p>\n<\/blockquote>\n<h3 id=\"doc-heading-9\">Quick Commerce业务描述<\/h3>\n<blockquote>\n<p>\"Our quick commerce business remained focused on scaling the business while improving unit economics, with increasing focus on high-value food orders and non-food categories. The quick commerce business further improved unit economics, and increased average order value quarter-over-quarter primarily driven by order mix optimization.\"<\/p>\n<\/blockquote>\n<p><strong>核心要点<\/strong>：\n1. 持续投入规模扩张的同时改善单均经济模型\n2. 侧重高价值食品订单和非食品品类\n3. 订单组合优化驱动客单价环比提升<\/p>\n<hr />\n<h2 id=\"doc-heading-10\">三、与即时零售相关的战略动作<\/h2>\n<p>| 动作 | 时间 | 影响判断 | 来源 |（仅推测）\n|:---|:---|:---|:---|\n| 淘宝\"小时达\"更名\"淘宝闪购\"，获首页一级入口 | 2025-05-02 | 流量入口大幅提升，与美团正面竞争 | <a href=\"https://news.baidu.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公开新闻<\/a> |\n| 500亿元补贴计划（12个月滚动投入） | 2025-07-02 | 用补贴换规模，加速获取用户心智 | <a href=\"https://news.baidu.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公开新闻<\/a> |\n| 饿了么+飞猪并入中国电商集团 | 2025-06-23 | 统一目标和资源共享，协同电商+即时零售 | <a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">财报<\/a>披露 |\n| 淘宝闪购+饿了么日订单突破6000万 | 2025-06-23 | 已达相当规模，与美团日订单量接近 | <a href=\"https://news.baidu.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公开新闻<\/a> |\n| 淘宝闪购+饿了么日订单突破8000万 | 2025-07-09 | 补贴驱动的高速增长仍在持续 | <a href=\"https://news.baidu.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公开新闻<\/a> |\n| 监管部门约谈主要外卖平台 | 2025-07-19首次约谈（三大平台），8月6日后续约谈 | 后续补贴力度可能受限 | <a href=\"https://news.baidu.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公开新闻<\/a>；【校验修正：原写2025-08-06，经与新闻文件交叉验证，首次约谈日期为2025-07-19】 | （仅推测） |\n| Quick commerce收入同比+57% | FY2026 Q4 / March Quarter | 增速在加快，规模效应逐步显现 | <a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">财报<\/a>数据 |\n| 中国电商集团EBITA下降40% | FY2026 Q4 / March Quarter | 大规模投入仍在吃利润 | <a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">财报<\/a>数据 |\n| 自由现金流流出173亿元 | FY2026 Q4 / March Quarter | 投入力度极大，quick commerce是主因 | <a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">财报<\/a>数据 |<\/p>\n<hr />\n<h2 id=\"doc-heading-11\">四、与医药服务平台即时零售的关联<\/h2>\n<h3 id=\"doc-heading-12\">竞争影响<\/h3>\n<ul>\n<li><strong>直接竞争加剧<\/strong>：淘宝闪购获淘宝9.28亿月活导流+饿了么配送网络，在药品O2O领域直接与医药即时零售平台竞争<\/li>\n<li><strong>补贴战挤压利润<\/strong>：阿里500亿补贴+美团跟进，整个即时零售行业利润承压<\/li>\n<li><strong>药房商家争夺<\/strong>：阿里和美团都在争取药店入驻，可能导致独家/首发的排他竞争（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-13\">差异化机会<\/h3>\n<ul>\n<li><strong>京东自营药房差异化<\/strong>：阿里平台模式 vs 京东自营模式，品控和时效承诺是关键差异点<\/li>\n<li><strong>DTP特药领域<\/strong>：阿里在DTP/特药即时零售领域的布局弱于医药服务平台，这是可深耕的差异化方向<\/li>\n<li><strong>供应链深度<\/strong>：医药服务平台在药品供应链上的积累（自营采购+仓储+质控）是平台模式难以快速复制的能力<\/li>\n<\/ul>\n<h3 id=\"doc-heading-14\">需要关注的风险<\/h3>\n<ul>\n<li>阿里quick commerce增速+57%远超行业平均，若持续可能改变竞争格局（仅推测）<\/li>\n<li>阿里将饿了么从独立分部合并到中国电商集团，意味着即时零售被提升到集团核心战略层<\/li>\n<li>88VIP超6200万（双位数增长），付费会员体系可能成为即时零售的用户粘性抓手（仅推测）<\/li>\n<\/ul>\n<hr />\n<p><em>信息溯源：本文档数据来自阿里巴巴集团FY2026全年业绩公告（2026-05-13发布），原文见 <a class=\"wiki-link\" href=\"#doc/doc-0a827473d876\" data-doc=\"doc-0a827473d876\">阿里FY2026全年财报-原文<\/a>。公开新闻部分来源于36氪、晚点LatePost等多家媒体报道，具体链接见 [阿里-淘宝闪购-[新闻汇编-2025Q2-Q3]]。<\/em><\/p>","rawText":"阿里FY2026财报 - 即时零售相关 引用级别：✅可正式引用 资料基础：官方公告、公司财报、交易所/港交所披露、公司官网新闻稿、监管披露或已核验权威公开来源。 数据来源：阿里巴巴集团 (NYSE: BABA / HKEX: 9988) FY2026全年业绩公告 发布日期：2026年5月13日 信息采集日期：2026-06-01 最后更新：2026-06-08 原文：阿里FY2026全年财报-原文 一句话定位 本文定位为阿里FY2026财报 - 即时零售相关的财报与经营数据资料，核心关注收入、利润、门店/渠道、O2O或相关业务指标的变化及其来源口径。 一、即时零售核心数据 FY2026全年（2025年4月 - 2026年3月） 指标 FY2026 FY2025 同比变动 来源 :--- :--- :--- :--- :--- **Quick commerce收入** 785.20亿元 535.88亿元 **+47%** 财报分部收入表 中国电商集团总收入 5,542.17亿元 5,083.80亿元 +9% 财报分部收入表 中国电商集团调整后EBITA 1,075.09亿元 1,932.23亿元 **-44%** 财报分部EBITA表 CMR（客户管理收入） 3,438.67亿元 3,267.69亿元 +5% 财报分部收入表 直销及其他收入 1,055.18亿元 1,037.22亿元 +2% 财报分部收入表 FY2026 Q4 / March Quarter（2026年1-3月） 指标 Q4 FY2026 Q4 FY2025 同比变动 来源 :--- :--- :--- :--- :--- **Quick commerce收入** 199.88亿元 127.15亿元 **+57%** 财报分部收入表 中国电商集团总收入 1,222.20亿元 1,153.48亿元 +6% 财报分部收入表 中国电商集团调整后EBITA 240.10亿元 397.42亿元 **-40%** 财报分部EBITA表 CMR 730.24亿元 721.80亿元 +1% 财报分部收入表 直销及其他 232.68亿元 246.65亿元 -6% 财报分部收入表 关键口径说明 Quick commerce收入口径**：包含\"淘宝即时零售\"（Taobao Instant Commerce，即淘宝闪购）和饿了么App产生的收入，扣除补贴（作为冲减收入处理） 组织调整**：FY2026 Q1（2025年4-6月），淘宝天猫集团、饿了么、飞猪战略合并为\"阿里巴巴中国电商集团\"（Alibaba China E-commerce Group），菜鸟、高德、数字媒体等归入\"All others\" CMR增速修正**：FY2026 Q4 CMR同比仅+1%，但剔除新商家发展计划对收入影响（补贴从营销费用重分类为冲减收入），同口径CMR增长8% 二、管理层表述 CEO Eddie Wu（吴泳铭） \"Alibaba's full-stack AI investments have progressed from incubation to commercialization at scale.\" CFO Toby Xu（徐宏） \"The unit economics and average order value of quick commerce steadily improved. We are confident in our business outlook and will continue to invest in AI + Cloud to strengthen our competitive advantages.\" Quick Commerce业务描述 \"Our quick commerce business remained focused on scaling the business while improving unit economics, with increasing focus on high-value food orders and non-food categories. The quick commerce business further improved unit economics, and increased average order value quarter-over-quarter primarily driven by order mix optimization.\" 核心要点**： 1. 持续投入规模扩张的同时改善单均经济模型 2. 侧重高价值食品订单和非食品品类 3. 订单组合优化驱动客单价环比提升 三、与即时零售相关的战略动作 动作 时间 影响判断 来源 （仅推测） :--- :--- :--- :--- 淘宝\"小时达\"更名\"淘宝闪购\"，获首页一级入口 2025-05-02 流量入口大幅提升，与美团正面竞争 公开新闻 500亿元补贴计划（12个月滚动投入） 2025-07-02 用补贴换规模，加速获取用户心智 公开新闻 饿了么+飞猪并入中国电商集团 2025-06-23 统一目标和资源共享，协同电商+即时零售 财报披露 淘宝闪购+饿了么日订单突破6000万 2025-06-23 已达相当规模，与美团日订单量接近 公开新闻 淘宝闪购+饿了么日订单突破8000万 2025-07-09 补贴驱动的高速增长仍在持续 公开新闻 监管部门约谈主要外卖平台 2025-07-19首次约谈（三大平台），8月6日后续约谈 后续补贴力度可能受限 公开新闻；【校验修正：原写2025-08-06，经与新闻文件交叉验证，首次约谈日期为2025-07-19】 （仅推测） Quick commerce收入同比+57% FY2026 Q4 / March Quarter 增速在加快，规模效应逐步显现 财报数据 中国电商集团EBITA下降40% FY2026 Q4 / March Quarter 大规模投入仍在吃利润 财报数据 自由现金流流出173亿元 FY2026 Q4 / March Quarter 投入力度极大，quick commerce是主因 财报数据 四、与医药服务平台即时零售的关联 竞争影响 直接竞争加剧**：淘宝闪购获淘宝9.28亿月活导流+饿了么配送网络，在药品O2O领域直接与医药即时零售平台竞争 补贴战挤压利润**：阿里500亿补贴+美团跟进，整个即时零售行业利润承压 药房商家争夺**：阿里和美团都在争取药店入驻，可能导致独家/首发的排他竞争（仅推测） 差异化机会 京东自营药房差异化**：阿里平台模式 vs 京东自营模式，品控和时效承诺是关键差异点 DTP特药领域**：阿里在DTP/特药即时零售领域的布局弱于医药服务平台，这是可深耕的差异化方向 供应链深度**：医药服务平台在药品供应链上的积累（自营采购+仓储+质控）是平台模式难以快速复制的能力 需要关注的风险 阿里quick commerce增速+57%远超行业平均，若持续可能改变竞争格局（仅推测） 阿里将饿了么从独立分部合并到中国电商集团，意味着即时零售被提升到集团核心战略层 88VIP超6200万（双位数增长），付费会员体系可能成为即时零售的用户粘性抓手（仅推测） 信息溯源：本文档数据来自阿里巴巴集团FY2026全年业绩公告（2026-05-13发布），原文见 阿里FY2026全年财报-原文。公开新闻部分来源于36氪、晚点LatePost等多家媒体报道，具体链接见 [阿里-淘宝闪购-[新闻汇编-2025Q2-Q3]]。*","headings":[{"level":2,"text":"一句话定位","anchor":"doc-heading-1"},{"level":2,"text":"一、即时零售核心数据","anchor":"doc-heading-2"},{"level":3,"text":"FY2026全年（2025年4月 - 2026年3月）","anchor":"doc-heading-3"},{"level":3,"text":"FY2026 Q4 / March Quarter（2026年1-3月）","anchor":"doc-heading-4"},{"level":3,"text":"关键口径说明","anchor":"doc-heading-5"},{"level":2,"text":"二、管理层表述","anchor":"doc-heading-6"},{"level":3,"text":"CEO Eddie Wu（吴泳铭）","anchor":"doc-heading-7"},{"level":3,"text":"CFO Toby Xu（徐宏）","anchor":"doc-heading-8"},{"level":3,"text":"Quick Commerce业务描述","anchor":"doc-heading-9"},{"level":2,"text":"三、与即时零售相关的战略动作","anchor":"doc-heading-10"},{"level":2,"text":"四、与医药服务平台即时零售的关联","anchor":"doc-heading-11"},{"level":3,"text":"竞争影响","anchor":"doc-heading-12"},{"level":3,"text":"差异化机会","anchor":"doc-heading-13"},{"level":3,"text":"需要关注的风险","anchor":"doc-heading-14"}],"outgoing":["doc-0a827473d876","doc-0a827473d876"]},{"id":"doc-a9c8bb5d89de","title":"一心堂-新闻动态_2025-2026","path":"02-连锁药店/一心堂/一心堂-新闻动态_2025-2026.md","stem":"一心堂-新闻动态_2025-2026","module":"02-连锁药店","entity":"一心堂","contentType":"公开新闻","isIndex":false,"isGovernance":false,"summary":"﻿# 一心堂 · 新闻动态（2025-2026）","learningTakeaway":"本文帮助你理解一心堂 · 新闻动态的新闻动态资料，主要事件有业绩变化、门店调整、O2O运营、平台合作、监管合规和区域扩张。阅读后可以重点掌握：行业规模、平台竞争、财报指标、研报观点、新闻动态；主要帮助解决“这篇资料讲什么、关键事实是什么、后续应从哪些角度继续核验/阅读”的问题。","lastUpdated":"","citationStatus":"可供研判参考","html":"<p>﻿# 一心堂 · 新闻动态（2025-2026）<\/p>\n<blockquote>\n<p>引用级别：✅可供研判参考\n资料基础：行业研究报告、券商研报、机构观点、分析师判断、主观解释、预测或推演结论，公告，财报。<\/p>\n<p>更新时间：2026-06-08\n信息来源：公司<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>、2026年第一<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">季度报告<\/a>、行业报道、券商研报、监管/信用公示转引\n声明：本次已补充公开检索结果；财务数据优先采用一心堂公告/<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">巨潮资讯网<\/a>披露，合作动态、私域运营、门店调改、监管处罚等采用<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>、主流媒体和监管/信用公示转引。未见官方披露的事项明确标注“官方公开材料未列示明确信息；仅保留已披露事实”。<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"doc-heading-1\">一句话定位<\/h2>\n<p>本文定位为一心堂 · 新闻动态的新闻动态资料，主要事件有业绩变化、门店调整、O2O运营、平台合作、监管合规和区域扩张。<\/p>\n<h2 id=\"doc-heading-2\">一、2025年报核心数据<\/h2>\n<h3 id=\"doc-heading-3\">1. 营收与利润<\/h3>\n<ul>\n<li><strong>来源<\/strong>：一心堂2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a>（002727.SZ）<\/li>\n<li><strong>日期<\/strong>：2026-04<\/li>\n<li><strong>核心内容<\/strong>：一心堂2025年营收173.36亿（同比-3.69%），归母净利2.63亿（+130.8%），但ROE仅3.57%（六家最低）<\/li>\n<li><strong>关键数据<\/strong>：<\/li>\n<li>营收173.36亿（-3.69%）<\/li>\n<li>归母净利2.63亿（+130.8%）——低基数反弹（2024年仅1.14亿，较2023年5.49亿暴跌80%）<\/li>\n<li>ROE 3.57%（六家最低）<\/li>\n<li>总资产156.08亿（-7.26%）<\/li>\n<li><strong>可应用性思考<\/strong>：一心堂是六家中盈利能力最弱的公司，低基数效应导致报表增速虚高；扣非ROE仅~2.8%，说明主业经营回报极差（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-4\">2. 门店与渠道<\/h3>\n<ul>\n<li><strong>来源<\/strong>：一心堂2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a><\/li>\n<li><strong>核心内容<\/strong>：全直营11,112家门店，覆盖10个省份，云南占比49.32%（5,480家）。唯一坚持全直营的上市连锁药店。<\/li>\n<li><strong>关键数据<\/strong>：<\/li>\n<li>直营门店11,112家（无加盟）<\/li>\n<li>云南5,480家（49.32%），高度依赖西南市场<\/li>\n<li>覆盖10个省份<\/li>\n<li><strong>可应用性思考<\/strong>：全直营模式管理统一性更好，有利于O2O合作的一致性；但盈利严重不足说明模式效率亟待提升（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-5\">3. 线上/O2O业务<\/h3>\n<ul>\n<li><strong>来源<\/strong>：一心堂2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a>P17<\/li>\n<li><strong>核心内容<\/strong>：新零售+19.16%，即时零售占线上77.48%为六家最高，私域\"一心到家\"+101%<\/li>\n<li><strong>关键数据<\/strong>：<\/li>\n<li>新零售增速+19.16%<\/li>\n<li>即时零售占线上77.48%<\/li>\n<li>私域平台\"一心到家\"+101%<\/li>\n<li>线上占营收~7%（六家中较低）<\/li>\n<li><strong>可应用性思考<\/strong>：一心堂专注即时零售场景是差异化打法；私域+101%的增速显示其尝试降低对美团/饿了么的依赖，但基数较低（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-6\">二、行业报道中的增量动态<\/h2>\n<h3 id=\"doc-heading-7\">4. 一心堂全直营模式的效率困境<\/h3>\n<ul>\n<li><strong>来源<\/strong>：连锁药房2025年财报对比分析报告<\/li>\n<li><strong>日期<\/strong>：2026-05<\/li>\n<li><strong>核心内容<\/strong>：一心堂Q3扣非净利仅994万，Q4直接亏损-1,159万。经营利润极度微薄，稍有波动就亏损。全直营11,112家门店的固定成本沉重。<\/li>\n<li><strong>关键数据<\/strong>：<\/li>\n<li>Q1扣非净利15,678万 → Q2 8,642万 → Q3 994万 → Q4 -1,159万<\/li>\n<li>零售毛利率37.27%（+1.06pct），居六家第三，不差<\/li>\n<li>批发业务萎缩-7.5%，毛利率仅8.85%<\/li>\n<li><strong>可应用性思考<\/strong>：一心堂的毛利率不差（37.27%），问题在于全直营模式的高固定成本压垮了净利润。如果能通过O2O提升单店产出，盈利弹性可能较大（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-8\">5. 一心堂在行业关店潮中的选择<\/h3>\n<ul>\n<li><strong>来源<\/strong>：连锁药店行业增量新闻动态_2025-2026<\/li>\n<li><strong>日期<\/strong>：2025-2026<\/li>\n<li><strong>核心内容<\/strong>：头部连锁关闭约1,000家门店\"止血\"，但一心堂未明确披露关店数。全直营模式下调整门店的沉没成本更高。<\/li>\n<li><strong>可应用性思考<\/strong>：一心堂全直营模式在行业下行期的灵活性不如加盟模式，关店成本更高（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-9\">三、公开检索补充信息（2026-06-08核验）<\/h2>\n<blockquote>\n<p><strong>说明<\/strong>：以下信息已按公开公告、公司<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>、<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">主流财经报道<\/a>和监管/信用公示转引补充。未在公告或主流公开材料中找到明确披露的事项，按“官方公开材料未列示明确信息；仅保留已披露事实”处理，不做判断。（仅推测）<\/p>\n<\/blockquote>\n<h3 id=\"doc-heading-10\">6. 一心堂2026年Q1业绩情况<\/h3>\n<p>| 发布时间 | 发布主体 | 事件摘要 | 影响判断 | 来源 |（仅推测）\n|:---|:---|:---|:---|:---|\n| 2026-04-29 | 一心堂药业集团股份有限公司 | 2026年Q1营业收入44.34亿元，同比-6.99%；归母净利润1.76亿元，同比+9.83%；扣非归母净利润1.64亿元，同比+4.58%；经营活动现金净流入7.13亿元，同比+45.52%；毛利率33.09%。 | 收入端仍承压，但利润和现金流修复，说明门店调改、控费和毛利率改善对利润端已有支撑；对医药即时零售平台而言，一心堂仍是区域强势供给方，但增长质量优先于规模扩张。 | 一心堂2026年第一季度报告（<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">巨潮资讯网<\/a>，2026-04-29）；<a href=\"https://www.ebscn.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">光大证券<\/a>2026-05-01点评；中证智能财讯/<a href=\"https://www.eastmoney.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">东方财富<\/a>2026-05-01 |<\/p>\n<h3 id=\"doc-heading-11\">7. 一心堂与美团/饿了么/医药服务平台的具体合作动态<\/h3>\n<p>| 发布时间 | 发布主体 | 事件摘要 | 影响判断 | 来源 |（仅推测）\n|:---|:---|:---|:---|:---|\n| 2026-04 | 一心堂 | 2025<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>披露，公司依托“一心到家”等自营平台与第三方平台，打通“线上下单—门店自提/配送到家”的新零售闭环；官方公开材料未列示该字段；仅保留已披露事实2026年与美团、饿了么或具体医药服务平台的新签约/专项合作事件。 | 可确认一心堂继续采用“自营私域+第三方平台入驻”的新零售路径；但不能把第三方平台直接等同于美团/饿了么/医药服务平台的新增合作，以<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>或平台新闻为准。 | 一心堂2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a>；<a href=\"https://www.yidiandian.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">第一药店财智<\/a>/<a href=\"https://xueqiu.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">雪球<\/a>转引<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>内容（2026-04-28）；本次公开检索未见具体平台合作公告 |<\/p>\n<h3 id=\"doc-heading-12\">8. “一心到家”私域平台运营数据<\/h3>\n<p>| 发布时间 | 发布主体 | 事件摘要 | 影响判断 | 来源 |（仅推测）\n|:---|:---|:---|:---|:---|\n| 2026-04 | 一心堂 | 2025年新零售板块同比增长19.16%；即时零售渠道销售占线上业务77.48%；私域“一心到家”小程序渠道收入同比+101.42%。官方公开材料未列示该字段；仅保留已披露事实“一心到家”的GMV、订单量、用户数或复购率绝对值。 | “一心到家”增速高，说明私域承接能力提升；但因缺少GMV和用户数绝对值，当前只能判断增长方向，不能评估规模对美团/饿了么等公域平台的替代程度。 | 一心堂2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a>；<a href=\"https://www.yidiandian.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">第一药店财智<\/a>/<a href=\"https://xueqiu.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">雪球<\/a>转引<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>内容（2026-04-28）；<a href=\"https://www.ebscn.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">光大证券<\/a>2026-05-01点评 | （仅推测） |<\/p>\n<h3 id=\"doc-heading-13\">9. 门店调整/关店数量和计划<\/h3>\n<p>| 发布时间 | 发布主体 | 事件摘要 | 影响判断 | 来源 |（仅推测）\n|:---|:---|:---|:---|:---|\n| 2026-04 | 一心堂 | 截至2025年底，公司直营门店11,112家，同比净减少386家；截至2026年3月末门店11,021家，较2025年底净减少91家。 | 公司已从外延扩张转向存量优化，短期收入承压，但有利于降低低效门店拖累、提升单店产出。 | <a href=\"https://www.ebscn.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">光大证券<\/a>2026-05-01点评；一心堂2025年年度报告；一心堂2026年第一季度报告 |\n| 2026-04 | 一心堂 | 2025年已完成1000多家门店调改；2026年计划再调改4000多家。公司计划70%门店转型泛健康全品类大药房，30%为专业药房（DTP、慢病管理）。 | 门店调改是2026年核心经营变量；若执行顺利，可能提升非药占比、客流和坪效，但短期费用与执行风险建议持续跟踪观察。 | <a href=\"https://www.yidiandian.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">第一药店财智<\/a>/<a href=\"https://xueqiu.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">雪球<\/a>转引<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>内容（2026-04-28）；<a href=\"https://www.ebscn.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">光大证券<\/a>2026-05-01点评 | （仅推测） |<\/p>\n<h3 id=\"doc-heading-14\">10. 监管处罚/合规事件<\/h3>\n<p>| 发布时间 | 发布主体 | 事件摘要 | 影响判断 | 来源 |（仅推测）\n|:---|:---|:---|:---|:---|\n| 2025-10 | 德钦县医疗保障局/信用公示转引 | 一心堂德钦河香中路连锁店因超量开药、未核验参保人医保凭证、无处方销售处方药等，被责令退回医保基金1,246.65元并罚款2,493.30元。 | 医保合规仍是连锁药店经营风险；对一心堂而言，处方药、医保结算和门店执行一致性需要加强。 | <a href=\"https://www.baidu.com/s?wd=%E3%80%8A%E4%B8%AD%E5%9B%BD%E7%A7%91%E6%8A%80%E6%8A%95%E8%B5%84%E3%80%8B/%E6%90%9C%E7%8B%90%E8%BD%AC%E5%BC%95%E4%BF%A1%E7%94%A8%E4%B8%AD%E5%9B%BD%EF%BC%88%E4%BA%91%E5%8D%97%C2%B7%E6%98%AD%E9%80%9A%EF%BC%89%E8%A1%8C%E6%94%BF%E5%A4%84%E7%BD%9A%E4%BF%A1%E6%81%AF%EF%BC%8C2025-10-25\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">《中国科技投资》/搜狐转引信用中国（云南·昭通）行政处罚信息，2025-10-25<\/a> |\n| 2025-08至2025-09 | 各地医保部门/媒体转引 | 昆明晋宁、楚雄、施甸等地一心堂门店因超量销售处方药、违规纳入医保结算等问题被追回医保基金或处罚。 | 合规事件具有多点发生特征，可能影响医保资质、处方药销售和区域监管关注度。 | 搜狐《中国科技投资》2025-10-25；<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a>转引都市现场2025-09-20 | （仅推测） |\n| 2024-05 | <a href=\"https://www.nhsa.gov.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">国家医保局<\/a>基金监管司 | <a href=\"https://www.nhsa.gov.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">国家医保局<\/a>曾就部分门店串换药品、超量开药、代为结算等问题约谈一心堂；公司自查退回违规医保基金共计1070余万元。 | 说明一心堂医保合规问题并非单一门店偶发，后续需要持续跟踪整改和处罚披露。 | 搜狐《中国科技投资》2025-10-25；<a href=\"https://news.qq.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">腾讯新闻<\/a>/读创财经2025-12-21转引 |<\/p>\n<h3 id=\"doc-heading-15\">11. 2026年业务布局和战略调整<\/h3>\n<p>| 发布时间 | 发布主体 | 事件摘要 | 影响判断 | 来源 |（仅推测）\n|:---|:---|:---|:---|:---|\n| 2026-04 | 一心堂 | 2026年公司非药业务进入“规模化复制”阶段，目标是提升非药品类销售占比；以非药业务为切入点，构建“药品+服务+生活方式”一体化生态，推动门店从“药房”向“健康生活空间”升级。 | 一心堂2026年战略重心从单纯药品零售转向泛健康与专业药房双轨，可能改善毛利和客流结构。 | 一心堂2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a>；<a href=\"https://www.yidiandian.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">第一药店财智<\/a>/<a href=\"https://xueqiu.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">雪球<\/a>转引<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>内容（2026-04-28） | （仅推测） |\n| 2026-04 | 一心堂 | 公司规划70%门店转型泛健康全品类大药房，30%为专业药房（DTP、慢病管理）；泛健康三大支柱包括保健食品、医疗器械、泛健康（美妆/个护/母婴/潮玩）。 | 对即时零售合作的意义在于：非药和泛健康品类更适合高频近场履约，可能提高线上订单结构弹性。 | <a href=\"https://www.ebscn.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">光大证券<\/a>2026-05-01点评；一心堂2025年年度报告 | （仅推测） |\n| 2025-08 | 一心堂 | 公司于2025年5月在香港成立联营企业一心堂柏安国际有限公司，定位跨境业务核心平台，计划构建“智能采购—高效物流—数据赋能”的国际化供应链体系。 | 跨境供应链可能成为泛健康、非药和自营商品供给补充，但短期对即时零售医药业务的贡献建议持续跟踪后续财报验证。 | 一心堂2025年半<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a>（<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">巨潮资讯网<\/a>，2025-08-30） | （仅推测） |<\/p>\n<hr />\n<p><em>信息溯源：资料来源包括：一心堂2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a>（002727.SZ）、《连锁药房2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">财报<\/a>对比分析报告》、《连锁药店行业增量新闻动态_2025-2026》；本次补充新增一心堂2026年第一<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">季度报告<\/a>（<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">巨潮资讯网<\/a>，2026-04-29）、<a href=\"https://www.ebscn.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">光大证券<\/a>《一心堂2025<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>和2026年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">一季报<\/a>点评》（2026-05-01）、<a href=\"https://www.yidiandian.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">第一药店财智<\/a>转引<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>内容（2026-04-28）、一心堂2025年半<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a>（<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">巨潮资讯网<\/a>，2025-08-30）、以及搜狐/新浪/腾讯等对监管处罚或信用公示信息的转引。<\/em><\/p>","rawText":"﻿# 一心堂 · 新闻动态（2025-2026） 引用级别：✅可供研判参考 资料基础：行业研究报告、券商研报、机构观点、分析师判断、主观解释、预测或推演结论，公告，财报。 更新时间：2026-06-08 信息来源：公司年报、2026年第一季度报告、行业报道、券商研报、监管/信用公示转引 声明：本次已补充公开检索结果；财务数据优先采用一心堂公告/巨潮资讯网披露，合作动态、私域运营、门店调改、监管处罚等采用公司公告、主流媒体和监管/信用公示转引。未见官方披露的事项明确标注“官方公开材料未列示明确信息；仅保留已披露事实”。 一句话定位 本文定位为一心堂 · 新闻动态的新闻动态资料，主要事件有业绩变化、门店调整、O2O运营、平台合作、监管合规和区域扩张。 一、2025年报核心数据 1. 营收与利润 来源**：一心堂2025年年度报告（002727.SZ） 日期**：2026-04 核心内容**：一心堂2025年营收173.36亿（同比-3.69%），归母净利2.63亿（+130.8%），但ROE仅3.57%（六家最低） 关键数据**： 营收173.36亿（-3.69%） 归母净利2.63亿（+130.8%）——低基数反弹（2024年仅1.14亿，较2023年5.49亿暴跌80%） ROE 3.57%（六家最低） 总资产156.08亿（-7.26%） 可应用性思考**：一心堂是六家中盈利能力最弱的公司，低基数效应导致报表增速虚高；扣非ROE仅~2.8%，说明主业经营回报极差（仅推测） 2. 门店与渠道 来源**：一心堂2025年年度报告 核心内容**：全直营11,112家门店，覆盖10个省份，云南占比49.32%（5,480家）。唯一坚持全直营的上市连锁药店。 关键数据**： 直营门店11,112家（无加盟） 云南5,480家（49.32%），高度依赖西南市场 覆盖10个省份 可应用性思考**：全直营模式管理统一性更好，有利于O2O合作的一致性；但盈利严重不足说明模式效率亟待提升（仅推测） 3. 线上/O2O业务 来源**：一心堂2025年年度报告P17 核心内容**：新零售+19.16%，即时零售占线上77.48%为六家最高，私域\"一心到家\"+101% 关键数据**： 新零售增速+19.16% 即时零售占线上77.48% 私域平台\"一心到家\"+101% 线上占营收~7%（六家中较低） 可应用性思考**：一心堂专注即时零售场景是差异化打法；私域+101%的增速显示其尝试降低对美团/饿了么的依赖，但基数较低（仅推测） 二、行业报道中的增量动态 4. 一心堂全直营模式的效率困境 来源**：连锁药房2025年财报对比分析报告 日期**：2026-05 核心内容**：一心堂Q3扣非净利仅994万，Q4直接亏损-1,159万。经营利润极度微薄，稍有波动就亏损。全直营11,112家门店的固定成本沉重。 关键数据**： Q1扣非净利15,678万 → Q2 8,642万 → Q3 994万 → Q4 -1,159万 零售毛利率37.27%（+1.06pct），居六家第三，不差 批发业务萎缩-7.5%，毛利率仅8.85% 可应用性思考**：一心堂的毛利率不差（37.27%），问题在于全直营模式的高固定成本压垮了净利润。如果能通过O2O提升单店产出，盈利弹性可能较大（仅推测） 5. 一心堂在行业关店潮中的选择 来源**：连锁药店行业增量新闻动态_2025-2026 日期**：2025-2026 核心内容**：头部连锁关闭约1,000家门店\"止血\"，但一心堂未明确披露关店数。全直营模式下调整门店的沉没成本更高。 可应用性思考**：一心堂全直营模式在行业下行期的灵活性不如加盟模式，关店成本更高（仅推测） 三、公开检索补充信息（2026-06-08核验） 说明**：以下信息已按公开公告、公司年报、主流财经报道和监管/信用公示转引补充。未在公告或主流公开材料中找到明确披露的事项，按“官方公开材料未列示明确信息；仅保留已披露事实”处理，不做判断。（仅推测） 6. 一心堂2026年Q1业绩情况 发布时间 发布主体 事件摘要 影响判断 来源 （仅推测） :--- :--- :--- :--- :--- 2026-04-29 一心堂药业集团股份有限公司 2026年Q1营业收入44.34亿元，同比-6.99%；归母净利润1.76亿元，同比+9.83%；扣非归母净利润1.64亿元，同比+4.58%；经营活动现金净流入7.13亿元，同比+45.52%；毛利率33.09%。 收入端仍承压，但利润和现金流修复，说明门店调改、控费和毛利率改善对利润端已有支撑；对医药即时零售平台而言，一心堂仍是区域强势供给方，但增长质量优先于规模扩张。 一心堂2026年第一季度报告（巨潮资讯网，2026-04-29）；光大证券2026-05-01点评；中证智能财讯/东方财富2026-05-01 7. 一心堂与美团/饿了么/医药服务平台的具体合作动态 发布时间 发布主体 事件摘要 影响判断 来源 （仅推测） :--- :--- :--- :--- :--- 2026-04 一心堂 2025年报披露，公司依托“一心到家”等自营平台与第三方平台，打通“线上下单—门店自提/配送到家”的新零售闭环；官方公开材料未列示该字段；仅保留已披露事实2026年与美团、饿了么或具体医药服务平台的新签约/专项合作事件。 可确认一心堂继续采用“自营私域+第三方平台入驻”的新零售路径；但不能把第三方平台直接等同于美团/饿了么/医药服务平台的新增合作，以公司公告或平台新闻为准。 一心堂2025年年度报告；第一药店财智/雪球转引年报内容（2026-04-28）；本次公开检索未见具体平台合作公告 8. “一心到家”私域平台运营数据 发布时间 发布主体 事件摘要 影响判断 来源 （仅推测） :--- :--- :--- :--- :--- 2026-04 一心堂 2025年新零售板块同比增长19.16%；即时零售渠道销售占线上业务77.48%；私域“一心到家”小程序渠道收入同比+101.42%。官方公开材料未列示该字段；仅保留已披露事实“一心到家”的GMV、订单量、用户数或复购率绝对值。 “一心到家”增速高，说明私域承接能力提升；但因缺少GMV和用户数绝对值，当前只能判断增长方向，不能评估规模对美团/饿了么等公域平台的替代程度。 一心堂2025年年度报告；第一药店财智/雪球转引年报内容（2026-04-28）；光大证券2026-05-01点评 （仅推测） 9. 门店调整/关店数量和计划 发布时间 发布主体 事件摘要 影响判断 来源 （仅推测） :--- :--- :--- :--- :--- 2026-04 一心堂 截至2025年底，公司直营门店11,112家，同比净减少386家；截至2026年3月末门店11,021家，较2025年底净减少91家。 公司已从外延扩张转向存量优化，短期收入承压，但有利于降低低效门店拖累、提升单店产出。 光大证券2026-05-01点评；一心堂2025年年度报告；一心堂2026年第一季度报告 2026-04 一心堂 2025年已完成1000多家门店调改；2026年计划再调改4000多家。公司计划70%门店转型泛健康全品类大药房，30%为专业药房（DTP、慢病管理）。 门店调改是2026年核心经营变量；若执行顺利，可能提升非药占比、客流和坪效，但短期费用与执行风险建议持续跟踪观察。 第一药店财智/雪球转引年报内容（2026-04-28）；光大证券2026-05-01点评 （仅推测） 10. 监管处罚/合规事件 发布时间 发布主体 事件摘要 影响判断 来源 （仅推测） :--- :--- :--- :--- :--- 2025-10 德钦县医疗保障局/信用公示转引 一心堂德钦河香中路连锁店因超量开药、未核验参保人医保凭证、无处方销售处方药等，被责令退回医保基金1,246.65元并罚款2,493.30元。 医保合规仍是连锁药店经营风险；对一心堂而言，处方药、医保结算和门店执行一致性需要加强。 《中国科技投资》/搜狐转引信用中国（云南·昭通）行政处罚信息，2025-10-25 2025-08至2025-09 各地医保部门/媒体转引 昆明晋宁、楚雄、施甸等地一心堂门店因超量销售处方药、违规纳入医保结算等问题被追回医保基金或处罚。 合规事件具有多点发生特征，可能影响医保资质、处方药销售和区域监管关注度。 搜狐《中国科技投资》2025-10-25；新浪财经转引都市现场2025-09-20 （仅推测） 2024-05 国家医保局基金监管司 国家医保局曾就部分门店串换药品、超量开药、代为结算等问题约谈一心堂；公司自查退回违规医保基金共计1070余万元。 说明一心堂医保合规问题并非单一门店偶发，后续需要持续跟踪整改和处罚披露。 搜狐《中国科技投资》2025-10-25；腾讯新闻/读创财经2025-12-21转引 11. 2026年业务布局和战略调整 发布时间 发布主体 事件摘要 影响判断 来源 （仅推测） :--- :--- :--- :--- :--- 2026-04 一心堂 2026年公司非药业务进入“规模化复制”阶段，目标是提升非药品类销售占比；以非药业务为切入点，构建“药品+服务+生活方式”一体化生态，推动门店从“药房”向“健康生活空间”升级。 一心堂2026年战略重心从单纯药品零售转向泛健康与专业药房双轨，可能改善毛利和客流结构。 一心堂2025年年度报告；第一药店财智/雪球转引年报内容（2026-04-28） （仅推测） 2026-04 一心堂 公司规划70%门店转型泛健康全品类大药房，30%为专业药房（DTP、慢病管理）；泛健康三大支柱包括保健食品、医疗器械、泛健康（美妆/个护/母婴/潮玩）。 对即时零售合作的意义在于：非药和泛健康品类更适合高频近场履约，可能提高线上订单结构弹性。 光大证券2026-05-01点评；一心堂2025年年度报告 （仅推测） 2025-08 一心堂 公司于2025年5月在香港成立联营企业一心堂柏安国际有限公司，定位跨境业务核心平台，计划构建“智能采购—高效物流—数据赋能”的国际化供应链体系。 跨境供应链可能成为泛健康、非药和自营商品供给补充，但短期对即时零售医药业务的贡献建议持续跟踪后续财报验证。 一心堂2025年半年度报告（巨潮资讯网，2025-08-30） （仅推测） 信息溯源：资料来源包括：一心堂2025年年度报告（002727.SZ）、《连锁药房2025年财报对比分析报告》、《连锁药店行业增量新闻动态_2025-2026》；本次补充新增一心堂2026年第一季度报告（巨潮资讯网，2026-04-29）、光大证券《一心堂2025年报和2026年一季报点评》（2026-05-01）、第一药店财智转引年报内容（2026-04-28）、一心堂2025年半年度报告（巨潮资讯网，2025-08-30）、以及搜狐/新浪/腾讯等对监管处罚或信用公示信息的转引。*","headings":[{"level":2,"text":"一句话定位","anchor":"doc-heading-1"},{"level":2,"text":"一、2025年报核心数据","anchor":"doc-heading-2"},{"level":3,"text":"1. 营收与利润","anchor":"doc-heading-3"},{"level":3,"text":"2. 门店与渠道","anchor":"doc-heading-4"},{"level":3,"text":"3. 线上/O2O业务","anchor":"doc-heading-5"},{"level":2,"text":"二、行业报道中的增量动态","anchor":"doc-heading-6"},{"level":3,"text":"4. 一心堂全直营模式的效率困境","anchor":"doc-heading-7"},{"level":3,"text":"5. 一心堂在行业关店潮中的选择","anchor":"doc-heading-8"},{"level":2,"text":"三、公开检索补充信息（2026-06-08核验）","anchor":"doc-heading-9"},{"level":3,"text":"6. 一心堂2026年Q1业绩情况","anchor":"doc-heading-10"},{"level":3,"text":"7. 一心堂与美团/饿了么/医药服务平台的具体合作动态","anchor":"doc-heading-11"},{"level":3,"text":"8. “一心到家”私域平台运营数据","anchor":"doc-heading-12"},{"level":3,"text":"9. 门店调整/关店数量和计划","anchor":"doc-heading-13"},{"level":3,"text":"10. 监管处罚/合规事件","anchor":"doc-heading-14"},{"level":3,"text":"11. 2026年业务布局和战略调整","anchor":"doc-heading-15"}],"outgoing":[]},{"id":"doc-ff9ca01a47c8","title":"一心堂-结构化摘要","path":"02-连锁药店/一心堂/一心堂-结构化摘要.md","stem":"一心堂-结构化摘要","module":"02-连锁药店","entity":"一心堂","contentType":"综合分析","isIndex":false,"isGovernance":false,"summary":"﻿# 一心堂 - 结构化摘要","learningTakeaway":"本文帮助你理解一心堂 - 结构化摘要的结构化摘要资料，核心关注财务指标、O2O能力、门店网络、平台合作和合作机会判断。阅读后可以重点掌握：行业规模、平台竞争、财报指标、研报观点、新闻动态；主要帮助解决“这篇资料讲什么、关键事实是什么、后续应从哪些角度继续核验/阅读”的问题。","lastUpdated":"2026-06-08","citationStatus":"可供研判参考","html":"<p>﻿# 一心堂 - 结构化摘要<\/p>\n<blockquote>\n<p>引用级别：✅可供研判参考\n资料基础：行业研究报告、券商研报、机构观点、分析师判断、主观解释、预测或推演结论，公告，财报。<\/p>\n<p>整合周期：2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>\n基于：一心堂2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a> / 连锁药房2025年财报对比分析报告 / 行业公开信息\n最后更新：2026-06-08<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"doc-heading-1\">一句话定位<\/h2>\n<p>本文定位为一心堂 - 结构化摘要的结构化摘要资料，核心关注财务指标、O2O能力、门店网络、平台合作和合作机会判断。<\/p>\n<h2 id=\"doc-heading-2\">关键数据仪表盘<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">维度<\/th>\n<th style=\"text-align: left;\">最新数据<\/th>\n<th style=\"text-align: left;\">趋势<\/th>\n<th style=\"text-align: left;\">数据截止日<\/th>\n<th style=\"text-align: left;\">来源<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">营业收入<\/td>\n<td style=\"text-align: left;\">173.36亿元<\/td>\n<td style=\"text-align: left;\">↓-3.69% YoY<\/td>\n<td style=\"text-align: left;\">2025年<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>P7<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">归母净利润<\/td>\n<td style=\"text-align: left;\">2.63亿元<\/td>\n<td style=\"text-align: left;\">↑+130.8%（低基数）<\/td>\n<td style=\"text-align: left;\">2025年<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>P7<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">ROE<\/td>\n<td style=\"text-align: left;\">3.57%<\/td>\n<td style=\"text-align: left;\">↑+2.07pct（仍为六家最低）<\/td>\n<td style=\"text-align: left;\">2025年<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>P8<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">直营门店数<\/td>\n<td style=\"text-align: left;\">11,112家<\/td>\n<td style=\"text-align: left;\">—<\/td>\n<td style=\"text-align: left;\">2025年末<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>P14<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">零售毛利率<\/td>\n<td style=\"text-align: left;\">37.27%<\/td>\n<td style=\"text-align: left;\">↑+1.06pct<\/td>\n<td style=\"text-align: left;\">2025年<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>P20<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">批发毛利率<\/td>\n<td style=\"text-align: left;\">8.85%<\/td>\n<td style=\"text-align: left;\">↓-1.64pct<\/td>\n<td style=\"text-align: left;\">2025年<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>P20<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">新零售增速<\/td>\n<td style=\"text-align: left;\">+19.16%<\/td>\n<td style=\"text-align: left;\">↑<\/td>\n<td style=\"text-align: left;\">2025年<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>P17<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">即时零售占线上<\/td>\n<td style=\"text-align: left;\">77.48%<\/td>\n<td style=\"text-align: left;\">—<\/td>\n<td style=\"text-align: left;\">2025年<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>P17<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">私域\"一心到家\"增速<\/td>\n<td style=\"text-align: left;\">+101%<\/td>\n<td style=\"text-align: left;\">↑（低基数）<\/td>\n<td style=\"text-align: left;\">2025年<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>P17<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">云南门店占比<\/td>\n<td style=\"text-align: left;\">49.32%（5,480家）<\/td>\n<td style=\"text-align: left;\">—<\/td>\n<td style=\"text-align: left;\">2025年末<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>P14<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"doc-heading-3\">核心观点（5条）<\/h2>\n<ol>\n<li>\n<p><strong>全直营模式的双面性<\/strong>：11,112家全直营门店是六家中唯一无加盟的，品控和毛利率可控（37.27%居第三），但固定成本沉重导致ROE仅3.57%为六家最低。<\/p>\n<\/li>\n<li>\n<p><strong>低基数反弹掩盖真实困境<\/strong>：归母净利+130.8%看似亮眼，但2024年仅1.14亿（较2023年5.49亿暴跌80%），扣非净利~1.60亿，净利率仅0.9%。Q3扣非994万、Q4亏损-1,159万，经营极度微薄。<\/p>\n<\/li>\n<li>\n<p><strong>即时零售占比最高但线上占比最低的矛盾<\/strong>：即时零售占线上77.48%为六家最高，说明一心堂线上几乎全是即时零售；但线上仅占营收~7%，远低于健之佳29.7%，说明线上化整体进程滞后。<\/p>\n<\/li>\n<li>\n<p><strong>私域路线是差异化尝试<\/strong>：\"一心到家\"+101%说明一心堂在尝试降低对美团/饿了么的依赖，走私域路线。但+101%的基数较低，私域能否真正替代平台渠道有待观察。<\/p>\n<\/li>\n<li>\n<p><strong>高度依赖西南市场<\/strong>：云南5,480家门店占比49.32%，区域集中度极高。这对医药即时零售平台在西南市场的覆盖密度是有利条件，但在华东/华南的一心堂覆盖较弱。<\/p>\n<\/li>\n<\/ol>\n<h2 id=\"doc-heading-4\">重要结论<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">结论<\/th>\n<th style=\"text-align: left;\">置信度<\/th>\n<th style=\"text-align: left;\">依据<\/th>\n<th style=\"text-align: left;\">变量<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">一心堂是O2O平台议价能力最弱的连锁药店<\/td>\n<td style=\"text-align: left;\">高<\/td>\n<td style=\"text-align: left;\">ROE 3.57%最低+营收负增长+全直营高固定成本<\/td>\n<td style=\"text-align: left;\">如果O2O带来显著增量，议价能力可能改善<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">全直营模式在行业下行期的灵活性不如加盟模式<\/td>\n<td style=\"text-align: left;\">中<\/td>\n<td style=\"text-align: left;\">关店成本高，Q3-Q4经营恶化<\/td>\n<td style=\"text-align: left;\">如果通过O2O提升单店产出，弹性较大<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">一心堂线上化进程滞后于行业<\/td>\n<td style=\"text-align: left;\">高<\/td>\n<td style=\"text-align: left;\">线上占比~7% vs 健之佳29.7%、老百姓~14%<\/td>\n<td style=\"text-align: left;\">私域\"一心到家\"+101%可能改变趋势<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">一心堂在西南市场的覆盖密度是O2O合作的优势<\/td>\n<td style=\"text-align: left;\">高<\/td>\n<td style=\"text-align: left;\">云南5,480家+覆盖10省<\/td>\n<td style=\"text-align: left;\">西南市场O2O需求密度可能低于一线城市<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"doc-heading-5\">关键时间线<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">时间<\/th>\n<th style=\"text-align: left;\">事件<\/th>\n<th style=\"text-align: left;\">数据/影响<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">2025年全年<\/td>\n<td style=\"text-align: left;\">营收173.36亿(-3.69%)，归母净利2.63亿(+130.8%)<\/td>\n<td style=\"text-align: left;\">低基数反弹，真实经营水平仍弱<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2025年Q3<\/td>\n<td style=\"text-align: left;\">扣非净利仅994万<\/td>\n<td style=\"text-align: left;\">经营利润接近归零<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2025年Q4<\/td>\n<td style=\"text-align: left;\">扣非净利-1,159万<\/td>\n<td style=\"text-align: left;\">季度亏损<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2025年全年<\/td>\n<td style=\"text-align: left;\">新零售+19.16%，即时零售占线上77.48%<\/td>\n<td style=\"text-align: left;\">线上业务以即时零售为主<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2025年全年<\/td>\n<td style=\"text-align: left;\">私域\"一心到家\"+101%<\/td>\n<td style=\"text-align: left;\">尝试降低平台依赖<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2026-04<\/td>\n<td style=\"text-align: left;\">2025<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>发布<\/td>\n<td style=\"text-align: left;\">ROE仅3.57%，行业最低<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"doc-heading-6\">与即时零售的关联<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">维度<\/th>\n<th style=\"text-align: left;\">一心堂现状<\/th>\n<th style=\"text-align: left;\">与医药服务平台即时零售的关系<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">O2O上线情况<\/td>\n<td style=\"text-align: left;\">未单独披露O2O销售额，新零售+19.16%<\/td>\n<td style=\"text-align: left;\">O2O增量可能是其营收改善的关键抓手<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">私域策略<\/td>\n<td style=\"text-align: left;\">\"一心到家\"+101%，即时零售占线上77.48%<\/td>\n<td style=\"text-align: left;\">【推理】一心堂可能在降低对美团/饿了么的依赖，医药即时零售平台可作为替代平台<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">全直营优势<\/td>\n<td style=\"text-align: left;\">品控统一、管理一致<\/td>\n<td style=\"text-align: left;\">【推理】全直营模式下O2O合作标准更统一，不需要协调加盟商<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">区域覆盖<\/td>\n<td style=\"text-align: left;\">云南5,480家(49.32%)，覆盖10省<\/td>\n<td style=\"text-align: left;\">【推理】西南市场覆盖密度高，是医药服务平台在该区域O2O合作的优质对象<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">盈利困境<\/td>\n<td style=\"text-align: left;\">ROE 3.57%最低，Q3-Q4接近/进入亏损<\/td>\n<td style=\"text-align: left;\">【推理】一心堂对线上增量流量的渴求最强，合作意愿可能最高<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"doc-heading-7\">信息溯源清单<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">信息<\/th>\n<th style=\"text-align: left;\">来源<\/th>\n<th style=\"text-align: left;\">时间<\/th>\n<th style=\"text-align: left;\">链接/备注<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">营收173.36亿-3.69%<\/td>\n<td style=\"text-align: left;\">一心堂2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>P7<\/td>\n<td style=\"text-align: left;\">2026-04<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>原文<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">归母净利2.63亿+130.8%<\/td>\n<td style=\"text-align: left;\">一心堂2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>P7<\/td>\n<td style=\"text-align: left;\">2026-04<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>原文<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">ROE 3.57%<\/td>\n<td style=\"text-align: left;\">一心堂2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>P8<\/td>\n<td style=\"text-align: left;\">2026-04<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>原文<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">门店11,112家全直营<\/td>\n<td style=\"text-align: left;\">一心堂2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>P14<\/td>\n<td style=\"text-align: left;\">2026-04<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>原文<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">零售毛利率37.27%+1.06pct<\/td>\n<td style=\"text-align: left;\">一心堂2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>P20<\/td>\n<td style=\"text-align: left;\">2026-04<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>原文<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">新零售+19.16%<\/td>\n<td style=\"text-align: left;\">一心堂2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>P17<\/td>\n<td style=\"text-align: left;\">2026-04<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>原文<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">即时零售占线上77.48%<\/td>\n<td style=\"text-align: left;\">一心堂2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>P17<\/td>\n<td style=\"text-align: left;\">2026-04<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>原文<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">私域\"一心到家\"+101%<\/td>\n<td style=\"text-align: left;\">一心堂2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>P17<\/td>\n<td style=\"text-align: left;\">2026-04<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>原文<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Q3扣非994万/Q4-1,159万<\/td>\n<td style=\"text-align: left;\">一心堂2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>P8<\/td>\n<td style=\"text-align: left;\">2026-04<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>原文<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","rawText":"﻿# 一心堂 - 结构化摘要 引用级别：✅可供研判参考 资料基础：行业研究报告、券商研报、机构观点、分析师判断、主观解释、预测或推演结论，公告，财报。 整合周期：2025年年报 基于：一心堂2025年年度报告 / 连锁药房2025年财报对比分析报告 / 行业公开信息 最后更新：2026-06-08 一句话定位 本文定位为一心堂 - 结构化摘要的结构化摘要资料，核心关注财务指标、O2O能力、门店网络、平台合作和合作机会判断。 关键数据仪表盘 维度 最新数据 趋势 数据截止日 来源 :--- :--- :--- :--- :--- 营业收入 173.36亿元 ↓-3.69% YoY 2025年 年报P7 归母净利润 2.63亿元 ↑+130.8%（低基数） 2025年 年报P7 ROE 3.57% ↑+2.07pct（仍为六家最低） 2025年 年报P8 直营门店数 11,112家 — 2025年末 年报P14 零售毛利率 37.27% ↑+1.06pct 2025年 年报P20 批发毛利率 8.85% ↓-1.64pct 2025年 年报P20 新零售增速 +19.16% ↑ 2025年 年报P17 即时零售占线上 77.48% — 2025年 年报P17 私域\"一心到家\"增速 +101% ↑（低基数） 2025年 年报P17 云南门店占比 49.32%（5,480家） — 2025年末 年报P14 核心观点（5条） 1. **全直营模式的双面性**：11,112家全直营门店是六家中唯一无加盟的，品控和毛利率可控（37.27%居第三），但固定成本沉重导致ROE仅3.57%为六家最低。 2. **低基数反弹掩盖真实困境**：归母净利+130.8%看似亮眼，但2024年仅1.14亿（较2023年5.49亿暴跌80%），扣非净利~1.60亿，净利率仅0.9%。Q3扣非994万、Q4亏损-1,159万，经营极度微薄。 3. **即时零售占比最高但线上占比最低的矛盾**：即时零售占线上77.48%为六家最高，说明一心堂线上几乎全是即时零售；但线上仅占营收~7%，远低于健之佳29.7%，说明线上化整体进程滞后。 4. **私域路线是差异化尝试**：\"一心到家\"+101%说明一心堂在尝试降低对美团/饿了么的依赖，走私域路线。但+101%的基数较低，私域能否真正替代平台渠道有待观察。 5. **高度依赖西南市场**：云南5,480家门店占比49.32%，区域集中度极高。这对医药即时零售平台在西南市场的覆盖密度是有利条件，但在华东/华南的一心堂覆盖较弱。 重要结论 结论 置信度 依据 变量 :--- :--- :--- :--- 一心堂是O2O平台议价能力最弱的连锁药店 高 ROE 3.57%最低+营收负增长+全直营高固定成本 如果O2O带来显著增量，议价能力可能改善 （仅推测） 全直营模式在行业下行期的灵活性不如加盟模式 中 关店成本高，Q3-Q4经营恶化 如果通过O2O提升单店产出，弹性较大 （仅推测） 一心堂线上化进程滞后于行业 高 线上占比~7% vs 健之佳29.7%、老百姓~14% 私域\"一心到家\"+101%可能改变趋势 （仅推测） 一心堂在西南市场的覆盖密度是O2O合作的优势 高 云南5,480家+覆盖10省 西南市场O2O需求密度可能低于一线城市 （仅推测） 关键时间线 时间 事件 数据/影响 :--- :--- :--- 2025年全年 营收173.36亿(-3.69%)，归母净利2.63亿(+130.8%) 低基数反弹，真实经营水平仍弱 2025年Q3 扣非净利仅994万 经营利润接近归零 2025年Q4 扣非净利-1,159万 季度亏损 2025年全年 新零售+19.16%，即时零售占线上77.48% 线上业务以即时零售为主 2025年全年 私域\"一心到家\"+101% 尝试降低平台依赖 2026-04 2025年报发布 ROE仅3.57%，行业最低 与即时零售的关联 维度 一心堂现状 与医药服务平台即时零售的关系 :--- :--- :--- O2O上线情况 未单独披露O2O销售额，新零售+19.16% O2O增量可能是其营收改善的关键抓手 （仅推测） 私域策略 \"一心到家\"+101%，即时零售占线上77.48% 【推理】一心堂可能在降低对美团/饿了么的依赖，医药即时零售平台可作为替代平台 （仅推测） 全直营优势 品控统一、管理一致 【推理】全直营模式下O2O合作标准更统一，不需要协调加盟商 区域覆盖 云南5,480家(49.32%)，覆盖10省 【推理】西南市场覆盖密度高，是医药服务平台在该区域O2O合作的优质对象 盈利困境 ROE 3.57%最低，Q3-Q4接近/进入亏损 【推理】一心堂对线上增量流量的渴求最强，合作意愿可能最高 （仅推测） 信息溯源清单 信息 来源 时间 链接/备注 :--- :--- :--- :--- 营收173.36亿-3.69% 一心堂2025年年报P7 2026-04 年报原文 归母净利2.63亿+130.8% 一心堂2025年年报P7 2026-04 年报原文 ROE 3.57% 一心堂2025年年报P8 2026-04 年报原文 门店11,112家全直营 一心堂2025年年报P14 2026-04 年报原文 零售毛利率37.27%+1.06pct 一心堂2025年年报P20 2026-04 年报原文 新零售+19.16% 一心堂2025年年报P17 2026-04 年报原文 即时零售占线上77.48% 一心堂2025年年报P17 2026-04 年报原文 私域\"一心到家\"+101% 一心堂2025年年报P17 2026-04 年报原文 Q3扣非994万/Q4-1,159万 一心堂2025年年报P8 2026-04 年报原文","headings":[{"level":2,"text":"一句话定位","anchor":"doc-heading-1"},{"level":2,"text":"关键数据仪表盘","anchor":"doc-heading-2"},{"level":2,"text":"核心观点（5条）","anchor":"doc-heading-3"},{"level":2,"text":"重要结论","anchor":"doc-heading-4"},{"level":2,"text":"关键时间线","anchor":"doc-heading-5"},{"level":2,"text":"与即时零售的关联","anchor":"doc-heading-6"},{"level":2,"text":"信息溯源清单","anchor":"doc-heading-7"}],"outgoing":[]},{"id":"doc-93f68f13d877","title":"健之佳-新闻动态_2025-2026","path":"02-连锁药店/健之佳/健之佳-新闻动态_2025-2026.md","stem":"健之佳-新闻动态_2025-2026","module":"02-连锁药店","entity":"健之佳","contentType":"公开新闻","isIndex":false,"isGovernance":false,"summary":"﻿# 健之佳 · 新闻动态（2025-2026）","learningTakeaway":"本文帮助你理解健之佳 · 新闻动态的新闻动态资料，主要事件有业绩变化、门店调整、O2O运营、平台合作、监管合规和区域扩张。阅读后可以重点掌握：行业规模、平台竞争、财报指标、研报观点、新闻动态；主要帮助解决“这篇资料讲什么、关键事实是什么、后续应从哪些角度继续核验/阅读”的问题。","lastUpdated":"","citationStatus":"可供研判参考","html":"<p>﻿# 健之佳 · 新闻动态（2025-2026）<\/p>\n<blockquote>\n<p>引用级别：✅可供研判参考\n资料基础：行业研究报告、券商研报、机构观点、分析师判断、主观解释、预测或推演结论，公告，财报。<\/p>\n<p>更新时间：2026-06-08\n信息来源：公司<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>、2026年第一<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">季度报告<\/a>、行业报道、券商研报、监管/信用公示转引\n声明：本次已补充公开检索结果；财务数据优先采用健之佳公告/<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">巨潮资讯网<\/a>披露，线上/O2O、便利店+药房、战略调整等采用公司<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>、业绩说明会/投资者关系活动记录和主流公开报道。未见官方披露的事项明确标注“官方公开材料未列示明确信息；仅保留已披露事实”。<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"doc-heading-1\">一句话定位<\/h2>\n<p>本文定位为健之佳 · 新闻动态的新闻动态资料，主要事件有业绩变化、门店调整、O2O运营、平台合作、监管合规和区域扩张。<\/p>\n<h2 id=\"doc-heading-2\">一、2025年报核心数据<\/h2>\n<h3 id=\"doc-heading-3\">1. 营收与利润<\/h3>\n<ul>\n<li><strong>来源<\/strong>：健之佳医药连锁集团股份有限公司2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a>（605266.SH）<\/li>\n<li><strong>日期<\/strong>：2026-04<\/li>\n<li><strong>核心内容<\/strong>：健之佳2025年营收89.21亿（-3.90%，历年首次下降），归母净利1.48亿（+15.63%）。在营收下降的情况下实现利润增长，靠的是\"毛利率+0.34pct + 期间费用-4.99%\"的双重改善。<\/li>\n<li><strong>关键数据<\/strong>：<\/li>\n<li>营收89.21亿（-3.90%，历年首次下降）<\/li>\n<li>归母净利1.48亿（+15.63%）<\/li>\n<li>扣非净利1.38亿（+11.22%）<\/li>\n<li>ROE 5.50%（+0.97pct）<\/li>\n<li>经营现金流11.70亿（+129.85%）<\/li>\n<li>总资产97.54亿（-8.18%）<\/li>\n<li><strong>可应用性思考<\/strong>：健之佳\"营收下降但利润增长\"的模式说明\"提质增效\"策略见效，但也暴露出增长天花板——门店仅5,421家，规模最小（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-4\">2. 线上业务——六家之最<\/h3>\n<ul>\n<li><strong>来源<\/strong>：健之佳2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a>P24<\/li>\n<li><strong>核心内容<\/strong>：线上占比29.7%为六家最高，O2O门店覆盖率92.57%为六家最高。但B2C收入已经负增长（-4.14%），自营平台也在下滑（-1.25%），只有O2O还在增长（+9.31%）<\/li>\n<li><strong>关键数据<\/strong>：<\/li>\n<\/ul>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">渠道<\/th>\n<th style=\"text-align: left;\">2025收入(亿)<\/th>\n<th style=\"text-align: left;\">增速<\/th>\n<th style=\"text-align: left;\">占营收比<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">第三方O2O<\/td>\n<td style=\"text-align: left;\">12.09<\/td>\n<td style=\"text-align: left;\">+9.31%<\/td>\n<td style=\"text-align: left;\">13.56%<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">第三方B2C<\/td>\n<td style=\"text-align: left;\">6.72<\/td>\n<td style=\"text-align: left;\">-4.14%<\/td>\n<td style=\"text-align: left;\">7.53%<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">自营平台<\/td>\n<td style=\"text-align: left;\">7.69<\/td>\n<td style=\"text-align: left;\">-1.25%<\/td>\n<td style=\"text-align: left;\">8.62%<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">线上合计<\/td>\n<td style=\"text-align: left;\">26.50<\/td>\n<td style=\"text-align: left;\">+2.49%<\/td>\n<td style=\"text-align: left;\">29.70%<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>可应用性思考<\/strong>：健之佳线上占比29.7%说明其对O2O平台依赖度极高，平台议价能力强；B2C负增长+自营平台下滑意味着O2O几乎是其唯一的线上增长引擎（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-5\">3. 门店——主动收缩<\/h3>\n<ul>\n<li><strong>来源<\/strong>：健之佳2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a>P23-24<\/li>\n<li><strong>核心内容<\/strong>：期末门店5,421家（净减65家），是六家中唯一主动净减门店的公司。自建49家，关闭114家。医保门店占比96.83%为六家最高。<\/li>\n<li><strong>关键数据<\/strong>：<\/li>\n<li>期末门店5,421家（净减65家）<\/li>\n<li>自建49家，关闭114家<\/li>\n<li>医保门店占比96.83%<\/li>\n<li>O2O门店覆盖率92.57%<\/li>\n<li>O2O夜间业务增长超15%<\/li>\n<li><strong>可应用性思考<\/strong>：健之佳\"关店提质\"的策略是务实之举，医保门店占比96.83%说明其与医保支付体系绑定最深，这对DTP+即时零售的线上医保支付场景有参考价值（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-6\">4. 便利店+药房差异化定位<\/h3>\n<ul>\n<li><strong>来源<\/strong>：健之佳2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a>P30<\/li>\n<li><strong>核心内容<\/strong>：健之佳是六家中唯一实行\"便利店+药房\"双业态的。便利零售3.51亿（-11.76%），毛利率仅15.25%。<\/li>\n<li><strong>关键数据<\/strong>：<\/li>\n<li>医药零售80.46亿（-2.41%），毛利率35.62%<\/li>\n<li>便利零售3.51亿（-11.76%），毛利率15.25%<\/li>\n<li>医药批发0.10亿（+199.99%），毛利率21.66%<\/li>\n<li><strong>可应用性思考<\/strong>：便利店+药房模式与医药即时零售平台的非药秒送（非药店商家）定位有相似之处，健之佳的经验值得研究（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-7\">二、行业报道中的增量动态<\/h2>\n<h3 id=\"doc-heading-8\">5. 健之佳O2O高占比的双刃剑效应<\/h3>\n<ul>\n<li><strong>来源<\/strong>：连锁药房2025年财报对比分析报告<\/li>\n<li><strong>日期<\/strong>：2026-05<\/li>\n<li><strong>核心内容<\/strong>：健之佳线上占比29.7%为行业最高，但B2C已开始负增长（-4.14%），自营平台也在下滑（-1.25%），只有O2O还在增长（+9.31%）。线上业务对平台的依赖性在加深。<\/li>\n<li><strong>可应用性思考<\/strong>：健之佳O2O依赖度加深是平台合作的利好，但也意味着一旦平台佣金提高，健之佳的利润空间将被严重侵蚀（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-9\">6. 健之佳在行业关店潮中的选择<\/h3>\n<ul>\n<li><strong>来源<\/strong>：连锁药店行业增量新闻动态_2025-2026<\/li>\n<li><strong>日期<\/strong>：2025-2026<\/li>\n<li><strong>核心内容<\/strong>：健之佳是六家中唯一主动净减门店（-65家）的公司，体现\"关店提质\"的务实态度。经营现金流+129.85%说明关店止血策略有效。（仅推测）<\/li>\n<li><strong>可应用性思考<\/strong>：主动关店说明健之佳在规模与效率之间选择了效率，这种\"小而美\"策略在O2O合作中可能意味着质量优先（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-10\">三、公开检索补充信息（2026-06-08核验）<\/h2>\n<blockquote>\n<p><strong>说明<\/strong>：以下信息已按公开公告、公司<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>、业绩说明会/投资者关系活动记录、<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">主流财经报道<\/a>和监管/信用公示转引补充。未在公告或主流公开材料中找到明确披露的事项，按“官方公开材料未列示明确信息；仅保留已披露事实”处理，不做判断。（仅推测）<\/p>\n<\/blockquote>\n<h3 id=\"doc-heading-11\">7. 健之佳2026年Q1业绩情况<\/h3>\n<p>| 发布时间 | 发布主体 | 事件摘要 | 影响判断 | 来源 |（仅推测）\n|:---|:---|:---|:---|:---|\n| 2026-04-28 | 健之佳医药连锁集团股份有限公司 | 2026年Q1营业收入20.91亿元，同比-8.86%；期间费用7.01亿元，同比-8.33%；归母净利润3,594.97万元，同比+7.23%；扣非归母净利润3,295.59万元，同比+6.35%；经营活动现金流净额1.62亿元，同比-9.98%。公司说明通过供应链优化带动综合毛利率提升0.45个百分点，并通过降租控费稳定业绩。 | 收入仍受医保支付、消费环境和行业竞争影响下滑，但利润端小幅修复，说明“提质增效、控费、商品转型”短期有效；对医药即时零售平台而言，健之佳仍是线上化程度高、O2O基础较强的区域连锁。 | 健之佳2026年第一<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">季度报告<\/a>（<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">巨潮资讯网<\/a>/<a href=\"https://data.eastmoney.com/notices/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">东方财富公告<\/a>，2026-04-28）；<a href=\"https://www.stockstar.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">证券之星<\/a>/<a href=\"https://news.qq.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">腾讯新闻<\/a><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">一季报<\/a>简析（2026-04-29） |<\/p>\n<h3 id=\"doc-heading-12\">8. 健之佳与美团/饿了么/医药服务平台的具体合作动态<\/h3>\n<p>| 发布时间 | 发布主体 | 事件摘要 | 影响判断 | 来源 |（仅推测）\n|:---|:---|:---|:---|:---|\n| 2026-04 | 健之佳 | 2025<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>和2026年业绩说明会披露，公司线上业务依托实体药房网络及专业服务优势，通过第三方平台O2O、第三方B2C和自营O2O平台“佳E购”实现“网订店取”“网订店送”，并提供在线问诊、用药指导、健康管理等服务；官方公开材料未列示该字段；仅保留已披露事实2026年与美团、饿了么或具体医药服务平台的新签约/专项合作事件。 | 可确认健之佳继续采用“第三方平台O2O+B2C+自营佳E购”的全渠道路径；但不能把第三方平台直接等同于美团/饿了么/具体医药服务平台的新合作，以<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>或平台新闻为准。 | 健之佳2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a>；健之佳2025年度暨2026年第一季度业绩说明会投资者关系活动记录表（2026-04-28）；<a href=\"https://www.stockstar.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">证券之星<\/a>/<a href=\"https://news.qq.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">腾讯新闻<\/a>转引问答 |<\/p>\n<h3 id=\"doc-heading-13\">9. 健之佳便利店+药房模式的最新战略调整<\/h3>\n<p>| 发布时间 | 发布主体 | 事件摘要 | 影响判断 | 来源 |（仅推测）\n|:---|:---|:---|:---|:---|\n| 2026-04-28 | 健之佳 | 2026年度“提质增效重回报”行动方案提出，公司坚持“家庭医生、社区顾问、健康好邻居”定位，在社区专业药房、便利店实体服务网络基础上，坚定中西成药核心业务，同时向健康品类、专业化服务和全渠道营销深入转型；强化非医保依赖药品、非药业务和全渠道专业服务，以对冲医保收入下降影响。 | 便利店+药房模式不再只是便利零售补充，而是与非药、健康品类、专业服务共同构成门店转型抓手；该模式可提升近场高频品类和即时履约适配度，但便利零售低毛利问题建议持续跟踪关注。 | 健之佳2026年度“提质增效重回报”行动方案公告（2026-04-28）；健之佳2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a> | （仅推测） |\n| 2026-04-28 | 健之佳 | 行动方案提到加强薇诺娜、可复美、芙医研等产品营销，塑造“健之佳”贴牌商品组合，并开发、引进、推广欧洲LSI系列独家产品；在中西成药、保健食品方面强化品牌战略合作，探索直接进口、跨境购等方式引入海外优质商品。 | 便利店+药房的差异化重点从“便利商品”转向“健康与美丽、非药、独家/贴牌商品和跨境商品”，有助于改善毛利结构和线上差异化供给。 | <a href=\"https://www.baidu.com/s?wd=%E5%81%A5%E4%B9%8B%E4%BD%B32026%E5%B9%B4%E5%BA%A6%E2%80%9C%E6%8F%90%E8%B4%A8%E5%A2%9E%E6%95%88%E9%87%8D%E5%9B%9E%E6%8A%A5%E2%80%9D%E8%A1%8C%E5%8A%A8%E6%96%B9%E6%A1%88%E5%85%AC%E5%91%8A%EF%BC%882026-04-28%EF%BC%89\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">健之佳2026年度“提质增效重回报”行动方案公告（2026-04-28）<\/a> |<\/p>\n<h3 id=\"doc-heading-14\">10. 健之佳O2O夜间业务的具体数据和运营模式<\/h3>\n<p>| 发布时间 | 发布主体 | 事件摘要 | 影响判断 | 来源 |（仅推测）\n|:---|:---|:---|:---|:---|\n| 2026-04 | 健之佳 | 2025年第三方O2O收入12.09亿元，同比+9.31%，占营收13.56%；O2O门店覆盖率92.57%；<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>披露O2O夜间业务增长超15%。官方公开材料未列示该字段；仅保留已披露事实夜间订单量、夜间GMV、夜间订单占比或24小时门店绝对数的2025/2026最新统一口径。 | O2O仍是健之佳线上增长核心，夜间业务增长说明“延长服务时间+区域中心门店+即时履约”有增量价值；但缺少夜间绝对数据，暂不能评估夜间业务规模。 | 健之佳2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a>；健之佳2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a>摘要（<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">巨潮资讯网<\/a>，2026-04-28） |\n| 2026-04-28 | 健之佳 | 业绩说明会问答披露：第三方平台O2O通过布局区域中心门店、延长服务时间、提升供应链能力、细化门店层级管理拉动增长；自营O2O平台“佳E购”通过满足长尾商品需求和直播新模式拉动业绩。公司强调线上业务依托线下实体店网络、供应链、专业服务和品牌信任，无法单独计量净利率，也无法独立运作。 | 健之佳O2O运营模式本质是门店赋能型，而不是独立电商型；对平台合作的启示是，门店密度、夜间履约、专业服务和长尾供给比单纯低价更重要。 | 健之佳2025年度暨2026年第一季度业绩说明会投资者关系活动记录表（2026-04-28）；<a href=\"https://www.stockstar.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">证券之星<\/a>/<a href=\"https://news.qq.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">腾讯新闻<\/a>转引问答 |<\/p>\n<h3 id=\"doc-heading-15\">11. 健之佳涉及监管处罚/合规事件<\/h3>\n<p>| 发布时间 | 发布主体 | 事件摘要 | 影响判断 | 来源 |（仅推测）\n|:---|:---|:---|:---|:---|\n| 2025-01 | 昆明市医疗保障局/信用公示转引 | 云南健之佳连锁健康药房有限公司因将不属于医疗保障基金支付范围的医药费用纳入医保基金结算，被责令退回医保基金并处罚款；媒体转引金额为41,682.46元。 | 医保结算合规是健之佳的持续风险点，尤其在医保门店占比较高、O2O和处方相关服务扩张背景下，门店执行一致性和医保稽核系统建设重要性上升。 | <a href=\"https://www.baidu.com/s?wd=%E4%BF%A1%E7%94%A8%E4%B8%AD%E5%9B%BD%E8%A1%8C%E6%94%BF%E5%A4%84%E7%BD%9A%E4%BF%A1%E6%81%AF%E8%BD%AC%E5%BC%95%EF%BC%9B%E7%99%BE%E5%BA%A6%E5%81%A5%E5%BA%B7/%E5%B0%9A%E9%94%8B%E6%96%87%E7%AB%A0%EF%BC%882025%E5%B9%B4%E5%85%AC%E5%BC%80%E6%8A%A5%E9%81%93%EF%BC%89\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">信用中国行政处罚信息转引；百度健康/尚锋文章（2025年公开报道）<\/a> |\n| 2025-02 | 昆明市东川区医疗保障局/信用公示转引 | 云南健之佳连锁健康药房有限公司东川古铜路分店因将不属于医保基金支付范围的费用纳入医保结算、超量开药，被责令退回医保基金2,299.56元并处同额罚款。 | 处罚金额不大，但反映超量开药、医保支付范围管理是连锁药店高频合规风险；后续需关注是否影响门诊统筹、处方流转和线上医保支付合作。 | <a href=\"https://www.baidu.com/s?wd=%E4%BF%A1%E7%94%A8%E4%B8%AD%E5%9B%BD%E8%A1%8C%E6%94%BF%E5%A4%84%E7%BD%9A%E4%BF%A1%E6%81%AF%E8%BD%AC%E5%BC%95%EF%BC%9B%E7%99%BE%E5%BA%A6%E5%81%A5%E5%BA%B7/%E5%B0%9A%E9%94%8B%E6%96%87%E7%AB%A0%EF%BC%882025%E5%B9%B4%E5%85%AC%E5%BC%80%E6%8A%A5%E9%81%93%EF%BC%89\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">信用中国行政处罚信息转引；百度健康/尚锋文章（2025年公开报道）<\/a> |\n| 2026-04-28 | 健之佳 | 2026年度“提质增效重回报”行动方案提出，公司将完善医保、药监、卫健等合规操作制度和合规管控信息系统，推进医保稽核、处方强管控系统、药品追溯码全场景应用，并通过互联网医院和基层医疗机构“诊所+药店”应对门诊统筹和处方流转。 | 公司已把合规管控和处方强管控系统上升为2026经营重点，说明合规压力会直接影响业务模型和数字化投入。 | <a href=\"https://www.baidu.com/s?wd=%E5%81%A5%E4%B9%8B%E4%BD%B32026%E5%B9%B4%E5%BA%A6%E2%80%9C%E6%8F%90%E8%B4%A8%E5%A2%9E%E6%95%88%E9%87%8D%E5%9B%9E%E6%8A%A5%E2%80%9D%E8%A1%8C%E5%8A%A8%E6%96%B9%E6%A1%88%E5%85%AC%E5%91%8A%EF%BC%882026-04-28%EF%BC%89\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">健之佳2026年度“提质增效重回报”行动方案公告（2026-04-28）<\/a> | （仅推测） |<\/p>\n<h3 id=\"doc-heading-16\">12. 健之佳2026年新的业务布局和战略调整<\/h3>\n<p>| 发布时间 | 发布主体 | 事件摘要 | 影响判断 | 来源 |（仅推测）\n|:---|:---|:---|:---|:---|\n| 2026-04-28 | 健之佳 | 2026年度行动方案提出：放缓门店扩张速度，规划区域内“自建+收购”有序拓展；整改高亏损门店并迁址优化；细化门店管理，提升新店培育和收购整合效率，提高成熟店产出；加强员工专业能力和激励，提升人效。 | 2026年战略重心从规模扩张转向存量门店效率、亏损门店整改和人效提升，延续2025年“主动收缩、提质增效”逻辑。 | <a href=\"https://www.baidu.com/s?wd=%E5%81%A5%E4%B9%8B%E4%BD%B32026%E5%B9%B4%E5%BA%A6%E2%80%9C%E6%8F%90%E8%B4%A8%E5%A2%9E%E6%95%88%E9%87%8D%E5%9B%9E%E6%8A%A5%E2%80%9D%E8%A1%8C%E5%8A%A8%E6%96%B9%E6%A1%88%E5%85%AC%E5%91%8A%EF%BC%882026-04-28%EF%BC%89\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">健之佳2026年度“提质增效重回报”行动方案公告（2026-04-28）<\/a> |\n| 2026-04-28 | 健之佳 | 公司提出加强信息系统建设和数字化应用：医保稽核、处方强管控、药品追溯码全场景应用；引进并探索DeepSeek大模型在门店营运诊断、商品补货和周转效率、销量预测、服务质量和专业水准提升等场景的产业化运用。 | 数字化和AI应用将服务于门店精细化、合规和供应链效率，可能成为健之佳区别于传统药房的运营能力。 | <a href=\"https://www.baidu.com/s?wd=%E5%81%A5%E4%B9%8B%E4%BD%B32026%E5%B9%B4%E5%BA%A6%E2%80%9C%E6%8F%90%E8%B4%A8%E5%A2%9E%E6%95%88%E9%87%8D%E5%9B%9E%E6%8A%A5%E2%80%9D%E8%A1%8C%E5%8A%A8%E6%96%B9%E6%A1%88%E5%85%AC%E5%91%8A%EF%BC%882026-04-28%EF%BC%89\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">健之佳2026年度“提质增效重回报”行动方案公告（2026-04-28）<\/a> | （仅推测） |\n| 2026-04-28 | 健之佳 | 公司将通过与互联网医院合作争取医保平台处方流转，并依靠基层医疗机构“诊所+药店”开展门诊统筹业务；获取互联网医院执业许可证，支持统筹区内门诊统筹门店处方流转。 | 处方流转、门诊统筹和“诊所+药店”是2026年专业化服务布局重点，可能影响未来O2O处方药和医保支付场景。 | <a href=\"https://www.baidu.com/s?wd=%E5%81%A5%E4%B9%8B%E4%BD%B32026%E5%B9%B4%E5%BA%A6%E2%80%9C%E6%8F%90%E8%B4%A8%E5%A2%9E%E6%95%88%E9%87%8D%E5%9B%9E%E6%8A%A5%E2%80%9D%E8%A1%8C%E5%8A%A8%E6%96%B9%E6%A1%88%E5%85%AC%E5%91%8A%EF%BC%882026-04-28%EF%BC%89\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">健之佳2026年度“提质增效重回报”行动方案公告（2026-04-28）<\/a> | （仅推测） |<\/p>\n<hr />\n<p><em>信息溯源：资料来源包括：健之佳2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a>（605266.SH）、《连锁药房2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">财报<\/a>对比分析报告》、《连锁药店行业增量新闻动态_2025-2026》；本次补充新增健之佳2026年第一<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">季度报告<\/a>（<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">巨潮资讯网<\/a>/<a href=\"https://data.eastmoney.com/notices/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">东方财富公告<\/a>，2026-04-28）、健之佳2026年度“提质增效重回报”行动方案公告（2026-04-28）、健之佳2025年度暨2026年第一季度业绩说明会投资者关系活动记录表（2026-04-28）、健之佳2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年度报告<\/a>摘要（<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">巨潮资讯网<\/a>，2026-04-28）、以及信用中国行政处罚信息的媒体转引。<\/em><\/p>","rawText":"﻿# 健之佳 · 新闻动态（2025-2026） 引用级别：✅可供研判参考 资料基础：行业研究报告、券商研报、机构观点、分析师判断、主观解释、预测或推演结论，公告，财报。 更新时间：2026-06-08 信息来源：公司年报、2026年第一季度报告、行业报道、券商研报、监管/信用公示转引 声明：本次已补充公开检索结果；财务数据优先采用健之佳公告/巨潮资讯网披露，线上/O2O、便利店+药房、战略调整等采用公司年报、业绩说明会/投资者关系活动记录和主流公开报道。未见官方披露的事项明确标注“官方公开材料未列示明确信息；仅保留已披露事实”。 一句话定位 本文定位为健之佳 · 新闻动态的新闻动态资料，主要事件有业绩变化、门店调整、O2O运营、平台合作、监管合规和区域扩张。 一、2025年报核心数据 1. 营收与利润 来源**：健之佳医药连锁集团股份有限公司2025年年度报告（605266.SH） 日期**：2026-04 核心内容**：健之佳2025年营收89.21亿（-3.90%，历年首次下降），归母净利1.48亿（+15.63%）。在营收下降的情况下实现利润增长，靠的是\"毛利率+0.34pct + 期间费用-4.99%\"的双重改善。 关键数据**： 营收89.21亿（-3.90%，历年首次下降） 归母净利1.48亿（+15.63%） 扣非净利1.38亿（+11.22%） ROE 5.50%（+0.97pct） 经营现金流11.70亿（+129.85%） 总资产97.54亿（-8.18%） 可应用性思考**：健之佳\"营收下降但利润增长\"的模式说明\"提质增效\"策略见效，但也暴露出增长天花板——门店仅5,421家，规模最小（仅推测） 2. 线上业务——六家之最 来源**：健之佳2025年年度报告P24 核心内容**：线上占比29.7%为六家最高，O2O门店覆盖率92.57%为六家最高。但B2C收入已经负增长（-4.14%），自营平台也在下滑（-1.25%），只有O2O还在增长（+9.31%） 关键数据**： 渠道 2025收入(亿) 增速 占营收比 :--- :--- :--- :--- 第三方O2O 12.09 +9.31% 13.56% 第三方B2C 6.72 -4.14% 7.53% 自营平台 7.69 -1.25% 8.62% 线上合计 26.50 +2.49% 29.70% 可应用性思考**：健之佳线上占比29.7%说明其对O2O平台依赖度极高，平台议价能力强；B2C负增长+自营平台下滑意味着O2O几乎是其唯一的线上增长引擎（仅推测） 3. 门店——主动收缩 来源**：健之佳2025年年度报告P23-24 核心内容**：期末门店5,421家（净减65家），是六家中唯一主动净减门店的公司。自建49家，关闭114家。医保门店占比96.83%为六家最高。 关键数据**： 期末门店5,421家（净减65家） 自建49家，关闭114家 医保门店占比96.83% O2O门店覆盖率92.57% O2O夜间业务增长超15% 可应用性思考**：健之佳\"关店提质\"的策略是务实之举，医保门店占比96.83%说明其与医保支付体系绑定最深，这对DTP+即时零售的线上医保支付场景有参考价值（仅推测） 4. 便利店+药房差异化定位 来源**：健之佳2025年年度报告P30 核心内容**：健之佳是六家中唯一实行\"便利店+药房\"双业态的。便利零售3.51亿（-11.76%），毛利率仅15.25%。 关键数据**： 医药零售80.46亿（-2.41%），毛利率35.62% 便利零售3.51亿（-11.76%），毛利率15.25% 医药批发0.10亿（+199.99%），毛利率21.66% 可应用性思考**：便利店+药房模式与医药即时零售平台的非药秒送（非药店商家）定位有相似之处，健之佳的经验值得研究（仅推测） 二、行业报道中的增量动态 5. 健之佳O2O高占比的双刃剑效应 来源**：连锁药房2025年财报对比分析报告 日期**：2026-05 核心内容**：健之佳线上占比29.7%为行业最高，但B2C已开始负增长（-4.14%），自营平台也在下滑（-1.25%），只有O2O还在增长（+9.31%）。线上业务对平台的依赖性在加深。 可应用性思考**：健之佳O2O依赖度加深是平台合作的利好，但也意味着一旦平台佣金提高，健之佳的利润空间将被严重侵蚀（仅推测） 6. 健之佳在行业关店潮中的选择 来源**：连锁药店行业增量新闻动态_2025-2026 日期**：2025-2026 核心内容**：健之佳是六家中唯一主动净减门店（-65家）的公司，体现\"关店提质\"的务实态度。经营现金流+129.85%说明关店止血策略有效。（仅推测） 可应用性思考**：主动关店说明健之佳在规模与效率之间选择了效率，这种\"小而美\"策略在O2O合作中可能意味着质量优先（仅推测） 三、公开检索补充信息（2026-06-08核验） 说明**：以下信息已按公开公告、公司年报、业绩说明会/投资者关系活动记录、主流财经报道和监管/信用公示转引补充。未在公告或主流公开材料中找到明确披露的事项，按“官方公开材料未列示明确信息；仅保留已披露事实”处理，不做判断。（仅推测） 7. 健之佳2026年Q1业绩情况 发布时间 发布主体 事件摘要 影响判断 来源 （仅推测） :--- :--- :--- :--- :--- 2026-04-28 健之佳医药连锁集团股份有限公司 2026年Q1营业收入20.91亿元，同比-8.86%；期间费用7.01亿元，同比-8.33%；归母净利润3,594.97万元，同比+7.23%；扣非归母净利润3,295.59万元，同比+6.35%；经营活动现金流净额1.62亿元，同比-9.98%。公司说明通过供应链优化带动综合毛利率提升0.45个百分点，并通过降租控费稳定业绩。 收入仍受医保支付、消费环境和行业竞争影响下滑，但利润端小幅修复，说明“提质增效、控费、商品转型”短期有效；对医药即时零售平台而言，健之佳仍是线上化程度高、O2O基础较强的区域连锁。 健之佳2026年第一季度报告（巨潮资讯网/东方财富公告，2026-04-28）；证券之星/腾讯新闻一季报简析（2026-04-29） 8. 健之佳与美团/饿了么/医药服务平台的具体合作动态 发布时间 发布主体 事件摘要 影响判断 来源 （仅推测） :--- :--- :--- :--- :--- 2026-04 健之佳 2025年报和2026年业绩说明会披露，公司线上业务依托实体药房网络及专业服务优势，通过第三方平台O2O、第三方B2C和自营O2O平台“佳E购”实现“网订店取”“网订店送”，并提供在线问诊、用药指导、健康管理等服务；官方公开材料未列示该字段；仅保留已披露事实2026年与美团、饿了么或具体医药服务平台的新签约/专项合作事件。 可确认健之佳继续采用“第三方平台O2O+B2C+自营佳E购”的全渠道路径；但不能把第三方平台直接等同于美团/饿了么/具体医药服务平台的新合作，以公司公告或平台新闻为准。 健之佳2025年年度报告；健之佳2025年度暨2026年第一季度业绩说明会投资者关系活动记录表（2026-04-28）；证券之星/腾讯新闻转引问答 9. 健之佳便利店+药房模式的最新战略调整 发布时间 发布主体 事件摘要 影响判断 来源 （仅推测） :--- :--- :--- :--- :--- 2026-04-28 健之佳 2026年度“提质增效重回报”行动方案提出，公司坚持“家庭医生、社区顾问、健康好邻居”定位，在社区专业药房、便利店实体服务网络基础上，坚定中西成药核心业务，同时向健康品类、专业化服务和全渠道营销深入转型；强化非医保依赖药品、非药业务和全渠道专业服务，以对冲医保收入下降影响。 便利店+药房模式不再只是便利零售补充，而是与非药、健康品类、专业服务共同构成门店转型抓手；该模式可提升近场高频品类和即时履约适配度，但便利零售低毛利问题建议持续跟踪关注。 健之佳2026年度“提质增效重回报”行动方案公告（2026-04-28）；健之佳2025年年度报告 （仅推测） 2026-04-28 健之佳 行动方案提到加强薇诺娜、可复美、芙医研等产品营销，塑造“健之佳”贴牌商品组合，并开发、引进、推广欧洲LSI系列独家产品；在中西成药、保健食品方面强化品牌战略合作，探索直接进口、跨境购等方式引入海外优质商品。 便利店+药房的差异化重点从“便利商品”转向“健康与美丽、非药、独家/贴牌商品和跨境商品”，有助于改善毛利结构和线上差异化供给。 健之佳2026年度“提质增效重回报”行动方案公告（2026-04-28） 10. 健之佳O2O夜间业务的具体数据和运营模式 发布时间 发布主体 事件摘要 影响判断 来源 （仅推测） :--- :--- :--- :--- :--- 2026-04 健之佳 2025年第三方O2O收入12.09亿元，同比+9.31%，占营收13.56%；O2O门店覆盖率92.57%；年报披露O2O夜间业务增长超15%。官方公开材料未列示该字段；仅保留已披露事实夜间订单量、夜间GMV、夜间订单占比或24小时门店绝对数的2025/2026最新统一口径。 O2O仍是健之佳线上增长核心，夜间业务增长说明“延长服务时间+区域中心门店+即时履约”有增量价值；但缺少夜间绝对数据，暂不能评估夜间业务规模。 健之佳2025年年度报告；健之佳2025年年度报告摘要（巨潮资讯网，2026-04-28） 2026-04-28 健之佳 业绩说明会问答披露：第三方平台O2O通过布局区域中心门店、延长服务时间、提升供应链能力、细化门店层级管理拉动增长；自营O2O平台“佳E购”通过满足长尾商品需求和直播新模式拉动业绩。公司强调线上业务依托线下实体店网络、供应链、专业服务和品牌信任，无法单独计量净利率，也无法独立运作。 健之佳O2O运营模式本质是门店赋能型，而不是独立电商型；对平台合作的启示是，门店密度、夜间履约、专业服务和长尾供给比单纯低价更重要。 健之佳2025年度暨2026年第一季度业绩说明会投资者关系活动记录表（2026-04-28）；证券之星/腾讯新闻转引问答 11. 健之佳涉及监管处罚/合规事件 发布时间 发布主体 事件摘要 影响判断 来源 （仅推测） :--- :--- :--- :--- :--- 2025-01 昆明市医疗保障局/信用公示转引 云南健之佳连锁健康药房有限公司因将不属于医疗保障基金支付范围的医药费用纳入医保基金结算，被责令退回医保基金并处罚款；媒体转引金额为41,682.46元。 医保结算合规是健之佳的持续风险点，尤其在医保门店占比较高、O2O和处方相关服务扩张背景下，门店执行一致性和医保稽核系统建设重要性上升。 信用中国行政处罚信息转引；百度健康/尚锋文章（2025年公开报道） 2025-02 昆明市东川区医疗保障局/信用公示转引 云南健之佳连锁健康药房有限公司东川古铜路分店因将不属于医保基金支付范围的费用纳入医保结算、超量开药，被责令退回医保基金2,299.56元并处同额罚款。 处罚金额不大，但反映超量开药、医保支付范围管理是连锁药店高频合规风险；后续需关注是否影响门诊统筹、处方流转和线上医保支付合作。 信用中国行政处罚信息转引；百度健康/尚锋文章（2025年公开报道） 2026-04-28 健之佳 2026年度“提质增效重回报”行动方案提出，公司将完善医保、药监、卫健等合规操作制度和合规管控信息系统，推进医保稽核、处方强管控系统、药品追溯码全场景应用，并通过互联网医院和基层医疗机构“诊所+药店”应对门诊统筹和处方流转。 公司已把合规管控和处方强管控系统上升为2026经营重点，说明合规压力会直接影响业务模型和数字化投入。 健之佳2026年度“提质增效重回报”行动方案公告（2026-04-28） （仅推测） 12. 健之佳2026年新的业务布局和战略调整 发布时间 发布主体 事件摘要 影响判断 来源 （仅推测） :--- :--- :--- :--- :--- 2026-04-28 健之佳 2026年度行动方案提出：放缓门店扩张速度，规划区域内“自建+收购”有序拓展；整改高亏损门店并迁址优化；细化门店管理，提升新店培育和收购整合效率，提高成熟店产出；加强员工专业能力和激励，提升人效。 2026年战略重心从规模扩张转向存量门店效率、亏损门店整改和人效提升，延续2025年“主动收缩、提质增效”逻辑。 健之佳2026年度“提质增效重回报”行动方案公告（2026-04-28） 2026-04-28 健之佳 公司提出加强信息系统建设和数字化应用：医保稽核、处方强管控、药品追溯码全场景应用；引进并探索DeepSeek大模型在门店营运诊断、商品补货和周转效率、销量预测、服务质量和专业水准提升等场景的产业化运用。 数字化和AI应用将服务于门店精细化、合规和供应链效率，可能成为健之佳区别于传统药房的运营能力。 健之佳2026年度“提质增效重回报”行动方案公告（2026-04-28） （仅推测） 2026-04-28 健之佳 公司将通过与互联网医院合作争取医保平台处方流转，并依靠基层医疗机构“诊所+药店”开展门诊统筹业务；获取互联网医院执业许可证，支持统筹区内门诊统筹门店处方流转。 处方流转、门诊统筹和“诊所+药店”是2026年专业化服务布局重点，可能影响未来O2O处方药和医保支付场景。 健之佳2026年度“提质增效重回报”行动方案公告（2026-04-28） （仅推测） 信息溯源：资料来源包括：健之佳2025年年度报告（605266.SH）、《连锁药房2025年财报对比分析报告》、《连锁药店行业增量新闻动态_2025-2026》；本次补充新增健之佳2026年第一季度报告（巨潮资讯网/东方财富公告，2026-04-28）、健之佳2026年度“提质增效重回报”行动方案公告（2026-04-28）、健之佳2025年度暨2026年第一季度业绩说明会投资者关系活动记录表（2026-04-28）、健之佳2025年年度报告摘要（巨潮资讯网，2026-04-28）、以及信用中国行政处罚信息的媒体转引。*","headings":[{"level":2,"text":"一句话定位","anchor":"doc-heading-1"},{"level":2,"text":"一、2025年报核心数据","anchor":"doc-heading-2"},{"level":3,"text":"1. 营收与利润","anchor":"doc-heading-3"},{"level":3,"text":"2. 线上业务——六家之最","anchor":"doc-heading-4"},{"level":3,"text":"3. 门店——主动收缩","anchor":"doc-heading-5"},{"level":3,"text":"4. 便利店+药房差异化定位","anchor":"doc-heading-6"},{"level":2,"text":"二、行业报道中的增量动态","anchor":"doc-heading-7"},{"level":3,"text":"5. 健之佳O2O高占比的双刃剑效应","anchor":"doc-heading-8"},{"level":3,"text":"6. 健之佳在行业关店潮中的选择","anchor":"doc-heading-9"},{"level":2,"text":"三、公开检索补充信息（2026-06-08核验）","anchor":"doc-heading-10"},{"level":3,"text":"7. 健之佳2026年Q1业绩情况","anchor":"doc-heading-11"},{"level":3,"text":"8. 健之佳与美团/饿了么/医药服务平台的具体合作动态","anchor":"doc-heading-12 -link\">年报<\/a>P24<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">线上占营收<\/td>\n<td style=\"text-align: left;\">29.70%<\/td>\n<td style=\"text-align: left;\">行业最高<\/td>\n<td style=\"text-align: left;\">2025年<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>P24<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">O2O夜间业务增长<\/td>\n<td style=\"text-align: left;\">&gt;15%<\/td>\n<td style=\"text-align: left;\">↑<\/td>\n<td style=\"text-align: left;\">2025年<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>P25<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">医药零售毛利率<\/td>\n<td style=\"text-align: left;\">35.62%<\/td>\n<td style=\"text-align: left;\">+0.34pct<\/td>\n<td style=\"text-align: left;\">2025年<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>P30<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">便利零售收入<\/td>\n<td style=\"text-align: left;\">3.51亿元<\/td>\n<td style=\"text-align: left;\">↓-11.76%<\/td>\n<td style=\"text-align: left;\">2025年<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>P30<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"doc-heading-3\">核心观点（5条）<\/h2>\n<ol>\n<li>\n<p><strong>O2O依赖度行业最高，且在加深<\/strong>：线上占比29.7%远超同行（益丰~12%、老百姓~14%），O2O收入12.09亿占线上45.6%。B2C和自营平台都在萎缩，O2O几乎是唯一增长的线上渠道，对平台依赖持续加深。<\/p>\n<\/li>\n<li>\n<p><strong>\"营收下降+利润增长\"的提质增效模式<\/strong>：营收-3.9%但利润+15.6%，靠的是\"毛利率+0.34pct + 期间费用-4.99%\"的双重改善。经营现金流+129.85%说明\"关店止血\"策略有效。但这种模式的增长天花板很低。（仅推测）<\/p>\n<\/li>\n<li>\n<p><strong>便利店+药房的差异化定位值得研究<\/strong>：六家中唯一双业态运营。便利零售3.51亿（-11.76%），毛利率仅15.25%，说明便利店业务在萎缩。但\"药房+便利店\"的场景协同逻辑对医药服务平台非药秒送有参考价值。<\/p>\n<\/li>\n<li>\n<p><strong>医保门店占比96.83%为六家最高<\/strong>：与医保支付体系绑定最深，如果线上医保支付持续扩围，健之佳是最大受益者之一。这也是DTP+即时零售场景的关键基础设施。（仅推测）<\/p>\n<\/li>\n<li>\n<p><strong>主动净减门店——六家中最务实<\/strong>：净减65家门店是主动选择而非被动结果。114家关闭 vs 49家新建，说明健之佳在用\"关低效店+开精选店\"策略优化网络。（仅推测）<\/p>\n<\/li>\n<\/ol>\n<h2 id=\"doc-heading-4\">重要结论<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">结论<\/th>\n<th style=\"text-align: left;\">置信度<\/th>\n<th style=\"text-align: left;\">依据<\/th>\n<th style=\"text-align: left;\">变量<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">健之佳是O2O依赖度最高的连锁药店<\/td>\n<td style=\"text-align: left;\">高<\/td>\n<td style=\"text-align: left;\">线上占比29.7%+O2O覆盖率92.57%+O2O是唯一增长的线上渠道<\/td>\n<td style=\"text-align: left;\">如果自营平台恢复增长，依赖度可能降低<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">O2O高占比正在稀释综合毛利率<\/td>\n<td style=\"text-align: left;\">中<\/td>\n<td style=\"text-align: left;\">老百姓案例证明线上/DTP对综合毛利率的稀释效应<\/td>\n<td style=\"text-align: left;\">健之佳零售毛利率+0.34pct，目前还未明显稀释<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">便利店+药房模式对即时零售有参考价值<\/td>\n<td style=\"text-align: left;\">中<\/td>\n<td style=\"text-align: left;\">双业态场景协同逻辑成立，但便利零售-11.76%<\/td>\n<td style=\"text-align: left;\">便利店业务如果持续萎缩，协同价值降低<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">健之佳是线上医保支付扩围的最大受益者之一<\/td>\n<td style=\"text-align: left;\">中<\/td>\n<td style=\"text-align: left;\">医保门店占比96.83%最高<\/td>\n<td style=\"text-align: left;\">取决于线上医保支付政策推进速度<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">\"关店提质\"模式的增长天花板很低<\/td>\n<td style=\"text-align: left;\">高<\/td>\n<td style=\"text-align: left;\">门店仅5,421家，规模最小+主动净减<\/td>\n<td style=\"text-align: left;\">如果O2O显著提升单店产出，天花板可提升<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"doc-heading-5\">关键时间线<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">时间<\/th>\n<th style=\"text-align: left;\">事件<\/th>\n<th style=\"text-align: left;\">数据/影响<\/th>\n<\/tr>\ ferrer\" class=\"external-link\">年报<\/a>P23<\/td>\n<td style=\"text-align: left;\">2026-04<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>原文<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">医保门店占比96.83%<\/td>\n<td style=\"text-align: left;\">健之佳2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>P24<\/td>\n<td style=\"text-align: left;\">2026-04<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>原文<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">O2O夜间业务增长&gt;15%<\/td>\n<td style=\"text-align: left;\">健之佳2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>P25<\/td>\n<td style=\"text-align: left;\">2026-04<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>原文<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","rawText":"﻿# 健之佳 - 结构化摘要 引用级别：✅可供研判参考 资料基础：行业研究报告、券商研报、机构观点、分析师判断、主观解释、预测或推演结论，公告，财报。 整合周期：2025年年报 基于：健之佳2025年年度报告 / 连锁药房2025年财报对比分析报告 / 行业公开信息 最后更新：2026-06-08 一句话定位 本文定位为健之佳 - 结构化摘要的结构化摘要资料，核心关注财务指标、O2O能力、门店网络、平台合作和合作机会判断。 关键数据仪表盘 维度 最新数据 趋势 数据截止日 来源 :--- :--- :--- :--- :--- 营业收入 89.21亿元 ↓-3.90% YoY（首次下降） 2025年 年报P6-7 归母净利润 1.48亿元 ↑+15.63% 2025年 年报P7 扣非净利 1.38亿元 ↑+11.22% 2025年 年报P7 ROE 5.50% ↑+0.97pct 2025年 年报P7 经营现金流 11.70亿元 ↑+129.85% 2025年 年报P7 门店数 5,421家 净减65家（唯一净减） 2025年末 年报P23 医保门店占比 96.83% — 2025年 年报P24 O2O门店覆盖率 92.57% 行业最高 2025年 年报P25 第三方O2O收入 12.09亿元 ↑+9.31% 2025年 年报P24 第三方B2C收入 6.72亿元 ↓-4.14% 2025年 年报P24 自营平台收入 7.69亿元 ↓-1.25% 2025年 年报P24 线上合计 26.50亿元 ↑+2.49% 2025年 年报P24 线上占营收 29.70% 行业最高 2025年 年报P24 O2O夜间业务增长 >15% ↑ 2025年 年报P25 医药零售毛利率 35.62% +0.34pct 2025年 年报P30 便利零售收入 3.51亿元 ↓-11.76% 2025年 年报P30 核心观点（5条） 1. **O2O依赖度行业最高，且在加深**：线上占比29.7%远超同行（益丰~12%、老百姓~14%），O2O收入12.09亿占线上45.6%。B2C和自营平台都在萎缩，O2O几乎是唯一增长的线上渠道，对平台依赖持续加深。 2. **\"营收下降+利润增长\"的提质增效模式**：营收-3.9%但利润+15.6%，靠的是\"毛利率+0.34pct + 期间费用-4.99%\"的双重改善。经营现金流+129.85%说明\"关店止血\"策略有效。但这种模式的增长天花板很低。（仅推测） 3. **便利店+药房的差异化定位值得研究**：六家中唯一双业态运营。便利零售3.51亿（-11.76%），毛利率仅15.25%，说明便利店业务在萎缩。但\"药房+便利店\"的场景协同逻辑对医药服务平台非药秒送有参考价值。 4. **医保门店占比96.83%为六家最高**：与医保支付体系绑定最深，如果线上医保支付持续扩围，健之佳是最大受益者之一。这也是DTP+即时零售场景的关键基础设施。（仅推测） 5. **主动净减门店——六家中最务实**：净减65家门店是主动选择而非被动结果。114家关闭 vs 49家新建，说明健之佳在用\"关低效店+开精选店\"策略优化网络。（仅推测） 重要结论 结论 置信度 依据 变量 :--- :--- :--- :--- 健之佳是O2O依赖度最高的连锁药店 高 线上占比29.7%+O2O覆盖率92.57%+O2O是唯一增长的线上渠道 如果自营平台恢复增长，依赖度可能降低 （仅推测） O2O高占比正在稀释综合毛利率 中 老百姓案例证明线上/DTP对综合毛利率的稀释效应 健之佳零售毛利率+0.34pct，目前还未明显稀释 便利店+药房模式对即时零售有参考价值 中 双业态场景协同逻辑成立，但便利零售-11.76% 便利店业务如果持续萎缩，协同价值降低 （仅推测） 健之佳是线上医保支付扩围的最大受益者之一 中 医保门店占比96.83%最高 取决于线上医保支付政策推进速度 \"关店提质\"模式的增长天花板很低 高 门店仅5,421家，规模最小+主动净减 如果O2O显著提升单店产出，天花板可提升 （仅推测） 关键时间线 时间 事件 数据/影响 :--- :--- :--- 2025年全年 营收89.21亿(-3.9%)，首次下降 行业下行+主动收缩 2025年全年 归母净利1.48亿(+15.6%) 降费提质见效 2025年全年 经营现金流11.70亿(+129.85%) 关店止血+费用控制 2025年全年 线上26.50亿(29.7%)，O2O 12.09亿(+9.31%) O2O依赖度加深 2025年全年 B2C 6.72亿(-4.14%)，自营7.69亿(-1.25%) 传统线上渠道萎缩 2025年全年 门店净减65家，关闭114家 主动关店提质 2025年全年 O2O夜间业务增长>15% 夜间即时零售场景有价值 2026-04 2025年报发布 \"小而美\"差异化选手 与即时零售的关联 维度 健之佳现状 与医药服务平台即时零售的关系 :--- :--- :--- O2O依赖度 线上占比29.7%最高，O2O覆盖率92.57%最高 【推理】健之佳对O2O平台的依赖最深，平台议价能力最强 O2O收入 12.09亿(+9.31%)，唯一增长的线上渠道 【推理】O2O是健之佳的生命线，医药服务平台可以作为其O2O渠道的补充/替代 医保门店 96.83%为六家最高 【推理】医保绑定最深，线上医保支付扩围是最大受益者 夜间O2O 夜间业务增长>15% 【推理】夜间即时零售是差异化场景，医药服务平台可探索夜间药房合作 便利店+药房 便利零售3.51亿(-11.76%) 【推理】便利店业务萎缩但场景协同逻辑仍在，与医药服务平台非药秒送有相似定位 门店规模 5,421家，六家最小 【推理】规模小但O2O覆盖率高，说明几乎全部门店已上线O2O 信息溯源清单 信息 来源 时间 链接/备注 :--- :--- :--- :--- 营收89.21亿-3.9% 健之佳2025年年报P6-7 2026-04 年报原文 归母净利1.48亿+15.63% 健之佳2025年年报P7 2026-04 年报原文 扣非净利1.38亿+11.22% 健之佳2025年年报P7 2026-04 年报原文 ROE 5.50% 健之佳2025年年报P7 2026-04 年报原文 经营现金流+129.85% 健之佳2025年年报P7 2026-04 年报原文 O2O收入12.09亿+9.31% 健之佳2025年年报P24 2026-04 年报原文 B2C收入6.72亿-4.14% 健之
