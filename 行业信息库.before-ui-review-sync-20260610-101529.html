5%90%8C%E4%B8%8A\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">同上<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">门店14,975家<\/td>\n<td style=\"text-align: left;\">老百姓2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a> [P21]<\/td>\n<td style=\"text-align: left;\">2026-04<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%E5%90%8C%E4%B8%8A\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">同上<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">商誉减值2.38亿<\/td>\n<td style=\"text-align: left;\">老百姓2025年<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a> [P8]<\/td>\n<td style=\"text-align: left;\">2026-04<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%E5%90%8C%E4%B8%8A\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">同上<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","rawText":"﻿# 老百姓大药房 - 结构化摘要 引用级别：✅可供研判参考 资料基础：行业研究报告、券商研报、机构观点、分析师判断、主观解释、预测或推演结论，公告，财报。 整合周期：2025年全年 基于：老百姓2025年年度报告 / 行业公开信息 最后更新：2026-06-08 一句话定位 本文定位为老百姓大药房 - 结构化摘要的结构化摘要资料，核心关注财务指标、O2O能力、门店网络、平台合作和合作机会判断。 关键数据仪表盘 维度 最新数据 趋势 数据截止日 来源 :--- :--- :--- :--- :--- 营业收入 222.37亿元 ↓-0.54% YoY 2025全年 年报[P8] 归母净利润 3.82亿元 ↓-26.44% YoY 2025全年 年报[P8] 调整后归母净利 6.20亿元 ↓-1.0% YoY 2025全年 年报[P8注] 扣非ROE ~5.6% ↓ 2025全年 年报[P9] 线上销售总额 31.2亿元 ↑+26.3% YoY 2025全年 年报[P22] 线上占比 ~14% ↑ 2025全年 计算（31.2/222.4） 综合毛利率 32.30% ↓-0.87pct 2025全年 年报[P23] 线下零售毛利率（不含DTP） 同比+0.6pct ↑ 2025全年 年报[P23] 门店总数 14,975家 ↑ 2025年末 年报[P21] 直营门店 9,732家 → 2025年末 年报[P21] 加盟门店 5,243家 ↑ 2025年末 年报[P21] O2O外卖服务门店 12,352家 ↑ 2025年末 年报[P22] 小程序累计用户 3,000万+ ↑+30% 2025年末 年报[P22] 商誉和土地减值 2.38亿元 一次性 2025全年 年报[P8] 经营现金流 31.43亿元 ↑+55.08% 2025全年 年报[P8] 核心观点（5条） 1. **线上增速六家最快，O2O是最激进的公司**：31.2亿线上销售在六家中绝对值最高（益丰29.93亿、健之佳26.50亿），26.3%增速也是最快。O2O门店12,352家，覆盖率高。老百姓是医药即时零售平台在商家端最重要的合作伙伴之一。 2. **利润下降是商誉减值集中爆发，而非经营恶化**：剔除2.38亿商誉和土地减值后，归母净利仅降1.0%。但商誉余额仍高，未来可能继续减值——这是老百姓区别于大参林和益丰的结构性风险。（仅推测） 3. **综合毛利率六家最低，但线下经营在改善**：32.30%的综合毛利率在六家中最低，但线下零售（不含DTP）毛利率反而+0.6pct。低毛利的DTP和线上业务占比提升是结构性趋势，会持续拉低综合毛利率。 4. **加盟扩张是双刃剑**：加盟净增791家是扩张主力，直营仅增84家。加盟模式轻资产、快扩张，但加盟门店在O2O履约品质上的管控是潜在风险。（仅推测） 5. **下沉市场布局深，但单店产出可能较低**：78%门店位于地级市及以下，是全国覆盖最广的连锁之一。下沉市场O2O供给少，老百姓的门店网络有稀缺性价值。（仅推测） 重要结论 结论 置信度 依据 变量 :--- :--- :--- :--- 老百姓是O2O赛道上投入最激进的连锁 高 线上31.2亿+26.3%增速+12,352家O2O门店 O2O毛利率未知，可能\"增收不增利\" （仅推测） 利润下降主要是一次性减值，核心经营稳健 中 调整后归母6.20亿仅降1.0% 商誉余额官方公开材料未列示该字段；仅保留已披露事实，后续减值风险不明 综合毛利率将持续承压 中 DTP+线上低毛利占比提升+线下+0.6pct 线上增速如果放缓，毛利率可能企稳 （仅推测） 加盟管控是O2O品质的潜在风险 中 加盟占比35%，O2O门店中加盟占比不明 加盟店O2O履约数据官方公开材料未列示该字段；仅保留已披露事实 （仅推测） 关键时间线 时间 事件 数据/影响 :--- :--- :--- 2025全年 营收222.37亿微降 增收停滞，行业性现象 2025全年 归母3.82亿(-26.44%) 商誉减值2.38亿集中爆发 2025全年 线上31.2亿(+26.3%) O2O六家最快 2025全年 加盟净增791家 加盟主力扩张 2025 Q4 扣非亏损1.48亿 Q4集中计提减值 2026-05 GLP-1线上禁售新规 线上品类影响待评估 与大参林、益丰对比 维度 老百姓 大参林 益丰药房 :--- :--- :--- :--- 营收(亿) 222.4 275.0 244.3 营收增速 -0.54% +3.80% +1.54% 归母净利(亿) 3.82 12.35 16.78 扣非ROE ~5.6% 17.0% 14.4% 零售毛利率 综合32.30% 36.96% 40.82% 线上销售(亿) 31.2(+26.3%) 官方公开材料未列示该字段；仅保留已披露事实 29.93 门店数 14,975 17,758 14,831 加盟占比 35% 41% 29% 核心特征 O2O最激进，利润最薄 规模最大，利润弹性大 最稳，盈利能力最强 最大风险 商誉减值+O2O毛利率 O2O数据不透明 增速放缓 信息溯源清单 信息 来源 时间 链接/备注 :--- :--- :--- :--- 营收222.37亿(-0.54%) 老百姓2025年年报 [P8] 2026-04 老百姓深度分析 归母3.82亿(-26.44%) 老百姓2025年年报 [P8] 2026-04 同上 调整后6.20亿(-1.0%) 老百姓2025年年报 [P8注] 2026-04 同上 线上31.2亿(+26.3%) 老百姓2025年年报 [P22] 2026-04 同上 O2O门店12,352家 老百姓2025年年报 [P22] 2026-04 同上 综合毛利率32.30% 老百姓2025年年报 [P23] 2026-04 同上 门店14,975家 老百姓2025年年报 [P21] 2026-04 同上 商誉减值2.38亿 老百姓2025年年报 [P8] 2026-04 同上","headings":[{"level":2,"text":"一句话定位","anchor":"doc-heading-1"},{"level":2,"text":"关键数据仪表盘","anchor":"doc-heading-2"},{"level":2,"text":"核心观点（5条）","anchor":"doc-heading-3"},{"level":2,"text":"重要结论","anchor":"doc-heading-4"},{"level":2,"text":"关键时间线","anchor":"doc-heading-5"},{"level":2,"text":"与大参林、益丰对比","anchor":"doc-heading-6"},{"level":2,"text":"信息溯源清单","anchor":"doc-heading-7"}],"outgoing":[]},{"id":"doc-e31741c42244","title":"连锁药店行业增量新闻动态（2025-2026）","path":"02-连锁药店/连锁药店行业-增量新闻动态_2025-2026.md","stem":"连锁药店行业-增量新闻动态_2025-2026","module":"02-连锁药店","entity":"","contentType":"公开新闻","isIndex":false,"isGovernance":false,"summary":"引用级别：✅可正式引用","learningTakeaway":"本文帮助你理解连锁药店行业增量新闻动态的新闻动态资料，主要事件有业绩变化、门店调整、O2O运营、平台合作、监管合规和区域扩张。阅读后可以重点掌握：行业规模、平台竞争、财报指标、新闻动态、政策监管；主要帮助解决“这篇资料讲什么、关键事实是什么、后续应从哪些角度继续核验/阅读”的问题。","lastUpdated":"2026-06-08","citationStatus":"可正式引用","html":"<h1>连锁药店行业增量新闻动态（2025-2026）<\/h1>\n<blockquote>\n<p>引用级别：✅可正式引用\n资料基础：官方公告、公司财报、交易所/港交所披露、公司官网新闻稿、监管披露或已核验权威公开来源。<\/p>\n<p>采集周期：2025年下半年 ~ 2026年6月\n采集日期：2026-06-08\n最后更新：2026-06-08<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"doc-heading-1\">一句话定位<\/h2>\n<p>本文定位为连锁药店行业增量新闻动态的新闻动态资料，主要事件有业绩变化、门店调整、O2O运营、平台合作、监管合规和区域扩张。<\/p>\n<h2 id=\"doc-heading-2\">一、行业级动态<\/h2>\n<h3 id=\"doc-heading-3\">1. 药品流通行业进入高质量发展阶段<\/h3>\n<ul>\n<li><strong>来源<\/strong>：商务部《2024年药品流通行业运行统计分析报告》<\/li>\n<li><strong>日期<\/strong>：2025年发布<\/li>\n<li><strong>核心内容<\/strong>：商务部报告是观察药品批发、零售和连锁化趋势的官方基础资料。2025-2026年，上市连锁药店经营重心从规模扩张进一步转向经营质量、合规管理、数字化能力和单店效率。<\/li>\n<li><strong>可应用性思考<\/strong>：医药即时零售平台在选择药店供给时，应优先评估合规能力、门店质量、履约能力和专业服务能力。（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-4\">2. O2O药品市场保持增长<\/h3>\n<ul>\n<li><strong>来源<\/strong>：<a href=\"https://www.sinohealth.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中康科技<\/a>《2025中国医药核心渠道全景报告》、上市公司<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a><\/li>\n<li><strong>日期<\/strong>：2025-2026<\/li>\n<li><strong>核心内容<\/strong>：<a href=\"https://www.sinohealth.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中康科技<\/a>公开报告披露，O2O渠道规模为384亿元。上市连锁药店中，健之佳2025年第三方O2O收入12.09亿元，漱玉平民2025年O2O销售额9.92亿元，益丰药房2025年O2O含税销售额约20.94亿元，国大药房2024年创新业务中O2O销售12.1亿元。<\/li>\n<li><strong>可应用性思考<\/strong>：O2O已成为连锁药店线上增长的重要渠道，平台竞争重点从单纯流量分发转向履约效率、专业服务和合规能力。（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-5\">3. 头部连锁进入门店质量优化阶段<\/h3>\n<ul>\n<li><strong>来源<\/strong>：一心堂、健之佳、国药一致、漱玉平民、老百姓、大参林、益丰药房<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>及<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">一季报<\/a><\/li>\n<li><strong>日期<\/strong>：2025-2026<\/li>\n<li><strong>核心内容<\/strong>：多家上市连锁药店披露门店调改、关闭低效门店、优化门店结构和提升单店产出。一心堂2025年底直营门店11,112家，2026Q1末11,021家；健之佳2025年期末门店5,421家；漱玉平民2026Q1末门店8,447家；老百姓2026Q1末门店15,001家；益丰药房2026Q1末门店14,943家；大参林2025年末门店17,758家。<\/li>\n<li><strong>可应用性思考<\/strong>：头部连锁药店的竞争重点正在从门店数量扩张转向门店质量、成本效率和线上线下一体化能力。（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-6\">4. 合规能力成为医药即时零售底层能力<\/h3>\n<ul>\n<li><strong>来源<\/strong>：上市公司<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>、<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">一季报<\/a>、医保与药监公开信息<\/li>\n<li><strong>日期<\/strong>：2025-2026<\/li>\n<li><strong>核心内容<\/strong>：线上处方药、医保支付、药师在岗、处方审核、药品追溯等环节持续受到监管关注。多家上市连锁药店在<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>和经营计划中披露医保稽核、处方管理、药品追溯和合规系统建设。<\/li>\n<li><strong>可应用性思考<\/strong>：医药即时零售平台应将处方审核、医保支付、药师服务和药品追溯作为药品履约的标准能力。（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-7\">5. 专业药房和处方流转能力持续强化<\/h3>\n<ul>\n<li><strong>来源<\/strong>：上市公司<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>、经营计划和投资者关系活动记录<\/li>\n<li><strong>日期<\/strong>：2025-2026<\/li>\n<li><strong>核心内容<\/strong>：一心堂、健之佳、国大药房等连锁药店均在公开资料中提到专业药房、DTP、慢病管理、互联网医院、门诊统筹和处方流转等方向。<\/li>\n<li><strong>可应用性思考<\/strong>：专业药房和处方流转能力是连锁药店承接院外处方、慢病用药和即时履约的重要基础。（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-8\">6. 平台经营工具竞争加剧<\/h3>\n<ul>\n<li><strong>来源<\/strong>：美团买药公开报道、上市药店<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>/业绩说明会<\/li>\n<li><strong>日期<\/strong>：2026<\/li>\n<li><strong>核心内容<\/strong>：平台竞争从流量和补贴延伸到商家经营工具、库存管理、价格策略、营销自动化和合规运营。美团买药AI经营管家等工具类动态，显示平台正在强化对药店商家的经营赋能。（仅推测）<\/li>\n<li><strong>可应用性思考<\/strong>：面向药店的经营诊断、库存管理、价格管理、促销建议、合规提醒和履约诊断工具，将成为医药即时零售平台的重要竞争能力。（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-9\">二、各公司增量动态<\/h2>\n<h3 id=\"doc-heading-10\">老百姓大药房 (603883.SH)<\/h3>\n<ul>\n<li>2025<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>核心：营业收入222.37亿元，同比-0.54%；归母净利润3.82亿元，同比-26.44%；经营活动现金流31.43亿元，同比+55.08%。<\/li>\n<li>2026Q1核心：营业收入54.81亿元，同比+0.85%；归母净利润2.64亿元，同比+5.27%；扣非归母净利润2.60亿元，同比+6.98%；经营活动现金流8.59亿元，同比+6.76%。<\/li>\n<li>门店数据：截至2026年3月31日，门店15,001家，其中直营9,622家、加盟5,379家；直营医保门店8,965家，占直营药店93.17%。<\/li>\n<li>线上业务：2025年实现线上收入31.2亿元，同比+26.3%，线上占比约14%。<\/li>\n<li><strong>启示<\/strong>：老百姓门店规模大、线上增速快，适合作为全国性连锁药店合作样本。<\/li>\n<\/ul>\n<h3 id=\"doc-heading-11\">大参林 (603233.SH)<\/h3>\n<ul>\n<li>2025<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>核心：营业总收入275.02亿元，同比+3.80%；归母净利润12.35亿元，同比+35.04%；扣非归母净利润12.24亿元，同比+38.36%；经营现金流53.50亿元，同比+72.24%。<\/li>\n<li>门店数据：截至2025年末门店17,758家，其中直营10,468家、加盟7,290家，全年门店净增836家。<\/li>\n<li>O2O进展：O2O送药服务上线门店占比80.38%，并搭建便民24小时送药服务体系。<\/li>\n<li><strong>启示<\/strong>：大参林经营规模、盈利能力和现金流表现突出，具备大规模O2O合作基础。<\/li>\n<\/ul>\n<h3 id=\"doc-heading-12\">益丰药房 (603939.SH)<\/h3>\n<ul>\n<li>2025<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>核心：营业收入约244亿元，归母净利润约16.78亿元，扣非归母净利润约16.11亿元；线上含税销售额约29.93亿元，其中O2O约20.94亿元、B2C约8.99亿元。<\/li>\n<li>2026Q1核心：营业收入60.85亿元，同比+1.26%；归母净利润5.00亿元，同比+11.14%；扣非归母净利润4.93亿元，同比+12.57%；经营活动现金流10.56亿元。<\/li>\n<li>门店数据：截至2026Q1末门店14,943家，其中加盟店4,427家；2026Q1新增门店142家，关闭30家。<\/li>\n<li><strong>启示<\/strong>：益丰药房盈利能力和线上销售规模突出，是高质量连锁药店合作对象。<\/li>\n<\/ul>\n<h3 id=\"doc-heading-13\">一心堂 (002727.SZ)<\/h3>\n<ul>\n<li>2025<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>核心：营收173.36亿元，同比-3.69%；归母净利润2.63亿元，同比+130.8%；直营门店11,112家。<\/li>\n<li>2026Q1核心：营收44.34亿元，同比-6.99%；归母净利润1.76亿元，同比+9.83%；扣非归母净利润1.64亿元，同比+4.58%。<\/li>\n<li>O2O/私域进展：新零售+19.16%，即时零售占线上77.48%，私域“一心到家”小程序渠道收入同比+101.42%。<\/li>\n<li>门店调整：2025年已完成1000多家门店调改，2026年计划再调改4000多家。<\/li>\n<li><strong>启示<\/strong>：一心堂代表“全直营+私域加速+门店调改”模式，适合观察直营体系如何承接O2O和专业药房服务。<\/li>\n<\/ul>\n<h3 id=\"doc-heading-14\">健之佳 (605266.SH)<\/h3>\n<ul>\n<li>2025<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>核心：营收89.21亿元，同比-3.9%；归母净利润1.48亿元，同比+15.63%；线上占比29.7%。<\/li>\n<li>2026Q1核心：营收20.91亿元，同比-8.86%；归母净利润3,594.97万元，同比+7.23%；扣非归母净利润3,295.59万元，同比+6.35%。<\/li>\n<li>O2O进展：第三方O2O收入12.09亿元，同比+9.31%；O2O门店覆盖率92.57%；O2O夜间业务增长超15%。<\/li>\n<li>运营模式：第三方平台O2O、第三方B2C和自营O2O平台“佳E购”并行，通过区域中心门店、延长服务时间和供应链能力拉动增长。<\/li>\n<li><strong>启示<\/strong>：健之佳线上业务占比高，是观察O2O深度运营和便利店+药房模式的代表样本。<\/li>\n<\/ul>\n<h3 id=\"doc-heading-15\">国大药房/国药一致 (000028.SZ)<\/h3>\n<ul>\n<li>国药一致2025核心：营业总收入734.16亿元，归母净利润11.36亿元；分销板块收入533.21亿元，净利润9.49亿元。<\/li>\n<li>国大药房/零售板块：2025年零售收入209.81亿元，净利润-2.17亿元；剔除商誉和无形资产减值影响后净利润0.60亿元。<\/li>\n<li>2026Q1：国药一致收入178.23亿元；零售板块收入47.39亿元，净利润0.05亿元。<\/li>\n<li>O2O/线上：2024年国大药房创新业务销售18.9亿元，其中O2O 12.1亿元、B2C 2.3亿元、自营0.9亿元、商保3.6亿元。<\/li>\n<li><strong>启示<\/strong>：国大药房代表“央企体系+大规模零售+分销协同”模式，是评估大型药品零售平台化能力的重要样本。<\/li>\n<\/ul>\n<h3 id=\"doc-heading-16\">漱玉平民 (301017.SZ)<\/h3>\n<ul>\n<li>2025<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>核心：营收103.27亿元，同比+7.91%；归母净利润1.14亿元，同比+160.50%。<\/li>\n<li>O2O进展：O2O销售额9.92亿元，同比+14.7%，通过商圈运营、商品结构精细化和智能配送预警系统提升履约，配送准时率提升至98.6%。<\/li>\n<li>2026Q1：营收26.01亿元，同比+9.36%；归母净利润1,035.77万元，同比-59.58%；扣非归母净利润970.62万元，同比-58.27%。<\/li>\n<li>门店与区域：2026Q1末门店8,447家，其中直营4,862家；山东区域关闭37家，福建区域新增8家。<\/li>\n<li><strong>启示<\/strong>：漱玉平民区域密度高，O2O保持增长，是观察区域连锁药店即时履约能力的代表样本。<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-17\">三、行业核心指标追踪<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">指标<\/th>\n<th style=\"text-align: left;\">最新可引用口径<\/th>\n<th style=\"text-align: left;\">趋势<\/th>\n<th style=\"text-align: left;\">备注<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">药品流通行业数据<\/td>\n<td style=\"text-align: left;\">商务部《2024年药品流通行业运行统计分析报告》<\/td>\n<td style=\"text-align: left;\">→<\/td>\n<td style=\"text-align: left;\">官方行业基础资料<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">门店结构<\/td>\n<td style=\"text-align: left;\">多家头部连锁披露关店、调改、放缓扩张<\/td>\n<td style=\"text-align: left;\">↓<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>显示行业从规模扩张转向门店质量优化<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">O2O药品市场规模<\/td>\n<td style=\"text-align: left;\">384亿元<\/td>\n<td style=\"text-align: left;\">↑<\/td>\n<td style=\"text-align: left;\">中康科技2025年公开报告口径<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">典型头部连锁O2O收入<\/td>\n<td style=\"text-align: left;\">健之佳12.09亿、漱玉9.92亿、国大2024年12.1亿、益丰O2O约20.94亿<\/td>\n<td style=\"text-align: left;\">↑<\/td>\n<td style=\"text-align: left;\">均为公开披露或公开转引公司数据<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">合规能力<\/td>\n<td style=\"text-align: left;\">医保稽核、处方管理、药品追溯、药师服务<\/td>\n<td style=\"text-align: left;\">↑<\/td>\n<td style=\"text-align: left;\">多家公司<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>和经营计划披露为重点建设方向<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">专业药房能力<\/td>\n<td style=\"text-align: left;\">DTP、慢病管理、处方流转、互联网医院<\/td>\n<td style=\"text-align: left;\">↑<\/td>\n<td style=\"text-align: left;\">上市连锁药店持续布局专业化服务<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<h2 id=\"doc-heading-18\">四、对医药服务平台即时零售的启示<\/h2>\n<p>| 动态 | 对我们的影响 | 应对建议 |（仅推测）\n|:---|:---|:---|\n| 头部连锁从扩张转向提质 | O2O商家拓展从“数量扩张”转向“质量筛选” | 提前锁定高质量、医保合规、履约稳定的区域龙头门店 |\n| O2O药品市场384亿 | 市场空间明确，平台、私域、自营药房共同竞争 | 精准定位DTP、医疗器械、慢病管理、夜间应急购药等细分赛道 |\n| 专业药房能力强化 | 处方流转和慢病用药成为平台增量场景 | 强化处方审核、药师服务、互联网医院和医保线上支付能力 |\n| 平台经营工具竞争 | 药店需要更强经营、库存、价格和合规工具 | 为商家提供AI经营助手、库存/价格/促销建议、合规提醒和履约诊断工具 |（仅推测）\n| 低效门店出清 | 优质连锁门店价值提升 | 建立商家分层体系，对高质量门店提供更深合作和流量倾斜 |\n| 头部连锁O2O数据差异 | 合作评估需要统一经营指标 | 要求合作方提供门店覆盖、订单量、履约时效、客单价、医保支付和退款率等内部经营口径 |\n| 合规要求提高 | 处方药、医保支付和药品追溯影响履约安全 | 对减重药、处方药、医保支付建立专项风控和审方闭环 |<\/p>\n<hr />\n<p><em>信息溯源：本文数据来自商务部《2024年药品流通行业运行统计分析报告》、中康科技《2025中国医药核心渠道全景报告》、老百姓/大参林/益丰药房/一心堂/健之佳/国药一致/漱玉平民等公司年报、一季报、业绩快报、主要经营数据公告及已补齐公司文件。本文仅保留官方报告、公司公告和已核验公开披露数据。基础财报数据参照 <span class=\"wiki-link missing\">连锁药房2025年财报对比分析报告<\/span>。<\/em><\/p>","rawText":"连锁药店行业增量新闻动态（2025-2026） 引用级别：✅可正式引用 资料基础：官方公告、公司财报、交易所/港交所披露、公司官网新闻稿、监管披露或已核验权威公开来源。 采集周期：2025年下半年 ~ 2026年6月 采集日期：2026-06-08 最后更新：2026-06-08 一句话定位 本文定位为连锁药店行业增量新闻动态的新闻动态资料，主要事件有业绩变化、门店调整、O2O运营、平台合作、监管合规和区域扩张。 一、行业级动态 1. 药品流通行业进入高质量发展阶段 来源**：商务部《2024年药品流通行业运行统计分析报告》 日期**：2025年发布 核心内容**：商务部报告是观察药品批发、零售和连锁化趋势的官方基础资料。2025-2026年，上市连锁药店经营重心从规模扩张进一步转向经营质量、合规管理、数字化能力和单店效率。 可应用性思考**：医药即时零售平台在选择药店供给时，应优先评估合规能力、门店质量、履约能力和专业服务能力。（仅推测） 2. O2O药品市场保持增长 来源**：中康科技《2025中国医药核心渠道全景报告》、上市公司年报 日期**：2025-2026 核心内容**：中康科技公开报告披露，O2O渠道规模为384亿元。上市连锁药店中，健之佳2025年第三方O2O收入12.09亿元，漱玉平民2025年O2O销售额9.92亿元，益丰药房2025年O2O含税销售额约20.94亿元，国大药房2024年创新业务中O2O销售12.1亿元。 可应用性思考**：O2O已成为连锁药店线上增长的重要渠道，平台竞争重点从单纯流量分发转向履约效率、专业服务和合规能力。（仅推测） 3. 头部连锁进入门店质量优化阶段 来源**：一心堂、健之佳、国药一致、漱玉平民、老百姓、大参林、益丰药房年报及一季报 日期**：2025-2026 核心内容**：多家上市连锁药店披露门店调改、关闭低效门店、优化门店结构和提升单店产出。一心堂2025年底直营门店11,112家，2026Q1末11,021家；健之佳2025年期末门店5,421家；漱玉平民2026Q1末门店8,447家；老百姓2026Q1末门店15,001家；益丰药房2026Q1末门店14,943家；大参林2025年末门店17,758家。 可应用性思考**：头部连锁药店的竞争重点正在从门店数量扩张转向门店质量、成本效率和线上线下一体化能力。（仅推测） 4. 合规能力成为医药即时零售底层能力 来源**：上市公司年报、一季报、医保与药监公开信息 日期**：2025-2026 核心内容**：线上处方药、医保支付、药师在岗、处方审核、药品追溯等环节持续受到监管关注。多家上市连锁药店在年报和经营计划中披露医保稽核、处方管理、药品追溯和合规系统建设。 可应用性思考**：医药即时零售平台应将处方审核、医保支付、药师服务和药品追溯作为药品履约的标准能力。（仅推测） 5. 专业药房和处方流转能力持续强化 来源**：上市公司年报、经营计划和投资者关系活动记录 日期**：2025-2026 核心内容**：一心堂、健之佳、国大药房等连锁药店均在公开资料中提到专业药房、DTP、慢病管理、互联网医院、门诊统筹和处方流转等方向。 可应用性思考**：专业药房和处方流转能力是连锁药店承接院外处方、慢病用药和即时履约的重要基础。（仅推测） 6. 平台经营工具竞争加剧 来源**：美团买药公开报道、上市药店年报/业绩说明会 日期**：2026 核心内容**：平台竞争从流量和补贴延伸到商家经营工具、库存管理、价格策略、营销自动化和合规运营。美团买药AI经营管家等工具类动态，显示平台正在强化对药店商家的经营赋能。（仅推测） 可应用性思考**：面向药店的经营诊断、库存管理、价格管理、促销建议、合规提醒和履约诊断工具，将成为医药即时零售平台的重要竞争能力。（仅推测） 二、各公司增量动态 老百姓大药房 (603883.SH) 2025年报核心：营业收入222.37亿元，同比-0.54%；归母净利润3.82亿元，同比-26.44%；经营活动现金流31.43亿元，同比+55.08%。 2026Q1核心：营业收入54.81亿元，同比+0.85%；归母净利润2.64亿元，同比+5.27%；扣非归母净利润2.60亿元，同比+6.98%；经营活动现金流8.59亿元，同比+6.76%。 门店数据：截至2026年3月31日，门店15,001家，其中直营9,622家、加盟5,379家；直营医保门店8,965家，占直营药店93.17%。 线上业务：2025年实现线上收入31.2亿元，同比+26.3%，线上占比约14%。 启示**：老百姓门店规模大、线上增速快，适合作为全国性连锁药店合作样本。 大参林 (603233.SH) 2025年报核心：营业总收入275.02亿元，同比+3.80%；归母净利润12.35亿元，同比+35.04%；扣非归母净利润12.24亿元，同比+38.36%；经营现金流53.50亿元，同比+72.24%。 门店数据：截至2025年末门店17,758家，其中直营10,468家、加盟7,290家，全年门店净增836家。 O2O进展：O2O送药服务上线门店占比80.38%，并搭建便民24小时送药服务体系。 启示**：大参林经营规模、盈利能力和现金流表现突出，具备大规模O2O合作基础。 益丰药房 (603939.SH) 2025年报核心：营业收入约244亿元，归母净利润约16.78亿元，扣非归母净利润约16.11亿元；线上含税销售额约29.93亿元，其中O2O约20.94亿元、B2C约8.99亿元。 2026Q1核心：营业收入60.85亿元，同比+1.26%；归母净利润5.00亿元，同比+11.14%；扣非归母净利润4.93亿元，同比+12.57%；经营活动现金流10.56亿元。 门店数据：截至2026Q1末门店14,943家，其中加盟店4,427家；2026Q1新增门店142家，关闭30家。 启示**：益丰药房盈利能力和线上销售规模突出，是高质量连锁药店合作对象。 一心堂 (002727.SZ) 2025年报核心：营收173.36亿元，同比-3.69%；归母净利润2.63亿元，同比+130.8%；直营门店11,112家。 2026Q1核心：营收44.34亿元，同比-6.99%；归母净利润1.76亿元，同比+9.83%；扣非归母净利润1.64亿元，同比+4.58%。 O2O/私域进展：新零售+19.16%，即时零售占线上77.48%，私域“一心到家”小程序渠道收入同比+101.42%。 门店调整：2025年已完成1000多家门店调改，2026年计划再调改4000多家。 启示**：一心堂代表“全直营+私域加速+门店调改”模式，适合观察直营体系如何承接O2O和专业药房服务。 健之佳 (605266.SH) 2025年报核心：营收89.21亿元，同比-3.9%；归母净利润1.48亿元，同比+15.63%；线上占比29.7%。 2026Q1核心：营收20.91亿元，同比-8.86%；归母净利润3,594.97万元，同比+7.23%；扣非归母净利润3,295.59万元，同比+6.35%。 O2O进展：第三方O2O收入12.09亿元，同比+9.31%；O2O门店覆盖率92.57%；O2O夜间业务增长超15%。 运营模式：第三方平台O2O、第三方B2C和自营O2O平台“佳E购”并行，通过区域中心门店、延长服务时间和供应链能力拉动增长。 启示**：健之佳线上业务占比高，是观察O2O深度运营和便利店+药房模式的代表样本。 国大药房/国药一致 (000028.SZ) 国药一致2025核心：营业总收入734.16亿元，归母净利润11.36亿元；分销板块收入533.21亿元，净利润9.49亿元。 国大药房/零售板块：2025年零售收入209.81亿元，净利润-2.17亿元；剔除商誉和无形资产减值影响后净利润0.60亿元。 2026Q1：国药一致收入178.23亿元；零售板块收入47.39亿元，净利润0.05亿元。 O2O/线上：2024年国大药房创新业务销售18.9亿元，其中O2O 12.1亿元、B2C 2.3亿元、自营0.9亿元、商保3.6亿元。 启示**：国大药房代表“央企体系+大规模零售+分销协同”模式，是评估大型药品零售平台化能力的重要样本。 漱玉平民 (301017.SZ) 2025年报核心：营收103.27亿元，同比+7.91%；归母净利润1.14亿元，同比+160.50%。 O2O进展：O2O销售额9.92亿元，同比+14.7%，通过商圈运营、商品结构精细化和智能配送预警系统提升履约，配送准时率提升至98.6%。 2026Q1：营收26.01亿元，同比+9.36%；归母净利润1,035.77万元，同比-59.58%；扣非归母净利润970.62万元，同比-58.27%。 门店与区域：2026Q1末门店8,447家，其中直营4,862家；山东区域关闭37家，福建区域新增8家。 启示**：漱玉平民区域密度高，O2O保持增长，是观察区域连锁药店即时履约能力的代表样本。 三、行业核心指标追踪 指标 最新可引用口径 趋势 备注 :--- :--- :--- :--- 药品流通行业数据 商务部《2024年药品流通行业运行统计分析报告》 → 官方行业基础资料 门店结构 多家头部连锁披露关店、调改、放缓扩张 ↓ 公司公告显示行业从规模扩张转向门店质量优化 O2O药品市场规模 384亿元 ↑ 中康科技2025年公开报告口径 典型头部连锁O2O收入 健之佳12.09亿、漱玉9.92亿、国大2024年12.1亿、益丰O2O约20.94亿 ↑ 均为公开披露或公开转引公司数据 合规能力 医保稽核、处方管理、药品追溯、药师服务 ↑ 多家公司年报和经营计划披露为重点建设方向 专业药房能力 DTP、慢病管理、处方流转、互联网医院 ↑ 上市连锁药店持续布局专业化服务 四、对医药服务平台即时零售的启示 动态 对我们的影响 应对建议 （仅推测） :--- :--- :--- 头部连锁从扩张转向提质 O2O商家拓展从“数量扩张”转向“质量筛选” 提前锁定高质量、医保合规、履约稳定的区域龙头门店 O2O药品市场384亿 市场空间明确，平台、私域、自营药房共同竞争 精准定位DTP、医疗器械、慢病管理、夜间应急购药等细分赛道 专业药房能力强化 处方流转和慢病用药成为平台增量场景 强化处方审核、药师服务、互联网医院和医保线上支付能力 平台经营工具竞争 药店需要更强经营、库存、价格和合规工具 为商家提供AI经营助手、库存/价格/促销建议、合规提醒和履约诊断工具 （仅推测） 低效门店出清 优质连锁门店价值提升 建立商家分层体系，对高质量门店提供更深合作和流量倾斜 头部连锁O2O数据差异 合作评估需要统一经营指标 要求合作方提供门店覆盖、订单量、履约时效、客单价、医保支付和退款率等内部经营口径 合规要求提高 处方药、医保支付和药品追溯影响履约安全 对减重药、处方药、医保支付建立专项风控和审方闭环 信息溯源：本文数据来自商务部《2024年药品流通行业运行统计分析报告》、中康科技《2025中国医药核心渠道全景报告》、老百姓/大参林/益丰药房/一心堂/健之佳/国药一致/漱玉平民等公司年报、一季报、业绩快报、主要经营数据公告及已补齐公司文件。本文仅保留官方报告、公司公告和已核验公开披露数据。基础财报数据参照 连锁药房2025年财报对比分析报告。*","headings":[{"level":2,"text":"一句话定位","anchor":"doc-heading-1"},{"level":2,"text":"一、行业级动态","anchor":"doc-heading-2"},{"level":3,"text":"1. 药品流通行业进入高质量发展阶段","anchor":"doc-heading-3"},{"level":3,"text":"2. O2O药品市场保持增长","anchor":"doc-heading-4"},{"level":3,"text":"3. 头部连锁进入门店质量优化阶段","anchor":"doc-heading-5"},{"level":3,"text":"4. 合规能力成为医药即时零售底层能力","anchor":"doc-heading-6"},{"level":3,"text":"5. 专业药房和处方流转能力持续强化","anchor":"doc-heading-7"},{"level":3,"text":"6. 平台经营工具竞争加剧","anchor":"doc-heading-8"},{"level":2,"text":"二、各公司增量动态","anchor":"doc-heading-9"},{"level":3,"text":"老百姓大药房 (603883.SH)","anchor":"doc-heading-10"},{"level":3,"text":"大参林 (603233.SH)","anchor":"doc-heading-11"},{"level":3,"text":"益丰药房 (603939.SH)","anchor":"doc-heading-12"},{"level":3,"text":"一心堂 (002727.SZ)","anchor":"doc-heading-13"},{"level":3,"text":"健之佳 (605266.SH)","anchor":"doc-heading-14"},{"level":3,"text":"国大药房/国药一致 (000028.SZ)","anchor":"doc-heading-15"},{"level":3,"text":"漱玉平民 (301017.SZ)","anchor":"doc-heading-16"},{"level":2,"text":"三、行业核心指标追踪","anchor":"doc-heading-17"},{"level":2,"text":"四、对医药服务平台即时零售的启示","anchor":"doc-heading-18"}],"outgoing":[]},{"id":"doc-3bf07ee8430f","title":"DTP药企-信息摘要","path":"03-即时零售相关药企/DTP与特药/DTP药企-信息摘要.md","stem":"DTP药企-信息摘要","module":"03-即时零售相关药企","entity":"DTP与特药","contentType":"综合分析","isIndex":false,"isGovernance":false,"summary":"﻿# DTP与特药药企 - 信息摘要","learningTakeaway":"本文帮助你理解DTP与特药药企 - 信息摘要的药企信息资料，核心关注财务表现、产品管线、渠道布局、DTP/OTC机会和公开来源边界。阅读后可以重点掌握：行业规模、平台竞争、财报指标、研报观点、新闻动态；主要帮助解决“这篇资料讲什么、关键事实是什么、后续应从哪些角度继续核验/阅读”的问题。","lastUpdated":"2026-06-08","citationStatus":"可供研判参考","html":"<p>﻿# DTP与特药药企 - 信息摘要<\/p>\n<blockquote>\n<p>引用级别：✅可正式引用\n资料基础：官方公告、公司财报、交易所/港交所披露、公司官网新闻稿、监管披露或已核验权威公开来源。\n信息采集日期：2026-06-01\n最后更新：2026-06-08\n状态：已补充2024-2025年财报数据<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"doc-heading-1\">一句话定位<\/h2>\n<p>本文定位为DTP与特药药企 - 信息摘要的药企信息资料，核心关注财务表现、产品管线、渠道布局、DTP/OTC机会和公开来源边界。<\/p>\n<h2 id=\"doc-heading-2\">一、百济神州 (688235.SH / 06160.HK)<\/h2>\n<h3 id=\"doc-heading-3\">定位<\/h3>\n<p>中国创新药国际化代表，核心产品泽布替尼（BTK抑制剂），全球销售额超25亿美元<\/p>\n<h3 id=\"doc-heading-4\">最新财报数据<\/h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">指标<\/th>\n<th style=\"text-align: left;\">2024年（全年）<\/th>\n<th style=\"text-align: left;\">2025年（全年/业绩快报）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">营业总收入<\/td>\n<td style=\"text-align: left;\">272.14亿元（同比+56.2%）<\/td>\n<td style=\"text-align: left;\">382.05亿元[已按公开来源交叉检索]（同比+40.4%）<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">产品收入<\/td>\n<td style=\"text-align: left;\">269.94亿元（同比+74.1%）<\/td>\n<td style=\"text-align: left;\">—<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">归母净利润<\/td>\n<td style=\"text-align: left;\">-49.78亿元<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%2B14.22%E4%BA%BF%E5%85%83%EF%BC%88%2A%2A%E9%A6%96%E6%AC%A1%E5%B9%B4%E5%BA%A6%E7%9B%88%E5%88%A9%2A%2A%EF%BC%89\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">+14.22亿元（<strong>首次年度盈利<\/strong>）<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">泽布替尼全球销售<\/td>\n<td style=\"text-align: left;\">~188亿元<\/td>\n<td style=\"text-align: left;\">~280亿元[已按公开来源交叉检索]<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>泽布替尼<\/strong>：2025年全球销售约280亿元[已按公开来源交叉检索]，全球BTK抑制剂\"销冠\"，已超越伊布替尼<\/li>\n<li><strong>海外收入占比~86%[已按公开来源交叉检索]<\/strong>：美国市场首次贡献超50%收入，国内收入占比约14%<\/li>\n<li><strong>盈利状态<\/strong>：2025年实现首次年度盈利，2024年仍为亏损状态；正式引用需回到年度报告原文。<\/li>\n<li><strong>2026年Q1<\/strong>：泽布替尼全球销售75.98亿元[已按公开来源交叉检索]，公司总营收105.44亿元[已按公开来源交叉检索]（+31%）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-5\">与即时零售的关联<\/h3>\n<ul>\n<li><strong>渠道特点<\/strong>：抗肿瘤药物主要通过DTP药房和院内渠道销售，暂不涉及即时零售配送<\/li>\n<li><strong>潜在关联<\/strong>：DTP药房的数字化和O2O化趋势可能让特药也进入即时零售场景（仅推测）<\/li>\n<li><strong>核心关注<\/strong>：泽布替尼国内销售渠道分布（院内 vs DTP vs 线上）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-6\">关键跟踪维度<\/h3>\n<ul>\n<li>[x] 国内收入规模及渠道占比 — 国内收入约14%（海外约86%），但DTP药房具体占比未公开<\/li>\n<li><strong>公开来源处理结果<\/strong>：DTP药房合作网络规模 — 截至2026-06-08，已按<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>/财报、交易所或<a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">港交所披露<\/a>、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测）<\/li>\n<li><strong>公开来源处理结果<\/strong>：是否有2025-2026年仍在推进的线上处方+即时配送试点 — 截至2026-06-08，已按<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>/财报、交易所或<a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">港交所披露<\/a>、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测）<\/li>\n<li><strong>公开来源处理结果<\/strong>：新药上市时的渠道策略 — 截至2026-06-08，已按<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>/财报、交易所或<a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">港交所披露<\/a>、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-7\">可应用性思考<\/h3>\n<ul>\n<li>DTP特药短期内不直接进入即时零售，但DTP药房的O2O化是趋势<\/li>\n<li>医药服务平台DTP药房可以与百济神州建立直供合作，保证正品供给<\/li>\n<li>泽布替尼等高价值药品的即时配送需要冷链物流能力<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-8\">二、信达生物 (01801.HK)<\/h2>\n<h3 id=\"doc-heading-9\">定位<\/h3>\n<p>PD-1达伯舒（信迪利单抗）为核心，多管线布局（生物类似药+创新药+GLP-1）<\/p>\n<h3 id=\"doc-heading-10\">最新财报数据<\/h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">指标<\/th>\n<th style=\"text-align: left;\">2024年（全年）<\/th>\n<th style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=2025%E5%B9%B4H1%EF%BC%88%E5%8D%8A%E5%B9%B4%EF%BC%89\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">2025年H1（半年）<\/a><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">总产品收入<\/td>\n<td style=\"text-align: left;\">超82亿元（同比+40%+）<\/td>\n<td style=\"text-align: left;\">59.53亿元[已按公开来源交叉检索]（同比+50.6%）<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">总收入<\/td>\n<td style=\"text-align: left;\">130.4亿元（同比+38.4%）<\/td>\n<td style=\"text-align: left;\">—<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">净利润<\/td>\n<td style=\"text-align: left;\">8.14亿元（<strong>IFRS首次全年盈利<\/strong>）<\/td>\n<td style=\"text-align: left;\">—<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote>\n<p>⚠️ <strong>时间维度说明<\/strong>：百济神州和再鼎医药使用\"2025年全年/业绩快报\"数据，信达生物使用\"2025年H1\"半年数据。跨公司比较时请注意时间口径差异。<\/p>\n<\/blockquote>\n<ul>\n<li><strong>达伯舒（信迪利单抗/PD-1）<\/strong>：截至2024年12月已获批8项适应症[已按公开来源交叉检索]，覆盖非鳞状非小细胞肺癌等多个瘤种<\/li>\n<li><strong>玛仕度肽（GLP-1R/GCGR双重激动剂）<\/strong>：减重/降糖双适应症，2025年市场反馈\"非常不错\"[已按公开来源交叉检索]，两项研究登上《自然》主刊<\/li>\n<li><strong>管线布局<\/strong>：2025年计划新增6款创新药上市<\/li>\n<li><strong>商业合作规模<\/strong>：达220亿美元<\/li>\n<li><strong>2025全年营收<\/strong>：突破130亿元[已按公开来源交叉检索]<\/li>\n<\/ul>\n<h3 id=\"doc-heading-11\">与即时零售的关联<\/h3>\n<ul>\n<li><strong>渠道特点<\/strong>：PD-1等生物制剂主要通过DTP药房和院内渠道，冷链要求高<\/li>\n<li><strong>生物类似药<\/strong>：信达的生物类似药（如贝伐珠单抗类似药）可能在DTP药房放量（仅推测）<\/li>\n<li><strong>慢病属性<\/strong>：肿瘤慢病化趋势下，部分维持治疗可能进入O2O场景（仅推测）<\/li>\n<li><strong>达伯舒进入医保<\/strong>：已进入国家医保目录，院内+DTP双渠道覆盖<\/li>\n<\/ul>\n<h3 id=\"doc-heading-12\">关键跟踪维度<\/h3>\n<ul>\n<li>[x] 达伯舒国内销售额及渠道分布 — 具体渠道占比未公开<\/li>\n<li>[x] 新药管线上市时间表及渠道策略 — 2025年计划6款创新药（仅推测）<\/li>\n<li><strong>公开来源处理结果<\/strong>：DTP药房网络覆盖 — 截至2026-06-08，已按<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>/财报、交易所或<a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">港交所披露<\/a>、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测）<\/li>\n<li><strong>公开来源处理结果<\/strong>：是否有互联网医院+处方+配送的闭环试点 — 截至2026-06-08，已按<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>/财报、交易所或<a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">港交所披露<\/a>、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-13\">可应用性思考<\/h3>\n<ul>\n<li>【推理】肿瘤慢病化是长期趋势，DTP+O2O是潜在模式（仅推测）<\/li>\n<li>信达的生物类似药价格更低，可能扩大DTP药房的可触达患者群（仅推测）<\/li>\n<li><strong>玛仕度肽是关键关注点<\/strong>：【推理】GLP-1减重药如果在国内获批，DTP+即时零售是潜在渠道（仅推测）<\/li>\n<li>信达首度全年盈利【推理】标志着商业化能力趋于成熟，渠道扩张动力可能增强（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-14\">三、再鼎医药 (9688.HK)<\/h2>\n<h3 id=\"doc-heading-15\">定位<\/h3>\n<p>引进模式（License-in）代表，核心产品则乐（尼拉帕利）、爱普盾（肿瘤电场治疗）<\/p>\n<h3 id=\"doc-heading-16\">最新财报数据<\/h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">指标<\/th>\n<th style=\"text-align: left;\">2024年（全年）<\/th>\n<th style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=2025%E5%B9%B4%EF%BC%88%E6%8C%87%E5%BC%95%EF%BC%89\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">2025年（指引）<\/a><\/th>\n<th style=\"text-align: left;\">2025年（实际/全年）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">营业收入<\/td>\n<td style=\"text-align: left;\">~3.99亿美元（同比+50%）<\/td>\n<td style=\"text-align: left;\">5.60-5.90亿美元<\/td>\n<td style=\"text-align: left;\"><strong>4.60亿美元[已按公开来源交叉检索]（同比+15%）<\/strong><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">经营亏损<\/td>\n<td style=\"text-align: left;\">同比收窄23%<\/td>\n<td style=\"text-align: left;\">—<\/td>\n<td style=\"text-align: left;\">—<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">净亏损<\/td>\n<td style=\"text-align: left;\">2.57亿美元<\/td>\n<td style=\"text-align: left;\">—<\/td>\n<td style=\"text-align: left;\">—<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote>\n<p>⚠️ <strong>数据矛盾说明<\/strong>：2025年年初指引5.60-5.90亿美元，但全年实际营收仅4.60亿美元，显著低于指引下限（差距约18%）。可能原因：①指引发布时基于乐观假设；②后续新品放量不及预期；③汇率或市场环境变化。实际数据以<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>公告为准。（仅推测）<\/p>\n<\/blockquote>\n<ul>\n<li><strong>已商业化产品<\/strong>（均为引进产品）：<\/li>\n<li><strong>则乐（niraparib/尼拉帕利）<\/strong>：PARP抑制剂，卵巢癌等适应症<\/li>\n<li><strong>爱普盾<\/strong>：肿瘤电场治疗设备（非传统药品，配送和履约有特殊要求）<\/li>\n<li><strong>擎乐<\/strong>：胃肠道间质瘤靶向药<\/li>\n<li><strong>纽再乐<\/strong>：抗感染药物<\/li>\n<li><strong>卫伟迦<\/strong>：后续获批产品<\/li>\n<li><strong>2025年Q2产品收入<\/strong>：1.001亿美元[已按公开来源交叉检索]（同比+45%）<\/li>\n<li><strong>2025全年营收<\/strong>：达4.60亿美元（同比+15%），增长由纽再乐和鼎优乐驱动<\/li>\n<li><strong>高管变动<\/strong>：前总裁/COO Josh Smiley离任（唯一未达绩效目标的高管[已按公开来源交叉检索]）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-17\">与即时零售的关联<\/h3>\n<ul>\n<li><strong>渠道特点<\/strong>：引进产品在国内市场的渠道依赖DTP药房的专业推广<\/li>\n<li><strong>特殊性<\/strong>：爱普盾（肿瘤电场治疗设备）不是传统药品，配送和履约有特殊要求<\/li>\n<li><strong>关注点<\/strong>：再鼎的产品矩阵偏\"特药\"属性，与DTP药房的绑定更深<\/li>\n<\/ul>\n<h3 id=\"doc-heading-18\">关键跟踪维度<\/h3>\n<ul>\n<li>[x] 则乐/爱普盾国内销售额 — 则乐为主要收入贡献，具体金额未单独披露<\/li>\n<li><strong>公开来源处理结果<\/strong>：DTP药房渠道占比 — 截至2026-06-08，已按<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>/财报、交易所或<a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">港交所披露<\/a>、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测）<\/li>\n<li>[x] 引进新品的渠道策略 — 全部为License-in产品，渠道从零建设（仅推测）<\/li>\n<li><strong>公开来源处理结果<\/strong>：与互联网医疗平台的合作 — 截至2026-06-08，已按<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>/财报、交易所或<a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">港交所披露<\/a>、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-19\">可应用性思考<\/h3>\n<ul>\n<li>再鼎的引进模式意味着产品在国内渠道建设从零开始，DTP药房是其核心合作伙伴<\/li>\n<li>医药服务平台DTP药房可作为再鼎新品的首发渠道<\/li>\n<li><strong>爱普盾的设备属性<\/strong>：肿瘤电场治疗设备需要专业安装和指导，即时配送需搭配专业服务<\/li>\n<li>再鼎尚未盈利但亏损持续收窄，商业化能力在提升中<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-20\">四、DTP药企行业趋势<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">趋势<\/th>\n<th style=\"text-align: left;\">支撑依据<\/th>\n<th style=\"text-align: left;\">对我们的影响<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">DTP市场持续扩大<\/td>\n<td style=\"text-align: left;\">千亿级处方外流规模、处方外流政策加速<\/td>\n<td style=\"text-align: left;\">DTP药房方向的增长确定性高<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">肿瘤慢病化<\/td>\n<td style=\"text-align: left;\">创新药让肿瘤变成\"慢病\"<\/td>\n<td style=\"text-align: left;\">慢病复购场景适合O2O化<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">冷链即时配送需求<\/td>\n<td style=\"text-align: left;\">生物制剂/特药需要2-8℃配送<\/td>\n<td style=\"text-align: left;\">京东物流的冷链能力是差异化优势<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">处方药线上渗透率&lt;10%<\/td>\n<td style=\"text-align: left;\">政策限制仍是核心瓶颈<\/td>\n<td style=\"text-align: left;\">合规先行者有机会获得先发优势<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">医保线上支付扩围<\/td>\n<td style=\"text-align: left;\">淘宝闪购53城医保覆盖<\/td>\n<td style=\"text-align: left;\">医保打通是DTP即时零售的基础设施<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">创新药企密集扭亏<\/td>\n<td style=\"text-align: left;\">百济神州2025年首次盈利、信达生物IFRS首度盈利<\/td>\n<td style=\"text-align: left;\">商业化成熟后渠道扩张意愿增强<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">License-in模式依赖DTP<\/td>\n<td style=\"text-align: left;\">再鼎医药5款产品全部为引进，渠道从零建<\/td>\n<td style=\"text-align: left;\">DTP药房是引进产品的核心渠道伙伴<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<h2 id=\"doc-heading-21\">五、DTP即时零售可行性判断<\/h2>\n<p>| 维度 | 现状 | 判断 | （仅推测） |\n|:---|:---|:---|\n| 政策合规 | 处方药网售已开放但监管严格 | 可行，但需严格合规 |\n| 冷链履约 | 京东物流有冷链能力 | 可行，京东有差异化优势 |\n| 处方来源 | 互联网医院处方+线下处方流转 | 可行，但需打通处方流转 |\n| <a href=\"https://www.baidu.com/s?wd=%E5%8C%BB%E4%BF%9D%E6%94%AF%E4%BB%98\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">医保支付<\/a> | 线上医保覆盖城市逐步增加 | 逐步可行，但需等待政策落地 |\n| <a href=\"https://www.baidu.com/s?wd=%E7%94%A8%E6%88%B7%E5%BF%83%E6%99%BA\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">用户心智<\/a> | 患者习惯院内取药/DTP到店 | 需要教育，但慢病复购场景有需求 |<\/p>\n<p><strong>总体判断<\/strong>：DTP+即时零售在慢病复购场景下具备可行性，但需要政策、冷链、处方、医保四个条件同时满足。医药服务平台在冷链和合规方面有先天优势。（仅推测）<\/p>\n<hr />\n<h2 id=\"doc-heading-22\">数据来源级别速查<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">数据点<\/th>\n<th style=\"text-align: ref=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">财报<\/a>。（仅推测）<\/li>\n<\/ul>","rawText":"﻿# DTP与特药药企 - 信息摘要 引用级别：✅可正式引用 资料基础：官方公告、公司财报、交易所/港交所披露、公司官网新闻稿、监管披露或已核验权威公开来源。 信息采集日期：2026-06-01 最后更新：2026-06-08 状态：已补充2024-2025年财报数据 一句话定位 本文定位为DTP与特药药企 - 信息摘要的药企信息资料，核心关注财务表现、产品管线、渠道布局、DTP/OTC机会和公开来源边界。 一、百济神州 (688235.SH / 06160.HK) 定位 中国创新药国际化代表，核心产品泽布替尼（BTK抑制剂），全球销售额超25亿美元 最新财报数据 指标 2024年（全年） 2025年（全年/业绩快报） :--- :--- :--- 营业总收入 272.14亿元（同比+56.2%） 382.05亿元[已按公开来源交叉检索]（同比+40.4%） 产品收入 269.94亿元（同比+74.1%） — 归母净利润 -49.78亿元 +14.22亿元（**首次年度盈利**） 泽布替尼全球销售 ~188亿元 ~280亿元[已按公开来源交叉检索] 泽布替尼**：2025年全球销售约280亿元[已按公开来源交叉检索]，全球BTK抑制剂\"销冠\"，已超越伊布替尼 海外收入占比~86%[已按公开来源交叉检索]**：美国市场首次贡献超50%收入，国内收入占比约14% 盈利状态**：2025年实现首次年度盈利，2024年仍为亏损状态；正式引用需回到年度报告原文。 2026年Q1**：泽布替尼全球销售75.98亿元[已按公开来源交叉检索]，公司总营收105.44亿元[已按公开来源交叉检索]（+31%） 与即时零售的关联 渠道特点**：抗肿瘤药物主要通过DTP药房和院内渠道销售，暂不涉及即时零售配送 潜在关联**：DTP药房的数字化和O2O化趋势可能让特药也进入即时零售场景（仅推测） 核心关注**：泽布替尼国内销售渠道分布（院内 vs DTP vs 线上） 关键跟踪维度 [x] 国内收入规模及渠道占比 — 国内收入约14%（海外约86%），但DTP药房具体占比未公开 公开来源处理结果**：DTP药房合作网络规模 — 截至2026-06-08，已按公司公告/财报、交易所或港交所披露、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测） 公开来源处理结果**：是否有2025-2026年仍在推进的线上处方+即时配送试点 — 截至2026-06-08，已按公司公告/财报、交易所或港交所披露、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测） 公开来源处理结果**：新药上市时的渠道策略 — 截至2026-06-08，已按公司公告/财报、交易所或港交所披露、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测） 可应用性思考 DTP特药短期内不直接进入即时零售，但DTP药房的O2O化是趋势 医药服务平台DTP药房可以与百济神州建立直供合作，保证正品供给 泽布替尼等高价值药品的即时配送需要冷链物流能力 二、信达生物 (01801.HK) 定位 PD-1达伯舒（信迪利单抗）为核心，多管线布局（生物类似药+创新药+GLP-1） 最新财报数据 指标 2024年（全年） 2025年H1（半年） :--- :--- :--- 总产品收入 超82亿元（同比+40%+） 59.53亿元[已按公开来源交叉检索]（同比+50.6%） 总收入 130.4亿元（同比+38.4%） — 净利润 8.14亿元（**IFRS首次全年盈利**） — ⚠️ **时间维度说明**：百济神州和再鼎医药使用\"2025年全年/业绩快报\"数据，信达生物使用\"2025年H1\"半年数据。跨公司比较时请注意时间口径差异。 达伯舒（信迪利单抗/PD-1）**：截至2024年12月已获批8项适应症[已按公开来源交叉检索]，覆盖非鳞状非小细胞肺癌等多个瘤种 玛仕度肽（GLP-1R/GCGR双重激动剂）**：减重/降糖双适应症，2025年市场反馈\"非常不错\"[已按公开来源交叉检索]，两项研究登上《自然》主刊 管线布局**：2025年计划新增6款创新药上市 商业合作规模**：达220亿美元 2025全年营收**：突破130亿元[已按公开来源交叉检索] 与即时零售的关联 渠道特点**：PD-1等生物制剂主要通过DTP药房和院内渠道，冷链要求高 生物类似药**：信达的生物类似药（如贝伐珠单抗类似药）可能在DTP药房放量（仅推测） 慢病属性**：肿瘤慢病化趋势下，部分维持治疗可能进入O2O场景（仅推测） 达伯舒进入医保**：已进入国家医保目录，院内+DTP双渠道覆盖 关键跟踪维度 [x] 达伯舒国内销售额及渠道分布 — 具体渠道占比未公开 [x] 新药管线上市时间表及渠道策略 — 2025年计划6款创新药（仅推测） 公开来源处理结果**：DTP药房网络覆盖 — 截至2026-06-08，已按公司公告/财报、交易所或港交所披露、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测） 公开来源处理结果**：是否有互联网医院+处方+配送的闭环试点 — 截至2026-06-08，已按公司公告/财报、交易所或港交所披露、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测） 可应用性思考 【推理】肿瘤慢病化是长期趋势，DTP+O2O是潜在模式（仅推测） 信达的生物类似药价格更低，可能扩大DTP药房的可触达患者群（仅推测） 玛仕度肽是关键关注点**：【推理】GLP-1减重药如果在国内获批，DTP+即时零售是潜在渠道（仅推测） 信达首度全年盈利【推理】标志着商业化能力趋于成熟，渠道扩张动力可能增强（仅推测） 三、再鼎医药 (9688.HK) 定位 引进模式（License-in）代表，核心产品则乐（尼拉帕利）、爱普盾（肿瘤电场治疗） 最新财报数据 指标 2024年（全年） 2025年（指引） 2025年（实际/全年） :--- :--- :--- :--- 营业收入 ~3.99亿美元（同比+50%） 5.60-5.90亿美元 **4.60亿美元[已按公开来源交叉检索]（同比+15%）** 经营亏损 同比收窄23% — — 净亏损 2.57亿美元 — — ⚠️ **数据矛盾说明**：2025年年初指引5.60-5.90亿美元，但全年实际营收仅4.60亿美元，显著低于指引下限（差距约18%）。可能原因：①指引发布时基于乐观假设；②后续新品放量不及预期；③汇率或市场环境变化。实际数据以年报公告为准。（仅推测） 已商业化产品**（均为引进产品）： 则乐（niraparib/尼拉帕利）**：PARP抑制剂，卵巢癌等适应症 爱普盾**：肿瘤电场治疗设备（非传统药品，配送和履约有特殊要求） 擎乐**：胃肠道间质瘤靶向药 纽再乐**：抗感染药物 卫伟迦**：后续获批产品 2025年Q2产品收入**：1.001亿美元[已按公开来源交叉检索]（同比+45%） 2025全年营收**：达4.60亿美元（同比+15%），增长由纽再乐和鼎优乐驱动 高管变动**：前总裁/COO Josh Smiley离任（唯一未达绩效目标的高管[已按公开来源交叉检索]） 与即时零售的关联 渠道特点**：引进产品在国内市场的渠道依赖DTP药房的专业推广 特殊性**：爱普盾（肿瘤电场治疗设备）不是传统药品，配送和履约有特殊要求 关注点**：再鼎的产品矩阵偏\"特药\"属性，与DTP药房的绑定更深 关键跟踪维度 [x] 则乐/爱普盾国内销售额 — 则乐为主要收入贡献，具体金额未单独披露 公开来源处理结果**：DTP药房渠道占比 — 截至2026-06-08，已按公司公告/财报、交易所或港交所披露、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测） [x] 引进新品的渠道策略 — 全部为License-in产品，渠道从零建设（仅推测） 公开来源处理结果**：与互联网医疗平台的合作 — 截至2026-06-08，已按公司公告/财报、交易所或港交所披露、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测） 可应用性思考 再鼎的引进模式意味着产品在国内渠道建设从零开始，DTP药房是其核心合作伙伴 医药服务平台DTP药房可作为再鼎新品的首发渠道 爱普盾的设备属性**：肿瘤电场治疗设备需要专业安装和指导，即时配送需搭配专业服务 再鼎尚未盈利但亏损持续收窄，商业化能力在提升中 四、DTP药企行业趋势 趋势 支撑依据 对我们的影响 :--- :--- :--- DTP市场持续扩大 千亿级处方外流规模、处方外流政策加速 DTP药房方向的增长确定性高 肿瘤慢病化 创新药让肿瘤变成\"慢病\" 慢病复购场景适合O2O化 冷链即时配送需求 生物制剂/特药需要2-8℃配送 京东物流的冷链能力是差异化优势 处方药线上渗透率<10% 政策限制仍是核心瓶颈 合规先行者有机会获得先发优势 （仅推测） 医保线上支付扩围 淘宝闪购53城医保覆盖 医保打通是DTP即时零售的基础设施 创新药企密集扭亏 百济神州2025年首次盈利、信达生物IFRS首度盈利 商业化成熟后渠道扩张意愿增强 License-in模式依赖DTP 再鼎医药5款产品全部为引进，渠道从零建 DTP药房是引进产品的核心渠道伙伴 五、DTP即时零售可行性判断 维度 现状 判断 （仅推测） :--- :--- :--- 政策合规 处方药网售已开放但监管严格 可行，但需严格合规 冷链履约 京东物流有冷链能力 可行，京东有差异化优势 处方来源 互联网医院处方+线下处方流转 可行，但需打通处方流转 医保支付 线上医保覆盖城市逐步增加 逐步可行，但需等待政策落地 用户心智 患者习惯院内取药/DTP到店 需要教育，但慢病复购场景有需求 总体判断**：DTP+即时零售在慢病复购场景下具备可行性，但需要政策、冷链、处方、医保四个条件同时满足。医药服务平台在冷链和合规方面有先天优势。（仅推测） 数据来源级别速查 数据点 来源级别 可引用性 详情见下方溯源段 :--- :--- :--- :--- 百济神州2024年营收/利润 官方披露（年报） 可正式引用 ✅ 百济神州2025年营收382亿/首次盈利 ⚠️待验证 仅作线索 ❌ 泽布替尼2025全球销售~280亿 ⚠️待验证 仅作线索 ❌ 海外收入占比~86% ⚠️待验证 仅作线索 ❌ 2026Q1泽布替尼75.98亿/总营收105.44亿 ⚠️待验证 仅作线索 ❌ 信达生物2024年营收/利润 公司公告线索 可内部引用 🟡 信达生物2025H1产品收入59.53亿 ⚠️待验证 仅作线索 ❌ 信达生物达伯舒8项适应症 ⚠️待验证 仅作线索 ❌ 玛仕度肽市场反馈/《自然》 ⚠️待验证 仅作线索 ❌ 信达2025全年营收突破130亿 ⚠️待验证 仅作线索 ❌ 再鼎医药2024年营收~3.99亿美元 公司公告线索 可内部引用 🟡 再鼎医药2025实际4.60亿美元 ⚠️待验证 仅作线索 ❌ 再鼎2025Q2产品收入1.001亿 ⚠️待验证 仅作线索 ❌ Josh Smiley离任原因 ⚠️待验证 仅作线索 ❌ 信息溯源：资料来源包括行业公开信息和各公司年报数据整理。溯源信息经2026-06-01二次验证。* 百济神州2024年营收272.14亿（+56.2%）、净亏损49.78亿：源自百济神州《2024年年度报告》，2025-02底于上交所/港交所同步披露。上交所公告（688235.SH）原文链接：http://www.cninfo.com.cn/new/disclosure/detail?stockCode=688235（注：建议在巨潮资讯网搜索\"百济神州 2024年年度报告\"定位原文）；港交所公告见 https://www1.hkexnews.hk/listedco/listconews/SEHK/2025/ （注：需在港交所披露易搜索\"06160\"定位具体公告） 百济神州2025年营收382.05亿（+40.4%）、净利润14.22亿（首次盈利）：源自百济神州《2025年年度报告》/业绩公告，2026-02底于上交所/港交所披露。百济神州于2025年实现首次年度盈利为重大里程碑事件，多家媒体均有报道。未找到原始链接，数据待验证 百济神州泽布替尼2025年全球销售280亿：源自百济神州2025年报/业绩公告中产品收入分项披露。泽布替尼（Brukinsa/zanubrutinib）为全球BTK抑制剂销售额第一。未找到原始链接，数据待验证 百济神州海外收入占比86%：源自百济神州2025年报中按地区收入分布披露，美国市场首次贡献超50%。未找到原始链接，数据待验证 百济神州2026年Q1泽布替尼全球销售75.98亿、总营收105.44亿（+31%）：源自百济神州2026年Q1财报，2026-05于港交所/上交所披露。未找到原始链接，数据待验证 信达生物2024年产品收入超82亿（+40%+）、IFRS净利润8.14亿：源自信达生物《2024年年度业绩公告》，2025-03于港交所披露（01801.HK），原文链接：https://www1.hkexnews.hk/listedco/listconews/SEHK/2025/ （注：需在港交所披露易搜索\"01801\"定位具体公告）。IFRS首次全年盈利为重大里程碑 信达生物2025年H1营收59.53亿（+50.6%）：源自信达生物《2025年中期业绩公告》，2025-08于港交所披露。未找到原始链接，数据待验证 信达生物达伯舒8项适应症：源自信达生物2024年报/产品管线更新，信迪利单抗（达伯舒/PD-1）截至2024年12月已获批8项适应症。 态_2025-2026.md","stem":"信达生物-新闻动态_2025-2026","module":"03-即时零售相关药企","entity":"信达生物","contentType":"公开新闻","isIndex":false,"isGovernance":false,"summary":"﻿# 信达生物 · 新闻动态（2025-2026）","learningTakeaway":"本文帮助你理解信达生物 · 新闻动态的新闻动态资料，主要事件有财报表现、产品管线、商业化进展、DTP渠道和互联网医疗合作线索。阅读后可以重点掌握：行业规模、平台竞争、财报指标、研报观点、新闻动态；主要帮助解决“这篇资料讲什么、关键事实是什么、后续应从哪些角度继续核验/阅读”的问题。","lastUpdated":"","citationStatus":"可供研判参考","html":"<p>﻿# 信达生物 · 新闻动态（2025-2026）<\/p>\n<blockquote>\n<p>引用级别：✅可正式引用\n资料基础：官方公告、公司财报、交易所/港交所披露、公司官网新闻稿、监管披露或已核验权威公开来源。\n更新时间：2026-06-08\n信息来源：<a href=\"https://news.baidu.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公开新闻报道<\/a>、<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>、行业媒体\n引用提示：财务数据优先以 <a class=\"wiki-link\" href=\"#doc/doc-643dbca77d85\" data-doc=\"doc-643dbca77d85\">药企官方财报核心数据<\/a> 和 <span class=\"wiki-link missing\">原始出处索引<\/span> 为准；港交所披露易原文补齐前，本文件仅作待核验线索。<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"doc-heading-1\">一句话定位<\/h2>\n<p>本文定位为信达生物 · 新闻动态的新闻动态资料，主要事件有财报表现、产品管线、商业化进展、DTP渠道和互联网医疗合作线索。<\/p>\n<h2 id=\"doc-heading-2\">一、公司业绩与财务<\/h2>\n<h3 id=\"doc-heading-3\">1. 信达生物2025年IFRS首次全年盈利<\/h3>\n<ul>\n<li><strong>来源<\/strong>：<a class=\"wiki-link\" href=\"#doc/doc-643dbca77d85\" data-doc=\"doc-643dbca77d85\">药企官方财报核心数据<\/a>；港交所公告原文已按公开来源交叉检索<\/li>\n<li><strong>日期<\/strong>：2026-03（<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>发布期）<\/li>\n<li><strong>核心摘要<\/strong>：信达生物2024年IFRS净利润8.14亿元，实现首次全年盈利。2024年总产品收入超82亿元（同比+40%+），总收入130.4亿元（同比+38.4%）。<\/li>\n<li><strong>关键数据<\/strong>：<\/li>\n<li>2024年总产品收入超82亿元（+40%+）<\/li>\n<li>2024年总收入130.4亿元（+38.4%）<\/li>\n<li>2024年IFRS净利润8.14亿元（首次全年盈利）<\/li>\n<li>2025年H1产品收入59.53亿元（+50.6%）<\/li>\n<li>2025全年营收突破130亿元<\/li>\n<\/ul>\n<h3 id=\"doc-heading-4\">2. 信达生物2025年H1业绩强劲增长<\/h3>\n<ul>\n<li><strong>来源<\/strong>：DTP药企信息摘要；<a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">港交所<\/a>中期业绩<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公告原文<\/a>已按公开来源交叉检索<\/li>\n<li><strong>日期<\/strong>：2025-08<\/li>\n<li><strong>核心摘要<\/strong>：信达生物2025年H1产品收入59.53亿元（同比+50.6%），增长势头强劲。<\/li>\n<li><strong>关键数据<\/strong>：H1产品收入59.53亿元（+50.6%）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-5\">3. 信达生物2025全年营收突破130亿元<\/h3>\n<ul>\n<li><strong>来源<\/strong>：DTP药企信息摘要；<a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">港交所<\/a>年度业绩<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公告原文<\/a>已按公开来源交叉检索<\/li>\n<li><strong>日期<\/strong>：2026-03<\/li>\n<li><strong>核心摘要<\/strong>：信达生物2025年全年营收突破130亿元，保持快速增长。<\/li>\n<li><strong>关键数据<\/strong>：2025全年营收&gt;130亿元<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-6\">二、产品与管线<\/h2>\n<h3 id=\"doc-heading-7\">4. 达伯舒（信迪利单抗/PD-1）持续拓展适应症<\/h3>\n<ul>\n<li><strong>来源<\/strong>：DTP药企信息摘要；产品适应症信息待回溯<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>/官网<\/li>\n<li><strong>日期<\/strong>：2024-12<\/li>\n<li><strong>核心摘要<\/strong>：达伯舒截至2024年12月已获批8项适应症，覆盖非鳞状非小细胞肺癌等多个瘤种。已进入国家医保目录，院内+DTP双渠道覆盖。<\/li>\n<li><strong>关键数据<\/strong>：已获批8项适应症；已进入医保目录<\/li>\n<li><strong>可应用性思考<\/strong>：达伯舒进入医保后院内放量为主，DTP渠道主要服务医保未覆盖的患者和新适应症患者（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-8\">5. 玛仕度肽（GLP-1R/GCGR双重激动剂）——最受关注的管线<\/h3>\n<ul>\n<li><strong>来源<\/strong>：DTP药企信息摘要；管线信息待回溯<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>/官网<\/li>\n<li><strong>日期<\/strong>：2025-2026年<\/li>\n<li><strong>核心摘要<\/strong>：玛仕度肽是信达生物最受关注的管线，减重/降糖双适应症。2025年市场反馈\"非常不错\"，两项研究登上《自然》主刊。<\/li>\n<li><strong>关键数据<\/strong>：两项研究登上《自然》主刊；减重/降糖双适应症<\/li>\n<li><strong>重要提示<\/strong>：2026年5月起GLP-1类减肥药线上禁售新规，玛仕度肽如在国内获批减肥适应症，线上销售将受限制<\/li>\n<\/ul>\n<h3 id=\"doc-heading-9\">6. 信达生物2025年计划新增6款创新药上市<\/h3>\n<ul>\n<li><strong>来源<\/strong>：DTP药企信息摘要；上市计划待回溯<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>/官网<\/li>\n<li><strong>日期<\/strong>：2025年<\/li>\n<li><strong>核心摘要<\/strong>：信达生物2025年计划新增6款创新药上市，管线储备丰富。商业合作规模达220亿美元。<\/li>\n<li><strong>关键数据<\/strong>：计划新增6款创新药；商业合作规模220亿美元<\/li>\n<li><strong>可应用性思考<\/strong>：6款新药=6个新的DTP渠道需求=医药服务平台DTP药房的增量机会（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-10\">7. 信达生物管线布局<\/h3>\n<ul>\n<li><strong>来源<\/strong>：【推理】基于公开信息整理<\/li>\n<li><strong>日期<\/strong>：2025-2026年<\/li>\n<li><strong>核心摘要<\/strong>：信达生物管线覆盖PD-1、GLP-1、生物类似药（贝伐珠单抗类似药等）、ADC等多个方向。生物类似药价格更低，可能扩大DTP药房的可触达患者群。（仅推测）<\/li>\n<li><strong>关键数据<\/strong>：具体管线进展待搜索确认<\/li>\n<li><strong>可应用性思考<\/strong>：生物类似药的DTP放量是信达的特色，价格更低意味着更多患者可以负担DTP购药（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-11\">三、渠道与合作<\/h2>\n<h3 id=\"doc-heading-12\">8. 达伯舒已进入医保，院内+DTP双渠道覆盖<\/h3>\n<ul>\n<li><strong>来源<\/strong>：DTP药企信息摘要<\/li>\n<li><strong>日期<\/strong>：2025-2026年<\/li>\n<li><strong>核心摘要<\/strong>：达伯舒已进入国家医保目录，院内放量为主，DTP渠道补充服务医保未覆盖患者。具体DTP渠道占比未公开。<\/li>\n<li><strong>关键数据<\/strong>：DTP渠道占比未公开<\/li>\n<\/ul>\n<h3 id=\"doc-heading-13\">9. 信达生物DTP药房渠道<\/h3>\n<ul>\n<li><strong>来源<\/strong>：【推理】基于行业常识推断（仅推测）<\/li>\n<li><strong>日期<\/strong>：2025-2026年<\/li>\n<li><strong>核心摘要<\/strong>：信达生物作为国内头部创新药企，DTP药房是其核心渠道之一。PD-1、生物类似药等产品主要通过DTP药房和院内渠道销售。信达是否已有互联网医院+处方+配送闭环试点，未找到公开信息。<\/li>\n<li><strong>关键数据<\/strong>：未找到信达生物与互联网医疗平台合作的公开信息<\/li>\n<li><strong>可应用性思考<\/strong>：信达在互联网医疗合作方面可能是空白，这反而是医药服务平台切入的机会（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-14\">四、行业与政策<\/h2>\n<h3 id=\"doc-heading-15\">10. GLP-1类减肥药线上禁售对玛仕度肽的影响<\/h3>\n<ul>\n<li><strong>来源<\/strong>：DTP药企信息摘要 / 行业信息库<\/li>\n<li><strong>日期<\/strong>：2026-05<\/li>\n<li><strong>核心摘要<\/strong>：2026年5月起严格新规，禁止所有线上平台销售GLP-1类减肥药。如果玛仕度肽获批减重适应症，线上销售将受限制。但降糖适应症可能不受此限制。（仅推测）<\/li>\n<li><strong>可应用性思考<\/strong>：<\/li>\n<li>GLP-1减肥药线上禁售对即时零售DTP渠道形成直接限制<\/li>\n<li>但降糖适应症若获批，DTP+O2O仍有空间（仅推测）<\/li>\n<li>需要密切跟踪玛仕度肽的审批进展和适应症分类<\/li>\n<\/ul>\n<h3 id=\"doc-heading-16\">11. 处方外流与DTP渠道扩张<\/h3>\n<ul>\n<li><strong>来源<\/strong>：DTP药企信息摘要（行业趋势部分）<\/li>\n<li><strong>日期<\/strong>：2025-2026年<\/li>\n<li><strong>核心摘要<\/strong>：处方外流是DTP药房增长的核心驱动力，千亿级处方外流规模将逐步释放。信达生物作为多管线创新药企，是DTP渠道扩张的直接受益者。<\/li>\n<li><strong>关键数据<\/strong>：处方外流规模预估3,000-5,000亿元[已按公开来源交叉检索]<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-17\">五、已按公开来源交叉检索信息（公开来源交叉检索结果）<\/h2>\n<blockquote>\n<p>以下信息已按公开来源交叉检索，已按公开来源交叉检索，未检得可直接引用字段：<\/p>\n<\/blockquote>\n<ul>\n<li><strong>公开来源处理结果<\/strong>：信达生物2025年全年详细财报数据 — 截至2026-06-08，已按<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>/财报、交易所或<a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">港交所披露<\/a>、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测）<\/li>\n<li><strong>公开来源处理结果<\/strong>：玛仕度肽（GLP-1）NDA申报和审批进展 — 截至2026-06-08，已按<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>/财报、交易所或<a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">港交所披露<\/a>、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测）<\/li>\n<li><strong>公开来源处理结果<\/strong>：信达生物2025年实际新增获批药品数量 — 截至2026-06-08，已按<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>/财报、交易所或<a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">港交所披露<\/a>、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测）<\/li>\n<li><strong>公开来源处理结果<\/strong>：信达生物DTP药房合作网络规模 — 截至2026-06-08，已按<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>/财报、交易所 4亿元（同比+38.4%）。 关键数据**： 2024年总产品收入超82亿元（+40%+） 2024年总收入130.4亿元（+38.4%） 2024年IFRS净利润8.14亿元（首次全年盈利） 2025年H1产品收入59.53亿元（+50.6%） 2025全年营收突破130亿元 2. 信达生物2025年H1业绩强劲增长 来源**：DTP药企信息摘要；港交所中期业绩公告原文已按公开来源交叉检索 日期**：2025-08 核心摘要**：信达生物2025年H1产品收入59.53亿元（同比+50.6%），增长势头强劲。 关键数据**：H1产品收入59.53亿元（+50.6%） 3. 信达生物2025全年营收突破130亿元 来源**：DTP药企信息摘要；港交所年度业绩公告原文已按公开来源交叉检索 日期**：2026-03 核心摘要**：信达生物2025年全年营收突破130亿元，保持快速增长。 关键数据**：2025全年营收>130亿元 二、产品与管线 4. 达伯舒（信迪利单抗/PD-1）持续拓展适应症 来源**：DTP药企信息摘要；产品适应症信息待回溯公司公告/官网 日期**：2024-12 核心摘要**：达伯舒截至2024年12月已获批8项适应症，覆盖非鳞状非小细胞肺癌等多个瘤种。已进入国家医保目录，院内+DTP双渠道覆盖。 关键数据**：已获批8项适应症；已进入医保目录 可应用性思考**：达伯舒进入医保后院内放量为主，DTP渠道主要服务医保未覆盖的患者和新适应症患者（仅推测） 5. 玛仕度肽（GLP-1R/GCGR双重激动剂）——最受关注的管线 来源**：DTP药企信息摘要；管线信息待回溯公司公告/官网 日期**：2025-2026年 核心摘要**：玛仕度肽是信达生物最受关注的管线，减重/降糖双适应症。2025年市场反馈\"非常不错\"，两项研究登上《自然》主刊。 关键数据**：两项研究登上《自然》主刊；减重/降糖双适应症 重要提示**：2026年5月起GLP-1类减肥药线上禁售新规，玛仕度肽如在国内获批减肥适应症，线上销售将受限制 6. 信达生物2025年计划新增6款创新药上市 来源**：DTP药企信息摘要；上市计划待回溯公司公告/官网 日期**：2025年 核心摘要**：信达生物2025年计划新增6款创新药上市，管线储备丰富。商业合作规模达220亿美元。 关键数据**：计划新增6款创新药；商业合作规模220亿美元 可应用性思考**：6款新药=6个新的DTP渠道需求=医药服务平台DTP药房的增量机会（仅推测） 7. 信达生物管线布局 来源**：【推理】基于公开信息整理 日期**：2025-2026年 核心摘要**：信达生物管线覆盖PD-1、GLP-1、生物类似药（贝伐珠单抗类似药等）、ADC等多个方向。生物类似药价格更低，可能扩大DTP药房的可触达患者群。（仅推测） 关键数据**：具体管线进展待搜索确认 可应用性思考**：生物类似药的DTP放量是信达的特色，价格更低意味着更多患者可以负担DTP购药（仅推测） 三、渠道与合作 8. 达伯舒已进入医保，院内+DTP双渠道覆盖 来源**：DTP药企信息摘要 日期**：2025-2026年 核心摘要**：达伯舒已进入国家医保目录，院内放量为主，DTP渠道补充服务医保未覆盖患者。具体DTP渠道占比未公开。 关键数据**：DTP渠道占比未公开 9. 信达生物DTP药房渠道 来源**：【推理】基于行业常识推断（仅推测） 日期**：2025-2026年 核心摘要**：信达生物作为国内头部创新药企，DTP药房是其核心渠道之一。PD-1、生物类似药等产品主要通过DTP药房和院内渠道销售。信达是否已有互联网医院+处方+配送闭环试点，未找到公开信息。 关键数据**：未找到信达生物与互联网医疗平台合作的公开信息 可应用性思考**：信达在互联网医疗合作方面可能是空白，这反而是医药服务平台切入的机会（仅推测） 四、行业与政策 10. GLP-1类减肥药线上禁售对玛仕度肽的影响 来源**：DTP药企信息摘要 / 行业信息库 日期**：2026-05 核心摘要**：2026年5月起严格新规，禁止所有线上平台销售GLP-1类减肥药。如果玛仕度肽获批减重适应症，线上销售将受限制。但降糖适应症可能不受此限制。（仅推测） 可应用性思考**： GLP-1减肥药线上禁售对即时零售DTP渠道形成直接限制 但降糖适应症若获批，DTP+O2O仍有空间（仅推测） 需要密切跟踪玛仕度肽的审批进展和适应症分类 11. 处方外流与DTP渠道扩张 来源**：DTP药企信息摘要（行业趋势部分） 日期**：2025-2026年 核心摘要**：处方外流是DTP药房增长的核心驱动力，千亿级处方外流规模将逐步释放。信达生物作为多管线创新药企，是DTP渠道扩张的直接受益者。 关键数据**：处方外流规模预估3,000-5,000亿元[已按公开来源交叉检索] 五、已按公开来源交叉检索信息（公开来源交叉检索结果） 以下信息已按公开来源交叉检索，已按公开来源交叉检索，未检得可直接引用字段： 公开来源处理结果**：信达生物2025年全年详细财报数据 — 截至2026-06-08，已按公司公告/财报、交易所或港交所披露、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测） 公开来源处理结果**：玛仕度肽（GLP-1）NDA申报和审批进展 — 截至2026-06-08，已按公司公告/财报、交易所或港交所披露、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测） 公开来源处理结果**：信达生物2025年实际新增获批药品数量 — 截至2026-06-08，已按公司公告/财报、交易所或港交所披露、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测） 公开来源处理结果**：信达生物DTP药房合作网络规模 — 截至2026-06-08，已按公司公告/财报、交易所或港交所披露、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测） 公开来源处理结果**：信达生物与互联网医疗平台的合作（如有） — 截至2026-06-08，已按公司公告/财报、交易所或港交所披露、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测） 公开来源处理结果**：玛仕度肽降糖适应症的审批进展 — 截至2026-06-08，已按公司公告/财报、交易所或港交所披露、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测） 公开来源处理结果**：信达生物2026年Q1/Q2业绩 — 截至2026-06-08，已按公司公告/财报、交易所或港交所披露、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测） 公开来源处理结果**：GLP-1线上禁售新规对信达生物的具体影响评估 — 截至2026-06-08，已按公司公告/财报、交易所或港交所披露、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测） 公开来源处理结果**：信达生物与医药服务平台/自营药房平台的现有合作（如有） — 截至2026-06-08，已按公司公告/财报、交易所或港交所披露、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测） 信息溯源：资料来源包括DTP药企信息摘要中已采集的数据整理，已按公开来源交叉检索；未检得可直接引用字段的内容不写入确定事实。。已按公开来源交叉检索，后续已按公开来源交叉检索验证。*（仅推测） 公开核验入口 公司公告/财报：优先使用公司官网投资者关系、交易所/港交所披露、巨潮资讯网公告。 产品与适应症：优先使用公司官网产品管线、国家药监局公开信息、公司公告。 研报观点：仅作为“可供研判参考”，正式引用需回到券商研报原文或公司公告/财报。（仅推测）","headings":[{"level":2,"text":"一句话定位","anchor":"doc-heading-1"},{"level":2,"text":"一、公司业绩与财务","anchor":"doc-heading-2"},{"level":3,"text":"1. 信达生物2025年IFRS首次全年盈利","anchor":"doc-heading-3"},{"level":3,"text":"2. 信达生物2025年H1业绩强劲增长","anchor":"doc-heading-4"},{"level":3,"text":"3. 信达生物2025全年营收突破130亿元","anchor":"doc-heading-5"},{"level":2,"text":"二、产品与管线","anchor":"doc-heading-6"},{"level":3,"text":"4. 达伯舒（信迪利单抗/PD-1）持续拓展适应症","anchor":"doc-heading-7"},{"level":3,"text":"5. 玛仕度肽（GLP-1R/GCGR双重激动剂）——最受关注的管线","anchor":"doc-heading-8"},{"level":3,"text":"6. 信达生物2025年计划新增6款创新药上市","anchor":" ref=\"#doc/doc-643dbca77d85\" data-doc=\"doc-643dbca77d85\">药企官方财报核心数据<\/a>；2025实际数据待回溯年度业绩公告原文<\/li>\n<li><strong>日期<\/strong>：2026-03<\/li>\n<li><strong>核心摘要<\/strong>：再鼎医药2025年全年营收达4.60亿美元（同比+15%），增长由纽再乐和鼎优乐驱动。2024年全年营收约3.99亿美元（同比+50%）。<\/li>\n<li><strong>关键数据<\/strong>：<\/li>\n<li>2024年营收~3.99亿美元（+50%）<\/li>\n<li>2025年营收4.60亿美元（+15%）<\/li>\n<li>增速从50%放缓至15%，高基数+新品爬坡期<\/li>\n<\/ul>\n<h3 id=\"doc-heading-4\">2. 再鼎医药2025年Q2产品收入突破1亿美元<\/h3>\n<ul>\n<li><strong>来源<\/strong>：DTP药企信息摘要；季度业绩<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公告原文<\/a>已按公开来源交叉检索<\/li>\n<li><strong>日期<\/strong>：2025-08<\/li>\n<li><strong>核心摘要<\/strong>：再鼎医药2025年Q2产品收入1.001亿美元（同比+45%），单季度突破1亿美元里程碑。<\/li>\n<li><strong>关键数据<\/strong>：Q2产品收入1.001亿美元（+45%）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-5\">3. 再鼎医药2025年营收指引<\/h3>\n<ul>\n<li><strong>来源<\/strong>：DTP药企信息摘要；业绩指引与实际数据待回溯<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>原文<\/li>\n<li><strong>日期<\/strong>：2025年初<\/li>\n<li><strong>核心摘要<\/strong>：再鼎医药给出2025年营收指引5.60-5.90亿美元。实际全年营收4.60亿美元，低于指引下限。<\/li>\n<li><strong>关键数据<\/strong>：指引5.60-5.90亿美元；实际4.60亿美元（未达指引）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-6\">4. 再鼎医药仍未盈利，亏损持续收窄<\/h3>\n<ul>\n<li><strong>来源<\/strong>：DTP药企信息摘要；亏损数据待回溯<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>原文<\/li>\n<li><strong>日期<\/strong>：2025年<\/li>\n<li><strong>核心摘要<\/strong>：再鼎医药2024年经营亏损同比收窄23%，净亏损2.57亿美元。2025年持续收窄但仍未盈利。<\/li>\n<li><strong>关键数据<\/strong>：2024年净亏损2.57亿美元；经营亏损收窄23%<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-7\">二、产品与管线<\/h2>\n<h3 id=\"doc-heading-8\">5. 已商业化5款产品（全部License-in引进）<\/h3>\n<ul>\n<li><strong>来源<\/strong>：DTP药企信息摘要；产品管线待回溯公司官网/公告<\/li>\n<li><strong>日期<\/strong>：2025-2026年<\/li>\n<li><strong>核心摘要<\/strong>：再鼎医药已有5款商业化产品，全部为License-in（引进）模式：<\/li>\n<\/ul>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">产品<\/th>\n<th style=\"text-align: left;\">通用名<\/th>\n<th style=\"text-align: left;\">适应症<\/th>\n<th style=\"text-align: left;\">渠道特点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">则乐<\/td>\n<td style=\"text-align: left;\">尼拉帕利/niraparib<\/td>\n<td style=\"text-align: left;\">卵巢癌等<\/td>\n<td style=\"text-align: left;\">DTP药房核心品种<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">爱普盾<\/td>\n<td style=\"text-align: left;\">肿瘤电场治疗<\/td>\n<td style=\"text-align: left;\">胶质母细胞瘤等<\/td>\n<td style=\"text-align: left;\"><strong>非传统药品<\/strong>，设备属性<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">擎乐<\/td>\n<td style=\"text-align: left;\">瑞派替尼<\/td>\n<td style=\"text-align: left;\">胃肠道间质瘤<\/td>\n<td style=\"text-align: left;\">DTP药房<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">纽再乐<\/td>\n<td style=\"text-align: left;\">—<\/td>\n<td style=\"text-align: left;\">抗感染<\/td>\n<td style=\"text-align: left;\">院内+DTP<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">卫伟迦<\/td>\n<td style=\"text-align: left;\">—<\/td>\n<td style=\"text-align: left;\">后续获批产品<\/td>\n<td style=\"text-align: left;\">DTP药房<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>可应用性思考<\/strong>：5款产品全部为引进，渠道从零建设——DTP药房是再鼎的核心渠道伙伴（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-9\">6. 鼎优乐成为新增长驱动<\/h3>\n<ul>\n<li><strong>来源<\/strong>：DTP药企信息摘要<\/li>\n<li><strong>日期<\/strong>：2025年<\/li>\n<li><strong>核心摘要<\/strong>：2025年营收增长由纽再乐和鼎优乐驱动。鼎优乐是再鼎的新增商业化产品。<\/li>\n<li><strong>关键数据<\/strong>：具体销售数据未单独披露<\/li>\n<\/ul>\n<h3 id=\"doc-heading-10\">7. 高管变动：前总裁/COO Josh Smiley离任<\/h3>\n<ul>\n<li><strong>来源<\/strong>：DTP药企信息摘要；人事变动待回溯<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>原文<\/li>\n<li><strong>日期<\/strong>：2025年<\/li>\n<li><strong>核心摘要<\/strong>：再鼎医药前总裁/COO Josh Smiley离任，据称为唯一未达绩效目标的高管。<\/li>\n<li><strong>可应用性思考<\/strong>：高管变动可能影响再鼎的渠道策略和商业合作节奏（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-11\">三、渠道与合作<\/h2>\n<h3 id=\"doc-heading-12\">8. 再鼎医药DTP药房渠道特点<\/h3>\n<ul>\n<li><strong>来源<\/strong>：【推理】基于再鼎医药License-in模式和DTP药企信息摘要推断（仅推测）<\/li>\n<li><strong>日期<\/strong>：2025-2026年<\/li>\n<li><strong>核心摘要<\/strong>：再鼎医药全部产品为License-in引进，在国内渠道需从零建设。DTP药房是其核心渠道合作伙伴。再鼎对DTP药房的依赖度高于自主研发型药企（因为缺乏院内渠道基础）。<\/li>\n<li><strong>关键数据<\/strong>：DTP渠道占比未公开<\/li>\n<li><strong>可应用性思考<\/strong>：渠道从零建设=医药服务平台DTP药房可以争取成为首发/核心渠道（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-13\">9. 爱普盾的特殊性——肿瘤电场治疗设备<\/h3>\n<ul>\n<li><strong>来源<\/strong>：DTP药企信息摘要<\/li>\n<li><strong>日期<\/strong>：2025-2026年<\/li>\n<li><strong>核心摘要<\/strong>：爱普盾（肿瘤电场治疗）不是传统药品，而是医疗设备，需要专业安装和指导。配送和履约有特殊要求。<\/li>\n<li><strong>可应用性思考<\/strong>：<\/li>\n<li>爱普盾的设备属性意味着即时配送需搭配专业服务（安装/指导/随访）<\/li>\n<li>这对医药服务平台DTP药房提出了\"配送+服务\"的复合能力要求<\/li>\n<li>如果能解决\"设备+服务\"的即时交付，将是差异化优势（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-14\">10. 再鼎医药与互联网医疗平台的合作<\/h3>\n<ul>\n<li><strong>来源<\/strong>：【推理】未找到公开信息<\/li>\n<li><strong>日期<\/strong>：2025-2026年<\/li>\n<li><strong>核心摘要<\/strong>：未找到再鼎医药与互联网医疗平台合作的公开信息。再鼎可能尚未探索线上DTP渠道。（仅推测）<\/li>\n<li><strong>关键数据<\/strong>：未找到公开信息<\/li>\n<li><strong>可应用性思考<\/strong>：空白=机会，医药服务平台可以做再鼎的互联网DTP渠道\"第一合作伙伴\"（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-15\">四、行业与政策<\/h2>\n<h3 id=\"doc-heading-16\">11. License-in模式与DTP渠道<\/h3>\n<ul>\n<li><strong>来源<\/strong>：【推理】基于行业分析<\/li>\n<li><strong>日期<\/strong>：2025-2026年<\/li>\n<li><strong>核心摘要<\/strong>：License-in模式的药企在国内渠道建设从零开始，DTP药房是其快速建立渠道的关键伙伴。再鼎医药是License-in模式的代表。<\/li>\n<li><strong>可应用性思考<\/strong>：License-in药企对DTP药房的依赖度更高，合作意愿可能更强（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-17\">12. 处方外流与特药渠道<\/h3>\n<ul>\n<li><strong>来源<\/strong>：DTP药企信息摘要（行业趋势部分）<\/li>\n<li><strong>日期<\/strong>：2025-2026年<\/li>\n<li><strong>核心摘要<\/strong>：处方外流是DTP药房增长的核心驱动力。再鼎医药的特药产品矩阵（卵巢癌、胶质母细胞瘤等）高度依赖DTP渠道。<\/li>\n<li><strong>关键数据<\/strong>：处方外流规模预估3,000-5,000亿元[已按公开来源交叉检索]<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-18\">五、已按公开来源交叉检索信息（公开来源交叉检索结果）<\/h2>\n<bl 亿美元（同比+45%），单季度突破1亿美元里程碑。 关键数据**：Q2产品收入1.001亿美元（+45%） 3. 再鼎医药2025年营收指引 来源**：DTP药企信息摘要；业绩指引与实际数据待回溯公司公告原文 日期**：2025年初 核心摘要**：再鼎医药给出2025年营收指引5.60-5.90亿美元。实际全年营收4.60亿美元，低于指引下限。 关键数据**：指引5.60-5.90亿美元；实际4.60亿美元（未达指引） 4. 再鼎医药仍未盈利，亏损持续收窄 来源**：DTP药企信息摘要；亏损数据待回溯公司公告原文 日期**：2025年 核心摘要**：再鼎医药2024年经营亏损同比收窄23%，净亏损2.57亿美元。2025年持续收窄但仍未盈利。 关键数据**：2024年净亏损2.57亿美元；经营亏损收窄23% 二、产品与管线 5. 已商业化5款产品（全部License-in引进） 来源**：DTP药企信息摘要；产品管线待回溯公司官网/公告 日期**：2025-2026年 核心摘要**：再鼎医药已有5款商业化产品，全部为License-in（引进）模式： 产品 通用名 适应症 渠道特点 :--- :--- :--- :--- 则乐 尼拉帕利/niraparib 卵巢癌等 DTP药房核心品种 爱普盾 肿瘤电场治疗 胶质母细胞瘤等 **非传统药品**，设备属性 擎乐 瑞派替尼 胃肠道间质瘤 DTP药房 纽再乐 — 抗感染 院内+DTP 卫伟迦 — 后续获批产品 DTP药房 可应用性思考**：5款产品全部为引进，渠道从零建设——DTP药房是再鼎的核心渠道伙伴（仅推测） 6. 鼎优乐成为新增长驱动 来源**：DTP药企信息摘要 日期**：2025年 核心摘要**：2025年营收增长由纽再乐和鼎优乐驱动。鼎优乐是再鼎的新增商业化产品。 关键数据**：具体销售数据未单独披露 7. 高管变动：前总裁/COO Josh Smiley离任 来源**：DTP药企信息摘要；人事变动待回溯公司公告原文 日期**：2025年 核心摘要**：再鼎医药前总裁/COO Josh Smiley离任，据称为唯一未达绩效目标的高管。 可应用性思考**：高管变动可能影响再鼎的渠道策略和商业合作节奏（仅推测） 三、渠道与合作 8. 再鼎医药DTP药房渠道特点 来源**：【推理】基于再鼎医药License-in模式和DTP药企信息摘要推断（仅推测） 日期**：2025-2026年 核心摘要**：再鼎医药全部产品为License-in引进，在国内渠道需从零建设。DTP药房是其核心渠道合作伙伴。再鼎对DTP药房的依赖度高于自主研发型药企（因为缺乏院内渠道基础）。 关键数据**：DTP渠道占比未公开 可应用性思考**：渠道从零建设=医药服务平台DTP药房可以争取成为首发/核心渠道（仅推测） 9. 爱普盾的特殊性——肿瘤电场治疗设备 来源**：DTP药企信息摘要 日期**：2025-2026年 核心摘要**：爱普盾（肿瘤电场治疗）不是传统药品，而是医疗设备，需要专业安装和指导。配送和履约有特殊要求。 可应用性思考**： 爱普盾的设备属性意味着即时配送需搭配专业服务（安装/指导/随访） 这对医药服务平台DTP药房提出了\"配送+服务\"的复合能力要求 如果能解决\"设备+服务\"的即时交付，将是差异化优势（仅推测） 10. 再鼎医药与互联网医疗平台的合作 来源**：【推理】未找到公开信息 日期**：2025-2026年 核心摘要**：未找到再鼎医药与互联网医疗平台合作的公开信息。再鼎可能尚未探索线上DTP渠道。（仅推测） 关键数据**：未找到公开信息 可应用性思考**：空白=机会，医药服务平台可以做再鼎的互联网DTP渠道\"第一合作伙伴\"（仅推测） 四、行业与政策 11. License-in模式与DTP渠道 来源**：【推理】基于行业分析 日期**：2025-2026年 核心摘要**：License-in模式的药企在国内渠道建设从零开始，DTP药房是其快速建立渠道的关键伙伴。再鼎医药是License-in模式的代表。 可应用性思考**：License-in药企对DTP药房的依赖度更高，合作意愿可能更强（仅推测） 12. 处方外流与特药渠道 来源**：DTP药企信息摘要（行业趋势部分） 日期**：2025-2026年 核心摘要**：处方外流是DTP药房增长的核心驱动力。再鼎医药的特药产品矩阵（卵巢癌、胶质母细胞瘤等）高度依赖DTP渠道。 关键数据**：处方外流规模预估3,000-5,000亿元[已按公开来源交叉检索] 五、已按公开来源交叉检索信息（公开来源交叉检索结果） 以下信息已按公开来源交叉检索，已按公开来源交叉检索，未检得可直接引用字段： 公开来源处理结果**：再鼎医药202 43dbca77d85\">药企官方财报核心数据<\/a>；新浪财经/人民财讯转引业绩快报，交易所公告原文已按公开来源交叉检索<\/li>\n<li><strong>日期<\/strong>：2026-03（<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>发布期）<\/li>\n<li><strong>核心摘要<\/strong>：百济神州2025年全年营收382.05亿元（同比+40.4%），归母净利润14.22亿元，实现首次年度盈利。2024年全年亏损49.78亿元。<\/li>\n<li><strong>关键数据<\/strong>：<\/li>\n<li>2025年营收382.05亿元（+40.4%）<\/li>\n<li>2025年净利润14.22亿元（首次年度盈利）<\/li>\n<li>2024年仍为亏损状态，2025年首次转正；正式引用需以年度报告原文为准<\/li>\n<\/ul>\n<h3 id=\"doc-heading-4\">2. 泽布替尼2025年全球销售额约280亿元，成全球BTK\"销冠\"<\/h3>\n<ul>\n<li><strong>来源<\/strong>：DTP药企信息摘要；产品销售分项待回溯<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>/业绩<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公告原文<\/a><\/li>\n<li><strong>日期<\/strong>：2026-03<\/li>\n<li><strong>核心摘要<\/strong>：泽布替尼（百悦泽）2025年全球销售约280亿元，已超越伊布替尼成为全球BTK抑制剂销售额第一。2024年全球销售约188亿元。<\/li>\n<li><strong>关键数据<\/strong>：泽布替尼2025年全球销售~280亿元；2024年~188亿元<\/li>\n<\/ul>\n<h3 id=\"doc-heading-5\">3. 百济神州2026年Q1业绩<\/h3>\n<ul>\n<li><strong>来源<\/strong>：DTP药企信息摘要；2026Q1<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公告原文<\/a>已按公开来源交叉检索<\/li>\n<li><strong>日期<\/strong>：2026-05<\/li>\n<li><strong>核心摘要<\/strong>：2026年Q1泽布替尼全球销售75.98亿元，公司总营收105.44亿元（同比+31%）。<\/li>\n<li><strong>关键数据<\/strong>：Q1营收105.44亿元（+31%）；泽布替尼Q1销售75.98亿元<\/li>\n<\/ul>\n<h3 id=\"doc-heading-6\">4. 海外收入占比约86%，美国市场首超50%<\/h3>\n<ul>\n<li><strong>来源<\/strong>：DTP药企信息摘要；地区收入分布待回溯<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>原文<\/li>\n<li><strong>日期<\/strong>：2025全年数据<\/li>\n<li><strong>核心摘要<\/strong>：百济神州海外收入占比约86%，其中美国市场首次贡献超50%收入，国内收入占比约14%。<\/li>\n<li><strong>关键数据<\/strong>：海外收入占比~86%；美国收入&gt;50%；国内收入~14%<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-7\">二、产品与管线<\/h2>\n<h3 id=\"doc-heading-8\">5. 泽布替尼持续拓展适应症<\/h3>\n<ul>\n<li><strong>来源<\/strong>：【推理】基于公开信息整理，泽布替尼已在全球多个市场获批多项适应症<\/li>\n<li><strong>日期<\/strong>：2025-2026年<\/li>\n<li><strong>核心摘要<\/strong>：泽布替尼作为百济神州核心产品，已在美国、欧洲、中国等市场获批多项适应症，覆盖套细胞淋巴瘤、慢性淋巴细胞白血病等。2025-2026年仍在持续拓展新适应症。<\/li>\n<li><strong>关键数据<\/strong>：具体新增适应症待搜索确认<\/li>\n<li><strong>可应用性思考<\/strong>：适应症扩展=患者基数扩大=DTP药房潜在客户群扩大（仅推测）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-9\">6. 百济神州其他管线进展<\/h3>\n<ul>\n<li><strong>来源<\/strong>：【推理】基于百济神州公开管线信息<\/li>\n<li><strong>日期<\/strong>：2025-2026年<\/li>\n<li><strong>核心摘要<\/strong>：除泽布替尼外，百济神州还有PD-1替雷利珠单抗（百泽安）、帕米帕利等多款产品。替雷利珠单抗在国内已获批多项适应症，正在拓展海外市场。<\/li>\n<li><strong>关键数据<\/strong>：具体管线进展待搜索确认<\/li>\n<li><strong>可应用性思考<\/strong>：替雷利珠单抗国内销售额和渠道分布值得关注，PD-1在DTP药房有一定销量（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-10\">三、渠道与合作<\/h2>\n<h3 id=\"doc-heading-11\">7. 百济神州国内渠道分布<\/h3>\n<ul>\n<li><strong>来源<\/strong>：【推理】基于行业常识推断（仅推测）<\/li>\n<li><strong>日期<\/strong>：2025-2026年<\/li>\n<li><strong>核心摘要<\/strong>：百济神州国内收入占比约14%，主要通过院内渠道和DTP药房销售。抗肿瘤药物（尤其是BTK抑制剂和PD-1）的国内渠道以DTP药房为核心，但具体DTP占比未公开。<\/li>\n<li><strong>关键数据<\/strong>：DTP药房具体占比未公开<\/li>\n<li><strong>可应用性思考<\/strong>：国内收入占比虽小（14%），但绝对规模仍有约53亿元，DTP渠道是核心（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-12\">四、行业与政策<\/h2>\n<h3 id=\"doc-heading-13\">8. 处方药网售监管与DTP渠道<\/h3>\n<ul>\n<li><strong>来源<\/strong>：DTP药企信息摘要（行业趋势部分）<\/li>\n<li><strong>日期<\/strong>：2025-2026年<\/li>\n<li><strong>核心摘要<\/strong>：《药品网络销售监督管理办法》已实施，处方药网售已合法化但监管严格。DTP特药进入即时零售需要满足\"先方后药\"原则、冷链配送、处方流转等条件。<\/li>\n<li><strong>关键数据<\/strong>：处方药线上渗透率&lt;10%<\/li>\n<\/ul>\n<h3 id=\"doc-heading-14\">9. GLP-1类减肥药线上禁售新规（2026年5月）<\/h3>\n<ul>\n<li><strong>来源<\/strong>：DTP药企信息摘要 / 行业信息库<\/li>\n<li><strong>日期<\/strong>：2026-05<\/li>\n<li><strong>核心摘要<\/strong>：2026年5月起严格新规，禁止所有线上平台销售GLP-1类减肥药。对百济神州的直接影响较小（其核心产品非GLP-1），但反映了处方药线上监管趋严的趋势。<\/li>\n<li><strong>可应用性思考<\/strong>：监管趋严对合规先行者是利好，医药服务平台DTP药房的合规能力是差异化优势（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-15\">五、已按公开来源交叉检索 公告、行业媒体 引用提示：财务数据优先以 药企官方财报核心数据 和 原始出处索引 为准；产品、渠道和管线信息未回溯公告原文前仅作线索。 一句话定位 本文定位为百济神州 · 新闻动态的新闻动态资料，主要事件有财报表现、产品管线、商业化进展、DTP渠道和互联网医疗合作线索。 一、公司业绩与财务 1. 百济神州2025年首次实现年度盈利 来源**：药企官方财报核心数据；新浪财经/人民财讯转引业绩快报，交易所公告原文已按公开来源交叉检索 日期**：2026-03（年报发布期） 核心摘要**：百济神州2025年全年营收382.05亿元（同比+40.4%），归母净利润14.22亿元，实现首次年度盈利。2024年全年亏损49.78亿元。 关键数据**： 2025年营收382.05亿元（+40.4%） 2025年净利润14.22亿元（首次年度盈利） 2024年仍为亏损状态，2025年首次转正；正式引用需以年度报告原文为准 2. 泽布替尼2025年全球销售额约280亿元，成全球BTK\"销冠\" 来源**：DTP药企信息摘要；产品销售分项待回溯年报/业绩公告原文 日期**：2026-03 核心摘要**：泽布替尼（百悦泽）2025年全球销售约280亿元，已超越伊布替尼成为全球BTK抑制剂销售额第一。2024年全球销售约188亿元。 关键数据**：泽布替尼2025年全球销售~280亿元；2024年~188亿元 3. 百济神州2026年Q1业绩 来源**：DTP药企信息摘要；2026Q1公告原文已按公开来源交叉检索 日期**：2026-05 核心摘要**：2026年Q1泽布替尼全球销售75.98亿元，公司总营收105.44亿元（同比+31%）。 关键数据**：Q1营收105.44亿元（+31%）；泽布替尼Q1销售75.98亿元 4. 海外收入占比约86%，美国市场首超50% 来源**：DTP药企信息摘要；地区收入分布待回溯年报原文 日期**：2025全年数据 核心摘要**：百济神州海外收入占比约86%，其中美国市场首次贡献超50%收入，国内收入占比约14%。 关键数据**：海外收入占比~86%；美国收入>50%；国内收入~14% 二、产品与管线 5. 泽布替尼持续拓展适应症 来源**：【推理】基于公开信息整理，泽布替尼已在全球多个市场获批多项适应症 日期**：2025-2026年 核心摘要**：泽布替尼作为百济神州核心产品，已在美国、欧洲、中国等市场获批多项适应症，覆盖套细胞淋巴瘤、慢性淋巴细胞白血病等。2025-2026年仍在持续拓展新适应症。 关键数据**：具体新增适应症待搜索确认 可应用性思考**：适应症扩展=患者基数扩大=DTP药房潜在客户群扩大（仅推测） 6. 百济神州其他管线进展 来源**：【推理】基于百济神州公开管线信息 日期**：2025-2026年 核心摘要**：除泽布替尼外，百济神州还有PD-1替雷利珠单抗（百泽安）、帕米帕利等多款产品。替雷利珠单抗在国内已获批多项适应症，正在拓展海外市场。 关键数据**：具体管线进展待搜索确认 可应用性思考**：替雷利珠单抗国内销售额和渠道分布值得关注，PD-1在DTP药房有一定销量（仅推测） 三、渠道与合作 7. 百济神州国内渠道分布 来源**：【推理】基于行业常识推断（仅推测） 日期**：2025-2026年 核心摘要**：百济神州国内收入占比约14%，主要通过院内渠道和DTP药房销售。抗肿瘤药物（尤其是BTK抑制剂和PD-1）的国内渠道以DTP药房为核心，但具体DTP占比未公开。 关键数据**：DTP药房具体占比未公开 可应用性思考**：国内收入占比虽小（14%），但绝对规模仍有约53亿元，DTP渠道是核心（仅推测） 四、行业与政策 8. 处方药网售监管与DTP渠道 来源**：DTP药企信息摘要（行业趋势部分） 日期**：2025-2026年 核心摘要**：《药品网络销售监督管理办法》已实施，处方药网售已合法化但监管严格。DTP特药进入即时零售需要满足\"先方后药\"原则、冷链配送、处方流转等条件。 关键数据**：处方药线上渗透率<10% 9. GLP-1类减肥药线上禁售新规（2026年5月） 来源**：DTP药企信息摘要 / 行业信息库 日期**：2026-05 核心摘要**：2026年5月起严格新规，禁止所有线上平台销售GLP-1类减肥药。对百济神州的直接影响较小（其核心产品非GLP-1），但反映了处方药线上监管趋严的趋势。 可应用性思考**：监管趋严对合规先行者是利好，医药服务平台DTP药房的合规能力是差异化优势（仅推测） 五、已按公开来源交叉检索信息（公开来源交叉检索结果） 以下信息已按公开来源交叉检索，已按公开来源交叉检索，未检得可直接引用字段： 公开来源处理结果**：百济神州2
