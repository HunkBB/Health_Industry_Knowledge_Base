<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>即时零售医药行业信息库</title>
<style>
:root {
  --paper: #f6f7f4;
  --paper-2: #ebe8df;
  --panel: #ffffff;
  --ink: #17202a;
  --muted: #66717f;
  --soft: #8b95a2;
  --line: #d9dedb;
  --line-strong: #bfc8c2;
  --blue: #315f8f;
  --red: #b7352c;
  --green: #2f6f5e;
  --gold: #a46d18;
  --purple: #67568a;
  --shadow: 0 18px 42px rgba(23,32,42,.08);
  --radius: 8px;
  --serif: "Georgia", "Times New Roman", "Noto Serif SC", "Songti SC", serif;
  --sans: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background:
    linear-gradient(90deg, rgba(23,32,42,.035) 1px, transparent 1px) 0 0/48px 48px,
    linear-gradient(180deg, #fafaf8 0%, var(--paper) 42%, #f1f3ef 100%);
  color: var(--ink);
  font-family: var(--sans);
  line-height: 1.65;
}
button, input { font: inherit; }
button {
  appearance: none;
  -webkit-appearance: none;
  cursor: pointer;
  color: inherit;
}
a { color: inherit; }
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  height: 64px;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 28px;
  background: rgba(250,250,248,.92);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(16px);
}
.brand {
  display: flex;
  flex-direction: column;
  min-width: 218px;
  letter-spacing: 0;
}
.brand strong { font-size: 15px; line-height: 1.2; }
.brand span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.nav-tabs {
  display: flex;
  gap: 4px;
  padding: 4px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.72);
  border-radius: var(--radius);
}
.nav-tabs button {
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 7px 12px;
  border-radius: 6px;
  font-size: 13px;
}
.nav-tabs button.active {
  color: var(--ink);
  background: var(--panel);
  box-shadow: 0 2px 10px rgba(23,32,42,.08);
}
.global-search {
  flex: 1;
  max-width: 520px;
  margin-left: auto;
  position: relative;
}
.global-search input {
  width: 100%;
  border: 1px solid var(--line-strong);
  background: #fff;
  border-radius: var(--radius);
  height: 38px;
  padding: 0 14px 0 40px;
  color: var(--ink);
  outline: none;
  box-shadow: 0 2px 16px rgba(23,32,42,.04);
}
.global-search input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(49,95,143,.12); }
.search-mark { position: absolute; left: 13px; top: 8px; color: var(--muted); }
.auth-area {
  min-width: 118px;
  display: flex;
  justify-content: flex-end;
}
.auth-button,
.logout-button {
  border: 1px solid var(--line-strong);
  background: #fff;
  border-radius: 6px;
  padding: 7px 11px;
  font-size: 13px;
  color: #24313e;
}
.auth-button:hover,
.logout-button:hover { border-color: var(--blue); color: var(--blue); }
.auth-user {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 12px;
}
.auth-user strong { color: var(--ink); font-size: 13px; }
.locked-section {
  min-height: calc(100vh - 120px);
  display: grid;
  place-items: start center;
  padding: 86px 24px;
}
.login-card {
  width: min(440px, 100%);
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 28px;
}
.login-card .kicker { margin-bottom: 14px; }
.login-card h2 {
  margin: 0;
  font-family: var(--serif);
  font-size: 30px;
  line-height: 1.2;
}
.login-card p {
  margin: 10px 0 20px;
  color: var(--muted);
}
.login-form {
  display: grid;
  gap: 12px;
}
.login-form label {
  display: grid;
  gap: 6px;
  color: #283543;
  font-size: 13px;
  font-weight: 700;
}
.login-form input {
  width: 100%;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  padding: 10px 11px;
  outline: 0;
  background: #fbfbf9;
}
.login-form input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(49,95,143,.12);
}
.login-submit {
  margin-top: 4px;
  border: 1px solid #17202a;
  background: #17202a;
  color: #fff;
  border-radius: 6px;
  padding: 10px 12px;
  font-weight: 700;
}
.login-error {
  min-height: 18px;
  color: var(--red);
  font-size: 12px;
}
.page {
  min-height: calc(100vh - 64px);
}
.view { display: none; }
.view.active { display: block; }
.hero {
  max-width: 1240px;
  margin: 0 auto;
  padding: 34px 28px 24px;
}
.hero-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.06fr) minmax(360px, .94fr);
  gap: 28px;
  align-items: stretch;
  border: 1px solid rgba(22, 104, 127, .16);
  border-radius: 34px;
  padding: 28px;
  background:
    radial-gradient(circle at 5% 0%, rgba(49, 174, 167, .18), transparent 34%),
    linear-gradient(135deg, rgba(255,255,255,.96), rgba(235, 248, 247, .88));
  box-shadow: 0 24px 70px rgba(14, 66, 86, .10);
  overflow: hidden;
  position: relative;
}
.hero-grid::after {
  content: "";
  position: absolute;
  inset: auto -80px -130px auto;
  width: 340px;
  height: 340px;
  border-radius: 999px;
  background: rgba(34, 151, 159, .10);
}
.hero-copy { position: relative; z-index: 1; }
.kicker {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  color: #0f6f7f;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .12em;
  font-weight: 800;
}
.kicker::before {
  content: "";
  width: 34px;
  height: 1px;
  background: #0f6f7f;
}
.hero h1 {
  font-family: var(--serif);
  font-size: clamp(42px, 5.4vw, 76px);
  line-height: 1.02;
  letter-spacing: -.03em;
  margin: 18px 0 18px;
  max-width: 820px;
}
.hero-lead {
  max-width: 780px;
  color: #39424c;
  font-size: 18px;
  line-height: 1.75;
}
.hero-actions { display:flex; gap:12px; flex-wrap:wrap; margin-top:20px; }
.hero-search {
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: 560px;
  min-height: 48px;
  padding: 0 14px;
  border: 1px solid rgba(15,111,127,.20);
  border-radius: 999px;
  background: rgba(255,255,255,.86);
  box-shadow: 0 12px 30px rgba(14,66,86,.07);
}
.hero-search input {
  flex: 1;
  border: 0;
  background: transparent;
  outline: 0;
  font-size: 15px;
  color: var(--ink);
}
.medical-visual {
  position: relative;
  z-index: 1;
  min-height: 360px;
  border-radius: 28px;
  background:
    linear-gradient(145deg, rgba(19,90,118,.95), rgba(18,148,151,.78)),
    radial-gradient(circle at 80% 20%, rgba(255,255,255,.28), transparent 28%);
  color: #fff;
  overflow: hidden;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.20);
}
.medical-visual::before {
  content: "";
  position:absolute;
  inset:0;
  opacity:.22;
  background-image: linear-gradient(rgba(255,255,255,.24) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.24) 1px, transparent 1px);
  background-size: 34px 34px;
}
.medical-visual-inner { position:relative; padding:26px; height:100%; }
.visual-badge { display:inline-flex; align-items:center; gap:8px; border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.12); border-radius:999px; padding:7px 11px; font-size:12px; }
.pill-scene { position:absolute; inset:70px 24px 24px; min-height:80%; display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); grid-template-rows: minmax(156px, 1fr) minmax(124px, .78fr); gap:16px; justify-content:stretch; align-content:stretch; align-items:stretch; }
.med-card { position:relative; border:1px solid rgba(255,255,255,.30); background:rgba(255,255,255,.16); backdrop-filter: blur(8px); border-radius:24px; padding:16px; box-shadow:0 18px 40px rgba(0,0,0,.12); color:#fff; text-align:left; cursor:pointer; display:flex; flex-direction:column; justify-content:space-between; align-items:stretch; min-width:0; min-height:0; overflow:hidden; transition: transform .16s ease, background .16s ease; }
.med-card:hover { transform: translateY(-2px); background:rgba(255,255,255,.22); }
.med-card.news { grid-column:1; grid-row:1; width:100%; height:100%; }
.med-card.drug { grid-column:2; grid-row:1; width:100%; height:100%; }
.med-card.chart { grid-column:1 / -1; grid-row:2; min-height:124px; padding:16px 18px; justify-content:center; gap:8px; }
.med-icon { font-size:30px; margin-bottom:8px; line-height:1; }
.med-card h3 { margin:0 0 5px; font-size:18px; line-height:1.22; color:#fff; }
.med-card p { margin:0; color:rgba(255,255,255,.80); font-size:13px; line-height:1.42; }
.med-card-link { margin-top:10px; color:#fff; font-weight:800; font-size:13px; line-height:1.2; }
.med-card.chart .med-card-link { margin-top:10px; transform:none; }
.chart-line { margin-top:8px; height:24px; border-radius:12px; background: linear-gradient(135deg, transparent 45%, rgba(255,255,255,.75) 47%, transparent 50%), linear-gradient(90deg, rgba(255,255,255,.10), rgba(255,255,255,.18)); }
.btn {
  border: 1px solid var(--ink);
  background: var(--ink);
  color: #fff;
  min-height: 38px;
  padding: 8px 13px;
  border-radius: var(--radius);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
}
.btn.secondary { background: transparent; color: var(--ink); border-color: var(--line-strong); }
.executive-panel {
  background: rgba(255,255,255,.86);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
  margin-top: 8px;
}
.snapshot-section {
  max-width: 1240px;
  margin: 0 auto;
  padding: 18px 28px 70px;
}
.snapshot-section .executive-panel { margin-top: 0; }
.briefing-section {
  max-width: 1240px;
  margin: 0 auto;
  padding: 18px 28px 20px;
}
.weekly-layout { display:grid; grid-template-columns: minmax(0,.95fr) minmax(0,1.35fr); gap:14px; align-items:stretch; }
.weekly-lead-card {
  border: 1px solid rgba(15,111,127,.18);
  border-radius: 26px;
  background: linear-gradient(145deg, #fff, #edf9f8);
  padding: 22px;
  min-height: 100%;
  box-shadow: var(--shadow-sm);
}
.weekly-lead-card .news-icon { width:52px; height:52px; display:grid; place-items:center; border-radius:18px; background:rgba(15,111,127,.10); font-size:26px; margin-bottom:14px; }
.weekly-grid, .radar-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.briefing-card, .radar-card {
  border: 1px solid var(--line);
  border-radius: 22px;
  background: rgba(255,255,255,.92);
  padding: 18px;
  box-shadow: var(--shadow-sm);
}
.briefing-card { display:flex; flex-direction:column; min-height: 232px; }
.card-action { margin-top:auto; padding-top:8px; }
.briefing-card h3, .radar-card h3 { margin: 8px 0 4px; font-family: var(--serif); font-size: 19px; }
.briefing-card p, .radar-card p { color: var(--muted); margin: 3px 0 8px; line-height:1.55; }
.radar-section { position: relative; }
.radar-card { position:relative; overflow:hidden; }
.radar-card::before { content:""; position:absolute; inset:auto -42px -64px auto; width:150px; height:150px; border-radius:999px; border:1px solid rgba(15,111,127,.14); box-shadow:0 0 0 18px rgba(15,111,127,.035),0 0 0 38px rgba(15,111,127,.025); }
.radar-top { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; position:relative; }
.platform-mark { width:42px; height:42px; display:grid; place-items:center; border-radius:16px; background:rgba(15,111,127,.09); font-weight:800; color:#0f6f7f; }
.radar-signals { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; position:relative; }
.snapshot-section .metric-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.panel-title {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}
.panel-title h2 { font-size: 15px; margin: 0; }
.panel-title span { color: var(--muted); font-size: 12px; }
.metric-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
.metric { border-left: 2px solid var(--blue); padding: 2px 0 2px 12px; }
.metric strong { display: block; font-family: var(--serif); font-size: 26px; line-height: 1.1; }
.metric span { color: var(--muted); font-size: 12px; }
.issue-section, .path-section, .search-section, .library-section { max-width: 1240px; margin: 0 auto; padding: 26px 28px; }
.section-head { display: flex; justify-content: space-between; align-items: end; gap: 18px; margin-bottom: 16px; }
.section-head h2 { font-family: var(--serif); font-size: 30px; margin: 0; }
.section-head p { max-width: 560px; margin: 0; color: var(--muted); font-size: 14px; }
.issue-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.issue-card {
  background: rgba(255,255,255,.92);
  border: 1px solid var(--line);
  border-radius: 26px;
  min-height: 292px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: 0 8px 24px rgba(23,32,42,.045);
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.issue-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: rgba(15,111,127,.28); }
.issue-card-top { display:flex; align-items:center; gap:12px; }
.issue-icon { width:48px; height:48px; display:grid; place-items:center; border-radius:18px; background:rgba(15,111,127,.08); font-size:25px; }
.issue-card .eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.issue-card h3 { margin: 0; font-size: 20px; line-height: 1.28; }
.issue-card p { margin: 0; color: #46515c; font-size: 14px; }
.issue-card .takeaway { border-top: 1px solid var(--line); padding-top: 12px; color: var(--ink); }
.keyword-strip { display:flex; gap:6px; flex-wrap:wrap; margin:2px 0 4px; }
.issue-footer { margin-top: auto; display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
.tag {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--line);
  color: var(--muted);
  background: rgba(255,255,255,.76);
  border-radius: 999px;
  padding: 3px 9px;
  font-size: 12px;
}
.text-link { border: 0; background: transparent; color: var(--blue); padding: 0; text-align: left; font-weight: 700; cursor:pointer; }
.accent-blue { border-top: 3px solid var(--blue); }
.accent-red { border-top: 3px solid var(--red); }
.accent-green { border-top: 3px solid var(--green); }
.accent-purple { border-top: 3px solid var(--purple); }
.accent-gold { border-top: 3px solid var(--gold); }
.accent-ink { border-top: 3px solid var(--ink); }
.path-strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border: 1px solid var(--line); background: rgba(255,255,255,.82); border-radius: var(--radius); overflow: hidden; }
.path-step { min-height: 164px; padding: 16px; border-right: 1px solid var(--line); }
.path-step:last-child { border-right: 0; }
.path-step .num { font-family: var(--serif); font-size: 34px; color: var(--red); }
.path-step h3 { margin: 5px 0 8px; font-size: 15px; }
.path-step p { margin: 0; color: var(--muted); font-size: 13px; }
.search-layout {
  display: grid;
  grid-template-columns: 320px minmax(0, 1fr);
  gap: 18px;
}
.query-panel, .result-panel, .doc-shell, .library-panel, .issue-detail {
  background: rgba(255,255,255,.9);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 10px 28px rgba(23,32,42,.045);
}
.query-panel { padding: 18px; }
.query-panel h3 { margin: 0 0 12px; font-size: 16px; }
.quick-query {
  width: 100%;
  text-align: left;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: var(--radius);
  padding: 10px 11px;
  margin: 0 0 8px;
  color: #34404c;
}
.quick-query:hover { border-color: var(--blue); }
.result-panel { padding: 18px; min-height: 420px; }
.result-item {
  border-bottom: 1px solid var(--line);
  padding: 14px 0;
}
.result-item:first-child { padding-top: 0; }
.result-item:last-child { border-bottom: 0; }
.result-kind {
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .08em;
  font-size: 11px;
  font-weight: 700;
}
.result-item h3 { margin: 4px 0 6px; font-size: 18px; }
.result-item p { margin: 0 0 8px; color: #46515c; font-size: 14px; }
mark { background: #fff1b8; color: inherit; padding: 0 2px; }
.issue-page {
  max-width: 1240px;
  margin: 0 auto;
  padding: 32px 28px 70px;
}
.issue-detail {
  padding: 28px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: 28px;
}
.issue-detail h1 {
  font-family: var(--serif);
  font-size: 42px;
  line-height: 1.08;
  margin: 10px 0 16px;
}
.related-list { display: grid; gap: 10px; }
.related-doc {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: var(--radius);
  padding: 12px;
}
.related-doc h4 { margin: 0 0 5px; font-size: 15px; }
.related-doc p { margin: 0; color: var(--muted); font-size: 13px; }
.recommended-groups { display: grid; gap: 18px; margin-top: 12px; }
.recommended-group { border: 1px solid var(--line); border-radius: 20px; background: rgba(255,255,255,.88); padding: 16px; }
.recommended-group h3 { margin: 0 0 12px; font-size: 18px; font-family: var(--serif); }
.recommended-doc-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.recommended-doc { border: 1px solid var(--line); border-radius: 16px; padding: 12px; background: #fff; }
.recommended-doc h4 { margin: 0 0 6px; font-size: 15px; }
.recommended-doc p { margin: 0; color: var(--muted); font-size: 13px; }
.group-entry-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }
.group-entry-card { border: 1px solid var(--line); border-radius: 20px; background: #fff; padding: 16px; text-align: left; cursor: pointer; box-shadow: var(--shadow-sm); transition: transform .16s ease, border-color .16s ease; }
.group-entry-card:hover { transform: translateY(-2px); border-color: rgba(19, 90, 118, .35); }
.group-entry-icon { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; background: rgba(19, 90, 118, .08); font-size: 22px; margin-bottom: 10px; }
.group-entry-card h3 { margin: 0 0 6px; font-size: 18px; font-family: var(--serif); color: var(--ink); }
.group-entry-card p { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
.group-doc-list { display: grid; gap: 12px; margin-top: 18px; }
.group-doc-card { border: 1px solid var(--line); border-radius: 18px; padding: 15px; background: #fff; }
.group-doc-card h3 { margin: 0 0 6px; font-size: 18px; }
.group-doc-card p { margin: 0; color: var(--muted); }
.doc-page {
  max-width: 1440px;
  margin: 0 auto;
  padding: 24px 24px 72px;
}
.doc-shell {
  display: grid;
  grid-template-columns: 248px minmax(0, 1fr) 336px;
  gap: 0;
  overflow: hidden;
}
.doc-nav, .doc-aside {
  padding: 22px;
  background: #fbfbf9;
}
.doc-nav { border-right: 1px solid var(--line); }
.doc-aside { border-left: 1px solid var(--line); }
.doc-main { padding: 26px 38px 38px; min-width: 0; }
.outline-list {
  list-style: none;
  margin: 10px 0 0;
  padding: 0;
  display: grid;
  gap: 6px;
  min-width: 0;
  max-width: 100%;
  overflow: hidden;
}
.outline-list li {
  min-width: 0;
  max-width: 100%;
  overflow: hidden;
}
.outline-item {
  display: inline-block;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  padding: 5px 8px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: #4b5968;
  font-size: 13px;
  line-height: 1.35;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-align: left;
  box-sizing: border-box;
}

/* Home reading path emphasis: make 01-06 feel like a recommended roadmap. */
.path-section {
  max-width: 1180px;
  margin: 22px auto 36px;
  padding: 36px 34px 40px;
  border: 1px solid rgba(38, 99, 118, .13);
  border-radius: 30px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.98), rgba(244,250,250,.94)),
    radial-gradient(circle at 14% 0%, rgba(54,171,169,.12), transparent 36%),
    radial-gradient(circle at 88% 16%, rgba(15,111,127,.07), transparent 30%);
  box-shadow: 0 24px 60px rgba(19, 67, 86, .11);
}
.path-section .section-head {
  margin-bottom: 24px;
  align-items: flex-start;
}
.path-section .section-head h2 {
  font-size: clamp(34px, 3.1vw, 42px);
  letter-spacing: -.035em;
  color: #13283b;
}
.path-section .section-head p {
  max-width: 760px;
  font-size: 15.5px;
  color: #44535f;
  line-height: 1.7;
}
.path-strip {
  position: relative;
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 14px;
  border: 0;
  background: transparent;
  border-radius: 0;
  overflow: visible;
}
.path-strip::before {
  content: ";
  position: absolute;
  left: 8%;
  right: 8%;
  top: 47px;
  height: 2px;
  background: linear-gradient(90deg, rgba(20,112,132,.10), rgba(20,112,132,.44), rgba(20,112,132,.10));
  z-index: 0;
}
.path-step {
  position: relative;
  z-index: 1;
  min-height: 190px;
  padding: 18px 16px 17px;
  border: 1px solid rgba(27, 74, 92, .11) !important;
  border-radius: 22px;
  background: rgba(255,255,255,.95) !important;
  box-shadow: 0 12px 30px rgba(22, 58, 74, .085);
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}
.path-step:hover {
  transform: translateY(-3px);
  box-shadow: 0 18px 40px rgba(22, 58, 74, .14);
  border-color: rgba(20,112,132,.24) !important;
}
.path-step:not(:last-child)::after {
  content: →;
  position: absolute;
  right: -15px;
  top: 36px;
  width: 19px;
  height: 19px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: #0f6f7f;
  background: #f4fbfb;
  border: 1px solid rgba(20,112,132,.17);
  font-size: 13px;
  font-weight: 900;
  z-index: 2;
}
.path-step .num {
  width: 50px;
  height: 35px;
  min-height: 35px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 14px;
  font-family: var(--serif);
  font-size: 20px;
  line-height: 1;
  color: #0f6f7f;
  background: rgba(15,111,127,.09);
  border: 1px solid rgba(15,111,127,.15);
}
.path-step h3 {
  min-height: 42px;
  margin: 0 0 8px;
  font-size: 16px;
  line-height: 1.3;
  color: #17212b;
}
.path-step p {
  min-height: auto;
  margin: 0;
  color: #5f6d78;
  font-size: 13px;
  line-height: 1.55;
}

ath":"01-即时零售平台/美团-美团买药/公开新闻/美团即时零售与买药新闻动态_2025-2026.md","stem":"美团即时零售与买药新闻动态_2025-2026","module":"01-即时零售平台","entity":"美团-美团买药","contentType":"公开新闻","isIndex":false,"isGovernance":false,"summary":"引用级别：✅可正式引用","learningTakeaway":"本文帮助你理解美团即时零售/美团买药 公开新闻动态的新闻动态资料，主要事件有平台补贴竞争、供给网络扩张、品类合作、即时履约和医药零售相关业务变化。阅读后可以重点掌握：行业规模、平台竞争、财报指标、新闻动态、政策监管；主要帮助解决“这篇资料讲什么、关键事实是什么、后续应从哪些角度继续核验/阅读”的问题。","lastUpdated":"","citationStatus":"可正式引用","html":"<h1>美团即时零售/美团买药 公开新闻动态（2025-2026）<\/h1>\n<blockquote>\n<p>引用级别：✅可正式引用\n资料基础：官方公告、公司财报、交易所/港交所披露、公司官网新闻稿、监管披露或已核验权威公开来源。<\/p>\n<p>更新时间：2026-06-08\n信息来源：Google News RSS 聚合、维基百科、<a href=\"https://36kr.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">36氪<\/a>、<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a>、<a href=\"https://xueqiu.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">雪球<\/a>、<a href=\"https://www.ebrun.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">亿邦动力网<\/a>等<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"doc-heading-1\">一句话定位<\/h2>\n<p>本文定位为美团即时零售/美团买药 公开新闻动态的新闻动态资料，主要事件有平台补贴竞争、供给网络扩张、品类合作、即时履约和医药零售相关业务变化。<\/p>\n<h2 id=\"doc-heading-2\">一、美团闪购与即时零售<\/h2>\n<h3 id=\"doc-heading-3\">1. 闪电仓重仓即时零售<\/h3>\n<ul>\n<li><strong>标题<\/strong>：美团闪购携3万家闪电仓重仓即时零售<\/li>\n<li><strong>来源<\/strong>：<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a><\/li>\n<li><strong>日期<\/strong>：2025-06<\/li>\n<li><strong>原文链接<\/strong>：<a href=\"https://finance.sina.com.cn\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\"><a class=\"external-link\" href=\"https://finance.sina.com.cn\" target=\"_blank\" rel=\"noopener noreferrer\">https://finance.sina.com.cn<\/a><\/a> （搜索\"美团闪购携3万家闪电仓\"可找到原文）<\/li>\n<li><strong>核心摘要<\/strong>：美团闪购以3万家闪电仓（前置仓模式）为核心抓手，大规模拓展即时零售品类覆盖。闪电仓是美团即时零售双轨模式中的\"平台仓\"部分，与自营的小象超市并行。<\/li>\n<li><strong>关键数据<\/strong>：3万家闪电仓<\/li>\n<\/ul>\n<h3 id=\"doc-heading-4\">2. 即时零售双轨并行：闪电仓 + 小象超市<\/h3>\n<ul>\n<li><strong>标题<\/strong>：即时零售双轨并行，小象超市扛旗自营<\/li>\n<li><strong>来源<\/strong>：<a href=\"https://www.21jingji.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">21财经<\/a><\/li>\n<li><strong>日期<\/strong>：2025-06<\/li>\n<li><strong>原文链接<\/strong>：<a href=\"https://www.21jingji.com\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\"><a class=\"external-link\" href=\"https://www.21jingji.com\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.21jingji.com<\/a><\/a><\/li>\n<li><strong>核心摘要<\/strong>：美团2025年零售战略确立为\"闪电仓+小象超市\"双轮驱动。闪电仓负责平台模式（招商），小象超市负责自营模式（买货卖货）。王莆中定调即时零售为\"一种高确定性的生活方式\"。<\/li>\n<li><strong>关键数据<\/strong>：双轨模式明确<\/li>\n<\/ul>\n<h3 id=\"doc-heading-5\">3. 美团App为闪购新增独立入口<\/h3>\n<ul>\n<li><strong>标题<\/strong>：美团App为闪购新增独立入口<\/li>\n<li><strong>来源<\/strong>：行业报道<\/li>\n<li><strong>日期<\/strong>：2025-04<\/li>\n<li><strong>核心摘要<\/strong>：美团在App内为闪购业务新增独立入口，提升即时零售在用户侧的可见度和流量权重。<\/li>\n<\/ul>\n<h3 id=\"doc-heading-6\">4. 美团日单量峰值达1.5亿<\/h3>\n<ul>\n<li><strong>标题<\/strong>：美团日单量1.5亿！巨头\"烧钱\"鏖战即时零售<\/li>\n<li><strong>来源<\/strong>：<a href=\"https://www.stcn.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">证券时报<\/a><\/li>\n<li><strong>日期<\/strong>：2025-07-12<\/li>\n<li><strong>核心摘要<\/strong>：在补贴大战高峰期，美团日订单量达到1.5亿单。但大规模补贴导致利润严重受损，Q2利润同比暴跌89%。<\/li>\n<li><strong>关键数据<\/strong>：日单量1.5亿<\/li>\n<\/ul>\n<h3 id=\"doc-heading-7\">5. 美团即时零售品类扩展：白酒业重注<\/h3>\n<ul>\n<li><strong>标题<\/strong>：白酒业618重注即时零售<\/li>\n<li><strong>来源<\/strong>：<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a><\/li>\n<li><strong>日期<\/strong>：2026-05-27<\/li>\n<li><strong>核心摘要<\/strong>：茅台、五粮液等头部白酒品牌与美团闪购合作，借即时零售渠道触达消费者。即时零售正从应急品类向高客单价 discretionary 品类延伸。<\/li>\n<li><strong>关键数据<\/strong>：头部白酒品牌入驻美团闪购<\/li>\n<\/ul>\n<h3 id=\"doc-heading-8\">6. 即时零售平台开放基建网络<\/h3>\n<ul>\n<li><strong>标题<\/strong>：即时零售平台开放基建网络<\/li>\n<li><strong>来源<\/strong>：<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a><\/li>\n<li><strong>日期<\/strong>：2026-03-23<\/li>\n<li><strong>核心摘要<\/strong>：即时零售平台向更多品类商家开放履约基建网络，酒水饮料行业加速入驻。<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-9\">二、小象超市<\/h2>\n<h3 id=\"doc-heading-10\">7. 小象超市规模第二、增速第一<\/h3>\n<ul>\n<li><strong>标题<\/strong>：王兴称小象\"规模第二，增速第一\"<\/li>\n<li><strong>来源<\/strong>：风闻<\/li>\n<li><strong>日期<\/strong>：2025-11<\/li>\n<li><strong>核心摘要<\/strong>：王兴在内部/公开场合表示，小象超市在生鲜电商赛道中规模排名第二，但增速排名第一。线上GMV接近3000亿。<\/li>\n<li><strong>关键数据<\/strong>：线上GMV接近3000亿；规模第二、增速第一<\/li>\n<\/ul>\n<h3 id=\"doc-heading-11\">8. 小象超市重启线下店<\/h3>\n<ul>\n<li><strong>标题<\/strong>：小象超市重启线下店，美团放不下超市梦<\/li>\n<li><strong>来源<\/strong>：<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a><\/li>\n<li><strong>日期<\/strong>：2025-04（启动）/ 2025-12（北京首店）/ 2026-01（宁波拓店）<\/li>\n<li><strong>核心摘要<\/strong>：小象超市在北京开出首家线下门店，随后拓展至宁波。美团重启线下超市门店，与盒马形成\"生鲜1V1\"对垒态势。<\/li>\n<li><strong>关键数据<\/strong>：北京首店开业、宁波拓店<\/li>\n<\/ul>\n<h3 id=\"doc-heading-12\">9. 小象超市近1000个前置仓，覆盖所有一二线城市<\/h3>\n<ul>\n<li><strong>标题<\/strong>：小象超市将覆盖所有一二线城市<\/li>\n<li><strong>来源<\/strong>：<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a><\/li>\n<li><strong>日期<\/strong>：2025-06<\/li>\n<li><strong>核心摘要<\/strong>：小象超市全国近1000个前置仓，计划覆盖所有一二线城市。<\/li>\n<li><strong>关键数据<\/strong>：近1000个前置仓<\/li>\n<\/ul>\n<h3 id=\"doc-heading-13\">10. 美团收购叮咚买菜（50亿元/7.17亿美元）<\/h3>\n<ul>\n<li><strong>标题<\/strong>：美团为小象进货，50亿拿下叮咚买菜<\/li>\n<li><strong>来源<\/strong>：<a href=\"https://www.21jingji.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">21财经<\/a> / <a href=\"https://36kr.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">36氪<\/a> / <a href=\"https://www.cls.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">财联社<\/a><\/li>\n<li><strong>日期<\/strong>：2026-02-05<\/li>\n<li><strong>原文链接<\/strong>：<a href=\"https://www.21jingji.com\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\"><a class=\"external-link\" href=\"https://www.21jingji.com\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.21jingji.com<\/a><\/a> （搜索\"美团50亿叮咚买菜\"可找到原文）<\/li>\n<li><strong>核心摘要<\/strong>：美团以约50亿元人民币（7.17亿美元）收购叮咚买菜国内业务，由小象超市承接约1000个前置仓。这是2026年本地生活首笔超大型并购，标志着独立前置仓模式的终结。36氪评价\"美团捡了个大便宜\"。<\/li>\n<li><strong>关键数据<\/strong>：收购价格50亿元/7.17亿美元；约1000个前置仓；叮咚买菜创始人内部信\"决定放下较量\"<\/li>\n<\/ul>\n<h3 id=\"doc-heading-14\">11. 小象超市出海：Keemart登陆沙特<\/h3>\n<ul>\n<li><strong>标题<\/strong>：Keemart在沙特上线，美团全面国际化出海加速<\/li>\n<li><strong>来源<\/strong>：行业报道<\/li>\n<li><strong>日期<\/strong>：2025-05<\/li>\n<li><strong>核心摘要<\/strong>：小象超市海外版\"Keemart\"在沙特阿拉伯上线，美团自营零售开启国际化。<\/li>\n<\/ul>\n<h3 id=\"doc-heading-15\">12. 收购后竞购朴朴超市<\/h3>\n<ul>\n<li><strong>标题<\/strong>：朴朴超市成下一争夺标的，阿里美团竞标<\/li>\n<li><strong>来源<\/strong>：雷峰网等<\/li>\n<li><strong>日期<\/strong>：2026-02 之后<\/li>\n<li><strong>核心摘要<\/strong>：叮咚买菜被收购后，朴朴超市成为下一个争夺标的，阿里、京东、美团竞标，估值20-50亿美元（远超叮咚价格）。京东公开否认参与。<\/li>\n<li><strong>关键数据<\/strong>：朴朴估值20-50亿美元<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-16\">三、美团优选（社区团购）<\/h2>\n<h3 id=\"doc-heading-17\">13. 美团优选退出亏损省份<\/h3>\n<ul>\n<li><strong>标题<\/strong>：晚点独家丨美团优选退出亏损省份<\/li>\n<li><strong>来源<\/strong>：晚点LatePost（<a href=\"https://xueqiu.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">雪球<\/a>转载）<\/li>\n<li><strong>日期<\/strong>：2025-06<\/li>\n<li><strong>核心摘要<\/strong>：美团优选大范围退出亏损省份，5年未盈利。新业务5年亏损超千亿，美团优选退场为小象让路。<\/li>\n<li><strong>关键数据<\/strong>：5年亏损超千亿<\/li>\n<\/ul>\n<h3 id=\"doc-heading-18\">14. 美团优选全国关停<\/h3>\n<ul>\n<li><strong>标题<\/strong>：美团优选全国关停，社区团购格局一家独大<\/li>\n<li><strong>来源<\/strong>：<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a><\/li>\n<li><strong>日期<\/strong>：2025-12<\/li>\n<li><strong>核心摘要<\/strong>：美团优选在2025年底前基本完成全国关停，社区团购赛道只剩多多买菜一家独大。华尔街见闻评论\"美团优选后退，小象超市向前\"。<\/li>\n<li><strong>关键数据<\/strong>：美团优选全国关停<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-19\">四、美团买药 / 医药健康<\/h2>\n<h3 id=\"doc-heading-20\">15. 美团买药累计交易用户超3亿<\/h3>\n<ul>\n<li><strong>标题<\/strong>：美团医药累计交易用户突破3亿<\/li>\n<li><strong>来源<\/strong>：美团官方 / 央广网<\/li>\n<li><strong>日期<\/strong>：2024-08<\/li>\n<li><strong>核心摘要<\/strong>：美团买药累计交易用户突破3亿，与药店和药企合作构建\"15分钟医疗卫生服务圈\"。<\/li>\n<li><strong>关键数据<\/strong>：累计交易用户超3亿<\/li>\n<\/ul>\n<h3 id=\"doc-heading-21\">16. 美团买药与医疗器械五巨头深化合作<\/h3>\n<ul>\n<li><strong>标题<\/strong>：美团医药健康联手医疗器械五巨头<\/li>\n<li><strong>来源<\/strong>：<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a> / <a href=\"https://www.ebrun.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">亿邦动力网<\/a><\/li>\n<li><strong>日期<\/strong>：2026-04<\/li>\n<li><strong>核心摘要<\/strong>：美团医药健康与鱼跃、海氏海诺等头部医疗器械品牌深化合作，开拓即时零售新主场。医疗器械品类增速超35%，头部品牌集体转向即时零售。<\/li>\n<li><strong>关键数据<\/strong>：医疗器械增速超35%<\/li>\n<\/ul>\n<h3 id=\"doc-heading-22\">17. 美团VS淘宝闪购在医疗赛道正面硬刚<\/h3>\n<ul>\n<li><strong>标题<\/strong>：美团VS淘宝闪购，在医疗赛道正面硬刚，底牌全亮了<\/li>\n<li><strong>来源<\/strong>：<a href=\"https://36kr.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">36氪<\/a><\/li>\n<li><strong>日期<\/strong>：2026-04-20<\/li>\n<li><strong>核心摘要<\/strong>：美团和淘宝闪购在医疗健康品类展开直接竞争，双方底牌尽出。这是即时零售竞争从外卖/生鲜向医疗健康纵深发展的标志事件。<\/li>\n<\/ul>\n<h3 id=\"doc-heading-23\">18. 美团AI+医疗场景应用<\/h3>\n<ul>\n<li><strong>标题<\/strong>：美团李晓辉：正探索AI+医疗场景应用<\/li>\n<li><strong>来源<\/strong>：新华网<\/li>\n<li><strong>日期<\/strong>：2025-04-09<\/li>\n<li><strong>核心摘要<\/strong>：美团医药健康负责人李晓辉表示正探索AI+医疗场景应用，将通过开放生态构建合作共赢。<\/li>\n<\/ul>\n<h3 id=\"doc-heading-24\">19. 美团试点AI经营管家助力药店经营<\/h3>\n<ul>\n<li><strong>标题<\/strong>：美团试点应用AI经营管家帮助医药商家长效经营<\/li>\n<li><strong>来源<\/strong>：<a href=\"https://www.ebrun.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">亿邦动力网<\/a><\/li>\n<li><strong>日期<\/strong>：2026-04-14<\/li>\n<li><strong>核心摘要<\/strong>：美团推出AI经营管家工具，帮助药店商家在即时零售平台上实现更长效的经营优化。<\/li>\n<\/ul>\n<h3 id=\"doc-heading-25\">20. 美团、阿里、京东竞逐AI医药服务赛道<\/h3>\n<ul>\n<li><strong>标题<\/strong>：美团、阿里、京东竞逐AI医药服务赛道<\/li>\n<li><strong>来源<\/strong>：第一财经<\/li>\n<li><strong>日期<\/strong>：2026-04-14<\/li>\n<li><strong>核心摘要<\/strong>：三大平台在AI医药服务领域展开新一轮竞逐，从药品配送延伸到AI问诊、健康管理。<\/li>\n<\/ul>\n<h3 id=\"doc-heading-26\">21. 拜耳与美团深化合作<\/h3>\n<ul>\n<li><strong>标题<\/strong>：拜耳与美团深化合作，\"智享健康，聚力向新\"<\/li>\n<li><strong>来源<\/strong>：新华网<\/li>\n<li><strong>日期<\/strong>：2024-11<\/li>\n<li><strong>核心摘要<\/strong>：拜耳与美团买药达成深度合作，在OTC药品的即时零售渠道上进一步深入。<\/li>\n<\/ul>\n<h3 id=\"doc-heading-27\">22. 同仁堂拥抱即时零售<\/h3>\n<ul>\n<li><strong>标题<\/strong>：北京同仁堂升级与美团合作，355年老店拥抱即时零售<\/li>\n<li><strong>来源<\/strong>：新京报<\/li>\n<li><strong>日期<\/strong>：2024-03<\/li>\n<li><strong>核心摘要<\/strong>：北京同仁堂大栅栏店（355年历史）升级与美团买药合作，正式入驻即时零售。<\/li>\n<\/ul>\n<h3 id=\"doc-heading-28\">23. O2O买药药店加速跑通<\/h3>\n<ul>\n<li><strong>标题<\/strong>：大批药店，跑通O2O<\/li>\n<li><strong>来源<\/strong>：<a href=\"https://news.qq.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">腾讯新闻<\/a><\/li>\n<li><strong>日期<\/strong>：2026-02<\/li>\n<li><strong>核心摘要<\/strong>：越来越多的线下药店成功跑通O2O模式，线上下单、即时配送成为药店新增长通道。<\/li>\n<\/ul>\n<h3 id=\"doc-heading-29\">24. 药店行业面临大规模关店<\/h3>\n<ul>\n<li><strong>标题<\/strong>：京东、美团、阿里\"三雄割据\"，70万家药店面临洗牌，30万家或关店<\/li>\n<li><strong>来源<\/strong>：中华网财经<\/li>\n<li><strong>日期<\/strong>：2025-12<\/li>\n<li><strong>核心摘要<\/strong>：在三大平台竞争压力下，全国约70万家线下药店面临洗牌，预估30万家可能关闭。O2O正在重塑药店生态。（仅推测）<\/li>\n<li><strong>关键数据<\/strong>：70万家药店面临洗牌；30万家或关店<\/li>\n<\/ul>\n<h3 id=\"doc-heading-30\">25. 监管：5月新规禁止线上销售GLP-1减肥药<\/h3>\n<ul>\n<li><strong>标题<\/strong>：5月网购新规：GLP-1减肥药全网禁售<\/li>\n<li><strong>来源<\/strong>：搜狐网<\/li>\n<li><strong>日期<\/strong>：2026-05<\/li>\n<li><strong>核心摘要<\/strong>：2026年5月起严格新规，禁止所有线上平台销售GLP-1类减肥药。对美团买药、饿了么买药等平台的处方药品类产生影响。<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-31\">五、美团2025年整体财务表现<\/h2>\n<h3 id=\"doc-heading-32\">26. 2025全年收入3649亿元，净亏损234亿元<\/h3>\n<ul>\n<li><strong>标题<\/strong>：美团2025年收入3649亿元，由盈转亏<\/li>\n<li><strong>来源<\/strong>：<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a> / 多家媒体<\/li>\n<li><strong>日期<\/strong>：2026-03-26<\/li>\n<li><strong>核心摘要<\/strong>：美团2025年全年收入3649亿元，同比增长8%，但净亏损234亿元（上年同期盈利）。盈利缩水592亿元。核心本地商业分部Q3经营亏损141亿元。王兴透露2026年Q1持续减亏。<\/li>\n<li><strong>关键数据<\/strong>：收入3649亿元（+8%）；净亏损234亿元；盈利缩水592亿元<\/li>\n<\/ul>\n<h3 id=\"doc-heading-33\">27. Q2利润暴跌89%<\/h3>\n<ul>\n<li><strong>标题<\/strong>：补贴战致利润下滑，Q2利润大降89%<\/li>\n<li><strong>来源<\/strong>：<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a><\/li>\n<li><strong>日期<\/strong>：2025-08<\/li>\n<li><strong>核心摘要<\/strong>：外卖补贴大战导致美团Q2利润同比暴跌89%，本地商业利润下滑96.8%。<\/li>\n<\/ul>\n<h3 id=\"doc-heading-34\">28. Q3首次季度亏损（2022年以来）<\/h3>\n<ul>\n<li><strong>标题<\/strong>：美团Q3录得首次季度亏损<\/li>\n<li><strong>来源<\/strong>：Bloomberg / Reuters / WSJ<\/li>\n<li><strong>日期<\/strong>：2025-11<\/li>\n<li><strong>核心摘要<\/strong>：美团Q3出现2022年以来首次季度亏损，预估亏损约221亿元人民币【校验修正：原文误写\"221亿美元\"，221亿美元≈1600亿人民币，与Q3经营亏损141亿元量级不符，应为人民币】。三大平台（美团、阿里、京东）在这场补贴大战中合计少赚约1700亿元。<\/li>\n<li><strong>关键数据<\/strong>：Q3预估亏损约221亿元人民币【校验修正：原文误写\"221亿美元\"】<\/li>\n<\/ul>\n<h3 id=\"doc-heading-35\">29. 王兴从\"不惜代价\"到\"反内卷\"<\/h3>\n<ul>\n<li><strong>标题<\/strong>：王兴坚决反对非理性\"内卷\"竞争<\/li>\n<li><strong>来源<\/strong>：多家报道<\/li>\n<li><strong>日期<\/strong>：2026年初<\/li>\n<li><strong>核心摘要<\/strong>：王兴在不到一年时间内从\"不惜代价\"投入补贴战，转为公开表态\"坚决反对非理性内卷竞争\"。美团战略从进攻转向\"战略收敛\"，聚焦长期和AI入口。<\/li>\n<\/ul>\n<h3 id=\"doc-heading-36\">30. 美团业绩改善：收缩、省钱，等待阿里犯错<\/h3>\n<ul>\n<li><strong>标题<\/strong>：美团业绩改善的背后：收缩、省钱，等待阿里犯错<\/li>\n<li><strong>来源<\/strong>：<a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a><\/li>\n<li><strong>日期<\/strong>：2026-05-26<\/li>\n<li><strong>核心摘要<\/strong>：美团通过收缩非核心业务（优选关停）、控制补贴节奏、等待竞争态势缓和来实现业绩改善。市值较高点腰斩后有所回升。<\/li>\n<li><strong>关键数据<\/strong>：市值较高点腰斩<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-37\">六、美团即时零售战略框架总结<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>维度<\/th>\n<th>核心内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>双轨模式<\/strong><\/td>\n<td>闪电仓（平台模式，3万仓）+ 小象超市（自营模式，近1000前置仓）<\/td>\n<\/tr>\n<tr>\n<td><strong>品类扩展<\/strong><\/td>\n<td>从外卖 → 生鲜 → 医药 → 白酒/医疗器械 → 全品类<\/td>\n<\/tr>\n<tr>\n<td><strong>医药战略<\/strong><\/td>\n<td>3亿用户 + AI经营管家 + 医疗器械五巨头合作 + 拜耳/同仁堂品牌入驻<\/td>\n<\/tr>\n<tr>\n<td><strong>线下拓展<\/strong><\/td>\n<td>小象超市重启线下店（北京、宁波）<\/td>\n<\/tr>\n<tr>\n<td><strong>国际化<\/strong><\/td>\n<td>Keemart登陆沙特（小象超市出海）<\/td>\n<\/tr>\n<tr>\n<td><strong>并购整合<\/strong><\/td>\n<td>收购叮咚买菜（50亿），竞购朴朴超市<\/td>\n<\/tr>\n<tr>\n<td><strong>收缩退出<\/strong><\/td>\n<td>美团优选全国关停（5年亏超千亿）<\/td>\n<\/tr>\n<tr>\n<td><strong>财务影响<\/strong><\/td>\n<td>2025全年亏234亿，核心本地商业Q3经营亏损141亿<\/td>\n<\/tr>\n<tr>\n<td><strong>战略转向<\/strong><\/td>\n<td>从\"不惜代价\"到\"反内卷\"，聚焦AI入口<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","rawText":"美团即时零售/美团买药 公开新闻动态（2025-2026） 引用级别：✅可正式引用 资料基础：官方公告、公司财报、交易所/港交所披露、公司官网新闻稿、监管披露或已核验权威公开来源。 更新时间：2026-06-08 信息来源：Google News RSS 聚合、维基百科、36氪、新浪财经、雪球、亿邦动力网等 一句话定位 本文定位为美团即时零售/美团买药 公开新闻动态的新闻动态资料，主要事件有平台补贴竞争、供给网络扩张、品类合作、即时履约和医药零售相关业务变化。 一、美团闪购与即时零售 1. 闪电仓重仓即时零售 标题**：美团闪购携3万家闪电仓重仓即时零售 来源**：新浪财经 日期**：2025-06 原文链接**：https://finance.sina.com.cn （搜索\"美团闪购携3万家闪电仓\"可找到原文） 核心摘要**：美团闪购以3万家闪电仓（前置仓模式）为核心抓手，大规模拓展即时零售品类覆盖。闪电仓是美团即时零售双轨模式中的\"平台仓\"部分，与自营的小象超市并行。 关键数据**：3万家闪电仓 2. 即时零售双轨并行：闪电仓 + 小象超市 标题**：即时零售双轨并行，小象超市扛旗自营 来源**：21财经 日期**：2025-06 原文链接**：https://www.21jingji.com 核心摘要**：美团2025年零售战略确立为\"闪电仓+小象超市\"双轮驱动。闪电仓负责平台模式（招商），小象超市负责自营模式（买货卖货）。王莆中定调即时零售为\"一种高确定性的生活方式\"。 关键数据**：双轨模式明确 3. 美团App为闪购新增独立入口 标题**：美团App为闪购新增独立入口 来源**：行业报道 日期**：2025-04 核心摘要**：美团在App内为闪购业务新增独立入口，提升即时零售在用户侧的可见度和流量权重。 4. 美团日单量峰值达1.5亿 标题**：美团日单量1.5亿！巨头\"烧钱\"鏖战即时零售 来源**：证券时报 日期**：2025-07-12 核心摘要**：在补贴大战高峰期，美团日订单量达到1.5亿单。但大规模补贴导致利润严重受损，Q2利润同比暴跌89%。 关键数据**：日单量1.5亿 5. 美团即时零售品类扩展：白酒业重注 标题**：白酒业618重注即时零售 来源**：新浪财经 日期**：2026-05-27 核心摘要**：茅台、五粮液等头部白酒品牌与美团闪购合作，借即时零售渠道触达消费者。即时零售正从应急品类向高客单价 discretionary 品类延伸。 关键数据**：头部白酒品牌入驻美团闪购 6. 即时零售平台开放基建网络 标题**：即时零售平台开放基建网络 来源**：新浪财经 日期**：2026-03-23 核心摘要**：即时零售平台向更多品类商家开放履约基建网络，酒水饮料行业加速入驻。 二、小象超市 7. 小象超市规模第二、增速第一 标题**：王兴称小象\"规模第二，增速第一\" 来源**：风闻 日期**：2025-11 核心摘要**：王兴在内部/公开场合表示，小象超市在生鲜电商赛道中规模排名第二，但增速排名第一。线上GMV接近3000亿。 关键数据**：线上GMV接近3000亿；规模第二、增速第一 8. 小象超市重启线下店 标题**：小象超市重启线下店，美团放不下超市梦 来源**：新浪财经 日期**：2025-04（启动）/ 2025-12（北京首店）/ 2026-01（宁波拓店） 核心摘要**：小象超市在北京开出首家线下门店，随后拓展至宁波。美团重启线下超市门店，与盒马形成\"生鲜1V1\"对垒态势。 关键数据**：北京首店开业、宁波拓店 9. 小象超市近1000个前置仓，覆盖所有一二线城市 标题**：小象超市将覆盖所有一二线城市 来源**：新浪财经 日期**：2025-06 核心摘要**：小象超市全国近1000个前置仓，计划覆盖所有一二线城市。 关键数据**：近1000个前置仓 10. 美团收购叮咚买菜（50亿元/7.17亿美元） 标题**：美团为小象进货，50亿拿下叮咚买菜 来源**：21财经 / 36氪 / 财联社 日期**：2026-02-05 原文链接**：https://www.21jingji.com （搜索\"美团50亿叮咚买菜\"可找到原文） 核心摘要**：美团以约50亿元人民币（7.17亿美元）收购叮咚买菜国内业务，由小象超市承接约1000个前置仓。这是2026年本地生活首笔超大型并购，标志着独立前置仓模式的终结。36氪评价\"美团捡了个大便宜\"。 关键数据**：收购价格50亿元/7.17亿美元；约1000个前置仓；叮咚买菜创始人内部信\"决定放下较量\" 11. 小象超市出海：Keemart登陆沙特 标题**：Keemart在沙特上线，美团全面国际化出海加速 来源**：行业报道 日期**：2025-05 核心摘要**：小象超市海外版\"Keemart\"在沙特阿拉伯上线，美团自营零售开启国际化。 12. 收购后竞购朴朴超市 标题**：朴朴超市成下一争夺标的，阿里美团竞标 来源**：雷峰网等 日期**：2026-02 之后 核心摘要**：叮咚买菜被收购后，朴朴超市成为下一个争夺标的，阿里、京东、美团竞标，估值20-50亿美元（远超叮咚价格）。京东公开否认参与。 关键数据**：朴朴估值20-50亿美元 三、美团优选（社区团购） 13. 美团优选退出亏损省份 标题**：晚点独家丨美团优选退出亏损省份 来源**：晚点LatePost（雪球转载） 日期**：2025-06 核心摘要**：美团优选大范围退出亏损省份，5年未盈利。新业务5年亏损超千亿，美团优选退场为小象让路。 关键数据**：5年亏损超千亿 14. 美团优选全国关停 标题**：美团优选全国关停，社区团购格局一家独大 来源**：新浪财经 日期**：2025-12 核心摘要**：美团优选在2025年底前基本完成全国关停，社区团购赛道只剩多多买菜一家独大。华尔街见闻评论\"美团优选后退，小象超市向前\"。 关键数据**：美团优选全国关停 四、美团买药 / 医药健康 15. 美团买药累计交易用户超3亿 标题**：美团医药累计交易用户突破3亿 来源**：美团官方 / 央广网 日期**：2024-08 核心摘要**：美团买药累计交易用户突破3亿，与药店和药企合作构建\"15分钟医疗卫生服务圈\"。 关键数据**：累计交易用户超3亿 16. 美团买药与医疗器械五巨头深化合作 标题**：美团医药健康联手医疗器械五巨头 来源**：新浪财经 / 亿邦动力网 日期**：2026-04 核心摘要**：美团医药健康与鱼跃、海氏海诺等头部医疗器械品牌深化合作，开拓即时零售新主场。医疗器械品类增速超35%，头部品牌集体转向即时零售。 关键数据**：医疗器械增速超35% 17. 美团VS淘宝闪购在医疗赛道正面硬刚 标题**：美团VS淘宝闪购，在医疗赛道正面硬刚，底牌全亮了 来源**：36氪 日期**：2026-04-20 核心摘要**：美团和淘宝闪购在医疗健康品类展开直接竞争，双方底牌尽出。这是即时零售竞争从外卖/生鲜向医疗健康纵深发展的标志事件。 18. 美团AI+医疗场景应用 标题**：美团李晓辉：正探索AI+医疗场景应用 来源**：新华网 日期**：2025-04-09 核心摘要**：美团医药健康负责人李晓辉表示正探索AI+医疗场景应用，将通过开放生态构建合作共赢。 19. 美团试点AI经营管家助力药店经营 标题**：美团试点应用AI经营管家帮助医药商家长效经营 来源**：亿邦动力网 日期**：2026-04-14 核心摘要**：美团推出AI经营管家工具，帮助药店商家在即时零售平台上实现更长效的经营优化。 20. 美团、阿里、京东竞逐AI医药服务赛道 标题**：美团、阿里、京东竞逐AI医药服务赛道 来源**：第一财经 日期**：2026-04-14 核心摘要**：三大平台在AI医药服务领域展开新一轮竞逐，从药品配送延伸到AI问诊、健康管理。 21. 拜耳与美团深化合作 标题**：拜耳与美团深化合作，\"智享健康，聚力向新\" 来源**：新华网 日期**：2024-11 核心摘要**：拜耳与美团买药达成深度合作，在OTC药品的即时零售渠道上进一步深入。 22. 同仁堂拥抱即时零售 标题**：北京同仁堂升级与美团合作，355年老店拥抱即时零售 来源**：新京报 日期**：2024-03 核心摘要**：北京同仁堂大栅栏店（355年历史）升级与美团买药合作，正式入驻即时零售。 23. O2O买药药店加速跑通 标题**：大批药店，跑通O2O 来源**：腾讯新闻 日期**：2026-02 核心摘要**：越来越多的线下药店成功跑通O2O模式，线上下单、即时配送成为药店新增长通道。 24. 药店行业面临大规模关店 标题**：京东、美团、阿里\"三雄割据\"，70万家药店面临洗牌，30万家或关店 来源**：中华网财经 日期**：2025-12 核心摘要**：在三大平台竞争压力下，全国约70万家线下药店面临洗牌，预估30万家可能关闭。O2O正在重塑药店生态。（仅推测） 关键数据**：70万家药店面临洗牌；30万家或关店 25. 监管：5月新规禁止线上销售GLP-1减肥药 标题**：5月网购新规：GLP-1减肥药全网禁售 来源**：搜狐网 日期**：2026-05 核心摘要**：2026年5月起严格新规，禁止所有线上平台销售GLP-1类减肥药。对美团买药、饿了么买药等平台的处方药品类产生影响。 五、美团2025年整体财务表现 26. 2025全年收入3649亿元，净亏损234亿元 标题**：美团2025年收入3649亿元，由盈转亏 来源**：新浪财经 / 多家媒体 日期**：2026-03-26 核心摘要**：美团2025年全年收入3649亿元，同比增长8%，但净亏损234亿元（上年同期盈利）。盈利缩水592亿元。核心本地商业分部Q3经营亏损141亿元。王兴透露2026年Q1持续减亏。 关键数据**：收入3649亿元（+8%）；净亏损234亿元；盈利缩水592亿元 27. Q2利润暴跌89% 标题**：补贴战致利润下滑，Q2利润大降89% 来源**：新浪财经 日期**：2025-08 核心摘要**：外卖补贴大战导致美团Q2利润同比暴跌89%，本地商业利润下滑96.8%。 28. Q3首次季度亏损（2022年以来） 标题**：美团Q3录得首次季度亏损 来源**：Bloomberg / Reuters / WSJ 日期**：2025-11 核心摘要**：美团Q3出现2022年以来首次季度亏损，预估亏损约221亿元人民币【校验修正：原文误写\"221亿美元\"，221亿美元≈1600亿人民币，与Q3经营亏损141亿元量级不符，应为人民币】。三大平台（美团、阿里、京东）在这场补贴大战中合计少赚约1700亿元。 关键数据**：Q3预估亏损约221亿元人民币【校验修正：原文误写\"221亿美元\"】 29. 王兴从\"不惜代价\"到\"反内卷\" 标题**：王兴坚决反对非理性\"内卷\"竞争 来源**：多家报道 日期**：2026年初 核心摘要**：王兴在不到一年时间内从\"不惜代价\"投入补贴战，转为公开表态\"坚决反对非理性内卷竞争\"。美团战略从进攻转向\"战略收敛\"，聚焦长期和AI入口。 30. 美团业绩改善：收缩、省钱，等待阿里犯错 标题**：美团业绩改善的背后：收缩、省钱，等待阿里犯错 来源**：新浪财经 日期**：2026-05-26 核心摘要**：美团通过收缩非核心业务（优选关停）、控制补贴节奏、等待竞争态势缓和来实现业绩改善。市值较高点腰斩后有所回升。 关键数据**：市值较高点腰斩 六、美团即时零售战略框架总结 维度 核心内容 ------ ---------- **双轨模式** 闪电仓（平台模式，3万仓）+ 小象超市（自营模式，近1000前置仓） **品类扩展** 从外卖 → 生鲜 → 医药 → 白酒/医疗器械 → 全品类 **医药战略** 3亿用户 + AI经营管家 + 医疗器械五巨头合作 + 拜耳/同仁堂品牌入驻 **线下拓展** 小象超市重启线下店（北京、宁波） **国际化** Keemart登陆沙特（小象超市出海） **并购整合** 收购叮咚买菜（50亿），竞购朴朴超市 **收缩退出** 美团优选全国关停（5年亏超千亿） **财务影响** 2025全年亏234亿，核心本地商业Q3经营亏损141亿 **战略转向** 从\"不惜代价\"到\"反内卷\"，聚焦AI入口","headings":[{"level":2,"text":"一句话定位","anchor":"doc-heading-1"},{"level":2,"text":"一、美团闪购与即时零售","anchor":"doc-heading-2"},{"level":3,"text":"1. 闪电仓重仓即时零售","anchor":"doc-heading-3"},{"level":3,"text":"2. 即时零售双轨并行：闪电仓 + 小象超市","anchor":"doc-heading-4"},{"level":3,"text":"3. 美团App为闪购新增独立入口","anchor":"doc-heading-5"},{"level":3,"text":"4. 美团日单量峰值达1.5亿","anchor":"doc-heading-6"},{"level":3,"text":"5. 美团即时零售品类扩展：白酒业重注","anchor":"doc-heading-7"},{"level":3,"text":"6. 即时零售平台开放基建网络","anchor":"doc-heading-8"},{"level":2,"text":"二、小象超市","anchor":"doc-heading-9"},{"level":3,"text":"7. 小象超市规模第二、增速第一","anchor":"doc-heading-10"},{"level":3,"text":"8. 小象超市重启线下店","anchor":"doc-heading-11"},{"level":3,"text":"9. 小象超市近1000个前置仓，覆盖所有一二线城市","anchor":"doc-heading-12"},{"level":3,"text":"10. 美团收购叮咚买菜（50亿元/7.17亿美元）","anchor":"doc-heading-13"},{"level":3,"text":"11. 小象超市出海：Keemart登陆沙特","anchor":"doc-heading-14"},{"level":3,"text":"12. 收购后竞购朴朴超市","anchor":"doc-heading-15"},{"level":2,"text":"三、美团优选（社区团购）","anchor":"doc-heading-16"},{"level":3,"text":"13. 美团优选退出亏损省份","anchor":"doc-heading-17"},{"level":3,"text":"14. 美团优选全国关停","anchor":"doc-heading-18"}],"outgoing":[]},{"id":"doc-0e6545efa363","title":"美团-美团买药-结构化摘要","path":"01-即时零售平台/美团-美团买药/综合分析/美团-美团买药-结构化摘要.md","stem":"美团-美团买药-结构化摘要","module":"01-即时零售平台","entity":"美团-美团买药","contentType":"综合分析","isIndex":false,"isGovernance":false,"summary":"﻿# 美团即时零售 - 结构化摘要","learningTakeaway":"本文帮助你理解美团即时零售 - 结构化摘要的结构化摘要资料，核心关注平台规模、供给履约、品类合作、竞争风险和对医药服务平台的启示。阅读后可以重点掌握：行业规模、平台竞争、财报指标、研报观点、新闻动态；主要帮助解决“这篇资料讲什么、关键事实是什么、后续应从哪些角度继续核验/阅读”的问题。","lastUpdated":"2026-06-08","citationStatus":"可供研判参考","html":"<p>﻿# n<td style=\"text-align: left;\">2025年总收入<\/td>\n<td style=\"text-align: left;\">3,649亿元<\/td>\n<td style=\"text-align: left;\">↑+8%<\/td>\n<td style=\"text-align: left;\">2025全年<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">财报<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2025年净亏损<\/td>\n<td style=\"text-align: left;\">234亿元<\/td>\n<td style=\"text-align: left;\">↓（从盈转亏）<\/td>\n<td style=\"text-align: left;\">2025全年<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">财报<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">核心本地商业Q3经营亏损<\/td>\n<td style=\"text-align: left;\">141亿元<\/td>\n<td style=\"text-align: left;\">↓<\/td>\n<td style=\"text-align: left;\">2025Q3<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">财报<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">美团买药GMV<\/td>\n<td style=\"text-align: left;\">500亿+（公开资料整理）<\/td>\n<td style=\"text-align: left;\">↑<\/td>\n<td style=\"text-align: left;\">2025<\/td>\n<td style=\"text-align: left;\">行业报道，待回溯官方/机构来源<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">美团买药累计用户<\/td>\n<td style=\"text-align: left;\">3亿+<\/td>\n<td style=\"text-align: left;\">↑<\/td>\n<td style=\"text-align: left;\">2024-08<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%E7%BE%8E%E5%9B%A2%E5%AE%98%E6%96%B9\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">美团官方<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">美团买药合作药店<\/td>\n<td style=\"text-align: left;\">25万+家<\/td>\n<td style=\"text-align: left;\">↑<\/td>\n<td style=\"text-align: left;\">2025<\/td>\n<td style=\"text-align: left;\"><a href=\"https://news.baidu.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公开新闻<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">美团买药覆盖市县<\/td>\n<td style=\"text-align: left;\">近3,000个<\/td>\n<td style=\"text-align: left;\">↑<\/td>\n<td style=\"text-align: left;\">2025<\/td>\n<td style=\"text-align: left;\"><a href=\"https://news.baidu.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公开新闻<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">医疗器械即时零售增速<\/td>\n<td style=\"text-align: left;\">&gt;35%<\/td>\n<td style=\"text-align: left;\">↑<\/td>\n<td style=\"text-align: left;\">2025-2026<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.ebrun.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">亿邦动力<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2026年Q1经营亏损<\/td>\n<td style=\"text-align: left;\">65亿元，较上季度161亿元明显收窄<\/td>\n<td style=\"text-align: left;\">↑<\/td>\n<td style=\"text-align: left;\">2026Q1<\/td>\n<td style=\"text-align: left;\">美团<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">官方公告<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"doc-heading-3\">核心观点（5条）<\/h2>\n<ol>\n<li>\n<p><strong>2025年是从盈利到亏损的转折年<\/strong>：核心本地商业从2024年大幅盈利转为全年亏损69亿元，Q3单季亏损141亿元是最低点。主要因应对淘宝闪购竞争加大补贴和履约投入。（仅推测）<\/p>\n<\/li>\n<li>\n<p><strong>闪电仓快速扩张是重要护城河<\/strong>：从2024年10月的3万家到2025年Q2突破5万家，月增约2,500家。闪电仓模式（商家入驻+美团赋能）与京东自营药房形成差异化竞争。<\/p>\n<\/li>\n<li>\n<p><strong>美团买药供给规模较强，但GMV和份额仍以已披露来源为准<\/strong>：合作药店、覆盖市县等供给指标具备参考价值；GMV 500亿+、O2O药品份额40%+未见官方单独披露，不纳入正式结论。<\/p>\n<\/li>\n<li>\n<p><strong>管理层基调：必要投资但强调效率<\/strong>：Q3见底后Q4、2026Q1亏损收窄，说明投入效率改善，但不能表述为“已恢复盈利”。<\/p>\n<\/li>\n<li>\n<p><strong>美团优选持续收缩<\/strong>：2025年美团优选继续退出亏损区域并推动全国关停，资源从社区团购转向小象超市和即时零售。<\/p>\n<\/li>\n<\/ol>\n<h2 id=\"doc-heading-4\">重要结论<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">结论<\/th>\n<th style=\"text-align: left;\">置信度<\/th>\n<th style=\"text-align: left;\">依据<\/th>\n<th style=\"text-align: left;\">变量<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">美团即时零售市场地位仍强，但竞争压力持续<\/td>\n<td style=\"text-align: left;\">中<\/td>\n<td style=\"text-align: left;\">2026Q1亏损收窄，供给和履约基础仍强<\/td>\n<td style=\"text-align: left;\">淘宝闪购补贴力度是否持续<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">美团买药供给规模领先，份额需继续核验<\/td>\n<td style=\"text-align: left;\">中<\/td>\n<td style=\"text-align: left;\">25万+药店；GMV/份额仍待回溯<\/td>\n<td style=\"text-align: left;\">医药即时零售平台药房扩张速度<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">闪电仓模式将成为即时零售主流供给形态<\/td>\n<td style=\"text-align: left;\">中<\/td>\n<td style=\"text-align: left;\">快速扩张+单位经济改善<\/td>\n<td style=\"text-align: left;\">闪电仓商家盈利能力存疑<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">补贴战最激烈时期已过<\/td>\n<td style=\"text-align: left;\">中<\/td>\n<td style=\"text-align: left;\">2025Q3见底+监管约谈<\/td>\n<td style=\"text-align: left;\">淘宝闪购是否继续大规模补贴<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"doc-heading-5\">2025年关键季度数据追踪<\/h2>\n<h3 id=\"doc-heading-6\">核心本地商业（Core Local Commerce）<\/h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">季度<\/th>\n<th style=\"text-align: left;\">收入（公开资料口径）<\/th>\n<th style=\"text-align: left;\">经营利润/亏损<\/th>\n<th style=\"text-align: left;\">趋势<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">2025 Q1<\/td>\n<td style=\"text-align: left;\">~540亿元<\/td>\n<td style=\"text-align: left;\">盈利但同比大幅下降<\/td>\n<td style=\"text-align: left;\">↓<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2025 Q2<\/td>\n<td style=\"text-align: left;\">~570亿元<\/td>\n<td style=\"text-align: left;\">小幅亏损<\/td>\n<td style=\"text-align: left;\">↓<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2025 Q3<\/td>\n<td style=\"text-align: left;\">~580亿元<\/td>\n<td style=\"text-align: left;\">-141亿元（最低点）<\/td>\n<td style=\"text-align: left;\">↓↓<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: lef >2025<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.meituan.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">美团买药官网<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<p><em>注：本文件保留部分行业线索和历史公开资料口径。本文仅保留已核验公开披露数据。<\/em><\/p>","rawText":"﻿# 美团即时零售 - 结构化摘要 引用级别：✅可供研判参考 资料基础：行业研究报告、券商研报、机构观点、分析师判断、主观解释、预测或推演结论，公告，财报。 整合周期：2025年全年 ~ 2026年Q1 基于：美团2025年Q1-Q4财报 / 2026年Q1财报 / 公开新闻 / 券商研报 引用提示：涉及美团买药GMV、O2O份额、2025分季度收入公开资料口径的数据，正式引用优先使用 数据引用台账。 最后更新：2026-06-08 一句话定位 本文定位为美团即时零售 - 结构化摘要的结构化摘要资料，核心关注平台规模、供给履约、品类合作、竞争风险和对医药服务平台的启示。 关键数据仪表盘 维度 最新数据 趋势 数据截止日 来源 :--- :--- :--- :--- :--- 即时配送总订单量 ~219亿单/年（2025年公开资料口径） ↑ 2025全年 财报 闪电仓数量 5万+家（2025年Q2突破） ↑月增~2500家 2025-06 新浪财经 小象超市前置仓 近1,000个+叮咚1,000仓 ↑（收购叮咚后） 2026-02 21财经 2025年总收入 3,649亿元 ↑+8% 2025全年 财报 2025年净亏损 234亿元 ↓（从盈转亏） 2025全年 财报 核心本地商业Q3经营亏损 141亿元 ↓ 2025Q3 财报 美团买药GMV 500亿+（公开资料整理） ↑ 2025 行业报道，待回溯官方/机构来源 美团买药累计用户 3亿+ ↑ 2024-08 美团官方 美团买药合作药店 25万+家 ↑ 2025 公开新闻 美团买药覆盖市县 近3,000个 ↑ 2025 公开新闻 医疗器械即时零售增速 >35% ↑ 2025-2026 亿邦动力 2026年Q1经营亏损 65亿元，较上季度161亿元明显收窄 ↑ 2026Q1 美团官方公告 核心观点（5条） 1. **2025年是从盈利到亏损的转折年**：核心本地商业从2024年大幅盈利转为全年亏损69亿元，Q3单季亏损141亿元是最低点。主要因应对淘宝闪购竞争加大补贴和履约投入。（仅推测） 2. **闪电仓快速扩张是重要护城河**：从2024年10月的3万家到2025年Q2突破5万家，月增约2,500家。闪电仓模式（商家入驻+美团赋能）与京东自营药房形成差异化竞争。 3. **美团买药供给规模较强，但GMV和份额仍以已披露来源为准**：合作药店、覆盖市县等供给指标具备参考价值；GMV 500亿+、O2O药品份额40%+未见官方单独披露，不纳入正式结论。 4. **管理层基调：必要投资但强调效率**：Q3见底后Q4、2026Q1亏损收窄，说明投入效率改善，但不能表述为“已恢复盈利”。 5. **美团优选持续收缩**：2025年美团优选继续退出亏损区域并推动全国关停，资源从社区团购转向小象超市和即时零售。 重要结论 结论 置信度 依据 变量 :--- :--- :--- :--- 美团即时零售市场地位仍强，但竞争压力持续 中 2026Q1亏损收窄，供给和履约基础仍强 淘宝闪购补贴力度是否持续 美团买药供给规模领先，份额需继续核验 中 25万+药店；GMV/份额仍待回溯 医药即时零售平台药房扩张速度 闪电仓模式将成为即时零售主流供给形态 中 快速扩张+单位经济改善 闪电仓商家盈利能力存疑 （仅推测） 补贴战最激烈时期已过 中 2025Q3见底+监管约谈 淘宝闪购是否继续大规模补贴 2025年关键季度数据追踪 核心本地商业（Core Local Commerce） 季度 收入（公开资料口径） 经营利润/亏损 趋势 :--- :--- :--- :--- 2025 Q1 ~540亿元 盈利但同比大幅下降 ↓ 2025 Q2 ~570亿元 小幅亏损 ↓ 2025 Q3 ~580亿元 -141亿元（最低点） ↓↓ 2025 Q4 ~590亿元 亏损收窄 ↑ 2026 Q1 641亿元（核心本地商业收入） 经营亏损20亿元，较上季度亏损100亿元收窄 ↑ 美团买药 指标 2024年 2025年 变化 :--- :--- :--- :- s.baidu.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公开新闻报道<\/a>\n最后更新：2026-06-08\n注意：标注 <strong>[公开资料口径]<\/strong> 的数据为多渠道推算<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"doc-heading-1\">一句话定位<\/h2>\n<p>本文定位为美团FY2025及2026Q1财报 · 即时零售与买药相关的财报与经营数据资料，核心关注收入、利润、门店/渠道、O2O或相关业务指标的变化及其来源口径。<\/p>\n<h2 id=\"doc-heading-2\">一、美团整体 · 核心财务数据<\/h2>\n<h3 id=\"doc-heading-3\">1.1 FY2025 全年（2025年1月-12月）<\/h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">指标<\/th>\n<th style=\"text-align: left;\">FY2025<\/th>\n<th style=\"text-align: left;\">FY2024<\/th>\n<th style=\"text-align: left;\">同比变化<\/th>\n<th style=\"text-align: left;\">来源/备注<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">总收入<\/td>\n<td style=\"text-align: left;\">3,648.55亿元<\/td>\n<td style=\"text-align: left;\">3,375.92亿元<\/td>\n<td style=\"text-align: left;\">+8.1%<\/td>\n<td style=\"text-align: left;\">美团2025年全年<a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">业绩公告<\/a>（2026-03-26 <a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">港交所披露<\/a>）；原始口径：RMB364,854,746千元 vs RMB337,591,576千元<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">净利润/亏损<\/td>\n<td style=\"text-align: left;\">净亏损233.54亿元<\/td>\n<td style=\"text-align: left;\">盈利<\/td>\n<td style=\"text-align: left;\">从盈转亏，利润变化约-591.63亿元<\/td>\n<td style=\"text-align: left;\">美团2025年全年<a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">业绩公告<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">经调整净利润<\/td>\n<td style=\"text-align: left;\">经调整净亏损186.48亿元<\/td>\n<td style=\"text-align: left;\">经调整净利润437.72亿元<\/td>\n<td style=\"text-align: left;\">从盈转亏<\/td>\n<td style=\"text-align: left;\">美团2025年全年<a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">业绩公告<\/a>（2026-03-26 <a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">港交所披露<\/a>）；Non-IFRS口径：Adjusted net (loss)/profit RMB(18,648,001)千元 vs RMB43,772,449千元<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">核心本地商业经营利润/亏损<\/td>\n<td style=\"text-align: left;\">经营亏损68.85亿元<\/td>\n<td style=\"text-align: left;\">经营利润524.15亿元<\/td>\n<td style=\"text-align: left;\">从盈转亏<\/td>\n<td style=\"text-align: left;\">美团2025年全年<a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">业绩公告<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">新业务亏损<\/td>\n<td style=\"text-align: left;\">经营亏损100.82亿元<\/td>\n<td style=\"text-align: left;\">经营亏损72.73亿元<\/td>\n<td style=\"text-align: left;\">亏损扩大38.6%<\/td>\n<td style=\"text-align: left;\">美团2025年全年<a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">业绩公告<\/a>（2026-03-26 <a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">港交所披露<\/a>）；New Initiatives operating loss RMB(10,082,340)千元 vs RMB(7,273,314)千元；美团优选相关表述另需单独溯源<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">骑手数量<\/td>\n<td style=\"text-align: left;\">745万+<\/td>\n<td style=\"text-align: left;\">700万+<\/td>\n<td style=\"text-align: left;\">持续增长<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%E7%BE%8E%E5%9B%A2%E5%AE%98%E6%96%B9%E6%95%B0%E6%8D%AE\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">美团官方数据<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>关键解读<\/strong>：\n- 2025年是美团从盈利到亏损的转折年，主要因应对淘宝闪购冲击，大规模补贴导致核心本地商业从2024年经营利润524.15亿元转为全年亏损69亿元（仅推测）\n- Q3是最低点（单季经营亏损141亿元），Q4亏损收窄；2026Q1仍为经营亏损，但环比明显减亏\n- 2025年全年收入增速仅8%，远低于此前年份，反映补贴战对收入增长的稀释效应<\/p>\n<h3 id=\"doc-heading-4\">1.2 FY2025 分季度数据<\/h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">季度<\/th>\n<th style=\"text-align: left;\">官方披露情况<\/th>\n<th style=\"text-align: left;\">来源/备注<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">2025 Q1-Q3<\/td>\n<td style=\"text-align: left;\">本文件不保留分季度推算数据<\/td>\n<td style=\"text-align: left;\">美团公开年度<a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">业绩公告<\/a>未在本文中逐项列示前三季度拆分；正式引用以对应季度<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公告原文<\/a>为准<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2025 Q4<\/td>\n<td style=\"text-align: left;\">总收入920.96亿元；核心本地商业收入648.35亿元；新业务收入272.62亿元<\/td>\n<td style=\"text-align: left;\">美团FY2025年度<a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">业绩公告<\/a>，<a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">港交所披露<\/a>，2026-03-26<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"doc-heading-5\">1.3 FY2026 Q1（2026年1月-3月）<\/h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">指标<\/th>\n<th style=\"text-align: left;\">FY2026 Q1<\/th>\n<th style=\"text-align: left;\">同比变化<\/th>\n<th style=\"text-align: left;\">来源<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">总收入<\/td>\n<td style=\"text-align: left;\">910亿元<\/td>\n<td style=\"text-align: left;\">+5.6% YoY<\/td>\n<td style=\"text-align: left;\">美团2026年Q1<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">官方公告<\/a>（2026-06-01）<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">经营利润/亏损<\/td>\n<td style=\"text-align: left;\">经营亏损65亿元<\/td>\n<td style=\"text-align: left;\">环比减亏（上季度亏损161亿元）<\/td>\n<td style=\"text-align: left;\">美团2026年Q1<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">官方公告<\/a>（2026-06-01）<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">核心本地商业收入<\/td>\n<td style=\"text-align: left;\">640.63亿元<\/td>\n<td style=\"text-align: left;\">+0.1% YoY<\/td>\n<td style=\"text-align: left;\">美团2026年Q1<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">官方公告<\/a>（2026-06-01）；RMB64,063,286千元 vs RMB63,973,733千元<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">核心本地商业经营利润/亏损<\/td>\n<td style=\"text-align: left;\">经营亏损20亿元<\/td>\n<td style=\"text-align: left;\">环比减亏（上季度亏损100亿元）<\/td>\n<td style=\"text-align: left;\">美团2026年Q1<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">官方公告<\/a>（2026-06-01）<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">新业务收入<\/td>\n<td style=\"text-align: left;\">270亿元<\/td>\n<td style=\"text-align: left;\">+21% YoY<\/td>\n<td style=\"text-align: left;\">美团2026年Q1<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">官方公告<\/a>（2026-06-01）<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">新业务经营利润/亏损<\/td>\n<td style=\"text-align: left;\">亏损21亿元<\/td>\n<td style=\"text-align: left;\">环比减亏（上季度亏损46亿元）<\/td>\n<td style=\"text-align: left;\">美团2026年Q1<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">官方公告<\/a>（2026-06-01）<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">即时配送订单量<\/td>\n<td style=\"text-align: left;\">未单独披露具体订单量<\/td>\n<td style=\"text-align: left;\">未单独披露具体订单量<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%E7%BE%8E%E5%9B%A22026%E5%B9%B4Q1%E5%85%AC%E5%91%8A%E4%BB%85%E6%8F%90%E5%8F%8A%E6%8C%89%E9%9C%80%E9%85%8D%E9%80%81%E4%BA%A4%E6%98%93%E7%AC%94%E6%95%B0%E5%8F%97%E5%AD%A3%E8%8A%82%E6%80%A7%E5%BD%B1%E5%93%8D%E7%8E%AF%E6%AF%94%E4%B8%8B%E9%99%8D%EF%BC%8C%E5%AE%98%E6%96%B9%E5%85%AC%E5%BC%80%E6%9D%90%E6%96%99%E6%9C%AA%E5%88%97%E7%A4%BA%E8%AF%A5%E5%85%B7%E4%BD%93%E6%95%B0%E5%80%BC%EF%BC%9B%E4%BB%85%E4%BF%9D%E7%95%99%E5%85%AC%E5%91%8A%E5%B7%B2%E6%8A%AB%E9%9C%B2%E6%8F%8F%E8%BF%B0\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">美团2026年Q1公告仅提及按需配送交易笔数受季节性影响环比下降，官方公开材料未列示该具体数值；仅保留公告已披露描述<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>关键解读<\/strong>：\n- 2026Q1不是\"利润强劲反弹\"，而是整体经营亏损和核心本地商业亏损环比明显收窄；是否进入拐点需要观察后续季度\n- 管理层基调从\"不惜代价\"转为\"反内卷\"\n- 王兴表示2026年Q1持续减亏，后续聚焦AI入口和效率提升<\/p>\n<hr />\n<h2 id=\"doc-heading-6\">二、即时零售板块（闪购+配送）<\/h2>\n<h3 id=\"doc-heading-7\">2.1 即时配送<\/h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">指标<\/th>\n<th style=\"text-align: left;\">FY2025<\/th>\n<th style=\"text-align: left;\">FY2024（参考）<\/th>\n<th style=\"text-align: left;\">同比变化<\/th>\n<th style=\"text-align: left;\">来源/备注<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">即时配送覆盖城市<\/td>\n<td style=\"text-align: left;\">未单独披露稳定城市数<\/td>\n<td style=\"text-align: left;\">未单独披露稳定城市数<\/td>\n<td style=\"text-align: left;\">—<\/td>\n<td style=\"text-align: left;\">美团<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">财报<\/a>未单独披露该指标，以官方业务介绍或后台口径为准<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>说明<\/strong>：美团财报通常披露\"即时配送总订单量\"包含外卖+闪购，不单独拆分闪购订单量。<\/p>\n<h3 id=\"doc-heading-8\">2.2 美团闪购（Instashopping / 闪电仓）<\/h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">指标<\/th>\n<th style=\"text-align: left;\">数据<\/th>\n<th style=\"text-align: left;\">时间<\/th>\n<th style=\"text-align: left;\">来源/备注<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">闪电仓数量<\/td>\n<td style=\"text-align: left;\">5万+家<\/td>\n<td style=\"text-align: left;\">2025年Q2<\/td>\n<td style=\"text-align: left;\"><a href=\"https://finance ef=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a>；2026年2月收购叮咚买菜后增加约1,000仓<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">闪购App独立入口<\/td>\n<td style=\"text-align: left;\">已新增<\/td>\n<td style=\"text-align: left;\">2025年4月<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%E8%A1%8C%E4%B8%9A%E6%8A%A5%E9%81%93%EF%BC%9B%E6%8F%90%E5%8D%87%E5%8D%B3%E6%97%B6%E9%9B%B6%E5%94%AE%E5%9C%A8%E7%94%A8%E6%88%B7%E4%BE%A7%E7%9A%84%E5%8F%AF%E8%A7%81%E5%BA%A6\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">行业报道；提升即时零售在用户侧的可见度<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">线上GMV（小象超市相关）<\/td>\n<td style=\"text-align: left;\">接近3,000亿<\/td>\n<td style=\"text-align: left;\">2025年11月<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%E7%8E%8B%E5%85%B4%E8%A1%A8%E7%A4%BA%E5%B0%8F%E8%B1%A1%22%E8%A7%84%E6%A8%A1%E7%AC%AC%E4%BA%8C%EF%BC%8C%E5%A2%9E%E9%80%9F%E7%AC%AC%E4%B8%80%22\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">王兴表示小象\"规模第二，增速第一\"<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>关键解读<\/strong>：\n- 闪电仓是美团即时零售的核心供给基础设施，从3万到5万+仅用约8个月，扩张速度极快\n- 闪电仓模式（商家入驻+美团赋能选址/选品/运营SOP）是轻资产快速扩张的典型平台模式\n- 2026年2月美团以50亿元收购叮咚买菜，由小象超市承接约1,000个前置仓，进一步巩固自营即时零售能力\n- 美团优选2025年12月全国关停，资源从社区团购转向即时零售<\/p>\n<h3 id=\"doc-heading-9\">2.3 即时零售品类扩展<\/h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">时间<\/th>\n<th style=\"text-align: left;\">品类动态<\/th>\n<th style=\"text-align: left;\">来源<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">2025年<\/td>\n<td style=\"text-align: left;\">从外卖→生鲜→医药→白酒/医疗器械→全品类扩展<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%E5%A4%9A%E6%B8%A0%E9%81%93\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">多渠道<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2026年5月<\/td>\n<td style=\"te
