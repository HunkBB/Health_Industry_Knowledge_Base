rel=\"noopener noreferrer\" class=\"external-link\">中康科技<\/a>官网首页）<\/li>\n<li><strong>可应用性思考<\/strong>：AI+健康产业主题与我们的AI应用研究高度契合，可关注后续发布内容（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-5\">四、西普会历年规律<\/h2>\n<ul>\n<li>每年同步发布：<\/li>\n<li>药品零售综合竞争力百强榜<\/li>\n<li>医药工业综合竞争力百强榜<\/li>\n<li>系列子榜单（研发十强、连锁药店十强等）<\/li>\n<li>榜单数据可用于团队对连锁药店和药企的行业地位判断（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-6\">五、处方外流相关<\/h2>\n<ul>\n<li>处方外流在O2O渠道落地不断深化，Rx品类运营能力正成为药企核心竞争力<\/li>\n<li>千亿级处方外流规模，药店分类分级管理政策加速外流<\/li>\n<li>淘宝闪购已将医保覆盖拓展至53个城市，AI处方匹配技术上线<\/li>\n<li>处方药线上销售渗透率仍低于10%，为核心约束<\/li>\n<li><strong>可应用性思考<\/strong>：处方外流是DTP药房方向的核心驱动力，需持续跟踪政策进展（仅推测）<\/li>\n<\/ul>\n<hr />\n<p><em>信息溯源：部分数据来源于搜狗微信公开资料线索（已按公开来源交叉检索后方可进入正式结论），具体榜单数据和完整内容需访问<a href=\"https://www.sinohealth.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中康科技<\/a>官网或对应公众号获取。<\/em><\/p>","rawText":"西普会 - 内容摘要 引用级别：✅可正式引用 资料基础：官方公告、公司财报、交易所/港交所披露、公司官网新闻稿、监管披露或已核验权威公开来源。 信息采集日期：2026-06-01 最后更新：2026-06-08 来源：搜狗微信搜索、中康科技官网、行业报道 一句话定位 本文定位为西普会 - 内容摘要的行业机构/报告资料，核心关注行业规模、用户需求、渠道变化、品类机会和引用口径。 一、西普会概况 全称**：中国药品零售产业信息发布会（CHEO） 主办方**：中康科技 举办地**：海南博鳌（博鳌亚洲论坛大酒店） 举办时间**：通常每年8月 定位**：药店行业最大年度盛会，发布年度行业数据、企业百强榜 二、2025年西普会 发布榜单**： 2025中国医药工业综合竞争力百强榜**（含\"三大企业榜单\"，包括医药工业研发十强） 2025中国药品零售综合竞争力百强榜**（入围门槛为年销售规模） 溯源**：搜狗微信搜索\"汇聚南药\"公众号文章确认发布 三、2026年西普会 主题**：\"走进AI时代——健康产业的范式革命与路径选择\" 发布时间**：2026年4月9日（来源：中康科技官网首页） 可应用性思考**：AI+健康产业主题与我们的AI应用研究高度契合，可关注后续发布内容（仅推测） 四、西普会历年规律 每年同步发布： 1. 药品零售综合竞争力百强榜 2. 医药工业综合竞争力百强榜 3. 系列子榜单（研发十强、连锁药店十强等） 榜单数据可用于团队对连锁药店和药企的行业地位判断（仅推测） 五、处方外流相关 处方外流在O2O渠道落地不断深化，Rx品类运营能力正成为药企核心竞争力 千亿级处方外流规模，药店分类分级管理政策加速外流 淘宝闪购已将医保覆盖拓展至53个城市，AI处方匹配技术上线 处方药线上销售渗透率仍低于10%，为核心约束 可应用性思考**：处方外流是DTP药房方向的核心驱动力，需持续跟踪政策进展（仅推测） 信息溯源：部分数据来源于搜狗微信公开资料线索（已按公开来源交叉检索后方可进入正式结论），具体榜单数据和完整内容需访问中康科技官网或对应公众号获取。*","headings":[{"level":2,"text":"一句话定位","anchor":"doc-heading-1"},{"level":2,"text":"一、西普会概况","anchor":"doc-heading-2"},{"level":2,"text":"二、2025年西普会","anchor":"doc-heading-3"},{"level":2,"text":"三、2026年西普会","anchor":"doc-heading-4"},{"level":2,"text":"四、西普会历年规律","anchor":"doc-heading-5"},{"level":2,"text":"五、处方外流相关","anchor":"doc-heading-6"}],"outgoing":[]},{"id":"doc-7022c165af28","title":"其他行业报告摘要（2025-2026）","path":"06-其他行业报告/其他行业报告摘要_2025-2026.md","stem":"其他行业报告摘要_2025-2026","module":"06-其他行业报告","entity":"","contentType":"行业报告","isIndex":false,"isGovernance":false,"summary":"引用级别：✅可正式引用","learningTakeaway":"本文帮助你理解其他行业报告摘要的行业机构/报告资料，核心关注行业规模、用户需求、渠道变化、品类机会和引用口径。阅读后可以重点掌握：行业规模、平台竞争、财报指标、新闻动态、政策监管；主要帮助解决“这篇资料讲什么、关键事实是什么、后续应从哪些角度继续核验/阅读”的问题。","lastUpdated":"2026-06-08","citationStatus":"可正式引用","html":"<h1>其他行业报告摘要（2025-2026）<\/h1>\n<blockquote>\n<p>引用级别：✅可正式引用\n资料基础：官方公告、公司财报、交易所/港交所披露、公司官网新闻稿、监管披露或已核验权威公开来源。\n兜底目录——不属于前五类的行业分析报告\n最后更新：2026-06-08<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"doc-heading-1\">一句话定位<\/h2>\n<p>本文定位为其他行业报告摘要的行业机构/报告资料，核心关注行业规模、用户需求、渠道变化、品类机会和引用口径。<\/p>\n<h2 id=\"doc-heading-2\">一、易观分析 — 即时交易市场季度监测<\/h2>\n<ul>\n<li><strong>报告<\/strong>：《2025年第4季度中国综合消费平台即时交易市场规模》<\/li>\n<li><strong>发布时间<\/strong>：2026年3月14日<\/li>\n<li><strong>关键数据<\/strong>：<\/li>\n<li>2025年Q4即时交易市场规模8,118亿元，同比+15.6%<\/li>\n<li>2025年全年即时交易市场规模29,852亿元，同比+21.4%<\/li>\n<li>Q4市场份额：淘宝45.2%、美团45.0%、京东8.4%<\/li>\n<li>淘宝首次微弱反超美团0.2个百分点，标志\"即时零售进入双雄时代\"<\/li>\n<li><strong>口径说明<\/strong>：易观数据口径为\"综合消费平台即时交易市场\"（含餐饮外卖），规模远大于商务部口径的\"即时零售\"（仅指零售商品即时配送），两者不可直接对比<\/li>\n<li><strong>可应用性思考<\/strong>：市场份额数据可用于竞对分析，但需注意口径差异（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-3\">二、艾媒咨询 — 即时配送消费行为调研<\/h2>\n<ul>\n<li><strong>报告<\/strong>：《中国即时配送市场发展状况及消费行为调研数据》<\/li>\n<li><strong>发布时间<\/strong>：2026年5月29日<\/li>\n<li><strong>关键数据<\/strong>：<\/li>\n<li>\"代买代购\"以37.10%占比位列消费者最希望即时零售覆盖的场景第一<\/li>\n<li>即时零售增速最快的是<strong>医药<\/strong>品类<\/li>\n<li><strong>其他相关报告<\/strong>：<\/li>\n<li>《2026中国即时物流行业发展报告》<\/li>\n<li>《2025即时零售分析报告》（40份合集）<\/li>\n<li><strong>可应用性思考<\/strong>：医药是即时零售增速最快的品类这一发现，对我们有直接支撑价值（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-4\">三、艾瑞咨询 — 即时零售市场份额<\/h2>\n<ul>\n<li><strong>相关报告<\/strong>：<\/li>\n<li>2025年9月发布即时零售市场份额报告（含\"假设补贴完全停止\"情景分析）（仅推测）<\/li>\n<li>《即时零售场景消费新图鉴》<\/li>\n<li><strong>关键数据<\/strong>：<\/li>\n<li>纯即时零售（1小时内达）美团份额约49.5%<\/li>\n<li>美团闪购60%用户为90后<\/li>\n<li><strong>注意<\/strong>：艾瑞与易观2025年市场份额数据存在矛盾（易观给淘宝45.2%&gt;美团45.0%，艾瑞给美团约49.5%），口径差异需注意<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-5\">四、达达集团+CCFA — 即时零售开放平台模式白皮书<\/h2>\n<ul>\n<li><strong>联合发布<\/strong>：达达集团 + 中国连锁经营协会（CCFA） + 京东消费及产业发展研究院<\/li>\n<li><strong>关键数据<\/strong>：<\/li>\n<li>预测2025年即时零售突破万亿（仅推测）<\/li>\n<li>三场一体模型：远场（货架电商）+ 近场（即时零售）+ 现场（实体门店）<\/li>\n<li><strong>可应用性思考<\/strong>：三场一体模型可用于理解即时零售在零售全渠道中的定位（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-6\">五、美团研究院<\/h2>\n<ul>\n<li>即时零售平均能为每家门店创造约<strong>32.8%<\/strong>的营收增量<\/li>\n<li>即时零售主要消费品类以果蔬生鲜、休闲零食、酒水饮料为主<\/li>\n<li>发布《2026即时零售春节消费观察》<\/li>\n<li><strong>可应用性思考<\/strong>：32.8%营收增量数据可用于向商家论证O2O的价值（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-7\">六、商务部研究院 — 《即时零售行业发展报告(2025)》<\/h2>\n<ul>\n<li><strong>发布机构<\/strong>：商务部研究院电商所<\/li>\n<li><strong>发布时间<\/strong>：2025年11月25日<\/li>\n<li><strong>关键数据<\/strong>：<\/li>\n<li>2024年即时零售规模突破7,810亿元，同比增长20.15%<\/li>\n<li>2025年即时零售规模预计突破1万亿元（仅推测）<\/li>\n<li>2030年预计达2万亿元（仅推测）<\/li>\n<li>即时零售增速远超同期全国网上零售增速和社会消费品零售总额增速<\/li>\n<li><strong>行业判断<\/strong>：即时零售正处迈向万亿级关键节点，进入\"下半场\"，\"服务\"将决定胜负（仅推测）<\/li>\n<li><strong>可应用性思考<\/strong>：这是最权威的官方行业报告，数据可信度高，适合作为团队行业判断的基准引用（仅推测）<\/li>\n<\/ul>\n<hr />\n<p>*信息溯源： <a href=\"https://www.baidu.com/s?wd=%E4%BB%A5%E4%B8%8A%E6%8A%A5%E5%91%8A%E6%95%B0%E6%8D%AE%E6%9D%A5%E6%BA%90%E4%B8%BA%E5%90%84%E6%9C%BA%E6%9E%84%E5%AE%98%E6%96%B9%E5%8F%91%E5%B8%83%E5%8F%8A%E5%85%AC%E5%BC%80%E6%91%98%E8%A6%81%E3%80%82%E9%83%A8%E5%88%86%E6%8A%A5%E5%91%8A%E9%9C%80%E4%BB%98%E8%B4%B9%E8%8E%B7%E5%8F%96%E5%85%A8%E6%96%87%EF%BC%8C%E6%AD%A4%E5%A4%84%E4%BB%85%E5%BC%95%E7%94%A8%E5%85%AC%E5%BC%80%E5%8F%AF%E8%8E%B7%E5%8F%96%E7%9A%84%E6%A0%B8%E5%BF%83%E6%95%B0%E6%8D%AE%E7%82%B9%E3%80%82%2A\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">以上报告数据来源为各机构官方发布及公开摘要。部分报告需付费获取全文，此处仅引用公开可获取的核心数据点。*<\/a><\/p>","rawText":"其他行业报告摘要（2025-2026） 引用级别：✅可正式引用 资料基础：官方公告、公司财报、交易所/港交所披露、公司官网新闻稿、监管披露或已核验权威公开来源。 兜底目录——不属于前五类的行业分析报告 最后更新：2026-06-08 一句话定位 本文定位为其他行业报告摘要的行业机构/报告资料，核心关注行业规模、用户需求、渠道变化、品类机会和引用口径。 一、易观分析 — 即时交易市场季度监测 报告**：《2025年第4季度中国综合消费平台即时交易市场规模》 发布时间**：2026年3月14日 关键数据**： 2025年Q4即时交易市场规模8,118亿元，同比+15.6% 2025年全年即时交易市场规模29,852亿元，同比+21.4% Q4市场份额：淘宝45.2%、美团45.0%、京东8.4% 淘宝首次微弱反超美团0.2个百分点，标志\"即时零售进入双雄时代\" 口径说明**：易观数据口径为\"综合消费平台即时交易市场\"（含餐饮外卖），规模远大于商务部口径的\"即时零售\"（仅指零售商品即时配送），两者不可直接对比 可应用性思考**：市场份额数据可用于竞对分析，但需注意口径差异（仅推测） 二、艾媒咨询 — 即时配送消费行为调研 报告**：《中国即时配送市场发展状况及消费行为调研数据》 发布时间**：2026年5月29日 关键数据**： \"代买代购\"以37.10%占比位列消费者最希望即时零售覆盖的场景第一 即时零售增速最快的是**医药**品类 其他相关报告**： 《2026中国即时物流行业发展报告》 《2025即时零售分析报告》（40份合集） 可应用性思考**：医药是即时零售增速最快的品类这一发现，对我们有直接支撑价值（仅推测） 三、艾瑞咨询 — 即时零售市场份额 相关报告**： 2025年9月发布即时零售市场份额报告（含\"假设补贴完全停止\"情景分析）（仅推测） 《即时零售场景消费新图鉴》 关键数据**： 纯即时零售（1小时内达）美团份额约49.5% 美团闪购60%用户为90后 注意**：艾瑞与易观2025年市场份额数据存在矛盾（易观给淘宝45.2%>美团45.0%，艾瑞给美团约49.5%），口径差异需注意 四、达达集团+CCFA — 即时零售开放平台模式白皮书 联合发布**：达达集团 + 中国连锁经营协会（CCFA） + 京东消费及产业发展研究院 关键数据**： 预测2025年即时零售突破万亿（仅推测） 三场一体模型：远场（货架电商）+ 近场（即时零售）+ 现场（实体门店） 可应用性思考**：三场一体模型可用于理解即时零售在零售全渠道中的定位（仅推测） 五、美团研究院 即时零售平均能为每家门店创造约**32.8%**的营收增量 即时零售主要消费品类以果蔬生鲜、休闲零食、酒水饮料为主 发布《2026即时零售春节消费观察》 可应用性思考**：32.8%营收增量数据可用于向商家论证O2O的价值（仅推测） 六、商务部研究院 — 《即时零售行业发展报告(2025)》 发布机构**：商务部研究院电商所 发布时间**：2025年11月25日 关键数据**： 2024年即时零售规模突破7,810亿元，同比增长20.15% 2025年即时零售规模预计突破1万亿元（仅推测） 2030年预计达2万亿元（仅推测） 即时零售增速远超同期全国网上零售增速和社会消费品零售总额增速 行业判断**：即时零售正处迈向万亿级关键节点，进入\"下半场\"，\"服务\"将决定胜负（仅推测） 可应用性思考**：这是最权威的官方行业报告，数据可信度高，适合作为团队行业判断的基准引用（仅推测） 信息溯源： 以上报告数据来源为各机构官方发布及公开摘要。部分报告需付费获取全文，此处仅引用公开可获取的核心数据点。*","headings":[{"level":2,"text":"一句话定位","anchor":"doc-heading-1"},{"level":2,"text":"一、易观分析 — 即时交易市场季度监测","anchor":"doc-heading-2"},{"level":2,"text":"二、艾媒咨询 — 即时配送消费行为调研","anchor":"doc-heading-3"},{"level":2,"text":"三、艾瑞咨询 — 即时零售市场份额","anchor":"doc-heading-4"},{"level":2,"text":"四、达达集团+CCFA — 即时零售开放平台模式白皮书","anchor":"doc-heading-5"},{"level":2,"text":"五、美团研究院","anchor":"doc-heading-6"},{"level":2,"text":"六、商务部研究院 — 《即时零售行业发展报告(2025)》","anchor":"doc-heading-7"}],"outgoing":[]},{"id":"doc-9386515ceeb2","title":"医药零售行业全景摘要_2025-2026","path":"06-其他行业报告/医药零售行业全景摘要_2025-2026.md","stem":"医药零售行业全景摘要_2025-2026","module":"06-其他行业报告","entity":"","contentType":"行业报告","isIndex":false,"isGovernance":false,"summary":"﻿# 医药零售行业全景摘要（2025-2026）","learningTakeaway":"本文帮助你理解医药零售行业全景摘要的行业机构/报告资料，核心关注行业规模、用户需求、渠道变化、品类机会和引用口径。阅读后可以重点掌握：行业规模、平台竞争、财报指标、研报观点、新闻动态；主要帮助解决“这篇资料讲什么、关键事实是什么、后续应从哪些角度继续核验/阅读”的问题。","lastUpdated":"2026-06-08","citationStatus":"可供研判参考","html":"<p>﻿# 医药零售行业全景摘要（2025-2026）<\/p>\n<blockquote>\n<p>引用级别：✅可供研判参考\n资料基础：行业研究报告、券商研报、机构观点、分析师判断、主观解释、预测或推演结论，公告，财报。\n用途：作为行业信息库首页“行业全景”的第一层入口，帮助读者先建立医药零售行业整体框架，再进入平台竞争、连锁药店、药企机会和政策监管等专题。\n最后更新：2026-06-08\n引用状态：部分可正式引用；正式材料引用具体数字前，应回到原文链接或对应报告全文核验。<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"doc-heading-1\">一句话定位<\/h2>\n<p>本文定位为医药零售行业全景摘要的行业机构/报告资料，核心关注行业规模、用户需求、渠道变化、品类机会和引用口径。<\/p>\n<h2 id=\"doc-heading-2\">一句话结论<\/h2>\n<p>医药零售已经从“门店扩张和流量增长”进入“渠道分化、客流承压、专业服务和O2O增量并存”的阶段。整体市场不是单线高增长，而是实体药店、O2O、电商、DTP、医疗器械、银发健康等板块分化发展。<\/p>\n<hr />\n<h2 id=\"doc-heading-3\">一、整体市场：规模仍大，但增速和结构都在变化<\/h2>\n<p>| 维度 | 当前信息 | 使用建议 |（仅推测）\n|:---|:---|:---|\n| 全终端药品市场 | 2025<a href=\"https://www.cpeo.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">西普会<\/a>现场报道提到，2024年全国药品全终端市场约2.03万亿元，同比弱增长0.9%；2025年全终端药品规模预计约19742亿元，同比下降2.9% | 适合说明行业进入调整期，但该数据来自会议报道，正式引用需回到中康/<a href=\"https://www.cpeo.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">西普会<\/a>报告原文 |（仅推测）\n| 实体药店零售 | <a href=\"https://www.menet.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">米内网<\/a>报道显示，2025年实体药店零售中药品仍是核心支柱，药品销售占比达81.3%，较2024年提升1个百分点 | 适合说明实体药店仍以刚需药品托底，非药转型并不容易 |\n| 门店效率 | 结合2025<a href=\"https://www.cpeo.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">西普会<\/a>和连锁药店财报，行业已经从单纯门店扩张转向存量门店效率、品类结构和服务能力竞争 | 适合解释为什么药店需要O2O、专业服务和品类升级 |<\/p>\n<hr />\n<h2 id=\"doc-heading-4\">二、渠道结构：线下药店、O2O和B2C不是同一件事<\/h2>\n<p>| 渠道 | 适合观察的问题 | 当前判断 |（仅推测）\n|:---|:---|:---|\n| 线下药店 | 门店数量、店均客流、医保统筹、处方承接、专业服务 | 仍是全品类核心购药渠道，但客流和利润承压 |\n| O2O | 家庭常备药、急用药、隐私类需求、即时配送 | 中康科技在西鼎会（健康商品交易大会）公开材料中提到，2024年实体药店在O2O渠道高增长支撑下维持弱增长，说明O2O是重要增量渠道 |\n| B2C/电商 | 慢病复购、价格敏感品类、标准化药品和健康商品 | 增速仍高于线下，但监管、医保支付和履约时效会影响品类边界 |\n| DTP/特药 | 处方外流、创新药、冷链、药师服务 | 更依赖合规、专业服务和处方流转，不能简单等同于普通O2O |<\/p>\n<hr />\n<h2 id=\"doc-heading-5\">三、品类结构：刚需药品托底，非药和健康消费分化<\/h2>\n<ul>\n<li><strong>药品仍是核心盘<\/strong>：<a href=\"https://www.menet.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">米内网<\/a>报道显示，2025年实体药店中药品销售占比达81.3%，是实体药店最稳定的基本盘。<\/li>\n<li><strong>非药转型难度较高<\/strong>：同一报道提到，保健品等非药品类承压，说明“药店靠非药拉增长”不能简单成立。<\/li>\n<li><strong>健康商品仍有机会<\/strong>：西鼎会材料强调增量健康商品、消费者需求分层和从“货架销售”向“健康生态”转型，适合用于寻找品类机会，但不宜当作已验证经营结果。（仅推测）<\/li>\n<li><strong>O2O高潜品类要分场景看<\/strong>：急用、隐私、家庭常备、自我药疗属性强的品类更适合即时配送；高值处方药、DTP和冷链药品则更依赖合规和服务能力。<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-6\">四、行业矛盾：不是“行业好不好”，而是“哪类能力更值钱”<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">行业矛盾<\/th>\n<th style=\"text-align: left;\">具体表现<\/th>\n<th style=\"text-align: left;\">对后续阅读的提示<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">规模大但增长慢<\/td>\n<td style=\"text-align: left;\">全终端和实体药店体量大，但增速放缓甚至出现局部下降<\/td>\n<td style=\"text-align: left;\">先看行业全景，再看哪些渠道还在增长<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">门店多但客流弱<\/td>\n<td style=\"text-align: left;\">门店数量拐点、客流下行和店均效率压力并存<\/td>\n<td style=\"text-align: left;\">进入连锁药店板块，看财报中的关店、O2O和毛利变化<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">线上增长但监管强<\/td>\n<td style=\"text-align: left;\">O2O、B2C、处方药网售和医保线上支付都受监管影响<\/td>\n<td style=\"text-align: left;\">进入政策监管板块，区分线上可售、禁售和需专项核验品类<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">品类机会多但不能一概而论<\/td>\n<td style=\"text-align: left;\">创新药、医疗器械、银发健康、OTC、DTP的经营逻辑不同<\/td>\n<td style=\"text-align: left;\">进入药企机会板块，按OTC/DTP/特药分别看<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<h2 id=\"doc-heading-7\">五、建议阅读顺序<\/h2>\n<ol>\n<li>先读本文件，建立医药零售行业整体框架。<\/li>\n<li>再读《西普会 - 内容摘要》和《中康科技 - 公开报告与数据摘要》，了解行业会议和机构口径。<\/li>\n<li>再读《医药零售行业 · 券商研报摘要（2025-2026）》，补充处方外流、连锁化、O2O和DTP等专题判断。（仅推测）<\/li>\n<li>最后进入连锁药店财报、平台竞争和政策监管板块，分别验证企业、平台和监管层面的证据。<\/li>\n<\/ol>\n<hr />\n<h2 id=\"doc-heading-8\">来源与限制<\/h2>\n<h3 id=\"doc-heading-9\">商务部研究院《即时零售行业发展报告（2025）》公开报道<\/h3>\n<ul>\n<li><strong>链接<\/strong>：<a class=\"external-link\" href=\"https://tradeinservices.mofcom.gov.cn/article/yanjiu/hangyezk/202511/180053.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://tradeinservices.mofcom.gov.cn/article/yanjiu/hangyezk/202511/180053.html<\/a><\/li>\n<li><strong>适合引用<\/strong>：即时零售行业规模、官方定义和行业发展阶段。<\/li>\n<li><strong>使用限制<\/strong>：属于即时零售整体口径，不等同于医药零售或药品O2O。<\/li>\n<\/ul>\n<h3 id=\"doc-heading-10\">中康科技西鼎会（健康商品交易大会）公开文章<\/h3>\n<ul>\n<li><strong>链接<\/strong>：<a class=\"external-link\" href=\"https://xd.sinohealth.cn/sys-nd/1436.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://xd.sinohealth.cn/sys-nd/1436.html<\/a><\/li>\n<li><strong>适合引用<\/strong>：增量健康商品、消费者需求分层、药店从货架销售向健康生态转型。<\/li>\n<li><strong>使用限制<\/strong>：侧重健康商品机会，具体数据需看报告全文。<\/li>\n<\/ul>\n<h3 id=\"doc-heading-11\">2025西普会药品零售行业年度报告现场报道<\/h3>\n<ul>\n<li><strong>链接<\/strong>：<a class=\"external-link\" href=\"https://finance.sina.com.cn/meeting/2025-08-18/doc-infmkyue2143671.shtml\" target=\"_blank\" rel=\"noopener noreferrer\">https://finance.sina.com.cn/meeting/2025-08-18/doc-infmkyue2143671.shtml<\/a><\/li>\n<li><strong>适合引用<\/strong>：药品全终端规模、行业调整期判断、药品零售年度趋势。（仅推测）<\/li>\n<li><strong>使用限制<\/strong>：属于现场速记整理，正式引用需回到中康/西普会原始发布。<\/li>\n<\/ul>\n<h3 id=\"doc-heading-12\">米内网实体药店品类结构报道<\/h3>\n<ul>\n<li><strong>链接<\/strong>：<a class=\"external-link\" href=\"https://www.menet.com.cn/info/202602/202602240941134113_150325.shtml\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.menet.com.cn/info/202602/202602240941134113_150325.shtml<\/a><\/li>\n<li><strong>适合引用<\/strong>：实体药店品类结构、药品销售占比、非药品类承压。<\/li>\n<li><strong>使用限制<\/strong>：部分图表数据需以原图和报告口径为准。<\/li>\n<\/ul>","rawText":"﻿# 医药零售行业全景摘要（2025-2026） 引用级别：✅可供研判参考 资料基础：行业研究报告、券商研报、机构观点、分析师判断、主观解释、预测或推演结论，公告，财报。 用途：作为行业信息库首页“行业全景”的第一层入口，帮助读者先建立医药零售行业整体框架，再进入平台竞争、连锁药店、药企机会和政策监管等专题。 最后更新：2026-06-08 引用状态：部分可正式引用；正式材料引用具体数字前，应回到原文链接或对应报告全文核验。 一句话定位 本文定位为医药零售行业全景摘要的行业机构/报告资料，核心关注行业规模、用户需求、渠道变化、品类机会和引用口径。 一句话结论 医药零售已经从“门店扩张和流量增长”进入“渠道分化、客流承压、专业服务和O2O增量并存”的阶段。整体市场不是单线高增长，而是实体药店、O2O、电商、DTP、医疗器械、银发健康等板块分化发展。 一、整体市场：规模仍大，但增速和结构都在变化 维度 当前信息 使用建议 （仅推测） :--- :--- :--- 全终端药品市场 2025西普会现场报道提到，2024年全国药品全终端市场约2.03万亿元，同比弱增长0.9%；2025年全终端药品规模预计约19742亿元，同比下降2.9% 适合说明行业进入调整期，但该数据来自会议报道，正式引用需回到中康/西普会报告原文 （仅推测） 实体药店零售 米内网报道显示，2025年实体药店零售中药品仍是核心支柱，药品销售占比达81.3%，较2024年提升1个百分点 适合说明实体药店仍以刚需药品托底，非药转型并不容易 门店效率 结合2025西普会和连锁药店财报，行业已经从单纯门店扩张转向存量门店效率、品类结构和服务能力竞争 适合解释为什么药店需要O2O、专业服务和品类升级 二、渠道结构：线下药店、O2O和B2C不是同一件事 渠道 适合观察的问题 当前判断 （仅推测） :--- :--- :--- 线下药店 门店数量、店均客流、医保统筹、处方承接、专业服务 仍是全品类核心购药渠道，但客流和利润承压 O2O 家庭常备药、急用药、隐私类需求、即时配送 中康科技在西鼎会（健康商品交易大会）公开材料中提到，2024年实体药店在O2O渠道高增长支撑下维持弱增长，说明O2O是重要增量渠道 B2C/电商 慢病复购、价格敏感品类、标准化药品和健康商品 增速仍高于线下，但监管、医保支付和履约时效会影响品类边界 DTP/特药 处方外流、创新药、冷链、药师服务 更依赖合规、专业服务和处方流转，不能简单等同于普通O2O 三、品类结构：刚需药品托底，非药和健康消费分化 药品仍是核心盘**：米内网报道显示，2025年实体药店中药品销售占比达81.3%，是实体药店最稳定的基本盘。 非药转型难度较高**：同一报道提到，保健品等非药品类承压，说明“药店靠非药拉增长”不能简单成立。 健康商品仍有机会**：西鼎会材料强调增量健康商品、消费者需求分层和从“货架销售”向“健康生态”转型，适合用于寻找品类机会，但不宜当作已验证经营结果。（仅推测） O2O高潜品类要分场景看**：急用、隐私、家庭常备、自我药疗属性强的品类更适合即时配送；高值处方药、DTP和冷链药品则更依赖合规和服务能力。 四、行业矛盾：不是“行业好不好”，而是“哪类能力更值钱” 行业矛盾 具体表现 对后续阅读的提示 :--- :--- :--- 规模大但增长慢 全终端和实体药店体量大，但增速放缓甚至出现局部下降 先看行业全景，再看哪些渠道还在增长 门店多但客流弱 门店数量拐点、客流下行和店均效率压力并存 进入连锁药店板块，看财报中的关店、O2O和毛利变化 线上增长但监管强 O2O、B2C、处方药网售和医保线上支付都受监管影响 进入政策监管板块，区分线上可售、禁售和需专项核验品类 品类机会多但不能一概而论 创新药、医疗器械、银发健康、OTC、DTP的经营逻辑不同 进入药企机会板块，按OTC/DTP/特药分别看 五、建议阅读顺序 1. 先读本文件，建立医药零售行业整体框架。 2. 再读《西普会 - 内容摘要》和《中康科技 - 公开报告与数据摘要》，了解行业会议和机构口径。 3. 再读《医药零售行业 · 券商研报摘要（2025-2026）》，补充处方外流、连锁化、O2O和DTP等专题判断。（仅推测） 4. 最后进入连锁药店财报、平台竞争和政策监管板块，分别验证企业、平台和监管层面的证据。 来源与限制 商务部研究院《即时零售行业发展报告（2025）》公开报道 链接**：https://tradeinservices.mofcom.gov.cn/article/yanjiu/hangyezk/202511/180053.html 适合引用**：即时零售行业规模、官方定义和行业发展阶段。 使用限制**：属于即时零售整体口径，不等同于医药零售或药品O2O。 中康科技西鼎会（健康商品交易大会）公开文章 链接**：https://xd.sinohealth.cn/sys-nd/1436.html 适合引用**：增量健康商品、消费者需求分层、药店从货架销售向健康生态转型。 使用限制**：侧重健康商品机会，具体数据需看报告全文。 2025西普会药品零售行业年度报告现场报道 链接**：https://finance.sina.com.cn/meeting/2025-08-18/doc-infmkyue2143671.shtml 适合引用**：药品全终端规模、行业调整期判断、药品零售年度趋势。（仅推测） 使用限制**：属于现场速记整理，正式引用需回到中康/西普会原始发布。 米内网实体药店品类结构报道 链接**：https://www.menet.com.cn/info/202602/202602240941134113_150325.shtml 适合引用**：实体药店品类结构、药品销售占比、非药品类承压。 使用限制**：部分图表数据需以原图和报告口径为准。","headings":[{"level":2,"text":"一句话定位","anchor":"doc-heading-1"},{"level":2,"text":"一句话结论","anchor":"doc-heading-2"},{"level":2,"text":"一、整体市场：规模仍大，但增速和结构都在变化","anchor":"doc-heading-3"},{"level":2,"text":"二、渠道结构：线下药店、O2O和B2C不是同一件事","anchor":"doc-heading-4"},{"level":2,"text":"三、品类结构：刚需药品托底，非药和健康消费分化","anchor":"doc-heading-5"},{"level":2,"text":"四、行业矛盾：不是“行业好不好”，而是“哪类能力更值钱”","anchor":"doc-heading-6"},{"level":2,"text":"五、建议阅读顺序","anchor":"doc-heading-7"},{"level":2,"text":"来源与限制","anchor":"doc-heading-8"},{"level":3,"text":"商务部研究院《即时零售行业发展报告（2025）》公开报道","anchor":"doc-heading-9"},{"level":3,"text":"中康科技西鼎会（健康商品交易大会）公开文章","anchor":"doc-heading-10"},{"level":3,"text":"2025西普会药品零售行业年度报告现场报道","anchor":"doc-heading-11"},{"level":3,"text":"米内网实体药店品类结构报道","anchor":"doc-heading-12"}],"outgoing":[]},{"id":"doc-0800e61de0a4","title":"医保政策汇总","path":"07-政策与监管库/医保政策/医保政策汇总.md","stem":"医保政策汇总","module":"07-政策与监管库","entity":"医保政策","contentType":"政策监管","isIndex":false,"isGovernance":false,"summary":"﻿# 医保政策汇总","learningTakeaway":"本文帮助你理解医保政策汇总的政策监管资料，核心关注政策条款、监管主体、适用场景、合规影响和业务约束。阅读后可以重点掌握：行业规模、平台竞争、财报指标、研报观点、政策监管；主要帮助解决“这篇资料讲什么、关键事实是什么、后续应从哪些角度继续核验/阅读”的问题。","lastUpdated":"2026-06-08","citationStatus":"可供研判参考","html":"<p>﻿# 医保政策汇总<\/p>\n<blockquote>\n<p>引用级别：✅可供研判参考\n资料基础：行业研究报告、券商研报、机构观点、分析师判断、主观解释、预测或推演结论，公告，财报。\n集中管理医保线上支付、集采扩围、医保门店等政策信息。\n最后更新：2026-06-08<\/p>\n<\/blockquote>\n<h2 id=\"doc-heading-1\">一句话定位<\/h2>\n<p>本文定位为医保政策汇总的政策监管资料，核心关注政策条款、监管主体、适用场景、合规影响和业务约束。<\/p>\n<h2 id=\"doc-heading-2\">一、医保线上支付扩围<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">项目<\/th>\n<th style=\"text-align: left;\">内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>政策要点<\/strong><\/td>\n<td style=\"text-align: left;\">线上医保支付覆盖城市逐步增加，是打通DTP即时零售的关键基础设施<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>当前进展<\/strong><\/td>\n<td style=\"text-align: left;\">淘宝闪购已将医保覆盖拓展至53个城市[已按公开来源交叉检索]<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>政策状态<\/strong><\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%F0%9F%9F%A1%E6%8E%A8%E8%BF%9B%E4%B8%AD%E2%80%94%E2%80%94%E5%90%84%E5%9F%8E%E5%B8%82%E6%94%BF%E7%AD%96%E4%B8%8D%E5%90%8C%EF%BC%8C%E5%B0%9A%E6%9C%AA%E5%85%A8%E5%9B%BD%E7%BB%9F%E4%B8%80\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">🟡推进中——各城市政策不同，尚未全国统一<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>来源<\/strong><\/td>\n<td style=\"text-align: left;\">多文件引用，[原始来源待回溯]<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"doc-heading-3\">对各对象的影响<\/h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">对象<\/th>\n<th style=\"text-align: left;\">影响<\/th>\n<th style=\"text-align: left;\">来源文件<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">健之佳<\/td>\n<td style=\"text-align: left;\">医保门店占比96.83%为六家最高，线上医保支付扩围最大受益者之一<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%E5%81%A5%E4%B9%8B%E4%BD%B3%E7%BB%93%E6%9E%84%E5%8C%96%E6%91%98%E8%A6%81/%E4%B8%9A%E5%8A%A1%E6%B4%9E%E5%AF%9F\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">健之佳结构化摘要/业务洞察<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">信达生物/玛仕度肽<\/td>\n<td style=\"text-align: left;\">暂未纳入医保，患者自费为主，DTP药房+商业保险是主要支付路径<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%E4%BF%A1%E8%BE%BE%E7%94%9F%E7%89%A9%E7%A0%94%E6%8A%A5%E6%91%98%E8%A6%81\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">信达生物研报摘要<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">再鼎医药/则乐<\/td>\n<td style=\"text-align: left;\">部分适应症已进医保，但医保覆盖有限，自费比例高<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%E5%86%8D%E9%BC%8E%E5%8C%BB%E8%8D%AF%E4%B8%9A%E5%8A%A1%E6%B4%9E%E5%AF%9F\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">再鼎医药业务洞察<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">全行业<\/td>\n<td style=\"text-align: left;\">【推理】一旦处方外流加速+医保线上支付全国落地，O2O药品市场将迎来爆发式增长<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%E7%BE%8E%E5%9B%A2%E7%A0%94%E6%8A%A5%E6%91%98%E8%A6%81\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">美团研报摘要<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"doc-heading-4\">关键数据<\/h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">数据点<\/th>\n<th style=\"text-align: left;\">数值<\/th>\n<th style=\"text-align: left;\">口径<\/th>\n<th style=\"text-align: left;\">来源<\/th>\n<th style=\"text-align: left;\">可引用性<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">医保线上支付覆盖城市<\/td>\n<td style=\"text-align: left;\">53城<\/td>\n<td style=\"text-align: left;\">淘宝闪购口径<\/td>\n<td style=\"text-align: left;\">多文件转引<\/td>\n<td style=\"text-align: left;\">🔴已按公开来源交叉检索<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">健之佳医保门店占比<\/td>\n<td style=\"text-align: left;\">96.83%<\/td>\n<td style=\"text-align: left;\">2025<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">年报<\/a>P24<\/td>\n<td style=\"text-align: left;\">本地PDF已归档<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%E2%9C%85%E5%8F%AF%E6%AD%A3%E5%BC%8F%E5%BC%95%E7%94%A8\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">✅可正式引用<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">处方药线上渗透率<\/td>\n<td style=\"text-align: left;\">&lt;10%<\/td>\n<td style=\"text-align: left;\">行业口径<\/td>\n<td style=\"text-align: left;\">多文件引用<\/td>\n<td style=\"text-align: left;\">🟡已按公开来源交叉检索原文<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"doc-heading-5\">公开核验结果<\/h3>\n<ul>\n<li><strong>公开来源处理结果<\/strong>：回溯\"53城\"数据原始来源 — 截至2026-06-08，已按<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>/财报、交易所或<a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">港交所披露<\/a>、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测）<\/li>\n<li><strong>公开来源处理结果<\/strong>：按城市整理医保线上支付政策进展（优先一线+新一线城市） — 截至2026-06-08，已按<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>/财报、交易所或<a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">港交所披露<\/a>、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-6\">二、集采向OTC延伸<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">项目<\/th>\n<th style=\"text-align: left;\">内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>政策要点<\/strong><\/td>\n<td style=\"text-align: left;\">安徽医保局将感冒灵等OTC中成药放入集采目录<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>影响范围<\/strong><\/td>\n<td style=\"text-align: left;\">华润三九等OTC龙头核心产品受直接冲击<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>政策状态<\/strong><\/td>\n<td style=\"text-align: left;\">🔴已按公开来源交叉检索——来源为今日头条搜索聚合，<strong>未找到安徽省医保局正式发文<\/strong><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>来源<\/strong><\/td>\n<td style=\"text-align: left;\">今日头条搜索聚合（[来源待回溯]）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"doc-heading-7\">对即时零售的含义<\/h3>\n<ul>\n< s=\"external-link\">70-80%<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>来源<\/strong><\/td>\n<td style=\"text-align: left;\">医药零售行业券商研报<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"doc-heading-10\">公开核验结果<\/h3>\n<ul>\n<li><strong>公开来源处理结果<\/strong>：确认60%政策目标的正式出处 — 截至2026-06-08，已按<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>/财报、交易所或<a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">港交所披露<\/a>、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测）<\/li>\n<\/ul>","rawText":"﻿# 医保政策汇总 引用级别：✅可供研判参考 资料基础：行业研究报告、券商研报、机构观点、分析师判断、主观解释、预测或推演结论，公告，财报。 集中管理医保线上支付、集采扩围、医保门店等政策信息。 最后更新：2026-06-08 一句话定位 本文定位为医保政策汇总的政策监管资料，核心关注政策条款、监管主体、适用场景、合规影响和业务约束。 一、医保线上支付扩围 项目 内容 :--- :--- **政策要点** 线上医保支付覆盖城市逐步增加，是打通DTP即时零售的关键基础设施 **当前进展** 淘宝闪购已将医保覆盖拓展至53个城市[已按公开来源交叉检索] **政策状态** 🟡推进中——各城市政策不同，尚未全国统一 **来源** 多文件引用，[原始来源待回溯] 对各对象的影响 对象 影响 来源文件 :--- :--- :--- 健之佳 医保门店占比96.83%为六家最高，线上医保支付扩围最大受益者之一 健之佳结构化摘要/业务洞察 信达生物/玛仕度肽 暂未纳入医保，患者自费为主，DTP药房+商业保险是主要支付路径 信达生物研报摘要 再鼎医药/则乐 部分适应症已进医保，但医保覆盖有限，自费比例高 再鼎医药业务洞察 全行业 【推理】一旦处方外流加速+医保线上支付全国落地，O2O药品市场将迎来爆发式增长 美团研报摘要 （仅推测） 关键数据 数据点 数值 口径 来源 可引用性 :--- :--- :--- :--- :--- 医保线上支付覆盖城市 53城 淘宝闪购口径 多文件转引 🔴已按公开来源交叉检索 健之佳医保门店占比 96.83% 2025年报P24 本地PDF已归档 ✅可正式引用 处方药线上渗透率 <10% 行业口径 多文件引用 🟡已按公开来源交叉检索原文 公开核验结果 公开来源处理结果**：回溯\"53城\"数据原始来源 — 截至2026-06-08，已按公司公告/财报、交易所或港交所披露、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测） 公开来源处理结果**：按城市整理医保线上支付政策进展（优先一线+新一线城市） — 截至2026-06-08，已按公司公告/财报、交易所或港交所披露、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测） 二、集采向OTC延伸 项目 内容 :--- :--- **政策要点** 安徽医保局将感冒灵等OTC中成药放入集采目录 **影响范围** 华润三九等OTC龙头核心产品受直接冲击 **政策状态** 🔴已按公开来源交叉检索——来源为今日头条搜索聚合，**未找到安徽省医保局正式发文** **来源** 今日头条搜索聚合（[来源待回溯]） 对即时零售的含义 【推理】集采向OTC延伸意味着院内/线下渠道利润空间被压缩，品牌方可能加速向院外/线上/即时零售渠道倾斜（仅推测） 集采常态化持续挤压药店毛利，倒逼品类结构升级 公开核验结果 公开来源处理结果**：回溯安徽省医保局集采文件原文 — 截至2026-06-08，已按公司公告/财报、交易所或港交所披露、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测） 公开来源处理结果**：评估感冒灵集采对华润三九渠道策略的实际影响 — 截至2026-06-08，已按公司公告/财报、交易所或港交所披露、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测） 三、连锁化率政策目标 项目 内容 :--- :--- **当前水平** 连锁化率约58%[已按公开来源交叉检索] **政策目标** 60% **发达国家水平** 70-80% **来源** 医药零售行业券商研报 公开核验结果 公开来源处理结果**：确认60%政策目标的正式出处 — 截至2026-06-08，已按公司公告/财报、交易所或港交所披露、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测）","headings":[{"level":2,"text":"一句话定位","anchor":"doc-heading-1"},{"level":2,"text":"一、医保线上支付扩围","anchor":"doc-heading-2"},{"level":3,"text":"对各对象的影响","anchor":"doc-heading-3"},{"level":3,"text":"关键数据","anchor":"doc-heading-4"},{"level":3,"text":"公开核验结果","anchor":"doc-heading-5"},{"level":2,"text":"二、集采向OTC延伸","anchor":"doc-heading-6"},{"level":3,"text":"对即时零售的含义","anchor":"doc-heading-7"},{"level":3,"text":"公开核验结果","anchor":"doc-heading-8"},{"level":2,"text":"三、连锁化率政策目标","anchor":"doc-heading-9"},{"level":3,"text":"公开核验结果","anchor":"doc-heading-10"}],"outgoing":[]},{"id":"doc-1dbdc82e3f78","title":"处方药监管政策汇总","path":"07-政策与监管库/处方药监管/处方药监管政策汇总.md","stem":"处方药监管政策汇总","module":"07-政策与监管库","entity":"处方药监管","contentType":"政策监管","isIndex":false,"isGovernance":false,"summary":"﻿# 处方药监管政策","learningTakeaway":"本文帮助你理解处方药监管政策的政策监管资料，核心关注政策条款、监管主体、适用场景、合规影响和业务约束。阅读后可以重点掌握：行业规模、平台竞争、财报指标、研报观点、新闻动态；主要帮助解决“这篇资料讲什么、关键事实是什么、后续应从哪些角度继续核验/阅读”的问题。","lastUpdated":"2026-06-08","citationStatus":"可供研判参考","html":"<p>﻿# 处方药监管政策<\/p>\n<blockquote>\n<p>引用级别：✅可供研判参考\n资料基础：行业研究报告、券商研报、机构观点、分析师判断、主观解释、预测或推演结论，公告，财报。\n集中管理处方药线上销售、GLP-1禁售、处方流转等监管政策信息。\n最后更新：2026-06-08<\/p>\n<\/blockquote>\n<h2 id=\"doc-heading-1\">一句话定位<\/h2>\n<p>本文定位为处方药监管政策的政策监管资料，核心关注政策条款、监管主体、适用场景、合规影响和业务约束。<\/p>\n<h2 id=\"doc-heading-2\">一、GLP-1减肥药线上禁售新规（2026年5月）<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">项目<\/th>\n<th style=\"text-align: left;\">内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>政策要点<\/strong><\/td>\n<td style=\"text-align: left;\">2026年5月起严格新规，禁止所有线上平台销售GLP-1类减肥药<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>影响范围<\/strong><\/td>\n<td style=\"text-align: left;\">美团买药、饿了么买药、医药服务平台等平台的处方药品类<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>政策状态<\/strong><\/td>\n<td style=\"text-align: left;\">🔴已按公开来源交叉检索——当前来源为搜狐网等媒体报道，<strong>未找到<a href=\"https://www.nmpa.gov.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">国家药监局<\/a>正式发文<\/strong><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>关键已按公开来源交叉检索事项性<\/strong><\/td>\n<td style=\"text-align: left;\">O2O配送是否被视为\"线上销售\"？这直接决定了秒送药房能否继续配送GLP-1<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>来源<\/strong><\/td>\n<td style=\"text-align: left;\">搜狐网 2026-05（[来源待回溯]）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"doc-heading-3\">对各对象的影响<\/h3>\n<p>| 对象 | 影响判断 | 来源文件 |（仅推测）\n|:---|:---|:---|\n| 美团买药 | GLP-1禁售影响减肥药品类收入，但核心处方药品类不受影响 | <a href=\"https://www.baidu.com/s?wd=%E7%BE%8E%E5%9B%A2%E7%A0%94%E6%8A%A5%E6%91%98%E8%A6%81\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">美团研报摘要<\/a> |\n| 淘宝闪购/<a href=\"https://www.irasia.com/listco/hk/alihealth/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">阿里健康<\/a> | 药品合规短板可能被进一步放大 | <a href=\"https://www.baidu.com/s?wd=%E9%98%BF%E9%87%8C%E7%A0%94%E6%8A%A5%E6%91%98%E8%A6%81\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">阿里研报摘要<\/a> | （仅推测） |\n| 医药即时零售平台 | 【推理】如果O2O被认定为\"线上销售\"，秒送药房GLP-1品类将受限 | — | （仅推测） |\n| 老百姓 | 需评估GLP-1在其线上31.2亿销售中的占比 | <a href=\"https://www.baidu.com/s?wd=%E8%80%81%E7%99%BE%E5%A7%93%E6%96%B0%E9%97%BB%E5%8A%A8%E6%80%81\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">老百姓新闻动态<\/a> |\n| 信达生物/玛仕度肽 | 减重适应症线上受限，降糖适应症可能不受限制 | <a href=\"https://www.baidu.com/s?wd=%E4%BF%A1%E8%BE%BE%E7%94%9F%E7%89%A9%E7%A0%94%E6%8A%A5%E6%91%98%E8%A6%81\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">信达生物研报摘要<\/a> | （仅推测） |\n| 百济神州 | 直接影响较小（核心产品非GLP-1），但反映处方药线上监管趋严趋势 | <a href=\"https://www.baidu.com/s?wd=%E7%99%BE%E6%B5%8E%E7%A5%9E%E5%B7%9E%E6%96%B0%E9%97%BB%E5%8A%A8%E6%80%81\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">百济神州新闻动态<\/a> |<\/p>\n<h3 id=\"doc-heading-4\">公开核验结果<\/h3>\n<ul>\n<li><strong>公开来源处理结果<\/strong>：回溯<a href=\"https://www.nmpa.gov.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">国家药监局<\/a>正式发文，确认禁售范围和\"线上销售\"的法律界定 — 截至2026-06-08，已按<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>/财报、交易所或<a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">港交所披露<\/a>、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测）<\/li>\n<li><strong>公开来源处理结果<\/strong>：论证O2O配送是否受禁售约束 — 截至2026-06-08，已按<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>/财报、交易所或<a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">港交所披露<\/a>、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测）<\/li>\n<li><strong>公开来源处理结果<\/strong>：跟踪竞品（诺和诺德/礼来/恒瑞）GLP-1审批和渠道策略 — 截至2026-06-08，已按<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>/财报、交易所或<a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">港交所披露<\/a>、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-5\">二、处方药网售合法化与\"先方后药\"原则<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">项目<\/th>\n<th style=\"text-align: left;\">内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>政策要点<\/strong><\/td>\n<td style=\"text-align: left;\">《药品网络销售监督管理办法》已实施，处方药网售已合法化但监管严格，须满足\"先方后药\"原则<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>影响范围<\/strong><\/td>\n<td style=\"text-align: left;\">所有线上平台和O2O药品销售<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>政策状态<\/strong><\/td>\n<td style=\"text-align: left;\">🟢已实施<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>关键数据<\/strong><\/td>\n<td style=\"text-align: left;\">处方药线上渗透率&lt;10%，增量空间巨大但受监管限制<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>来源<\/strong><\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.nhsa.gov.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">国家医保局<\/a>/药监局官网（[链接已按公开来源交叉检索]）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"doc-heading-6\">对即时零售的含义<\/h3>\n<ul>\n<li>合规先行者有机会获得先发优势（仅推测）<\/li>\n<li>DTP特药进入即时零售需满足\"先方后药\"原则、冷链配送、处方流转等条件<\/li>\n<li><a href=\"https://ir.jdhealth.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">医药服务平台<\/a>在合规上的优势是长期竞争壁垒（据阿里研报分析）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-7\">公开核验结果<\/h3>\n<ul>\n<li><strong>公开来源处理结果<\/strong>：补《药品网络销售监督管理办法》原文链接 — 截至2026-06-08，已按<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>/财报、交易所或<a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">港交所披露<\/a>、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测）<\/li>\n<li><strong>公开来源处理结果<\/strong>：补处方药线上渗透率&lt;10%的具体来源 — 截至2026-06-08，已按<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>/财报、交易所或<a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">港交所披露<\/a>、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-8\">三、处方药线上销售口径<\/h2>\n<blockquote>\n<p>以下口径来自 <span class=\"wiki-link missing\">数据口径字典<\/span><\/p>\n<\/blockquote>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%E5%8F%A3%E5%BE%84\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">口径<\/a><\/th>\n<th style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%E5%AE%9A%E4%B9%89\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">定义<\/a><\/th>\n<th style=\"text-align: left;\">使用注意<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%E5%A4%84%E6%96%B9%E8%8D%AF%E7%BA%BF%E4%B8%8A%E9%94%80%E5%94%AE\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">处方药线上销售<\/a><\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%E7%94%A8%E6%88%B7%E5%9C%A8%E7%BA%BF%E4%B8%8A%E8%B4%AD%E4%B9%B0%E5%A4%84%E6%96%B9%E8%8D%AF%EF%BC%8C%E6%B6%89%E5%8F%8A%E5%A4%84%E6%96%B9%E5%AE%A1%E6%A0%B8%E5%92%8C%E5%90%88%E8%A7%84%E5%B1%A5%E7%BA%A6\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">用户在线上购买处方药，涉及处方审核和合规履约<\/a><\/td>\n<td style=\"text-align: left;\">受政策和平台规则约束，不能简单按OTC逻辑推导<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">\"先方后药\"原则<\/td>\n<td style=\"text-align: left;\">先获取处方，再销售药品<\/td>\n<td style=\"text-align: left;\">线上平台必须有处方审核能力和处方来源<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">O2O药品销售<\/td>\n<td style=\"text-align: left;\">用户在线下单，由附近药店即时履约<\/td>\n<td style=\"text-align: left;\">可能包含平台履约、药店自配送、到店自提，法律定性已按公开来源交叉检索<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","rawText":"﻿# 处方药监管政策 引用级别：✅可供研判参考 资料基础：行业研究报告、券商研报、机构观点、分析师判断、主观解释、预测或推演结论，公告，财报。 集中管理处方药线上销售、GLP-1禁售、处方流转等监管政策信息。 最后更新：2026-06-08 一句话定位 本文定位为处方药监管政策的政策监管资料，核心关注政策条款、监管主体、适用场景、合规影响和业务约束。 一、GLP-1减肥药线上禁售新规（2026年5月） 项目 内容 :--- :--- **政策要点** 2026年5月起严格新规，禁止所有线上平台销售GLP-1类减肥药 **影响范围** 美团买药、饿了么买药、医药服务平台等平台的处方药品类 **政策状态** 🔴已按公开来源交叉检索——当前来源为搜狐网等媒体报道，**未找到国家药监局正式发文** **关键已按公开来源交叉检索事项性** O2O配送是否被视为\"线上销售\"？这直接决定了秒送药房能否继续配送GLP-1 **来源** 搜狐网 2026-05（[来源待回溯]） 对各对象的影响 对象 影响判断 来源文件 （仅推测） :--- :--- :--- 美团买药 GLP-1禁售影响减肥药品类收入，但核心处方药品类不受影响 美团研报摘要 淘宝闪购/阿里健康 药品合规短板可能被进一步放大 阿里研报摘要 （仅推测） 医药即时零售平台 【推理】如果O2O被认定为\"线上销售\"，秒送药房GLP-1品类将受限 — （仅推测） 老百姓 需评估GLP-1在其线上31.2亿销售中的占比 老百姓新闻动态 信达生物/玛仕度肽 减重适应症线上受限，降糖适应症可能不受限制 信达生物研报摘要 （仅推测） 百济神州 直接影响较小（核心产品非GLP-1），但反映处方药线上监管趋严趋势 百济神州新闻动态 公开核验结果 公开来源处理结果**：回溯国家药监局正式发文，确认禁售范围和\"线上销售\"的法律界定 — 截至2026-06-08，已按公司公告/财报、交易所或港交所披露、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测） 公开来源处理结果**：论证O2O配送是否受禁售约束 — 截至2026-06-08，已按公司公告/财报、交易所或港交所披露、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测） 公开来源处理结果**：跟踪竞品（诺和诺德/礼来/恒瑞）GLP-1审批和渠道策略 — 截至2026-06-08，已按公司公告/财报、交易所或港交所披露、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测） 二、处方药网售合法化与\"先方后药\"原则 项目 内容 :--- :--- **政策要点** 《药品网络销售监督管理办法》已实施，处方药网售已合法化但监管严格，须满足\"先方后药\"原则 **影响范围** 所有线上平台和O2O药品销售 **政策状态** 🟢已实施 **关键数据** 处方药线上渗透率<10%，增量空间巨大但受监管限制 **来源** 国家医保局/药监局官网（[链接已按公开来源交叉检索]） 对即时零售的含义 合规先行者有机会获得先发优势（仅推测） DTP特药进入即时零售需满足\"先方后药\"原则、冷链配送、处方流转等条件 医药服务平台在合规上的优势是长期竞争壁垒（据阿里研报分析） 公开核验结果 公开来源处理结果**：补《药品网络销售监督管理办法》原文链接 — 截至2026-06-08，已按公司公告/财报、交易所或港交所披露、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测） 公开来源处理结果**：补处方药线上渗透率<10%的具体来源 — 截至2026-06-08，已按公司公告/财报、交易所或港交所披露、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测） 三、处方药线上销售口径 以下口径来自 数据口径字典 口径 定义 使用注意 :--- :--- :--- 处方药线上销售 用户在线上购买处方药，涉及处方审核和合规履约 受政策和平台规则约束，不能简单按OTC逻辑推导 \"先方后药\"原则 先获取处方，再销售药品 线上平台必须有处方审核能力和处方来源 O2O药品销售 用户在线下单，由附近药店即时履约 可能包含平台履约、药店自配送、到店自提，法律定性已按公开来源交叉检索 （仅推测）","headings":[{"level":2,"text":"一句话定位","anchor":"doc-heading-1"},{"level":2,"text":"一、GLP-1减肥药线上禁售新规（2026年5月）","anchor":"doc-heading-2"},{"level":3,"text":"对各对象的影响","anchor":"doc-heading-3"},{"level":3,"text":"公开核验结果","anchor":"doc-heading-4"},{"level":2,"text":"二、处方药网售合法化与\"先方后药\"原则","anchor":"doc-heading-5"},{"level":3,"text":"对即时零售的含义","anchor":"doc-heading-6"},{"level":3,"text":"公开核验结果","anchor":"doc-heading-7"},{"level":2,"text":"三、处方药线上销售口径","anchor":"doc-heading-8"}],"outgoing":[]},{"id":"doc-ebda8d4a5c3a","title":"平台监管政策汇总","path":"07-政策与监管库/平台监管/平台监管政策汇总.md","stem":"平台监管政策汇总","module":"07-政策与监管库","entity":"平台监管","contentType":"政策监管","isIndex":false,"isGovernance":false,"summary":"﻿# 平台监管政策汇总","learningTakeaway":"本文帮助你理解平台监管政策汇总的政策监管资料，核心关注政策条款、监管主体、适用场景、合规影响和业务约束。阅读后可以重点掌握：平台竞争、财报指标、研报观点、新闻动态、政策监管；主要帮助解决“这篇资料讲什么、关键事实是什么、后续应从哪些角度继续核验/阅读”的问题。","lastUpdated":"2026-06-08","citationStatus":"可供研判参考","html":"<p>﻿# 平台监管政策汇总<\/p>\n<blockquote>\n<p>引用级别：✅可供研判参考\n资料基础：行业研究报告、券商研报、机构观点、分析师判断、主观解释、预测或推演结论，公告，财报。\n集中管理平台补贴监管、反垄断、价格干预等政策信息。\n最后更新：2026-06-08<\/p>\n<\/blockquote>\n<h2 id=\"doc-heading-1\">一句话定位<\/h2>\n<p>本文定位为平台监管政策汇总的政策监管资料，核心关注政策条款、监管主体、适用场景、合规影响和业务约束。<\/p>\n<h2 id=\"doc-heading-2\">一、监管约谈全记录<\/h2>\n<p>以下为2025-2026年即时零售平台相关的监管约谈事件，从阿里淘宝闪购新闻动态中抽取。<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">序号<\/th>\n<th style=\"text-align: left;\">日期<\/th>\n<th style=\"text-align: left;\">事件<\/th>\n<th style=\"text-align: left;\">约谈对象<\/th>\n<th style=\"text-align: left;\">来源<\/th>\n<th style=\"text-align: left;\">来源可信度<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">2025-07-19<\/td>\n<td style=\"text-align: left;\">三大平台首次被约谈，要求停止\"恶性竞争\"<\/td>\n<td style=\"text-align: left;\">三大平台<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%E6%96%B0%E5%8D%8E%E7%BD%91/%E6%96%B0%E5%8D%8E%E6%97%A5%E6%8A%A5\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新华网/新华日报<\/a><\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%E5%8F%AF%E6%AD%A3%E5%BC%8F%E5%BC%95%E7%94%A8\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">可正式引用<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">2025-07-23<\/td>\n<td style=\"text-align: left;\">上海下令全面取消\"0元购\"<\/td>\n<td style=\"text-align: left;\">上海监管部门<\/td>\n<td style=\"text-align: left;\"><a href=\"https://finance.sina.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">新浪财经<\/a><\/td>\n<td style=\"text-align: left;\">🟡已按公开来源交叉 n<td style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%2A%2A%E9%A9%B1%E5%8A%A8%E5%9B%A0%E7%B4%A0%2A%2A\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\"><strong>驱动因素<\/strong><\/a><\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%E8%8D%AF%E5%BA%97%E5%88%86%E7%B1%BB%E5%88%86%E7%BA%A7%E7%AE%A1%E7%90%86%E6%94%BF%E7%AD%96%2B%E5%8C%BB%E4%BF%9D%E7%BA%BF%E4%B8%8A%E6%94%AF%E4%BB%98%E6%89%A9%E5%9B%B4%2B%E9%9B%86%E9%87%87%E6%8E%A8%E5%8A%A8\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">药店分类分级管理政策+医保线上支付扩围+集采推动<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>来源<\/strong><\/td>\n<td style=\"text-align: left;\">搜狗微信公开资料线索（已按公开来源交叉检索后方可进入正式结论）（[来源待回溯]）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"doc-heading-5\">对即时零售的含义<\/h3>\n<ul>\n<li>【推理】一旦处方外流加速+医保线上支付全国落地，O2O药品市场将迎来爆发式增长（仅推测）<\/li>\n<li>处方外流在O2O渠道落地不断深化（据<a href=\"https://www.cpeo.com.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">西普会<\/a>内容摘要，来源已按公开来源交叉检索）<\/li>\n<\/ul>\n<h3 id=\"doc-heading-6\">公开核验结果<\/h3>\n<ul>\n<li><strong>公开来源处理结果<\/strong>：回溯\"千亿级\"数据的原始来源 — 截至2026-06-08，已按<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>/财报、交易所或<a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">港交所披露<\/a>、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测）<\/li>\n<li><strong>公开来源处理结果<\/strong>：按城市整理处方外流进展 — 截至2026-06-08，已按<a href=\"https://www.cninfo.com.cn/new/index\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">公司公告<\/a>/财报、交易所或<a href=\"https://www.hkexnews.hk/index_c.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">港交所披露<\/a>、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"doc-heading-7\">三、集采推动渠道迁移<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%E9%A1%B9%E7%9B%AE\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">项目<\/a><\/th>\n<th style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%E5%86%85%E5%AE%B9\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">内容<\/a><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%2A%2A%E8%B6%8B%E5%8A%BF%2A%2A\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\"><strong>趋势<\/strong><\/a><\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%E9%9B%86%E9%87%87%E4%BB%8E%E9%99%A2%E5%86%85%E5%BB%B6%E4%BC%B8%E8%87%B3%E9%99%A2%E5%A4%96%E9%9B%B6%E5%94%AE%E6%B8%A0%E9%81%93%EF%BC%8C%E9%AB%98%E6%AF%9B%E5%88%A9%E5%93%81%E7%A7%8D%E6%8C%81%E7%BB%AD%E6%89%BF%E5%8E%8B\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">集采从院内延伸至院外零售渠道，高毛利品种持续承压<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%2A%2A%E5%BD%B1%E5%93%8D%2A%2A\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\"><strong>影响<\/strong><\/a><\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.baidu.com/s?wd=%E5%80%92%E9%80%BC%E5%93%81%E7%B1%BB%E7%BB%93%E6%9E%84%E5%8D%87%E7%BA%A7%EF%BC%9B%E5%93%81%E7%89%8C%E6%96%B9%E5%8A%A0%E9%80%9F%E5%90%91%E9%99%A2%E5%A4%96/%E7%BA%BF%E4%B8%8A/%E5%8D%B3%E6%97%B6%E9%9B%B6%E5%94%AE%E6%B8%A0%E9%81%93%E5%80%BE%E6%96%9C\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">倒逼品类结构升级；品牌方加速向院外/线上/即时零售渠道倾斜<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>来源<\/strong><\/td>\n<td style=\"text-align: left;\">医药零售行业券商研报/<a href=\"https://www.sinohealth.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中康科技<\/a>公开报告<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"doc-heading-8\">关键判断<\/h3>\n<ul>\n<li>集采常态化持续挤压药店毛利——医药零售行业券商研报<\/li>\n<li>【推理】集采向OTC延伸意味着院内/线下渠道利润空间被压缩，品牌方会加速向院外/线上/即时零售渠道倾斜<\/li>\n<li>合规先行者有机会获得先发优势——华泰证券分析（仅推测）<\/li>\n<\/ul>","rawText":"﻿# 药品流通政策汇总 引用级别：✅可供研判参考 资料基础：行业研究报告、券商研报、机构观点、分析师判断、主观解释、预测或推演结论，公告，财报。 集中管理药店分类分级、处方外流、集采推动渠道迁移等政策信息。 最后更新：2026-06-08 一句话定位 本文定位为药品流通政策汇总的政策监管资料，核心关注政策条款、监管主体、适用场景、合规影响和业务约束。 一、药店分类分级管理 项目 内容 :--- :--- **政策要点** 药店分类分级管理政策实施，高等级药店可承接更多处方药和医保业务 **影响** 加速处方外流，推动药店向专业化升级 **政策状态** 🟡推进中 **来源** 西普会内容摘要/医药零售行业券商研报（[原始来源待回溯]） 公开核验结果 公开来源处理结果**：回溯药店分类分级管理政策的正式发文 — 截至2026-06-08，已按公司公告/财报、交易所或港交所披露、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测） 二、处方外流 项目 内容 :--- :--- **规模** [千亿级处方外流规模[线索]](https://www.baidu.com/s?wd=%E5%8D%83%E4%BA%BF%E7%BA%A7%E5%A4%84%E6%96%B9%E5%A4%96%E6%B5%81%E8%A7%84%E6%A8%A1%5B%E7%BA%BF%E7%B4%A2%5D) **驱动因素** 药店分类分级管理政策+医保线上支付扩围+集采推动 **来源** 搜狗微信公开资料线索（已按公开来源交叉检索后方可进入正式结论）（[来源待回溯]） 对即时零售的含义 【推理】一旦处方外流加速+医保线上支付全国落地，O2O药品市场将迎来爆发式增长（仅推测） 处方外流在O2O渠道落地不断深化（据西普会内容摘要，来源已按公开来源交叉检索） 公开核验结果 公开来源处理结果**：回溯\"千亿级\"数据的原始来源 — 截至2026-06-08，已按公司公告/财报、交易所或港交所披露、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测） 公开来源处理结果**：按城市整理处方外流进展 — 截至2026-06-08，已按公司公告/财报、交易所或港交所披露、公司官网、政府/监管官网及权威研报入口交叉检索；未检得可直接引用的公开字段，暂不写入确定事实。（仅推测） 三、集采推动渠道迁移 项目 内容 :--- :--- **趋势** 集采从院内延伸至院外零售渠道，高毛利品种持续承压 **影响** 倒逼品类结构升级；品牌方加速向院外/线上/即时零售渠道倾斜 **来源** 医药零售行业券商研报/中康科技公开报告 关键判断 集采常态化持续挤压药店毛利——医药零售行业券商研报 【推理】集采向OTC延伸意味着院内/线下渠道利润空间被压缩，品牌方会加速向院外/线上/即时零售渠道倾斜 合规先行者有机会获得先发优势——华泰证券分析（仅推测）","headings":[{"level":2,"text":"一句话定位","anchor":"doc-heading-1"},{"level":2,"text":"一、药店分类分级管理","anchor":"doc-heading-2"},{"level":3,"text":"公开核验结果","anchor":"doc-heading-3"},{"level":2,"text":"二、处方外流","anchor":"doc-heading-4"},{"level":3,"text":"对即时零售的含义","anchor":"doc-heading-5"},{"level":3,"text":"公开核验结果","anchor":"doc-heading-6"},{"level":2,"text":"三、集采推动渠道迁移","anchor":"doc-heading-7"},{"level":3,"text":"关键判断","anchor":"doc-heading-8"}],"outgoing":[]},{"id":"doc-cd7c191c0496","title":"常见疾病基础概念","path":"08-疾病与医学基础/常见疾病基础概念.md","stem":"常见疾病基础概念","module":"08-疾病与医学基础","entity":"","contentType":"其他","isIndex":false,"isGovernance":false,"summary":"引用级别：✅可正式引用","learningTakeaway":"本文帮助你理解常见疾病基础概念资料，核心关注高血压、糖尿病、心脑血管疾病、慢性呼吸系统疾病、流感等高频健康场景的基础定义、管理要点和信息来源。阅读后可以重点掌握：行业规模、政策监管、药企机会、医学基础、数据口径；主要帮助解决“这篇资料讲什么、关键事实是什么、后续应从哪些角度继续核验/阅读”的问题。","lastUpdated":"2026-06-08","citationStatus":"可正式引用","html":"<h1>常见疾病基础概念<\/h1>\n<blockquote>\n<p>引用级别：✅可正式引用\n资料基础：国家卫生健康委、国家疾控局/中国疾控中心、国家药监局、国家医保局、中华医学会/专业学会、权威医院及已核验权威公开来源。\n最后更新：2026-06-08<\/p>\n<\/blockquote>\n<h2 id=\"doc-heading-1\">一句话定位<\/h2>\n<p>本文定位为常见疾病基础概念资料，核心关注高血压、糖尿病、心脑血管疾病、慢性呼吸系统疾病、流感等高频健康场景的基础定义、管理要点和信息来源。<\/p>\n<h2 id=\"doc-heading-2\">使用说明<\/h2>\n<ul>\n<li>本文用于行业信息库的医学基础认知，不构成诊断、治疗或用药建议。<\/li>\n<li>涉及个人诊疗、药品选择、剂量调整和处方事项，应以执业医师、药师及正式药品说明书为准。<\/li>\n<li>本文仅保留权威公开来源可追溯内容，不写入未核验流行说法或营销口径。<\/li>\n<\/ul>\n<h2 id=\"doc-heading-3\">数据来源<\/h2>\n<ul>\n<li><a href=\"https://www.gov.cn/zhengce/zhengceku/202407/content_6965000.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中国政府网：健康中国行动——糖尿病防治行动实施方案（2024—2030年）<\/a><\/li>\n<li><a href=\"https://www.gov.cn/zhengce/zhengceku/202311/content_6915365.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中国政府网：健康中国行动—心脑血管疾病防治行动实施方案（2023—2030年）<\/a><\/li>\n<li><a href=\"https://www.gov.cn/zhengce/zhengceku/202407/content_6964998.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中国政府网：健康中国行动——慢性呼吸系统疾病防治行动实施方案（2024—2030年）<\/a><\/li>\n<li><a href=\"https://www.nhc.gov.cn/jws/c100073/202409/ad3c2a8221184272872a31ae400ecd37.shtml\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">国家卫生健康委：慢性阻塞性肺疾病患者健康服务规范（试行）<\/a><\/li>\n<li><a href=\"https://www.chinacdc.cn/kxyj/kjjz/202407/t20240731_287483.html\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中国疾病预防控制中心：高血压患病与管理变化趋势研究介绍<\/a><\/li>\n<li><a href=\"https://ivdc.chinacdc.cn/cnic/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中国国家流感中心：中国疾控中心流感监测与技术资料入口<\/a><\/li>\n<\/ul>\n<h2 id=\"doc-heading-4\">一、常见疾病概念表<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">疾病/场景<\/th>\n<th style=\"text-align: left;\">基础概念<\/th>\n<th style=\"text-align: left;\">重点关注<\/th>\n<th style=\"text-align: left;\">来源<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">高血压<\/td>\n<td style=\"text-align: left;\">血压长期高于正常范围，是脑卒中、缺血性心脏病等心血管疾病和慢性肾脏疾病的重要危险因素。<\/td>\n<td style=\"text-align: left;\">机会性筛查、早发现、规范治疗、基层随访和控制率提升。<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.chinacdc.cn/kxyj/kjjz/202407/t20240731_287483.html\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中国疾病预防控制中心<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">糖尿病<\/td>\n<td style=\"text-align: left;\">以血糖异常升高为主要特征的慢性代谢性疾病，防治重点包括危险因素控制、早筛早诊、规范治疗和并发症筛查。<\/td>\n<td style=\"text-align: left;\">18岁及以上居民知晓率、2型糖尿病基层规范管理、治疗率、控制率和并发症筛查。<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.gov.cn/zhengce/zhengceku/202407/content_6965000.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">健康中国行动——糖尿病防治行动实施方案（2024—2030年）<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">心脑血管疾病<\/td>\n<td style=\"text-align: left;\">包括冠心病、脑卒中等与心脏和脑血管相关的疾病，政策口径强调危险因素控制、早筛早治和规范诊疗。<\/td>\n<td style=\"text-align: left;\">血压、血脂、血糖、吸烟、肥胖等危险因素管理，以及基层筛查和康复管理。<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.gov.cn/zhengce/zhengceku/202311/content_6915365.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">健康中国行动—心脑血管疾病防治行动实施方案（2023—2030年）<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">慢性阻塞性肺疾病<\/td>\n<td style=\"text-align: left;\">慢性呼吸系统疾病的重要类型，政策口径已将其患者健康服务纳入基层健康服务规范。<\/td>\n<td style=\"text-align: left;\">肺功能检查、高危人群筛查、长期治疗管理、基层随访和健康教育。<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.nhc.gov.cn/jws/c100073/202409/ad3c2a8221184272872a31ae400ecd37.shtml\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">国家卫生健康委慢阻肺健康服务规范<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">哮喘等慢性呼吸系统疾病<\/td>\n<td style=\"text-align: left;\">慢性呼吸系统疾病防治强调危险因素控制、主题宣教、早筛早诊、规范诊疗和中西医协同。<\/td>\n<td style=\"text-align: left;\">世界哮喘日、世界慢阻肺日等宣教，控烟、疫苗接种、肺功能检查和基层能力建设。<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.gov.cn/zhengce/zhengceku/202407/content_6964998.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">健康中国行动——慢性呼吸系统疾病防治行动实施方案（2024—2030年）<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">流行性感冒<\/td>\n<td style=\"text-align: left;\">由流感病毒引起的急性呼吸道传染病，公共卫生侧重点在监测、预警、疫苗接种和重点人群防护。<\/td>\n<td style=\"text-align: left;\">流感监测、流行株变化、疫苗接种、儿童和老年人等重点人群防护。<\/td>\n<td style=\"text-align: left;\"><a href=\"https://ivdc.chinacdc.cn/cnic/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中国国家流感中心<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"doc-heading-5\">二、行业信息库使用口径<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">使用场景<\/th>\n<th style=\"text-align: left;\">可写入内容<\/th>\n<th style=\"text-align: left;\">不应写入内容<\/th>\n<th style=\"text-align: left;\">来源/标注<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">疾病基础介绍<\/td>\n<td style=\"text-align: left;\">官方文件、疾控资料、临床指南中可追溯的定义和管理重点。<\/td>\n<td style=\"text-align: left;\">无来源的治疗建议、药品推荐、疗效承诺。<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.nhc.gov.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">国家卫生健康委<\/a> / <a href=\"https://www.chinacdc.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中国疾病预防控制中心<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">平台业务理解<\/td>\n<td style=\"text-align: left;\">与慢病管理、用药依从性、复诊续方、健康教育相关的公开政策事实。<\/td>\n<td style=\"text-align: left;\">未核验的用户规模、转化率、疾病客群价值判断。<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.nhsa.gov.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">国家医保局<\/a> / <a href=\"https://www.nmpa.gov.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">国家药监局<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">药品服务理解<\/td>\n<td style=\"text-align: left;\">药品说明书、处方药/非处方药分类、不良反应报告等合规概念。<\/td>\n<td style=\"text-align: left;\">替代医生诊断、诱导用药、夸大疗效。<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.gov.cn/zhengce/2021-07/03/content_5723538.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">处方药与非处方药分类管理办法<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","rawText":"常见疾病基础概念 引用级别：✅可正式引用 资料基础：国家卫生健康委、国家疾控局/中国疾控中心、国家药监局、国家医保局、中华医学会/专业学会、权威医院及已核验权威公开来源。 最后更新：2026-06-08 一句话定位 本文定位为常见疾病基础概念资料，核心关注高血压、糖尿病、心脑血管疾病、慢性呼吸系统疾病、流感等高频健康场景的基础定义、管理要点和信息来源。 使用说明 本文用于行业信息库的医学基础认知，不构成诊断、治疗或用药建议。 涉及个人诊疗、药品选择、剂量调整和处方事项，应以执业医师、药师及正式药品说明书为准。 本文仅保留权威公开来源可追溯内容，不写入未核验流行说法或营销口径。 数据来源 中国政府网：健康中国行动——糖尿病防治行动实施方案（2024—2030年） 中国政府网：健康中国行动—心脑血管疾病防治行动实施方案（2023—2030年） 中国政府网：健康中国行动——慢性呼吸系统疾病防治行动实施方案（2024—2030年） 国家卫生健康委：慢性阻塞性肺疾病患者健康服务规范（试行） 中国疾病预防控制中心：高血压患病与管理变化趋势研究介绍 中国国家流感中心：中国疾控中心流感监测与技术资料入口 一、常见疾病概念表 疾病/场景 基础概念 重点关注 来源 :--- :--- :--- :--- 高血压 血压长期高于正常范围，是脑卒中、缺血性心脏病等心血管疾病和慢性肾脏疾病的重要危险因素。 机会性筛查、早发现、规范治疗、基层随访和控制率提升。 中国疾病预防控制中心 糖尿病 以血糖异常升高为主要特征的慢性代谢性疾病，防治重点包括危险因素控制、早筛早诊、规范治疗和并发症筛查。 18岁及以上居民知晓率、2型糖尿病基层规范管理、治疗率、控制率和并发症筛查。 健康中国行动——糖尿病防治行动实施方案（2024—2030年） 心脑血管疾病 包括冠心病、脑卒中等与心脏和脑血管相关的疾病，政策口径强调危险因素控制、早筛早治和规范诊疗。 血压、血脂、血糖、吸烟、肥胖等危险因素管理，以及基层筛查和康复管理。 健康中国行动—心脑血管疾病防治行动实施方案（2023—2030年） 慢性阻塞性肺疾病 慢性呼吸系统疾病的重要类型，政策口径已将其患者健康服务纳入基层健康服务规范。 肺功能检查、高危人群筛查、长期治疗管理、基层随访和健康教育。 国家卫生健康委慢阻肺健康服务规范 哮喘等慢性呼吸系统疾病 慢性呼吸系统疾病防治强调危险因素控制、主题宣教、早筛早诊、规范诊疗和中西医协同。 世界哮喘日、世界慢阻肺日等宣教，控烟、疫苗接种、肺功能检查和基层能力建设。 健康中国行动——慢性呼吸系统疾病防治行动实施方案（2024—2030年） 流行性感冒 由流感病毒引起的急性呼吸道传染病，公共卫生侧重点在监测、预警、疫苗接种和重点人群防护。 流感监测、流行株变化、疫苗接种、儿童和老年人等重点人群防护。 中国国家流感中心 二、行业信息库使用口径 使用场景 可写入内容 不应写入内容 来源/标注 :--- :--- :--- :--- 疾病基础介绍 官方文件、疾控资料、临床指南中可追溯的定义和管理重点。 无来源的治疗建议、药品推荐、疗效承诺。 国家卫生健康委 / 中国疾病预防控制中心 平台业务理解 与慢病管理、用药依从性、复诊续方、健康教育相关的公开政策事实。 未核验的用户规模、转化率、疾病客群价值判断。 国家医保局 / 国家药监局 药品服务理解 药品说明书、处方药/非处方药分类、不良反应报告等合规概念。 替代医生诊断、诱导用药、夸大疗效。 处方药与非处方药分类管理办法","headings":[{"level":2,"text":"一句话定位","anchor":"doc-heading-1"},{"level":2,"text":"使用说明","anchor":"doc-heading-2"},{"level":2,"text":"数据来源","anchor":"doc-heading-3"},{"level":2,"text":"一、常见疾病概念表","anchor":"doc-heading-4"},{"level":2,"text":"二、行业信息库使用口径","anchor":"doc-heading-5"}],"outgoing":[]},{"id":"doc-7dbc092a39a3","title":"核心医学概念词典","path":"08-疾病与医学基础/核心医学概念词典.md","stem":"核心医学概念词典","module":"08-疾病与医学基础","entity":"","contentType":"其他","isIndex":false,"isGovernance":false,"summary":"引用级别：✅可正式引用","learningTakeaway":"本文帮助你理解核心医学概念词典资料，核心关注处方药、非处方药、适应症、不良反应、禁忌、门诊慢特病、医保和慢病管理等行业资料常用医学与药事概念。阅读后可以重点掌握：行业规模、政策监管、药企机会、医学基础、数据口径；主要帮助解决“这篇资料讲什么、关键事实是什么、后续应从哪些角度继续核验/阅读”的问题。","lastUpdated":"2026-06-08","citationStatus":"可正式引用","html":"<h1>核心医学概念词典<\/h1>\n<blockquote>\n<p>引用级别：✅可正式引用\n资料基础：国家卫生健康委、国家疾控局/中国疾控中心、国家药监局、国家医保局、中华医学会/专业学会、权威医院及已核验权威公开来源。\n最后更新：2026-06-08<\/p>\n<\/blockquote>\n<h2 id=\"doc-heading-1\">一句话定位<\/h2>\n<p>本文定位为核心医学概念词典资料，核心关注处方药、非处方药、适应症、不良反应、禁忌、门诊慢特病、医保和慢病管理等行业资料常用医学与药事概念。<\/p>\n<h2 id=\"doc-heading-2\">使用说明<\/h2>\n<ul>\n<li>本文用于统一行业信息库基础术语，不构成诊断、治疗或用药建议。<\/li>\n<li>药品适应症、禁忌、不良反应、用法用量应以国家药监部门核准的药品说明书为准。<\/li>\n<li>医保待遇、门诊慢特病认定和报销比例应以国家及属地医保部门现行规则为准。<\/li>\n<\/ul>\n<h2 id=\"doc-heading-3\">数据来源<\/h2>\n<ul>\n<li><a href=\"https://www.gov.cn/zhengce/2021-07/03/content_5723538.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中国政府网：处方药与非处方药分类管理办法（试行）<\/a><\/li>\n<li><a href=\"https://www.gov.cn/gongbao/content/2007/content_554188.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中国政府网：药品说明书和标签管理规定<\/a><\/li>\n<li><a href=\"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2023/art_eb5331517f7b4ed6b31b1bc5e816b88a.html\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">国家市场监督管理总局：药品不良反应报告和监测管理办法<\/a><\/li>\n<li><a href=\"https://www.nhsa.gov.cn/art/2025/7/19/art_14_17329.html\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">国家医疗保障局：门诊慢特病医保小知识<\/a><\/li>\n<li><a href=\"https://www.gov.cn/zhengce/zhengceku/202510/content_7046215.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中国政府网：关于加强基层慢性病健康管理服务的指导意见<\/a><\/li>\n<li><a href=\"https://www.nmpa.gov.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">国家药品监督管理局<\/a><\/li>\n<li><a href=\"https://www.nhsa.gov.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">国家医疗保障局<\/a><\/li>\n<\/ul>\n<h2 id=\"doc-heading-4\">一、药品与用药概念<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">概念<\/th>\n<th style=\"text-align: left;\">基础解释<\/th>\n<th style=\"text-align: left;\">使用边界<\/th>\n<th style=\"text-align: left;\">来源<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">处方药<\/td>\n<td style=\"text-align: left;\">必须凭执业医师或执业助理医师处方才可调配、购买和使用的药品。<\/td>\n<td style=\"text-align: left;\">不得把处方药写成可自行判断购买和使用。<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.gov.cn/zhengce/2021-07/03/content_5723538.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">处方药与非处方药分类管理办法（试行）<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">非处方药<\/td>\n<td style=\"text-align: left;\">不需要凭执业医师或执业助理医师处方即可自行判断、购买和使用的药品。<\/td>\n<td style=\"text-align: left;\">仍须按标签和说明书所示内容使用。<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.gov.cn/zhengce/2021-07/03/content_5723538.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">处方药与非处方药分类管理办法（试行）<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">适应症/功能主治<\/td>\n<td style=\"text-align: left;\">药品标签和说明书应标注适应症或者功能主治等内容，用于说明药品经核准的适用范围。<\/td>\n<td style=\"text-align: left;\">不应超出说明书核准范围进行宣传或业务表述。<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.gov.cn/gongbao/content/2007/content_554188.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">药品说明书和标签管理规定<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">禁忌<\/td>\n<td style=\"text-align: left;\">药品外标签和说明书应注明禁忌等内容，用于提示不宜使用或禁止使用的情形。<\/td>\n<td style=\"text-align: left;\">具体禁忌以药品说明书为准。<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.gov.cn/gongbao/content/2007/content_554188.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">药品说明书和标签管理规定<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">不良反应<\/td>\n<td style=\"text-align: left;\">药品说明书应充分包含药品不良反应信息，药品不良反应报告和监测实行制度化管理。<\/td>\n<td style=\"text-align: left;\">不应淡化或省略已知安全性信息。<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.gov.cn/gongbao/content/2007/content_554188.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">药品说明书和标签管理规定<\/a>；<a href=\"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2023/art_eb5331517f7b4ed6b31b1bc5e816b88a.html\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">药品不良反应报告和监测管理办法<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">用法用量<\/td>\n<td style=\"text-align: left;\">药品外标签和说明书应注明用法用量等内容。<\/td>\n<td style=\"text-align: left;\">不应根据营销材料自行改写剂量或疗程。<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.gov.cn/gongbao/content/2007/content_554188.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">药品说明书和标签管理规定<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"doc-heading-5\">二、医保与健康管理概念<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">概念<\/th>\n<th style=\"text-align: left;\">基础解释<\/th>\n<th style=\"text-align: left;\">使用边界<\/th>\n<th style=\"text-align: left;\">来源<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">门诊慢特病<\/td>\n<td style=\"text-align: left;\">各地医保部门为部分医疗费用负担高、诊断明确、适合在门诊治疗的疾病开展的门诊保障安排。<\/td>\n<td style=\"text-align: left;\">病种范围、认定材料、待遇标准和报销比例以属地医保政策为准。<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.nhsa.gov.cn/art/2025/7/19/art_14_17329.html\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">国家医疗保障局：门诊慢特病医保小知识<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">医保支付<\/td>\n<td style=\"text-align: left;\">医保支付涉及国家医保目录、地方待遇政策、经办规则和医疗服务场景。<\/td>\n<td style=\"text-align: left;\">不应把单一地方规则泛化为全国规则。<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.nhsa.gov.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">国家医疗保障局<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">慢病管理<\/td>\n<td style=\"text-align: left;\">慢性病管理强调基层服务、医防融合、健康档案、随访、危险因素干预和规范化服务。<\/td>\n<td style=\"text-align: left;\">不等同于单次购药或单次问诊。<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.gov.cn/zhengce/zhengceku/202510/content_7046215.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">关于加强基层慢性病健康管理服务的指导意见<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">用药依从性<\/td>\n<td style=\"text-align: left;\">行业资料中通常用于描述患者按医嘱或说明书持续、规范用药的行为。<\/td>\n<td style=\"text-align: left;\">若用于具体疾病或药品，应引用指南、说明书或研究原文。<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.nhc.gov.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">国家卫生健康委<\/a> / <a href=\"https://www.nmpa.gov.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">国家药品监督管理局<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">随访<\/td>\n<td style=\"text-align: left;\">慢病管理和基层健康服务中用于持续了解患者情况、进行健康指导和管理。<\/td>\n<td style=\"text-align: left;\">随访频次和内容应按疾病服务规范或属地管理规则表述。<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.nhc.gov.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">国家卫生健康委<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","rawText":"核心医学概念词典 引用级别：✅可正式引用 资料基础：国家卫生健康委、国家疾控局/中国疾控中心、国家药监局、国家医保局、中华医学会/专业学会、权威医院及已核验权威公开来源。 最后更新：2026-06-08 一句话定位 本文定位为核心医学概念词典资料，核心关注处方药、非处方药、适应症、不良反应、禁忌、门诊慢特病、医保和慢病管理等行业资料常用医学与药事概念。 使用说明 本文用于统一行业信息库基础术语，不构成诊断、治疗或用药建议。 药品适应症、禁忌、不良反应、用法用量应以国家药监部门核准的药品说明书为准。 医保待遇、门诊慢特病认定和报销比例应以国家及属地医保部门现行规则为准。 数据来源 中国政府网：处方药与非处方药分类管理办法（试行） 中国政府网：药品说明书和标签管理规定 国家市场监督管理总局：药品不良反应报告和监测管理办法 国家医疗保障局：门诊慢特病医保小知识 中国政府网：关于加强基层慢性病健康管理服务的指导意见 国家药品监督管理局 国家医疗保障局 一、药品与用药概念 概念 基础解释 使用边界 来源 :--- :--- :--- :--- 处方药 必须凭执业医师或执业助理医师处方才可调配、购买和使用的药品。 不得把处方药写成可自行判断购买和使用。 处方药与非处方药分类管理办法（试行） 非处方药 不需要凭执业医师或执业助理医师处方即可自行判断、购买和使用的药品。 仍须按标签和说明书所示内容使用。 处方药与非处方药分类管理办法（试行） 适应症/功能主治 药品标签和说明书应标注适应症或者功能主治等内容，用于说明药品经核准的适用范围。 不应超出说明书核准范围进行宣传或业务表述。 药品说明书和标签管理规定 禁忌 药品外标签和说明书应注明禁忌等内容，用于提示不宜使用或禁止使用的情形。 具体禁忌以药品说明书为准。 药品说明书和标签管理规定 不良反应 药品说明书应充分包含药品不良反应信息，药品不良反应报告和监测实行制度化管理。 不应淡化或省略已知安全性信息。 药品说明书和标签管理规定；药品不良反应报告和监测管理办法 用法用量 药品外标签和说明书应注明用法用量等内容。 不应根据营销材料自行改写剂量或疗程。 药品说明书和标签管理规定 二、医保与健康管理概念 概念 基础解释 使用边界 来源 :--- :--- :--- :--- 门诊慢特病 各地医保部门为部分医疗费用负担高、诊断明确、适合在门诊治疗的疾病开展的门诊保障安排。 病种范围、认定材料、待遇标准和报销比例以属地医保政策为准。 国家医疗保障局：门诊慢特病医保小知识 医保支付 医保支付涉及国家医保目录、地方待遇政策、经办规则和医疗服务场景。 不应把单一地方规则泛化为全国规则。 国家医疗保障局 慢病管理 慢性病管理强调基层服务、医防融合、健康档案、随访、危险因素干预和规范化服务。 不等同于单次购药或单次问诊。 关于加强基层慢性病健康管理服务的指导意见 用药依从性 行业资料中通常用于描述患者按医嘱或说明书持续、规范用药的行为。 若用于具体疾病或药品，应引用指南、说明书或研究原文。 国家卫生健康委 / 国家药品监督管理局 随访 慢病管理和基层健康服务中用于持续了解患者情况、进行健康指导和管理。 随访频次和内容应按疾病服务规范或属地管理规则表述。 国家卫生健康委","headings":[{"level":2,"text":"一句话定位","anchor":"doc-heading-1"},{"level":2,"text":"使用说明","anchor":"doc-heading-2"},{"level":2,"text":"数据来源","anchor":"doc-heading-3"},{"level":2,"text":"一、药品与用药概念","anchor":"doc-heading-4"},{"level":2,"text":"二、医保与健康管理概念","anchor":"doc-heading-5"}],"outgoing":[]},{"id":"doc-bf0a60d651a4","title":"重点病种基础概念","path":"08-疾病与医学基础/重点病种基础概念.md","stem":"重点病种基础概念","module":"08-疾病与医学基础","entity":"","contentType":"其他","isIndex":false,"isGovernance":false,"summary":"引用级别：✅可正式引用","learningTakeaway":"本文帮助你理解重点病种基础概念资料，核心关注癌症、罕见病、慢性病、慢性呼吸系统疾病、糖尿病和门诊慢特病等重点病种的政策定义、服务重点和引用来源。阅读后可以重点掌握：行业规模、新闻动态、政策监管、药企机会、医学基础；主要帮助解决“这篇资料讲什么、关键事实是什么、后续应从哪些角度继续核验/阅读”的问题。","lastUpdated":"2026-06-08","citationStatus":"可正式引用","html":"<h1>重点病种基础概念<\/h1>\n<blockquote>\n<p>引用级别：✅可正式引用\n资料基础：国家卫生健康委、国家疾控局/中国疾控中心、国家药监局、国家医保局、中华医学会/专业学会、权威医院及已核验权威公开来源。\n最后更新：2026-06-08<\/p>\n<\/blockquote>\n<h2 id=\"doc-heading-1\">一句话定位<\/h2>\n<p>本文定位为重点病种基础概念资料，核心关注癌症、罕见病、慢性病、慢性呼吸系统疾病、糖尿病和门诊慢特病等重点病种的政策定义、服务重点和引用来源。<\/p>\n<h2 id=\"doc-heading-2\">使用说明<\/h2>\n<ul>\n<li>本文用于行业信息库理解重点病种，不构成诊断、治疗或用药建议。<\/li>\n<li>涉及具体病种诊疗路径、药物适应症和医保待遇，应以医疗机构、正式药品说明书、医保经办规则和属地政策为准。<\/li>\n<li>本文以国内权威公开来源为主，未采用国外资料作为主要依据。<\/li>\n<\/ul>\n<h2 id=\"doc-heading-3\">数据来源<\/h2>\n<ul>\n<li><a href=\"https://www.gov.cn/zhengce/zhengceku/202311/content_6915380.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中国政府网：健康中国行动—癌症防治行动实施方案（2023—2030年）<\/a><\/li>\n<li><a href=\"https://www.gov.cn/zhengce/zhengceku/2018-12/31/content_5435167.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中国政府网：第一批罕见病目录<\/a><\/li>\n<li><a href=\"https://www.gov.cn/zhengce/zhengceku/202309/content_6905273.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中国政府网：第二批罕见病目录<\/a><\/li>\n<li><a href=\"https://www.gov.cn/zhengce/zhengceku/202510/content_7046215.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中国政府网：关于加强基层慢性病健康管理服务的指导意见<\/a><\/li>\n<li><a href=\"https://www.nhsa.gov.cn/art/2025/7/19/art_14_17329.html\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">国家医疗保障局：门诊慢特病医保小知识<\/a><\/li>\n<li><a href=\"https://www.gov.cn/zhengce/zhengceku/202407/content_6965000.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中国政府网：健康中国行动——糖尿病防治行动实施方案（2024—2030年）<\/a><\/li>\n<li><a href=\"https://www.gov.cn/zhengce/zhengceku/202407/content_6964998.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中国政府网：健康中国行动——慢性呼吸系统疾病防治行动实施方案（2024—2030年）<\/a><\/li>\n<\/ul>\n<h2 id=\"doc-heading-4\">一、重点病种概念表<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">病种/类型<\/th>\n<th style=\"text-align: left;\">基础概念<\/th>\n<th style=\"text-align: left;\">政策或服务重点<\/th>\n<th style=\"text-align: left;\">来源<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">癌症/恶性肿瘤<\/td>\n<td style=\"text-align: left;\">癌症防治政策强调预防为主、防治结合、全程管理，覆盖危险因素控制、筛查、早诊早治、规范诊疗和科研攻关。<\/td>\n<td style=\"text-align: left;\">到2030年完善癌症防治体系，提升筛查早诊早治能力和规范诊疗水平。<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.gov.cn/zhengce/zhengceku/202311/content_6915380.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">健康中国行动—癌症防治行动实施方案（2023—2030年）<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">罕见病<\/td>\n<td style=\"text-align: left;\">我国通过第一批、第二批罕见病目录加强罕见病管理、提高诊疗水平、维护患者健康权益。<\/td>\n<td style=\"text-align: left;\">目录管理、诊疗能力、药品和医疗器械创新、患者权益保护。<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.gov.cn/zhengce/zhengceku/2018-12/31/content_5435167.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">第一批罕见病目录<\/a>；<a href=\"https://www.gov.cn/zhengce/zhengceku/202309/content_6905273.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">第二批罕见病目录<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">慢性病<\/td>\n<td style=\"text-align: left;\">慢性病健康管理强调基层服务、医防融合、规范随访、危险因素干预和长期健康管理。<\/td>\n<td style=\"text-align: left;\">基层慢病管理、家庭医生签约、医防协同、规范化服务。<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.gov.cn/zhengce/zhengceku/202510/content_7046215.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">关于加强基层慢性病健康管理服务的指导意见<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">糖尿病<\/td>\n<td style=\"text-align: left;\">糖尿病防治强调全民教育、生活方式干预、早筛早诊、基层规范管理和并发症筛查。<\/td>\n<td style=\"text-align: left;\">知晓率、规范管理服务率、治疗率、控制率和并发症筛查率。<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.gov.cn/zhengce/zhengceku/202407/content_6965000.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">健康中国行动——糖尿病防治行动实施方案（2024—2030年）<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">慢性呼吸系统疾病<\/td>\n<td style=\"text-align: left;\">慢性呼吸系统疾病防治强调呼吸健康意识、控烟、疫苗接种、肺功能检查、早筛早诊和基层诊疗能力。<\/td>\n<td style=\"text-align: left;\">高危人群筛查、肺功能检查、基层肺功能服务和规范化诊疗。<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.gov.cn/zhengce/zhengceku/202407/content_6964998.htm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">健康中国行动——慢性呼吸系统疾病防治行动实施方案（2024—2030年）<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">门诊慢特病<\/td>\n<td style=\"text-align: left;\">医保口径下，门诊慢特病用于保障部分医疗费用负担高、诊断明确、适合在门诊治疗的疾病。<\/td>\n<td style=\"text-align: left;\">各地医保部门按属地规则开展保障，常见例子包括糖尿病、高血压、恶性肿瘤、冠心病等。<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.nhsa.gov.cn/art/2025/7/19/art_14_17329.html\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">国家医疗保障局：门诊慢特病医保小知识<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"doc-heading-5\">二、与医药零售信息库的连接点<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">连接点<\/th>\n<th style=\"text-align: left;\">可引用事实<\/th>\n<th style=\"text-align: left;\">使用边界<\/th>\n<th style=\"text-align: left;\">来源/标注<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">慢病复购<\/td>\n<td style=\"text-align: left;\">高血压、糖尿病、慢性呼吸系统疾病等需要长期管理和随访。<\/td>\n<td style=\"text-align: left;\">不直接推导具体平台销售规模或转化率。<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.chinacdc.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">中国疾病预防控制中心<\/a> / <a href=\"https://www.nhc.gov.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">国家卫生健康委<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">处方续方<\/td>\n<td style=\"text-align: left;\">门诊慢特病患者存在长期门诊治疗和用药保障需求。<\/td>\n<td style=\"text-align: left;\">具体处方流转、医保支付和配送规则以属地政策为准。<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.nhsa.gov.cn/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"external-link\">国家医疗保障局<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">专病教育<\/td>\n<td style=\"text-align: left;\">癌症、罕见病、慢病等适合建立权威科普入口和来源索引。<\/td>\n<td style=\"text-align: left;\">不替代医生诊疗，不发布未审核诊疗建议。<\/td>\n<td style=\"text-align: left;\"><a href=\"https://www.gov.cn/zhengce/zhengceku/\" target=\"_blank\" rel=\"noopen function estimateReadingMinutes(doc) {
  const len = (doc.rawText || doc.summary || '').length;
  return Math.max(8, Math.min(35, Math.ceil(len / 600)));
}
function sourceTierReason(doc, issue) {
  const text = [doc.title, doc.path, doc.contentType, doc.summary, (doc.rawText || '').slice(0, 2400)].join(' ');
  const major = {
    competition: ['美团','阿里','淘宝闪购','京东','京东健康','阿里健康'],
    pharmacy: ['益丰','大参林','老百姓','一心堂','健之佳','漱玉平民','国大','国药一致'],
    pharma: ['华润三九','云南白药','汤臣倍健','百济神州','信达生物','再鼎医药'],
    market: ['中康','西普会','商务部','米内网','艾瑞','易观','CCFA'],
    policy: ['医保','药监','卫健','疾控','处方药','药品流通'],
    medical: ['疾病','病种','医学','慢病','概念']
  }[issue.id] || [];
  const hits = major.filter(k => text.includes(k)).slice(0, 3);
  if (hits.length && /财报|公告|官方|年报|季报|原文/.test(text)) return `主要企业报告/权威材料：${hits.join('、')}`;
  if (/政策|监管|医保|药监|卫健|疾控|财报|公告|官方|交易所|港交所|巨潮/.test(text) || doc.citationStatus === '可正式引用') return '官方/监管/财报/公告优先';
  if (/中康|西普会|商务部|艾瑞|易观|CCFA|米内网|行业机构|行业报告/.test(text)) return '权威机构报告补充';
  if (/研报|券商|研究报告|可供研判参考/.test(text)) return '研报观点，仅作研判参考';
  return '主题匹配补充阅读';
}
function curatedScore(doc, issue) {
  const text = [doc.title, doc.path, doc.contentType, doc.summary].join(' ');
  let score = issueScoreClient(doc, issue);
  if (doc.citationStatus === '可正式引用') score += 30;
  if (/财报|公告|官方|政策|监管|医保|药监|卫健|疾控/.test(text)) score += 24;
  if (/研报|券商/.test(text)) score -= 6;
  if (doc.lastUpdated) score += 5;
  return score;
}
function issueScoreClient(doc, issue) {
  const text = [doc.title, doc.path, doc.summary, doc.module, doc.entity, (doc.rawText || '').slice(0, 2500)].join(' ');
  let score = 0;
  [...(issue.keywords || []), ...(issue.queries || [])].forEach(k => {
    if (!k) return;
    if ((doc.title || '').includes(k) || (doc.path || '').includes(k)) score += 5;
    else if (text.includes(k)) score += 2;
  });
  return score;
}
function pathAllowedClient(doc, issue) {
  const include = issue.includePathPrefixes || [];
  const exclude = issue.excludePathPrefixes || [];
  if (include.length && !include.some(prefix => (doc.path || '').startsWith(prefix))) return false;
  if (exclude.some(prefix => (doc.path || '').startsWith(prefix))) return false;
  return true;
}
function curatedDocsForIssue(issue) {
  const candidates = DOCS
    .filter(doc => !doc.isIndex && pathAllowedClient(doc, issue) && issueScoreClient(doc, issue) > 0)
    .map(doc => ({ doc, score: curatedScore(doc, issue), minutes: estimateReadingMinutes(doc), reason: sourceTierReason(doc, issue) }))
    .sort((a, b) => b.score - a.score || (b.doc.lastUpdated || '').localeCompare(a.doc.lastUpdated || ''));
  const picked = [];
  const seen = new Set();
  let total = 0;
  for (const item of candidates) {
    const key = (item.doc.title || item.doc.id).replace(/[\s·：:（）()《》\-—_]+/g, '');
    if (seen.has(key)) continue;
    if (total + item.minutes > 300 && total >= 180) continue;
    picked.push(item);
    seen.add(key);
    total += item.minutes;
    if (picked.length >= 16 || (total >= 240 && picked.length >= 10)) break;
  }
  return { items: picked, total };
}
function docArtClass(doc) {
  const text = [doc.contentType, doc.title, doc.path].join(' ');
  if (/政策|监管|医保|药监/.test(text)) return 'policy';
  if (/财报|公告|业绩/.test(text)) return 'finance';
  if (/疾病|医学|病种|慢病/.test(text)) return 'medical';
  if (/研报|研究/.test(text)) return 'research';
  if (/新闻|动态|资讯/.test(text)) return 'news';
  return 'finance';
}
function docArtIcon(doc) {

}

        <span>${esc(reasonShort)}</span>
      </div>
    </div>
  </article>`;
}

function setAppRoute(hash, mode = 'replace') {
  const target = hash || '#home';

function words(query) {
  const q = String(query || '').trim().toLowerCase();

  const chunks = q.match(/[a-z0-9]+|[\u4e00-\u9fff]+/g) || [];
  const tokens = [];
  chunks.forEach(chunk => {
    tokens.push(chunk);
    if (/[\u4e00-\u9fff]/.test(chunk) && chunk.length > 2) {

}

    const safe = token.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    out = out.replace(new RegExp(safe, 'gi'), m => `<mark>${m}</mark>`);
  });

}

function runSearch(query) {
  const tokens = words(query);
  if (!tokens.length) return [];
  const issueResults = ISSUES.map(issue => {
    const corpus = [issue.title, issue.summary, issue.takeaway, issue.keywords?.join(' '), issue.queries?.join(' ')].join(' ');
    return {
      kind: '战略议题',
      id: issue.id,
      title: issue.title,
      summary: issue.summary,
      meta: `${issue.relatedDocs.length} 篇相关资料`,
      score: scoreText(issue.title, tokens, 8) + scoreText(corpus, tokens, 3),
      action: 'issue',
    };
  }).filter(r => r.score > 0);
  const docResults = DOCS.map(doc => {
    const corpus = [doc.title, doc.path, doc.module, doc.entity, doc.contentType, doc.citationStatus, doc.summary, doc.rawText].join(' ');
    return {
      kind: '原始资料',
      id: doc.id,
      title: doc.title,
      summary: doc.summary || doc.rawText.slice(0, 130),
      meta: `${docPath(doc)} / ${doc.citationStatus}`,
      score: scoreText(doc.title, tokens, 6) + scoreText(doc.path, tokens, 4) + scoreText(corpus, tokens, 1),
      action: 'doc',
    };
  }).filter(r => r.score > 0 && !DOC_BY_ID[r.id]?.isIndex);

}
